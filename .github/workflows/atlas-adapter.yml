name: Atlas deterministic adapter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python tests/test-citation-network-checker.py
      - run: python -m unittest discover -s tests/atlas -p 'test_*.py' -v
      # Content-level replay of every committed current receipt. Strict
      # (byte-exact) replay is not used here: setup-python '3.11' resolves to
      # changing patch releases, which change the manifest's environment block.
      # historical-* receipts come from earlier code and are not replayable.
      - name: Content replay of committed receipts
        run: |
          set -euo pipefail
          count=0
          for dir in tests/atlas/receipts/*/; do
            case "$dir" in */historical-*/) continue ;; esac
            echo "replay --level content: $dir"
            python -m atlas replay "${dir}manifest.json" "${dir}records.jsonl" --level content
            count=$((count + 1))
          done
          test "$count" -gt 0
      # Claim-link receipts (atlas.claims) pin an import receipt above as their
      # dependency; content replay rebuilds them from it.
      - name: Content replay of claim-link receipts
        run: |
          set -euo pipefail
          count=0
          for dir in tests/atlas/claims/receipts/*/; do
            echo "claims replay --level content: $dir"
            python -m atlas.claims replay "${dir}manifest.json" "${dir}records.jsonl" --level content
            count=$((count + 1))
          done
          test "$count" -gt 0
      # Extraction receipts (atlas.extraction) rebuild from committed public files.
      # The source PDF and full model output are not redistributed; their local
      # verification is `python -m atlas.extraction local-verify` and is not run here.
      - name: Content replay of extraction receipts
        run: |
          set -euo pipefail
          count=0
          for dir in tests/atlas/extraction/*/receipt/; do
            echo "extraction replay --level content: $dir"
            python -m atlas.extraction replay "${dir}manifest.json" "${dir}records.jsonl" --level content
            count=$((count + 1))
          done
          test "$count" -gt 0
      # Question receipts (atlas.question) rebuild from the receipts they pin; this also
      # content-replays every extraction receipt the question names.
      - name: Content replay of question receipts
        run: |
          set -euo pipefail
          count=0
          for dir in tests/atlas/question/*/receipt/; do
            echo "question replay --level content: $dir"
            python -m atlas.question replay "${dir}manifest.json" "${dir}records.jsonl" --level content
            count=$((count + 1))
          done
          test "$count" -gt 0
      # Receipts that came with an external agent's run under examples/: the import and
      # claim-link receipts the map-link receipt below depends on.
      - name: Content replay of example-run receipts
        run: |
          set -euo pipefail
          count=0
          for dir in examples/research/*/citation-network/atlas-receipt/; do
            echo "replay --level content: $dir"
            python -m atlas replay "${dir}manifest.json" "${dir}records.jsonl" --level content
            count=$((count + 1))
          done
          for dir in examples/research/*/citation-network/claims-receipt/; do
            echo "claims replay --level content: $dir"
            python -m atlas.claims replay "${dir}manifest.json" "${dir}records.jsonl" --level content
            count=$((count + 1))
          done
          test "$count" -gt 0
      # Map-link receipts (atlas.maplink) content-replay the claim-link receipt they pin,
      # then re-parse the pinned upstream Stage-1 map. The AJR receipt pins files under
      # examples/research/acemoglu-colonial-origins/ (Grok's run, PR #7).
      - name: Content replay of map-link receipts
        run: |
          set -euo pipefail
          count=0
          for dir in tests/atlas/maplink/*/receipt/; do
            echo "maplink replay --level content: $dir"
            python -m atlas.maplink replay "${dir}manifest.json" "${dir}records.jsonl" --level content
            count=$((count + 1))
          done
          test "$count" -gt 0
      # Challenge receipts (atlas.challenge) content-replay the import receipt they pin,
      # re-run the vendored checker and re-read every pinned challenge artifact.
      - name: Content replay of challenge receipts
        run: |
          set -euo pipefail
          count=0
          for dir in tests/atlas/challenge/*/receipt/; do
            echo "challenge replay --level content: $dir"
            python -m atlas.challenge replay "${dir}manifest.json" "${dir}records.jsonl" --level content
            count=$((count + 1))
          done
          test "$count" -gt 0
      # Every committed page (docs/atlas/views/views.json) must be a fresh render of verified records.
      - name: Reader views are current
        run: python -m atlas.view check-all
