name: Atlas deterministic adapter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python tests/test-citation-network-checker.py
      - run: python -m unittest discover -s tests/atlas -p 'test_*.py' -v
      # Content-level replay of every committed current receipt. Strict
      # (byte-exact) replay is not used here: setup-python '3.11' resolves to
      # changing patch releases, which change the manifest's environment block.
      # historical-* receipts come from earlier code and are not replayable.
      - name: Content replay of committed receipts
        run: |
          set -euo pipefail
          count=0
          for dir in tests/atlas/receipts/*/; do
            case "$dir" in */historical-*/) continue ;; esac
            echo "replay --level content: $dir"
            python -m atlas replay "${dir}manifest.json" "${dir}records.jsonl" --level content
            count=$((count + 1))
          done
          test "$count" -gt 0
