\\n\\n3. Hotspot table\\n\\nFor each problematic passage, provide:\\n\\n- original sentence or paragraph\\n- problem type:\\n  - repeated reassurance\\n  - false balance\\n  - unnecessary caveat\\n  - softened methodological claim\\n  - vague \\u201climitations\\u201d language\\n  - compliance-style apology\\n- why it weakens the argument\\n- recommended action: keep / cut / rewrite / move to introduction\\n- voice-restored replacement\\n\\n4. Stronger terminology suggestions\\n\\nIdentify places where the draft uses weak terms and suggest stronger accurate terms.\\n\\nExamples:\\n\\n- \\u201climitation\\u201d \\u2192 \\u201cproxy failure\\u201d if the measure does not test the claim\\n- \\u201cunderstudied\\u201d \\u2192 \\u201cuntested\\u201d if the decisive test has not been run\\n- \\u201cmixed evidence\\u201d \\u2192 \\u201cevidence does not support the strength of the claim\\u201d if that is more accurate\\n- \\u201ccultural factors may not fully explain\\u201d \\u2192 \\u201ccultural-only explanations have not earned the strength of their claims\\u201d if supported\\n\\n5. Good caveats to preserve\\n\\nList caveats that should remain because they are doing real evidentiary work.\\n\\nSection 5 must explicitly list any PIPELINE PROVENANCE FLAGS present \\u2014 reception status, confirmed-vs.-inferred status, provisional status, and specific-vs.-general scope \\u2014 as caveats that were preserved. Confirm that none were converted into bare confident assertions during restoration.\\n\\n6. Final voice-restoration pass\\n\\nRewrite only the affected passages. Do not rewrite the whole paper unless asked.\\n\\nPreserve the author\\u2019s directness, structure, and thesis.\\n\\nDo not make the prose inflammatory.\\n\\nDo not add unsupported claims.\\n\\nThe goal is accurate force, not rhetorical escalation.\\n\\n7. Manual review warning\\n\\nEnd by identifying any sections where your recommendation depends on context outside the excerpt or where the author should manually verify whether a caveat is necessary.\\n\\nHere is the draft to audit:\\n\\n[PASTE DRAFT HERE]\\n\"},\"retrieval-module\":{\"bytes\":16047,\"lines\":370,\"path\":\"tools/citation_reception_module.py\",\"sha256\":\"e374a13254e9\",\"text\":\"#!/usr/bin/env python3\\n\\\"\\\"\\\"\\nCITATION RECEPTION MODULE\\n=========================\\nReplaces the counter-audit's memory-based reception check with REAL data\\npulled from free citation APIs (OpenAlex + Semantic Scholar).\\n\\nPURPOSE\\n-------\\nFor any source the counter-audit makes \\\"load-bearing\\\" (rates strong/severe or\\nuses to move the verdict), this module retrieves:\\n  - citation count and citing-work list\\n  - how many citing works are formal replies/comments/rebuttals\\n  - citation-context snippets (the sentences where others cite this source)\\n  - reception-signal keywords in those snippets (refute / support / etc.)\\n  - open-access status + PDF link when available\\n\\nIt returns a structured RECEPTION PROFILE that the model then REASONS OVER,\\ninstead of the model recalling reception from training. This is the fix for\\nthe McShane & Wyner failure: reception becomes retrieved, not remembered.\\n\\nWHAT THIS DOES AND DOES NOT DO\\n------------------------------\\nDOES: reliably establish whether a source was heavily contested, how many\\nformal responses it drew, and the tenor of how it's cited -- all from free APIs,\\nno journal subscription, no full text required.\\n\\nDOES NOT: adjudicate who \\\"won\\\" a technical dispute. That still needs full text\\nand stays honestly labeled as unverified. This module answers \\\"was it contested\\nand how\\\" -- which is exactly the signal that would have caught McShane & Wyner.\\n\\nREQUIREMENTS\\n------------\\n  pip install requests\\n  (No API keys required. A free Semantic Scholar key raises rate limits;\\n   set S2_API_KEY env var if you have one.)\\n\\nSet a real contact email in MAILTO -- OpenAlex uses it for the polite pool\\n(faster, more reliable). This is required etiquette, not optional.\\n\\\"\\\"\\\"\\n\\nimport os\\nimport re\\nimport time\\nimport requests\\nfrom urllib.parse import quote\\n\\nMAILTO = os.environ.get(\\\"OPENALEX_MAILTO\\\", \\\"you@example.com\\\")  # \\u003c-- set this\\nS2_KEY = os.environ.get(\\\"S2_API_KEY\\\")  # optional, raises rate limits\\n\\nOPENALEX = \\\"https://api.openalex.org\\\"\\nS2 = \\\"https://api.semanticscholar.org/graph/v1\\\"\\n\\n# --- Reception-signal lexicon -------------------------------------------------\\n# Words in a citation-context snippet that suggest the citing paper is\\n# CHALLENGING the cited source vs. SUPPORTING it. Heuristic only; the model\\n# reasons over the actual snippets, this just pre-tallies signal.\\nREFUTE_TERMS = [\\n    \\\"however\\\", \\\"but\\\", \\\"flawed\\\", \\\"misspecified\\\", \\\"incorrect\\\", \\\"erroneous\\\",\\n    \\\"we show that\\\", \\\"contrary to\\\", \\\"fails to\\\", \\\"does not\\\", \\\"cannot\\\",\\n    \\\"overstate\\\", \\\"overestimate\\\", \\\"spurious\\\", \\\"artifact\\\", \\\"criticism\\\",\\n    \\\"criticize\\\", \\\"rebut\\\", \\\"refute\\\", \\\"dispute\\\", \\\"disagree\\\", \\\"problematic\\\",\\n    \\\"invalid\\\", \\\"unwarranted\\\", \\\"misleading\\\", \\\"in contrast\\\", \\\"reanalysis\\\",\\n    \\\"we find no\\\", \\\"no evidence\\\", \\\"contradict\\\", \\\"questionable\\\", \\\"biased\\\",\\n]\\nSUPPORT_TERMS = [\\n    \\\"consistent with\\\", \\\"confirms\\\", \\\"in agreement\\\", \\\"supports\\\", \\\"as shown by\\\",\\n    \\\"corroborate\\\", \\\"replicate\\\", \\\"extends\\\", \\\"building on\\\", \\\"following\\\",\\n    \\\"in line with\\\", \\\"validate\\\", \\\"reproduce\\\", \\\"we adopt\\\", \\\"we use the\\\",\\n    \\\"well-established\\\", \\\"seminal\\\", \\\"foundational\\\", \\\"as demonstrated\\\",\\n]\\n# Title/venue patterns that signal a formal reply/comment/rebuttal\\nREPLY_TITLE_PATTERNS = [\\n    r\\\"\\\\bcomment on\\\\b\\\", r\\\"\\\\breply to\\\\b\\\", r\\\"\\\\bresponse to\\\\b\\\", r\\\"\\\\brejoinder\\\\b\\\",\\n    r\\\"\\\\bcorrigendum\\\\b\\\", r\\\"\\\\berratum\\\\b\\\", r\\\"\\\\bretraction\\\\b\\\", r\\\"\\\\bre:\\\\b\\\",\\n    r\\\"\\\\bcritique of\\\\b\\\", r\\\"\\\\breanalysis of\\\\b\\\", r\\\"\\\\brevisiting\\\\b\\\",\\n    r\\\"\\\\ba comment\\\\b\\\", r\\\"\\\\bdiscussion of\\\\b\\\", r\\\"\\\\bconcerns? (about|regarding)\\\\b\\\",\\n]\\n\\n\\ndef _get(url, params=None, headers=None, tries=3):\\n    for i in range(tries):\\n        try:\\n            r = requests.get(url, params=params, headers=headers, timeout=30)\\n            if r.status_code == 429:\\n                time.sleep(2 * (i + 1))\\n                continue\\n            r.raise_for_status()\\n            return r.json()\\n        except requests.RequestException:\\n            if i == tries - 1:\\n                return None\\n            time.sleep(1.5 * (i + 1))\\n    return None\\n\\n\\ndef find_openalex_work(query):\\n    \\\"\\\"\\\"Resolve a title/DOI string to an OpenAlex work object.\\\"\\\"\\\"\\n    # If it looks like a DOI, use it directly.\\n    doi = re.search(r\\\"10\\\\.\\\\d{4,9}/[-._;()/:A-Z0-9]+\\\", query, re.I)\\n    if doi:\\n        w = _get(f\\\"{OPENALEX}/works/https://doi.org/{doi.group(0)}\\\",\\n                 params={\\\"mailto\\\": MAILTO})\\n        if w:\\n            return w\\n    # Otherwise title search, take best hit.\\n    res = _get(f\\\"{OPENALEX}/works\\\",\\n               params={\\\"search\\\": query, \\\"per-page\\\": 1, \\\"mailto\\\": MAILTO})\\n    if res and res.get(\\\"results\\\"):\\n        return res[\\\"results\\\"][0]\\n    return None\\n\\n\\ndef fetch_citing_works(work, max_pages=5, per_page=100):\\n    \\\"\\\"\\\"Pull the works that cite this work, via OpenAlex cited_by feed.\\\"\\\"\\\"\\n    citing = []\\n    wid = work.get(\\\"id\\\", \\\"\\\").split(\\\"/\\\")[-1]\\n    if not wid:\\n        return citing\\n    cursor = \\\"*\\\"\\n    for _ in range(max_pages):\\n        res = _get(f\\\"{OPENALEX}/works\\\",\\n                   params={\\\"filter\\\": f\\\"cites:{wid}\\\",\\n                           \\\"per-page\\\": per_page, \\\"cursor\\\": cursor,\\n                           \\\"mailto\\\": MAILTO})\\n        if not res or not res.get(\\\"results\\\"):\\n            break\\n        citing.extend(res[\\\"results\\\"])\\n        cursor = res.get(\\\"meta\\\", {}).get(\\\"next_cursor\\\")\\n        if not cursor:\\n            break\\n    return citing\\n\\n\\ndef fetch_s2_contexts(query):\\n    \\\"\\\"\\\"\\n    Semantic Scholar: get citation CONTEXTS (the sentences where others cite\\n    this paper) plus isInfluential flags. This is the reception goldmine.\\n    \\\"\\\"\\\"\\n    headers = {\\\"x-api-key\\\": S2_KEY} if S2_KEY else {}\\n    # Resolve paper\\n    search = _get(f\\\"{S2}/paper/search\\\",\\n                  params={\\\"query\\\": query, \\\"limit\\\": 1, \\\"fields\\\": \\\"paperId,title\\\"},\\n                  headers=headers)\\n    if not search or not search.get(\\\"data\\\"):\\n        return None\\n    pid = search[\\\"data\\\"][0][\\\"paperId\\\"]\\n    # Pull citations with contexts + influence flag\\n    cites = _get(f\\\"{S2}/paper/{pid}/citations\\\",\\n                 params={\\\"limit\\\": 1000,\\n                         \\\"fields\\\": \\\"contexts,isInfluential,title,year\\\"},\\n                 headers=headers)\\n    return cites.get(\\\"data\\\") if cites else None\\n\\n\\ndef classify_snippet(text):\\n    \\\"\\\"\\\"Tally refute vs support signal in one citation-context snippet.\\\"\\\"\\\"\\n    t = text.lower()\\n    refute = sum(1 for w in REFUTE_TERMS if w in t)\\n    support = sum(1 for w in SUPPORT_TERMS if w in t)\\n    return refute, support\\n\\n\\ndef is_reply_title(title):\\n    if not title:\\n        return False\\n    t = title.lower()\\n    return any(re.search(p, t) for p in REPLY_TITLE_PATTERNS)\\n\\n\\ndef build_reception_profile(query):\\n    \\\"\\\"\\\"\\n    Main entry point. Given a source (title or DOI), return a structured\\n    reception profile built from real API data for the model to reason over.\\n    \\\"\\\"\\\"\\n    profile = {\\n        \\\"query\\\": query,\\n        \\\"resolved\\\": False,\\n        \\\"citation_count\\\": None,\\n        \\\"n_citing_pulled\\\": 0,\\n        \\\"n_formal_replies\\\": 0,\\n        \\\"reply_titles\\\": [],\\n        \\\"influential_citation_count\\\": None,\\n        \\\"n_contexts\\\": 0,\\n        \\\"refute_signal\\\": 0,\\n        \\\"support_signal\\\": 0,\\n        \\\"sample_refuting_snippets\\\": [],\\n        \\\"sample_supporting_snippets\\\": [],\\n        \\\"open_access_pdf\\\": None,\\n        \\\"abstract_available\\\": False,\\n        # --- verification state (shared_primitives.txt \\u00a71) ---\\n        # Emitted mechanically. The module can establish LOCATED,\\n        # RECEPTION-CONFIRMED, CONTESTED, REBUTTED, PROVISIONAL.\\n        # It CANNOT establish ABSTRACT-CONFIRMED (requires judging whether the\\n        # abstract supports the claimed relevance) or FULL-TEXT-CONFIRMED\\n        # (requires a human read). Those stay None rather than being guessed.\\n        \\\"verification_state\\\": None,\\n        \\\"verification_state_rationale\\\": \\\"\\\",\\n        \\\"full_text_confirmed\\\": None,  # always None \\u2014 human read only\\n        \\\"reception_summary\\\": \\\"\\\",\\n        \\\"data_source\\\": \\\"retrieved (OpenAlex + Semantic Scholar)\\\",\\n        \\\"caveat\\\": (\\\"Reception SHAPE (contested vs. unchallenged) is retrieved and \\\"\\n                   \\\"reliable. Reception OUTCOME (who won a technical dispute) is NOT \\\"\\n                   \\\"established here and needs full text. Do not infer the winner.\\\"),\\n    }\\n\\n    work = find_openalex_work(query)\\n    if work:\\n        profile[\\\"resolved\\\"] = True\\n        profile[\\\"citation_count\\\"] = work.get(\\\"cited_by_count\\\")\\n        oa = work.get(\\\"open_access\\\", {})\\n        profile[\\\"open_access_pdf\\\"] = oa.get(\\\"oa_url\\\")\\n\\n        citing = fetch_citing_works(work)\\n        profile[\\\"n_citing_pulled\\\"] = len(citing)\\n        replies = [c for c in citing\\n                   if is_reply_title(c.get(\\\"title\\\") or c.get(\\\"display_name\\\"))]\\n        profile[\\\"n_formal_replies\\\"] = len(replies)\\n        profile[\\\"reply_titles\\\"] = [\\n            (c.get(\\\"title\\\") or c.get(\\\"display_name\\\")) for c in replies[:15]\\n        ]\\n\\n    # Semantic Scholar contexts (the sentence-level reception signal)\\n    contexts = fetch_s2_contexts(query)\\n    if contexts:\\n        infl = sum(1 for c in contexts if c.get(\\\"isInfluential\\\"))\\n        profile[\\\"influential_citation_count\\\"] = infl\\n        all_snips = []\\n        for c in contexts:\\n            for snip in (c.get(\\\"contexts\\\") or []):\\n                all_snips.append(snip)\\n        profile[\\\"n_contexts\\\"] = len(all_snips)\\n        for snip in all_snips:\\n            r, s = classify_snippet(snip)\\n            profile[\\\"refute_signal\\\"] += r\\n            profile[\\\"support_signal\\\"] += s\\n            if r > s and len(profile[\\\"sample_refuting_snippets\\\"]) \\u003c 8:\\n                profile[\\\"sample_refuting_snippets\\\"].append(snip.strip()[:400])\\n            elif s > r and len(profile[\\\"sample_supporting_snippets\\\"]) \\u003c 8:\\n                profile[\\\"sample_supporting_snippets\\\"].append(snip.strip()[:400])\\n\\n    # --- Verification state (shared_primitives.txt \\u00a71) -----------------------\\n    # Mechanical derivation only. Never guesses upward.\\n    cc = profile[\\\"citation_count\\\"]\\n    nr = profile[\\\"n_formal_replies\\\"]\\n    rs, ss = profile[\\\"refute_signal\\\"], profile[\\\"support_signal\\\"]\\n    reception_checked = profile[\\\"n_citing_pulled\\\"] > 0 or profile[\\\"n_contexts\\\"] > 0\\n\\n    if not profile[\\\"resolved\\\"]:\\n        profile[\\\"verification_state\\\"] = \\\"PROVISIONAL\\\"\\n        profile[\\\"verification_state_rationale\\\"] = (\\n            \\\"Source could not be resolved via OpenAlex/Semantic Scholar. Nothing \\\"\\n            \\\"verified. Any claim about this source rests on model memory \\u2014 likely \\\"\\n            \\\"error direction is OVER-rating, since prominence is better represented \\\"\\n            \\\"in training than refutation.\\\"\\n        )\\n    elif not reception_checked:\\n        profile[\\\"verification_state\\\"] = \\\"LOCATED\\\"\\n        profile[\\\"verification_state_rationale\\\"] = (\\n            \\\"Metadata resolved; no citing works or citation contexts retrieved, so \\\"\\n            \\\"reception is unchecked. Cannot anchor a severe finding.\\\"\\n        )\\n    else:\\n        # Reception WAS checked. Report the most specific applicable state.\\n        rebutted = nr >= 3 and rs > ss * 2\\n        contested = nr >= 2 or (rs > ss and rs >= 5)\\n        if rebutted:\\n            profile[\\\"verification_state\\\"] = \\\"REBUTTED\\\"\\n            profile[\\\"verification_state_rationale\\\"] = (\\n                f\\\"{nr} formal replies/comments detected and refute-signal ({rs}) \\\"\\n                f\\\"substantially exceeds support-signal ({ss}). Later work appears to \\\"\\n                f\\\"directly challenge this source. Downgrade its weight regardless of \\\"\\n                f\\\"how strong its original claims read. NOTE: this establishes that a \\\"\\n                f\\\"substantial challenge EXISTS, not that the challenge was correct.\\\"\\n            )\\n        elif contested:\\n            profile[\\\"verification_state\\\"] = \\\"CONTESTED\\\"\\n            profile[\\\"verification_state_rationale\\\"] = (\\n                f\\\"{nr} formal replies/comments, refute-signal {rs} vs support-signal \\\"\\n                f\\\"{ss}. Credible disagreement exists. Who is correct is NOT \\\"\\n                f\\\"established \\u2014 that needs full text.\\\"\\n            )\\n        else:\\n            profile[\\\"verification_state\\\"] = \\\"RECEPTION-CONFIRMED\\\"\\n            profile[\\\"verification_state_rationale\\\"] = (\\n                f\\\"Reception checked against retrieval: {cc} citations, {nr} formal \\\"\\n                f\\\"replies, refute-signal {rs} vs support-signal {ss}. No large \\\"\\n                f\\\"formal-response cluster detected. NOTE: absence of detected replies \\\"\\n                f\\\"is weaker evidence than presence \\u2014 reply detection is title-pattern \\\"\\n                f\\\"based and will miss replies that don't announce themselves.\\\"\\n            )\\n\\n    # ABSTRACT-CONFIRMED and FULL-TEXT-CONFIRMED are deliberately NOT emitted.\\n    # Both require judging whether the content supports a specific claim, which is\\n    # not a mechanical operation. The module reports availability only.\\n\\n    # Human-readable one-line reception signal for the model\\n    if not profile[\\\"resolved\\\"]:\\n        profile[\\\"reception_summary\\\"] = \\\"SOURCE NOT RESOLVED via API \\u2014 falls back to memory-flagged, provisional.\\\"\\n    else:\\n        contested = nr >= 2 or (rs > ss and rs >= 5)\\n        if contested:\\n            profile[\\\"reception_summary\\\"] = (\\n                f\\\"CONTESTED: {cc} citations, {nr} formal replies/comments, \\\"\\n                f\\\"refute-signal {rs} vs support-signal {ss}. This source drew \\\"\\n                f\\\"substantial formal response \\u2014 cap it until outcome is verified. \\\"\\n                f\\\"(This is the signal that would have caught McShane & Wyner.)\\\"\\n            )\\n        else:\\n            profile[\\\"reception_summary\\\"] = (\\n                f\\\"NOT visibly contested: {cc} citations, {nr} formal replies, \\\"\\n                f\\\"refute-signal {rs} vs support-signal {ss}. No large formal-response \\\"\\n                f\\\"cluster detected \\u2014 but absence of detected replies is weaker \\\"\\n                f\\\"evidence than presence; still confirm for load-bearing use.\\\"\\n            )\\n    return profile\\n\\n\\ndef format_for_prompt(profile):\\n    \\\"\\\"\\\"Render the profile as a block to paste into the counter-audit's\\n    reception-gate field for a given source.\\\"\\\"\\\"\\n    lines = [\\n        f\\\"RECEPTION PROFILE (retrieved) \\u2014 {profile['query']}\\\",\\n        f\\\"  Resolved: {profile['resolved']}\\\",\\n        f\\\"  Citations: {profile['citation_count']}\\\",\\n        f\\\"  Influential citations (S2): {profile['influential_citation_count']}\\\",\\n        f\\\"  Citing works pulled: {profile['n_citing_pulled']}\\\",\\n        f\\\"  Formal replies/comments detected: {profile['n_formal_replies']}\\\",\\n    ]\\n    if profile[\\\"reply_titles\\\"]:\\n        lines.append(\\\"  Reply/comment titles:\\\")\\n        for t in profile[\\\"reply_titles\\\"]:\\n            lines.append(f\\\"    - {t}\\\")\\n    lines += [\\n        f\\\"  Citation-context snippets analyzed: {profile['n_contexts']}\\\",\\n        f\\\"  Refute-signal / Support-signal: {profile['refute_signal']} / {profile['support_signal']}\\\",\\n    ]\\n    if profile[\\\"sample_refuting_snippets\\\"]:\\n        lines.append(\\\"  Sample CHALLENGING citation contexts:\\\")\\n        for s in profile[\\\"sample_refuting_snippets\\\"]:\\n            lines.append(f\\\"    > {s}\\\")\\n    if profile[\\\"sample_supporting_snippets\\\"]:\\n        lines.append(\\\"  Sample SUPPORTING citation contexts:\\\")\\n        for s in profile[\\\"sample_supporting_snippets\\\"]:\\n            lines.append(f\\\"    > {s}\\\")\\n    lines += [\\n        f\\\"  OA PDF: {profile['open_access_pdf']}\\\",\\n        \\\"\\\",\\n        f\\\"  >> VERIFICATION STATE: {profile['verification_state']}\\\",\\n        f\\\"     {profile['verification_state_rationale']}\\\",\\n        \\\"     FULL-TEXT-CONFIRMED: not established (human read required)\\\",\\n        \\\"     ABSTRACT-CONFIRMED: not established (requires judging relevance)\\\",\\n        \\\"\\\",\\n        f\\\"  >> RECEPTION SIGNAL: {profile['reception_summary']}\\\",\\n        f\\\"  >> CAVEAT: {profile['caveat']}\\\",\\n    ]\\n    return \\\"\\\\n\\\".join(lines)\\n\\n\\nif __name__ == \\\"__main__\\\":\\n    import sys\\n    if len(sys.argv) \\u003c 2:\\n        print(\\\"Usage: python citation_reception_module.py \\\\\\\"\\u003cpaper title or DOI>\\\\\\\"\\\")\\n        print(\\\"Example: python citation_reception_module.py \\\"\\n              \\\"\\\\\\\"A statistical analysis of multiple temperature proxies\\\\\\\"\\\")\\n        sys.exit(1)\\n    q = \\\" \\\".join(sys.argv[1:])\\n    prof = build_reception_profile(q)\\n    print(format_for_prompt(prof))\\n\"},\"tool2-field-context\":{\"bytes\":17502,\"lines\":361,\"path\":\"deferred/1-field-context-generator.txt\",\"sha256\":\"046aeeedfc67\",\"text\":\"FIELD CONTEXT GENERATOR\\n\\n-----------------------------------------------------------------\\nINSTRUMENT PREFLIGHT \\u2014 MANDATORY FOR FORMAL / LOGGED RUNS   [TOOL-004]\\n-----------------------------------------------------------------\\n\\nThis prompt is part of the audit instrument. Establish the exact instrument version BEFORE\\nsubstantive retrieval, extraction, analysis, or verdict work begins.\\n\\nA successful fetch indicator, correct repository path, branch label, plausible line count,\\nmatching rendered metadata, or internally self-consistent page does NOT by itself establish\\nthat the intended/current artifact was retrieved. A mutable remote reference can return a\\nhistorical representation that is internally self-consistent in every visible field.\\n\\nPROMPT IDENTITY MARKERS\\n\\n  - FIELD CONTEXT GENERATOR\\n  - CRITICAL: GROUNDING AND CONFIDENCE (READ FIRST)\\n\\nThese markers confirm the prompt family / expected structural features. They do NOT by\\nthemselves establish version currency: an older version may share the same title or markers.\\n\\n1. RECORD THE INSTRUMENT ACTUALLY IN CONTEXT.\\n\\n   Record, where available:\\n\\n   - canonical prompt path or supplied filename;\\n   - retrieval form: PASTED / ATTACHED / IMMUTABLE REMOTE / MUTABLE REMOTE;\\n   - requested branch or ref;\\n   - intended immutable commit/ref, if the run claims a repository version;\\n   - resolved commit SHA;\\n   - resolved blob/content hash, or a locally computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\n\\nYou are the Field Context Generator.\\n\\nYour job is to analyze the provided document and produce a structured \\\"Field\\nContext Block\\\" that CONFIGURES the downstream audit agents (Construct Validity,\\nInternal Validity & Replication, Forking Paths & Citation Integrity) so their\\naudits become domain-specific instead of generic.\\n\\nYour output is not commentary for a human reader. It is CONFIGURATION. The most\\nimportant part of your output (SECTION 6) tells the downstream agents, section\\nby section, how to modify their audits for this field. Treat that as the primary\\ndeliverable.\\n\\n=================================================================\\nCRITICAL: GROUNDING AND CONFIDENCE (READ FIRST)\\n=================================================================\\n\\nYou are being asked to describe a field's standards, disputes, and failure\\nmodes. You may not actually know this field reliably. Producing confident,\\nauthoritative-sounding field context that is WRONG is the worst failure here,\\nbecause your output configures every downstream audit \\u2014 your errors become\\ninvisible and load-bearing.\\n\\nTherefore:\\n\\n1. Prefer GROUNDED context. Where you have been given, or can cite, real field\\n   material \\u2014 methods papers, reviewer/journal guidelines, published\\n   methodological critiques, replication studies, retraction patterns \\u2014 ground\\n   your claims in it and cite it.\\n\\n2. LABEL every standard, red flag, and (especially) every downstream-targeting\\n   instruction as one of:\\n      [GROUNDED: \\u003csource>]  \\u2014 traceable to real field material\\n      [INFERRED \\u2014 NEEDS VALIDATION]  \\u2014 from model knowledge, not verified\\n\\n3. State an OVERALL CONFIDENCE for this Field Context Block (High / Moderate /\\n   Low), and state plainly: \\\"Downstream audits using an INFERRED or Low-confidence\\n   context must mark their own findings PROVISIONAL until this context is\\n   validated against real field discourse.\\\"\\n\\n4. Do NOT hide uncertainty behind fluent domain-sounding language. If you are\\n   unsure what this field actually disputes or requires, say so. An honest\\n   \\\"I am not confident about this field's standards\\\" is far more useful than a\\n   confident fabrication that silently miscalibrates every downstream audit.\\n\\n=================================================================\\nSTEP 1 \\u2014 CLASSIFY DOCUMENT TYPE\\n=================================================================\\n\\nDetermine the document type:\\n- Academic paper / empirical study\\n- Review / meta-analysis\\n- Policy document or government report\\n- News article or media claim\\n- Historical or cultural claim\\n- Theoretical / methodological paper\\n- Other (specify)\\n\\nDocument type materially changes which downstream checks apply. A news article\\nhas no pre-registration to check; a policy brief may have no original analysis to\\np-hack. Classify accurately, because SECTION 5 depends on it.\\n\\n=================================================================\\nFIELD CONTEXT BLOCK\\n=================================================================\\n\\n**Document Type**: [specific \\u2014 e.g., \\\"Empirical study in paleoclimate\\nreconstruction,\\\" \\\"Policy brief on criminal-justice reform,\\\" \\\"News article making\\na causal social claim\\\"]\\n\\n**Field / Domain**: [primary field and, crucially, SUBFIELD \\u2014 do not stop at\\n\\\"climate\\\" if it is \\\"paleoclimate reconstruction\\\"; subfield determines the real\\nfault lines. If the document spans subfields, name each and note which methods\\neach part uses.]\\n\\n**Overall Confidence in This Context Block**: [High / Moderate / Low] +\\none sentence why. + the provisional-status statement if Moderate/Low.\\n\\n-----------------------------------------------------------------\\nSECTION 1 \\u2014 CORE STANDARDS OF REVIEW\\n-----------------------------------------------------------------\\n\\nList 5\\u20138 methodological norms serious work of this type/field is held to.\\n- Specific to field AND document type. No generic \\\"research standards.\\\"\\n- Each labeled [GROUNDED: source] or [INFERRED \\u2014 NEEDS VALIDATION].\\n\\n-----------------------------------------------------------------\\nSECTION 2 \\u2014 SETTLED vs. CONTESTED  (guards against a dangerous failure)\\n-----------------------------------------------------------------\\n\\nSeparate the standards in Section 1 into two groups. This is mandatory and one of\\nthe most important sections \\u2014 auditing a paper against a CONTESTED standard as if\\nit were SETTLED smuggles the field's own disputed self-description into the\\nmeasuring instrument.\\n\\n  SETTLED (genuine consensus in this field \\u2014 safe to use as a benchmark):\\n    - [list, each labeled GROUNDED/INFERRED]\\n\\n  CONTESTED (the field is actively fighting about these \\u2014 do NOT treat as a\\n  settled benchmark; downstream audits must flag when a finding depends on one):\\n    - [list, each labeled GROUNDED/INFERRED, with one line on what the dispute is]\\n\\nIf you cannot tell whether a standard is settled or contested, place it in\\nCONTESTED and flag it. Default to caution.\\n\\n-----------------------------------------------------------------\\nSECTION 3 \\u2014 QUESTIONS A DOMAIN EXPERT WOULD ASK\\n-----------------------------------------------------------------\\n\\nList 6\\u201310 sharp, field-specific questions an expert reviewer/practitioner would\\nraise about a document of this type. These should read like real peer-review or\\nexpert-commentary questions, not generic ones. Each labeled GROUNDED/INFERRED.\\n\\n-----------------------------------------------------------------\\nSECTION 4 \\u2014 CHARACTERISTIC RED FLAGS (must be field-specific, not generic)\\n-----------------------------------------------------------------\\n\\nList recurring failure modes experts in THIS field scrutinize. Hard rule: each\\nred flag must be one a generalist auditor would MISS. If a red flag applies to\\nany field (selective framing, small n, overgeneralization), it is too generic \\u2014\\ncut it or make it field-specific.\\n\\nGood (field-specific) examples of the target specificity:\\n  - paleoclimate: \\\"ensemble spread reported as if it were a confidence interval\\\"\\n  - nutrition epi: \\\"food-frequency-questionnaire measurement error not propagated\\\"\\n  - econ: \\\"damage-function form assumed rather than estimated; discount-rate choice\\n    drives the headline result\\\"\\nBad (too generic): \\\"selective reporting,\\\" \\\"weak proxy,\\\" \\\"correlation vs causation.\\\"\\n\\nEach red flag labeled GROUNDED/INFERRED.\\n\\n-----------------------------------------------------------------\\nSECTION 5 \\u2014 APPLICABLE vs. N/A DOWNSTREAM CHECKS (driven by document type)\\n-----------------------------------------------------------------\\n\\nGiven the document type, state which downstream checks APPLY and which are N/A,\\nso downstream agents do not fire irrelevant checks and generate noise.\\n\\nFor each, mark APPLIES / N/A / PARTIAL and one-line why:\\n  - Construct-validity: proxy adequacy, operationalization, measurement validity\\n  - Internal-validity: confounding, selection bias, p-hacking, HARKing,\\n    forking-paths/multiverse, replication status\\n  - Citation-integrity: claim mutation, laundering, amplification, cartel structure\\n\\nExample: news article citing one study -> p-hacking N/A (no original analysis),\\ncitation-integrity APPLIES (how is the cited study represented?), construct-validity\\nPARTIAL (is the cited proxy adequate for the claim the article makes?).\\n\\n-----------------------------------------------------------------\\nSECTION 6 \\u2014 DOWNSTREAM AUDIT TARGETING  ***PRIMARY DELIVERABLE***\\n-----------------------------------------------------------------\\n\\nThis is the section that turns field context into CONFIGURATION. For each\\ndownstream audit, give SECTION-KEYED, field-specific modifications \\u2014 concrete\\nthings to add, emphasize, or check that the generic prompt would not include.\\nOrganize by the downstream audits' own sections.\\n\\n*** HIGHEST-ERROR-POTENTIAL SECTION. *** A wrong targeting instruction injects a\\nspecific, load-bearing error into every downstream audit for this field \\u2014 worse\\nthan vague wrong context, because it is directive. Therefore EVERY targeting\\ninstruction in this section MUST be labeled [GROUNDED: source] or [INFERRED \\u2014\\nNEEDS VALIDATION], and any INFERRED targeting instruction must be treated by\\ndownstream agents as provisional. Do not emit a confident, specific targeting\\ninstruction you cannot ground \\u2014 a vague honest note is safer than a precise\\nfabrication.\\n\\nFOR THE CONSTRUCT-VALIDITY AUDIT:\\n  - Proxy adequacy section: in this field, the characteristic proxy problems are\\n    ___; the measurement gold standard is ___; the common invalid-proxy move is\\n    ___. [label]\\n  - Operationalization section: field-specific operationalization pitfalls: ___\\n    [label]\\n  - Measurement-validity section: field-specific measurement/instrument issues,\\n    known unreliable instruments, calibration concerns: ___ [label]\\n\\nFOR THE INTERNAL-VALIDITY & REPLICATION AUDIT:\\n  - Confounding section: the confounders this field must control and frequently\\n    doesn't: ___ [label]\\n  - Selection section: field-specific selection/sampling problems: ___ [label]\\n  - P-hacking / forking-paths section: the analytical degrees of freedom\\n    characteristic of this field's methods (which pipeline choices matter most\\n    here): ___ [label]\\n  - Replication section: this field's replication track record and base rate for\\n    this type of finding; known failed replications to check against: ___ [label]\\n\\nFOR THE FORKING-PATHS & CITATION-INTEGRITY AUDIT:\\n  - Claim-mutation / amplification: the specific claims in this field prone to\\n    inflation across citation, and the canonical over-cited/laundered sources to\\n    watch for: ___ [label]\\n  - Cartel / neglect: known citation hubs, and the adjacent fields this field\\n    characteristically ignores: ___ [label]\\n\\nIf you do not know a field-specific answer for a given slot, write\\n\\\"[no field-specific modification \\u2014 generic check applies]\\\" rather than inventing\\none. An empty slot is honest; a fabricated targeting instruction is not.\\n\\n-----------------------------------------------------------------\\nSECTION 7 \\u2014 ADDITIONAL NOTES FOR AUDITORS\\n-----------------------------------------------------------------\\n\\n- Typical data limitations in this field.\\n- Where legitimate methodological critique is likely to be CONFLATED with\\n  ideological position \\u2014 IN BOTH DIRECTIONS \\u2014 so auditors hold the methods\\n  question separate from the political one. (Do not instruct auditors to \\\"soften\\\"\\n  on charged topics and do not treat one side's framing as the neutral baseline;\\n  the note is to keep methods and politics separate, symmetrically.)\\n- Field-specific context that helps the downstream agents, each GROUNDED/INFERRED.\\n\\n========           r.p("A small number of failure shapes recur across fields that share almost nothing else. The same defect that shows up in a psychology replication shows up, wearing different vocabulary, in a climate reconstruction and in a week of news coverage. That observation is the premise this toolkit is built on.", "lede"),

          ]),
          r.numlist([
            ["I", "<b>Measurement drift.</b> The quantity computed is not the quantity claimed. A proxy stands in for a construct and then quietly becomes it; a statistic answering one question is attached to a different one. The source may be entirely competent and this failure still occurs, because it happens in the sentence that reports the result rather than in the work that produced it."],
            ["II", "<b>Design latitude.</b> The result depends on analytical choices that were not fixed in advance. Exclusions, cutoffs, model specifications and outcome selection each have defensible options, and the reported result is one path through them. The failure is not that a choice was made; it is that the number of available paths is invisible in the write-up."],

  /* ==========================================================
     DOM HELPERS
     ========================================================== */

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = txt;
    return n;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function $(id) { return document.getElementById(id); }

  var TONE_CLASS = { fatal: "v-fatal", major: "v-major", minor: "v-minor", sound: "v-sound", prov: "v-prov" };

  function verdictBadge(v, brief) {
    var b = el("span", "vbadge " + (TONE_CLASS[v.tone] || "v-prov"));
    b.appendChild(el("span", "vletter", v.code));
    b.appendChild(el("span", null, brief && v.short ? v.short : v.label));
    return b;
  }

  var DOT = { run: "dot-run", flagged: "dot-flag", "not-run": "dot-off", human: "dot-gap", gap: "dot-gap", decision: "dot-gap" };

  /* ==========================================================
     STATE
     ========================================================== */

  var state = { auditId: AUDITS[0].id, runIndex: null };

  /* Below 1000px the three regions are stacked in document flow, so the panel a
     selection updates may be far below the fold. Scroll it into view, otherwise
     tapping a card reads as nothing happening. */
  function isStacked() {
    return window.matchMedia && window.matchMedia("(max-width: 1000px)").matches;
  }
  function reducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function reveal(node) {
    if (!isStacked() || !node || !node.scrollIntoView) return;
    node.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
  }

  function currentAudit() {
    for (var i = 0; i < AUDITS.length; i++) if (AUDITS[i].id === state.auditId) return AUDITS[i];
    return AUDITS[0];
  }

  /* ==========================================================
     LEFT — LIBRARY
     ========================================================== */

  function renderLibrary() {
    var list = $("libList");
    clear(list);
    $("libCount").textContent = AUDITS.length + " runs";

    AUDITS.forEach(function (a) {
      var btn = el("button", "lib-item");
      btn.setAttribute("role", "listitem");
      btn.setAttribute("aria-current", a.id === state.auditId ? "true" : "false");

      btn.appendChild(el("h3", "lib-title", a.title));
      btn.appendChild(el("p", "lib-claim", a.claimShort));

      var meta = el("div", "lib-meta");
      meta.appendChild(el("span", "chip chip-tag", a.tag));
      if (a.provenance === "synthetic") meta.appendChild(el("span", "chip chip-synth", "Synthetic"));
      meta.appendChild(el("span", "lib-date", a.date));
      btn.appendChild(meta);

      var meta2 = el("div", "lib-meta");
      meta2.style.marginTop = "7px";
      meta2.appendChild(verdictBadge(a.verdict, true));
      btn.appendChild(meta2);

      btn.addEventListener("click", function () {
        if (state.auditId === a.id) return;
        state.auditId = a.id;
        state.runIndex = null;
        renderAll();
        $("specimenScroll").scrollTop = 0;
        $("roScroll").scrollTop = 0;
        reveal(document.querySelector(".centre"));
      });

      list.appendChild(btn);
    });
  }

      (a.closedCandidates || []).forEach(function (c) {
        var f = el("div", "finding");
        var top = el("div", "finding-top");
        top.appendChild(el("span", "vbadge v-sound", "Closed"));
        f.appendChild(top);
        f.appendChild(el("h3", "finding-title", c.title));
        f.appendChild(el("p", "finding-body", c.closed));
        cand.appendChild(f);
      });
      b4.appendChild(cand);
    } else {
      var wrap = el("div", "findings");
      a.findings.forEach(function (f) {
        var card = el("div", "finding");
        var top = el("div", "finding-top");
        top.appendChild(el("span", "finding-id", f.id));
        var sb = el("span", "vbadge " + (TONE_CLASS[f.sev] || "v-prov"));
        sb.appendChild(el("span", null, f.sevLabel));
        top.appendChild(sb);
        card.appendChild(top);
        card.appendChild(el("h3", "finding-title", f.title));
        card.appendChild(el("p", "finding-body", f.body));

        var foot = el("div", "finding-foot");
        foot.appendChild(el("span", "k", "Target"));
        foot.appendChild(el("span", null, f.target));
        var sep = el("span", "k", "·");
        sep.style.letterSpacing = "0";
        foot.appendChild(sep);
        foot.appendChild(el("span", "k", "State"));
        foot.appendChild(el("span", "vstate", f.vstate));
        card.appendChild(foot);

        wrap.appendChild(card);
      });
      b4.appendChild(wrap);
    }
    root.appendChild(b4);
  }

    $("stripHint").textContent = ran + " of " + a.runs.length + " stages produced output";

    a.runs.forEach(function (r, i) {
      var inert = !r.output;
      var card = el("button", "run-card" + (inert ? " is-inert" : ""));
      card.setAttribute("role", "tab");

      st.appendChild(el("span", "dot " + (DOT[r.status] || "dot-off")));
      st.appendChild(el("span", null, r.statusLabel));
      card.appendChild(st);

      card.addEventListener("click", function () {
        state.runIndex = (state.runIndex === i) ? null : i;
        renderStrip();
        renderReadout();
        $("roScroll").scrollTop = 0;
        reveal(document.querySelector(".readout"));
      });

      rail.appendChild(card);
    });
  }

  /* ==========================================================
     RIGHT — READOUT
     ========================================================== */

  function renderReadout() {
    var a = currentAudit();
    var head = $("roHead");
    var body = $("readout");
    clear(head);
    clear(body);
    body.classList.remove("fade-in");
    void body.offsetWidth;
    body.classList.add("fade-in");

    if (state.runIndex === null) {
      head.appendChild(el("span", "eyebrow", "Detail readout"));
      head.appendChild(el("span", "region-count", "Audit level"));
      renderAuditReadout(a, body);
    } else {
      var back = el("button", "back-btn");
      back.appendChild(el("span", null, "←"));
      back.appendChild(el("span", null, "Audit summary"));
      back.addEventListener("click", function () {
        state.runIndex = null;
        renderStrip();
        renderReadout();
      });
      head.appendChild(back);
      head.appendChild(el("span", "region-count", "Prompt output"));
      renderRunReadout(a.runs[state.runIndex], body);
    }
  }

  function section(parent, label) {
    var s = el("div", "ro-section");
    s.appendChild(el("span", "eyebrow", label));
    parent.appendChild(s);
    return s;
  }

  function renderAuditReadout(a, body) {
    var s1 = section(body, "Overall summary");
    s1.appendChild(el("p", "ro-prose", a.summary));

    var s2 = section(body, "Key findings");
    var ul = el("ul", "keylist");
    a.keyFindings.forEach(function (k, i) {
      var li = el("li");
      li.appendChild(el("span", "kdot", String(i + 1).padStart(2, "0")));
      li.appendChild(el("span", null, k));
      ul.appendChild(li);
    });
    s2.appendChild(ul);

    var s3 = section(body, "Source status");
    var sl = el("div", "srclist");
    a.sourceStatus.forEach(function (s) {
      var row = el("div", "srcrow");
      var top = el("div", "srcrow-top");
      top.appendChild(el("span", "srcrow-label", s.label));
      top.appendChild(el("span", "srcrow-state", s.state));
      row.appendChild(top);
      row.appendChild(el("div", "srcrow-note", s.note));
      sl.appendChild(row);
    });
    s3.appendChild(sl);

    var s4 = section(body, "Recommended decisive test");
    var d = el("div", "decisive");
    d.appendChild(el("p", null, a.decisiveTest));
    d.appendChild(el("p", null, a.decisiveNote));
    s4.appendChild(d);
  }

  function renderRunReadout(run, body) {
    var head = el("div", "po-head");
    var kick = el("div", "spec-kicker");
    kick.appendChild(el("span", "chip chip-tag", run.stage === "—" ? "Stage —" : "Stage " + run.stage));
    var stChip = el("span", "run-state");
    stChip.appendChild(el("span", "dot " + (DOT[run.status] || "dot-off")));
    stChip.appendChild(el("span", null, run.statusLabel));
    kick.appendChild(stChip);
    head.appendChild(kick);

    head.appendChild(el("h2", "po-title", run.name));

    if (run.model || run.date) {
      var meta = el("div", "po-meta");
      if (run.model) {
        var m1 = el("span");
        m1.appendChild(el("span", "k", "Model"));
        m1.appendChild(document.createTextNode(run.model));
        meta.appendChild(m1);
      }
      if (run.date) {
        var m2 = el("span");
        m2.appendChild(el("span", "k", "Run"));
        m2.appendChild(document.createTextNode(run.date));
        meta.appendChild(m2);
      }
      head.appendChild(meta);
    }

    if (run.note) {
      var n = el("div", "po-note" + (run.output ? "" : " is-plain"), run.note);
      head.appendChild(n);
    }
    body.appendChild(head);

    if (!run.output) {
      var empty = el("div", "po-empty");
      empty.appendChild(el("p", null, "No output for this stage."));
      empty.appendChild(el("p", null, "It is listed rather than hidden. A sequence that quietly drops the stages it did not run looks identical to one that ran them all."));
      body.appendChild(empty);
      return;
    }

    var tools = el("div", "po-toolbar");
    var copyBtn = el("button", "copy-btn", "Copy output");
    tools.appendChild(copyBtn);
    var bytes = el("span", "po-bytes", run.output.split("\n").length + " lines");
    tools.appendChild(bytes);
    body.appendChild(tools);

    var wrap = el("div", "po-wrap");
    var pre = el("pre", "po-pre", run.output);
    wrap.appendChild(pre);
    body.appendChild(wrap);

    copyBtn.addEventListener("click", function () {
      copyText(run.output, copyBtn);
    });
  }

  function copyText(text, btn, label, onFail) {
    label = label || "Copy output";
    function ok() {
      btn.textContent = "Copied";
      btn.classList.add("is-ok");
      setTimeout(function () { btn.textContent = label; btn.classList.remove("is-ok"); }, 1600);
    }
    function giveUp() {
      /* The clipboard can be blocked outright in a sandboxed frame. Reveal a
         selectable copy rather than failing silently -- handover is the one
         thing this page cannot get wrong. */
      btn.textContent = "Select it below instead";
      setTimeout(function () { btn.textContent = label; }, 2600);
      if (onFail) onFail();
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      var done = false;
      try { done = document.execCommand("copy"); } catch (e) { done = false; }
      document.body.removeChild(ta);
      if (done) ok(); else giveUp();
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else {
      fallback();
    }
  }

  /* ==========================================================
     DOCUMENTATION
     ========================================================== */

  var R = {
    h3: function (t) { return "<h3>" + t + "</h3>"; },
    h4: function (t) { return "<h4>" + t + "</h4>"; },
    p: function (t, cls) { return "<p" + (cls ? " class=\"" + cls + "\"" : "") + ">" + t + "</p>"; },
    callout: function (ps) { return "<div class=\"callout\">" + ps.map(function (x) { return "<p>" + x + "</p>"; }).join("") + "</div>"; },
    numlist: function (rows) {
      return "<div class=\"numlist\">" + rows.map(function (r) {
        return "<div class=\"numrow\"><div class=\"n\">" + r[0] + "</div><div class=\"t\">" + r[1] + "</div></div>";
      }).join("") + "</div>";
    },
    vocab: function (items) {
      return "<div class=\"vocab\">" + items.map(function (i) { return "<code>" + i + "</code>"; }).join("") + "</div>";
    },
    ladder: function (rows) {
      return "<div class=\"ladder\">" + rows.map(function (r) {
        return "<div class=\"ladder-row\"><div class=\"L\">" + r[0] + "</div><div class=\"D\">" + r[1] + "</div></div>";
      }).join("") + "</div>";
    }
  };

  var docTab = DOCS[0].id;

  function renderDocs() {
    var nav = $("docsNav");
    clear(nav);
    DOCS.forEach(function (d) {
      var b = el("button", "docs-tab", d.label);
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", d.id === docTab ? "true" : "false");
      b.addEventListener("click", function () { docTab = d.id; renderDocs(); $("docsBody").scrollTop = 0; });
      nav.appendChild(b);
    });

    var body = $("docsBody");
    clear(body);
    var inner = el("div", "doc-inner");
    var doc = DOCS.filter(function (d) { return d.id === docTab; })[0];
    inner.innerHTML = doc.render(R);

    var foot = el("div", "docs-foot");
    foot.textContent = "This documentation is written for and owned by this app. The companion field-map essay it descends from is separate source material and is not reproduced here.";
    inner.appendChild(foot);

    body.appendChild(inner);
    body.classList.remove("fade-in");
    void body.offsetWidth;
    body.classList.add("fade-in");
  }

  function openDocs() {
    $("docs").classList.add("is-open");
    $("docs").setAttribute("aria-hidden", "false");
    $("scrim").classList.add("is-open");
    $("docsClose").focus();
  }
  function closeDocs() {
    $("docs").classList.remove("is-open");
    $("docs").setAttribute("aria-hidden", "true");
    $("scrim").classList.remove("is-open");
    $("docsBtn").focus();
  }

  /* ==========================================================
     THEME
     ========================================================== */

  function prefersDark() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  var themeOverride = null;

  function currentIsDark() {
    return themeOverride ? themeOverride === "dark" : prefersDark();
  }
  function syncThemeBtn() {
    var dark = currentIsDark();
    $("themeLabel").textContent = dark ? "Light" : "Dark";
    $("themeBtn").setAttribute("aria-pressed", dark ? "true" : "false");
  }
  function toggleTheme() {
    themeOverride = currentIsDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", themeOverride);
    syncThemeBtn();
  }

  /* ==========================================================
     RUN STATE  -  localStorage, with loud failure
     ========================================================== */

  var RUN_KEY = "provenance.run.v1";
  var run = null;
  var persistOk = true;

  function blankRun() {
    return { schema: 1, branch: "research", target: { label: "", cite: "" }, stages: {}, updatedAt: null };
  }
  function loadRun() {
    try {
      var raw = window.localStorage.getItem(RUN_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.schema === 1) return parsed;
      }
    } catch (e) { persistOk = false; }
    return blankRun();
  }
  var saveTimer = null;
  function saveRun() {
    run.updatedAt = new Date().toISOString().slice(0, 10);
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flushRun, 400);
  }
  function flushRun() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try { window.localStorage.setItem(RUN_KEY, JSON.stringify(run)); }
    catch (e) { if (persistOk) { persistOk = false; renderWarn(); } }
  }
  function stageState(id) {
    if (!run.stages[id]) run.stages[id] = { model: "", output: "", notes: "" };
    return run.stages[id];
  }
  function stageDone(id) {
    var s = run.stages[id];
    return !!(s && s.output && s.output.trim());
  }

  function renderWarn() {
    var host = $("warnHost");
    clear(host);
    if (persistOk) return;
    host.appendChild(el("div", "warnbar",
      "Not saving — this browser is blocking local storage. Copy anything you have pasted in before you close this tab."));
  }

  /* ==========================================================
     SEQUENCE
     ========================================================== */

  var seqState = { branch: "research", nodeId: "0-field-diagnostic", tab: "brief" };

  function seqNodes() {
    return SEQ.filter(function (n) { return n.branches.indexOf(seqState.branch) !== -1; });
  }
  function seqNode(id) {
    var m = SEQ.filter(function (n) { return n.id === id; });
    return m.length ? m[0] : null;
  }

  function renderBranchPick() {
    var host = $("branchPick");
    clear(host);
    [["research", "Research"], ["media", "Media"]].forEach(function (b) {
      var btn = el("button", "bbtn", b[1]);
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", seqState.branch === b[0] ? "true" : "false");
      btn.addEventListener("click", function () {
        if (seqState.branch === b[0]) return;
        seqState.branch = b[0];
        run.branch = b[0];
        saveRun();
        var still = seqNodes().filter(function (n) { return n.id === seqState.nodeId; });
        if (!still.length) seqState.nodeId = seqNodes()[0].id;
        seqState.tab = "brief";
        renderSeq();
      });
      host.appendChild(btn);
    });
  }

  function renderRail() {
    var host = $("rail");
    clear(host);

    var nodes = seqNodes();
    var order = ["gate", "target", "map", "prosecutors", "balance", "human", "foundation"];
    var promptCount = 0, doneCount = 0;

    order.forEach(function (g) {
      var inGroup = nodes.filter(function (n) { return n.group === g; });
      if (!inGroup.length) return;

      var meta = SEQ_GROUPS[g];
      var wrap = el("div", "railgroup");
      var lab = el("div", "glabel");
      lab.appendChild(el("span", "gname", meta.name));
      if (meta.note) lab.appendChild(el("span", "gnote", meta.note));
      wrap.appendChild(lab);

      var body = el("div", meta.parallel ? "parallel" : null);

      inGroup.forEach(function (n) {
        if (n.kind === "prompt") promptCount++;
        var done = n.kind === "prompt" && stageDone(n.id);
        if (done) doneCount++;

        var btn = el("button", "node");
        btn.setAttribute("aria-current", seqState.nodeId === n.id ? "true" : "false");
        btn.appendChild(el("span", "nmark", n.mark));

        var col = el("span");
        col.appendChild(el("span", "nname", n.name));
        col.appendChild(el("span", "nsub", n.sub));
        if (done) col.appendChild(el("span", "ntag t-done", "output saved"));
        else if (n.tag === "gate") col.appendChild(el("span", "ntag t-gate", "gate"));
        else if (n.tag === "gap") col.appendChild(el("span", "ntag t-gap", "not built"));
        else if (n.tag === "optional") col.appendChild(el("span", "ntag t-opt", "optional"));
        btn.appendChild(col);

        btn.addEventListener("click", function () {
          seqState.nodeId = n.id;
          seqState.tab = "brief";
          renderSeq();
          $("workScroll").scrollTop = 0;
          reveal(document.querySelector(".seqwork"));
        });
        body.appendChild(btn);
      });

      wrap.appendChild(body);
      host.appendChild(wrap);
    });

    $("seqProgress").textContent = doneCount + " of " + promptCount + " with output";
  }

  function renderWork() {
    var n = seqNode(seqState.nodeId);
    var head = $("workHead");
    var body = $("work");
    clear(head); clear(body);
    body.classList.remove("fade-in"); void body.offsetWidth; body.classList.add("fade-in");

    head.appendChild(el("span", "eyebrow", SEQ_GROUPS[n.group].name));
    head.appendChild(el("span", "region-count", n.kind === "prompt" ? "prompt stage" : n.kind));

    var kick = el("div", "work-kicker");
    var numbered = /^[0-9]+$/.test(n.mark);
    kick.appendChild(el("span", "chip chip-tag", numbered ? "Stage " + n.mark : SEQ_GROUPS[n.group].name));
    if (n.optional) kick.appendChild(el("span", "chip chip-synth", "Optional"));
    body.appendChild(kick);

    body.appendChild(el("h1", "work-title", n.name));
    body.appendChild(el("p", "work-tagline", n.tagline));

    var hasPrompt = n.kind === "prompt" && PROMPTS.prompts[n.id];
    var tabs = [["brief", "Brief"]];
    if (hasPrompt) tabs.push(["prompt", "Prompt"], ["output", "Your output"]);
    if (n.id === "select-target") tabs.push(["output", "Target"]);

    if (tabs.length > 1) {
      var tb = el("div", "tabs");
      tabs.forEach(function (t) {
        var b = el("button", "tab", t[1]);
        b.setAttribute("role", "tab");
        b.setAttribute("aria-selected", seqState.tab === t[0] ? "true" : "false");
        b.addEventListener("click", function () { seqState.tab = t[0]; renderWork(); });
        tb.appendChild(b);
      });
      body.appendChild(tb);
    }

    var active = seqState.tab;
    if (!tabs.some(function (t) { return t[0] === active; })) active = "brief";

    if (active === "brief") renderBrief(n, body);
    else if (active === "prompt") renderPrompt(n, body);
    else renderOutput(n, body);
  }

  function renderBrief(n, body) {
    n.brief.forEach(function (b) {
      var sec = el("div", "wsec");
      if (b[0] === "p") {
        var p = el("p"); p.innerHTML = b[1]; sec.appendChild(p);
      } else if (b[0] === "list" || b[0] === "ol") {
        var ul = el("ul", "blist");
        b[1].forEach(function (li) { var i = el("li"); var s = el("span"); s.innerHTML = li; i.appendChild(s); ul.appendChild(i); });
        sec.appendChild(ul);
      } else if (b[0] === "callout") {
        var c = el("div", "callout-sm"); c.innerHTML = b[1]; sec.appendChild(c);
      } else if (b[0] === "checkpoint" && n.checkpoint) {
        sec.appendChild(checkpointEl(n.checkpoint));
      }
      body.appendChild(sec);
    });

    if (n.routes) {
      var rs = el("div", "wsec");
      rs.appendChild(el("span", "eyebrow", "Where it routes you"));
      var wrap = el("div", "routes");
      n.routes.forEach(function (r) {
        var row = el("div", "route");
        var left = el("div");
        left.appendChild(el("div", "route-cond", r.cond));
        left.appendChild(el("div", "route-note", r.note));
        row.appendChild(left);
        row.appendChild(el("span", "route-go " + (r.tone === "yes" ? "go-yes" : "go-hold"), r.go));
        wrap.appendChild(row);
      });
      rs.appendChild(wrap);
      body.appendChild(rs);
    }
  }

  function checkpointEl(cp) {
    var c = el("div", "checkpoint");
    var h = el("div", "cp-head");
    h.appendChild(el("span", "cp-name", cp.name));
    h.appendChild(el("span", "cp-halt", cp.halt));
    c.appendChild(h);
    cp.body.forEach(function (t) { var p = el("p"); p.innerHTML = t; c.appendChild(p); });
    c.appendChild(el("div", "cp-cap", cp.cap));
    if (cp.foot) { var f = el("p"); f.style.marginTop = "9px"; f.innerHTML = cp.foot; c.appendChild(f); }
    return c;
  }

  function renderPrompt(n, body) {
    var p = PROMPTS.prompts[n.id];

    var stamp = el("div", "provenance-stamp");
    function kv(k, v) {
      var s = el("span");
      s.appendChild(el("span", "ps-k", k));
      s.appendChild(el("span", "ps-v", v));
      stamp.appendChild(s);
    }
    kv("Canonical source", p.path);
    kv("sha256", p.sha256);
    kv("Size", p.bytes.toLocaleString() + " bytes · " + p.lines.toLocaleString() + " lines");
    kv("Snapshot", PROMPTS.snapshot);
    stamp.appendChild(el("div", "ps-warn",
      "This is an embedded copy. The file above is canonical — if it and this page disagree, the file wins. Re-sync with tools/embed_prompts.py."));
    body.appendChild(stamp);

    var bar = el("div", "handover");
    var copy = el("button", "big-copy", "Copy prompt");
    bar.appendChild(copy);
    bar.appendChild(el("span", "saved-note", "Paste into whichever model you are testing, together with your target material."));
    body.appendChild(bar);

    var wrap = el("div", "pt-wrap");
    wrap.appendChild(el("pre", "pt-pre", p.text));
    body.appendChild(wrap);

    var ta = el("textarea", "pt-fallback");
    ta.readOnly = true;
    ta.value = p.text;
    ta.setAttribute("aria-label", "Prompt text, selectable");
    ta.style.display = "none";
    body.appendChild(ta);

    copy.addEventListener("click", function () {
      copyText(p.text, copy, "Copy prompt", function () {
        ta.style.display = "block";
        ta.focus(); ta.select();
      });
    });
  }

  function renderOutput(n, body) {
    if (n.id === "select-target") {
      var card = el("div", "target-card");
      card.appendChild(textField("Target", "label", run.target, "Paper, report or coverage set"));
      card.appendChild(textField("Citation or link", "cite", run.target, ""));
      body.appendChild(card);
      return;
    }

    var st = stageState(n.id);

    var row = el("div", "field-row");
    row.appendChild(textField("Model used", "model", st, "which model produced this"));
    body.appendChild(row);

    var f = el("div", "field");
    var lab = el("label", null, "Paste the model's output");
    var ta = el("textarea");
    ta.value = st.output || "";
    ta.placeholder = "Paste what the model returned, verbatim.";
    ta.addEventListener("input", function () { st.output = ta.value; saveRun(); renderRail(); });
    f.appendChild(lab); f.appendChild(ta);
    body.appendChild(f);

    var f2 = el("div", "field");
    var lab2 = el("label", null, "Notes — which checks fired, what changed, what got killed");
    var ta2 = el("textarea");
    ta2.style.minHeight = "90px";
    ta2.value = st.notes || "";
    ta2.addEventListener("input", function () { st.notes = ta2.value; saveRun(); });
    f2.appendChild(lab2); f2.appendChild(ta2);
    body.appendChild(f2);

    var bar = el("div", "savebar");
    bar.appendChild(el("span", "saved-note",
      run.updatedAt ? "Saved locally in this browser · last change " + run.updatedAt
                    : "Saved locally in this browser as you type."));
    body.appendChild(bar);
  }

  function textField(label, key, obj, placeholder) {
    var f = el("div", "field");
    f.appendChild(el("label", null, label));
    var i = el("input");
    i.type = "text";
    i.value = obj[key] || "";
    if (placeholder) i.placeholder = placeholder;
    i.addEventListener("input", function () { obj[key] = i.value; saveRun(); });
    f.appendChild(i);
    return f;
  }

  function renderSeq() {
    renderBranchPick();
    renderRail();
    renderWork();
  }

  /* ==========================================================
     MODE
     ========================================================== */

  var mode = "sequence";

  function setMode(m) {
    mode = m;
    $("seqView").hidden = m !== "sequence";
    $("examineView").hidden = m !== "examine";
    var btns = $("modeSwitch").querySelectorAll(".mbtn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-mode") === m ? "true" : "false");
    }
    if (m === "sequence") renderSeq(); else renderAll();
  }

  /* ==========================================================
     BOOT
     ========================================================== */

  function renderAll() {
    renderLibrary();
    renderSpecimen();
    renderStrip();
    renderReadout();
  }

  $("docsBtn").addEventListener("click", openDocs);
  $("docsClose").addEventListener("click", closeDocs);
  $("scrim").addEventListener("click", closeDocs);
  $("themeBtn").addEventListener("click", toggleTheme);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $("docs").classList.contains("is-open")) closeDocs();
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", function () { if (!themeOverride) syncThemeBtn(); });
  }

  var mbtns = $("modeSwitch").querySelectorAll(".mbtn");
  for (var mi = 0; mi < mbtns.length; mi++) {
    (function (b) {
      b.addEventListener("click", function () { setMode(b.getAttribute("data-mode")); });
    })(mbtns[mi]);
  }

  window.addEventListener("pagehide", flushRun);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flushRun();
  });

  run = loadRun();
  seqState.branch = run.branch || "research";
  if (!seqNodes().some(function (n) { return n.id === seqState.nodeId; })) {
    seqState.nodeId = seqNodes()[0].id;
  }

  syncThemeBtn();
  renderWarn();
  renderDocs();
  setMode("sequence");
})();
</script>
