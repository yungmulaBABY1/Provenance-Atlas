EGISTER variance only - not a finding. If\\n    it moves a [MEDIA-P1] axis, route it to CAUSAL-ROLE-FRAMING. E2.2 owns the\\n    result only where the wording adds or removes a causal bridge.\\n\\n  CAUSAL-CONTEXT VARIANCE  -  one formulation includes or removes the fact explaining WHY the\\n  next thing happened:\\n\\n    \\\"police used a Taser\\\"          vs. \\\"the Taser failed\\\" \\\"unemployment rose\\\"            vs.\\n    \\\"unemployment rose after the plant closed\\\" \\\"the district cut programs\\\"    vs. \\\"the\\n    district cut programs after the levy failed\\\" \\\"premiums increased\\\"           vs. \\\"premiums\\n    increased following the mandate change\\\" \\\"the company relocated\\\"        vs. \\\"the company\\n    relocated after the tax change\\\" \\\"cases rose in the county\\\"     vs. \\\"cases rose after\\n    testing was expanded\\\" \\\"the bill failed\\\"              vs. \\\"the bill failed after the\\n    amendment was added\\\" \\\"enrollment declined\\\"          vs. \\\"enrollment declined as the\\n    district redrew boundaries\\\"\\n\\n  In every pair, the shorter version is TRUE. It is not a softer synonym  -  it removes the\\n  reader's ability to model the sequence.\\n\\nTHREE BRIDGE TYPES  -  DO NOT CONVERT \\\"AFTER\\\" INTO \\\"BECAUSE.\\\" Several formulations below\\nestablish CHRONOLOGY, not causation. The term \\\"causal bridge\\\" invites upgrading a temporal\\nassociation into a causal fact. Classify:\\n\\n  SEQUENCE BRIDGE ........... what intervened between two events \\\"The levy failed; the\\n  district later cut programs.\\\" MECHANISM BRIDGE .......... how one event produced or\\n  constrained the next \\\"The failed levy left a $12M gap, after which the district cut\\n  programs.\\\" ATTRIBUTED CAUSAL BRIDGE .. a source's explanation for why one caused the other\\n  \\\"District officials said the failed levy forced the cuts.\\\"\\n\\nA missing SEQUENCE fact can be established even where causation remains contested. Record\\ncausal confidence SEPARATELY from whether the bridge was omitted. Omitting a sequence fact is\\na finding; asserting a mechanism the evidence doesn't support is a different finding, in the\\nopposite direction.\\n\\n| Wording used | Synonym only? | Bridge type (sequence/mechanism/attributed) | Added or removed? | Whose explanation? | Effect on reader's model |\\n|---|---|---|---|---|---|\\n\\nTESTS:\\n  1. Does the shorter version preserve the causal relationship, or only the fact?\\n  2. Does it tell the reader WHAT happened while omitting WHY the next thing did?\\n  3. Is the missing causal fact ESTABLISHED, or is it an interested party's explanation? These\\n     are different findings  -  omitting an established causal fact is stronger than omitting\\n     a contested one.\\n  4. Is the causal fact asserted, attributed, contested, or independently visible?\\n  5. IS THE OMITTED BRIDGE THE ONE THAT WOULD COMPLICATE THE PIECE'S FRAME? A piece that omits\\n     causal bridges in both directions is thin. A piece that omits only the ones cutting\\n     against its frame is constructed.\\n\\nSEVERITY: causal-bridge removal that materially changes the reader's model\\nof the sequence may be rated MODERATE or MAJOR. Register-only variance is not a\\nframing finding. Wording that moves a [MEDIA-P1] axis is classified and rated\\nunder CAUSAL-ROLE-FRAMING, not as a diluted causal-bridge finding. DO NOT\\nCOLLAPSE THESE OPERATIONS.\\n\\n-----------------------------------------------------------------\\nE2.3  -  BASELINE AND DENOMINATOR SELECTION\\n-----------------------------------------------------------------\\n\\nA quantitative claim's meaning is set by what it is compared against. Comparison choice is a\\nconstruction lever and is largely invisible unless audited directly.\\n\\n  1. RAW COUNT or RATE? Absolute numbers and per-capita rates support opposite impressions\\n     from identical data.\\n  2. WHICH BASELINE YEAR? Compared to last year, pre-pandemic, a decade ago, the peak, the\\n     trough? Is the chosen comparison point unusually high or low?\\n  3. WHICH POPULATION IS THE DENOMINATOR? Total population, affected population, eligible\\n     population, participants?\\n  4. INFLATION, SEASONAL, OR POPULATION ADJUSTMENT applied  -  or not?\\n  5. Are figures from opposing sides computed on the SAME basis?\\n  6. Does the piece report the comparison it used, or present a number bare?\\n  7. If a trend is claimed, over what window  -  and does the trend survive a different\\n     reasonable window?\\n\\nALSO TEST  -  common quantitative maneuvers: percentage vs. percentage-POINT change; stock vs.\\nflow; cumulative total vs. period-specific; nominal vs. inflation-adjusted; total vs. marginal\\nchange; mean vs. median; forecast vs. observed; preliminary vs. revised; absolute vs. relative\\nrisk; survey respondents vs. total population; eligible population vs. all residents; share of\\nincidents vs. share of offenders/victims/exposures; whether category DEFINITIONS or GEOGRAPHIC\\nBOUNDARIES changed across the comparison; start-date selection; truncated axes or visual\\nscaling if charts appear; uncertainty intervals and whether revisions are noted.\\n\\nDENOMINATOR SWITCHING  -  ask specifically: is the denominator merely UNSTATED, or has the\\npiece MOVED BETWEEN DENOMINATORS within a single argument? Switching mid-argument is usually\\nworse than consistently choosing one debatable basis, because it makes the comparison\\nincoherent rather than merely contestable.\\n\\n| Figure cited | Baseline / denominator used | Alternative available | Consistent across the argument? | Would it change the impression? |\\n|---|---|---|---|---|\\n\\nApplies to: crime statistics, unemployment, inflation, test scores, case counts, emissions,\\nimmigration figures, spending, polling. Wherever a number appears with a comparison, the\\ncomparison was chosen.\\n\\n-----------------------------------------------------------------\\nE2.4  -  ATMOSPHERIC CUES AND HISTORICAL SCENE-SETTING\\n-----------------------------------------------------------------\\n\\nContext is not neutral because it is true. It can tell the reader WHAT KIND OF EVENT this is\\nbefore the current facts establish the category.\\n\\n  SETTING CUES  -  true details supplying emotional weight, sometimes without causal\\n  relevance: crime:     \\\"in broad daylight,\\\" \\\"in front of witnesses,\\\" \\\"steps from a school\\\"\\n  policy:    \\\"in a district already facing cuts,\\\" \\\"amid record profits\\\" economics: \\\"as\\n  executives received bonuses,\\\" \\\"in a town with one employer\\\" health:    \\\"in a county with no\\n  ICU beds,\\\" \\\"during flu season\\\" education: \\\"in a building that failed inspection\\\" For each:\\n  is it MATERIALLY relevant, EMOTIONALLY relevant, both, or neither? State which. A cue can be\\n  all three; the finding is when it supplies aggravation without causal relevance.\\n\\n  HISTORICAL SCENE-SETTING  -  which prior episode is invoked as the relevant precedent, when\\n  several are available:\\n    | Element introduced | Where placed | Factual background or interpretive category? | Connection to current event established? |\\n\\n  THE COMPETING-HISTORY TEST  -  the sharpest question here: WHAT DIFFERENT HISTORY WOULD A\\n  MIRROR PIECE HAVE INVOKED, from the same true record? Name it concretely. crime:     history\\n  of police violence / history of attacks on officers immigration: history of immigrant crime\\n  / history of anti-immigrant violence economics: history of corporate relocation / history of\\n  failed subsidies health:    history of institutional failure / history of public\\n  overreaction education: history of underfunding / history of administrative bloat\\n\\n  The finding is NOT that history was invoked. It is that ONE history was activated to\\n  classify the event while a competing and equally available history was not  -  and that the\\n  piece did not report material differences between the invoked precedent and the current\\n  case.\\n\\n-----------------------------------------------------------------\\nE2.5  -  VIVIDNESS AND PERSONIFICATION\\n-----------------------------------------------------------------\\n\\nCLASSIFY VIVIDNESS BEFORE RATING IT. A vivid detail is not suspect because it is emotional:\\nEVIDENTIARY ..... detail necessary to understand what occurred INCIDENTAL ...... true but\\ncausally irrelevant SELECTIVE ....... graphic specificity for one party, clinical abstraction\\nfor the other SYMBOLIC ........ children, sacred sites, holidays, schools, uniforms, flags The\\nfinding is SELECTIVE vividness or symbolic weight carrying a conclusion the facts don't\\nestablish  -  not vividness itself.\\n\\n| Party | Named? | Biography | Visual detail | Emotional detail | Vividness type | Group/status label | Historical association |\\n|---|---|---|---|---|---|---|---|\\n\\n  1. Who is rendered as a PERSON and who as a CATEGORY?\\n  2. Who receives a name, photo, age, family role, aspiration, grief?\\n  3. Who receives institutional, demographic, or group labels instead?\\n  4. Do images humanize one side and abstract the other?\\n  5. Does vividness substitute for evidence of cause, culpability, or category membership?\\n\\nHuman-interest detail is not improper. The finding is ASYMMETRY, or vividness carrying a\\nconclusion the facts do not establish.\\n\\n-----------------------------------------------------------------\\nE2.6  -  REQUIRED FINDING RULES\\n-----------------------------------------------------------------\\n\\nAn attribute, causal, baseline, or context finding requires ALL of:\\n  - the fact meets one of the three ACCESS TIERS below;\\n  - it was material to the interpretation the piece creates;\\n  - reporting it would not violate an applicable privacy, safety, legal, or identification\\n    norm;\\n  - the audit can state HOW inclusion or omission changes interpretation.\\n\\nACCESS TIERS  -  a fact \\\"available at publication\\\" is too loose. A fact can exist in a\\n900-page filing, an obscure database, a foreign-language document, or a video posted minutes\\nbefore deadline without being reasonably available. Classify:\\n\\n  PIECE-KNOWN ......... the article itself proves the outlet possessed it (it appears\\n  elsewhere in the piece, or the piece cites the document containing it) SOURCE-KNOWN ........\\n  it appears in a document or statement the article demonstrably used GENERALLY AVAILABLE . it\\n  existed publicly, but this outlet's access is INFERRED\\n\\nPIECE-KNOWN and SOURCE-KNOWN support strong selection findings. GENERALLY AVAILABLE requires\\ncaution and an explicit statement of what makes access plausible given the outlet's format,\\ndeadline, and resources  -  cap at MODERATE absent that showing.\\n\\nCORPUS-REQUIRED ROUTING  -  where asymmetry cannot be tested among actors or outlets within\\nthe current event, mark it CORPUS-REQUIRED rather than inferring inconsistency. Establishing\\nthat an outlet SYSTEMATICALLY activates an attribute in one direction  -  names immigration\\nstatus here, does it elsewhere? discloses industry funding but not advocacy funding? applies\\n\\\"terrorism\\\" asymmetrically?  - requires comparable stories across events. State the\\nhypothesis, state that this audit cannot test it, and route it to a corpus audit. Do not\\nconvert an untestable hypothesis into a finding.\\n\\nMANDATORY INNOCENT EXPLANATIONS  -  consider each where applicable: identification not\\nconfirmed; cause still under investigation; legal restriction or minor status; privacy;\\nretaliation risk; genuine irrelevance to the immediate event; newsroom policy against\\ndemographic identification absent clear relevance; uncertainty whether a label accurately\\napplies; space; the reader is assumed to know from prior coverage.\\n\\nOWNERSHIP / NON-DOUBLE-COUNTING  -  REQUIRED FOR AGGREGATION INTEGRITY. This module CLASSIFIES\\nmechanisms; it does not create a parallel set of findings. Record each construction lever\\nONCE, assigned to the section that best captures its primary effect. Cross-reference rather\\nthan multiply.\\n\\n  Missing explanatory fact ............... causal bridge (NOT a second generic omission) Prior\\n  case assigning category membership  pattern linkage (mechanism: narrative flag) Lead image\\n  humanizing one party ........ packaging (mechanism: personification) Number misleading via\\n  denominator ...... baseline (NOT a second factual finding unless the number itself is false)\\n  Event-classification noun .............. causal-role-framing (NOT also\\n  narrative-flag or packaging, unless another distinct lever is present)\\n\\nIf a lever appears in two sections, name which section OWNS it and state the other as a\\ncross-reference. Inflating one choice into four findings corrupts the coherence count\\ndownstream.\\n\\nSYMMETRY REQUIREMENT  -  state this in the output: Omitting an attribute can be construction.\\nForegrounding it can also be construction. Omitting a causal bridge can be construction.\\nAsserting a contested cause can also be construction. The question is never whether the\\ntreatment helps one side. It is whether the treatment is PROPORTIONATE, EVIDENTIALLY GROUNDED,\\nand CONSISTENT across comparable parties.\\n\\n=================================================================\\nSECTION F  -  SOURCE DISTRIBUTION\\n=================================================================\\n\\n  1. List every voice quoted or cited. For each: who they are, their position, word count or\\n     approximate space given.\\n  2. What positions are represented? What positions are absent?\\n  3. Are the quoted voices drawn from one field, party, organization type, or advocacy\\n     position?\\n  4. Was a balancing voice available and not sought? (Officials, subject-matter experts,\\n     people with the opposite interest, the accused party's representative.) State whether you\\n     KNOW one was available or are inferring  - inference here is PROVISIONAL.\\n  5. Does the piece note that it sought comment and was refused? Absence of that note is\\n     itself information.\\n\\nRequired table:\\n\\n| Voice | Affiliation / position | Space given | Position advanced |\\n|---|---|---|---|\\n\\n=================================================================\\nSECTION F2  -  QUOTE FUNCTION & ATTRIBUTED FRAME\\n=================================================================\\n\\nTHIS IS NOT SOURCING ASYMMETRY. Keep them separate:\\n\\n  SOURCING ASYMMETRY = we quoted one side and not the other. Remedy: add a voice.\\n\\n  FRAME LAUNDERING = the outlet delivers interpretation it could not assert in its own voice\\n  by routing it through quoted third parties. The claim enters the piece with the force of an\\n  assertion and the deniability of attribution. The quotes are not sources for FACTS; they are\\n  carriers of MEANING.\\n\\nA piece can have perfect factual accuracy, attribute everything properly, and still import its\\nentire interpretive frame from outside itself.\\n\\nSTEP 1  -  CLASSIFY EVERY QUOTE BY FUNCTION\\n\\n| Quote (short) | Speaker | FACT-SOURCE (what happened) | FRAME-CARRIER (what it means) | Both | Words |\\n|---|---|---|---|---|---|\\n\\n  FACT-SOURCE: supplies information about the event the outlet could not otherwise report.\\n  \\\"Patterson said the man produced a knife.\\\" FRAME-CARRIER: supplies significance, moral\\n  register, causal story, or category membership. \\\"This is part of a pattern.\\\" \\\"No other\\n  country tolerates this.\\\" \\\"Someone's child.\\\" \\\"Murdered.\\\"\\n\\nSTEP 2  -  SPACE ALLOCATION Total words in fact-source quotes: ___ Total words in\\nframe-carrier quotes: ___ Ratio: ___ Words of outlet-voice reporting on the event itself: ___\\n\\n  A piece where frame-carrying quotes substantially outweigh both fact-sourcing and original\\n  reporting is structurally an opinion piece assembled from other people's opinions.\\n\\nSTEP 3  -  THE STRIP TEST  (the core diagnostic)\\n\\n  WHAT TO REMOVE  -  this is the most common place this test is run wrong.\\n\\n  Remove ONLY the FRAME-CARRIERS identified in Step 1. Keep the FACT-SOURCES.\\n\\n  You are not testing whether the piece can stand without sourcing. Every news article depends\\n  on attributed facts; strip those and EVERY piece \\\"collapses,\\\" which makes the diagnostic\\n  meaningless. You are testing whether the piece's INTERPRETATION comes from its own reporting\\n  or is imported from quoted opinion.\\n\\n  KEEP (fact-sources  -  the piece's evidentiary base):\\n    - attributed statements of what happened, whoever supplied them\\n    - paraphrased official accounts\\n    - MIXED CONSTRUCTIONS, where a fact is paraphrased with a short quoted fragment inside it.\\n      Example: Patterson said the man produced a \\\"fixed blade knife,\\\" injuring an officer This\\n      is a FACT-SOURCE. The quotation marks cover three words of a factual claim. Keep the\\n      whole clause. Removing it because it contains quoted strings is a mechanical error, not\\n      a strip.\\n\\n  REMOVE (frame-carriers  -  imported meaning):\\n    - characterizations of significance, moral weight, or category membership\\n    - claims about pattern, precedent, or what the event \\\"is part of\\\"\\n    - emotional register instructions\\n    - contested legal or moral predicates asserted by a speaker (\\\"murdered\\\")\\n\\n  BORDERLINE: if a quote does both, keep the factual component and remove the interpretive\\n  one. State that you split it and how.\\n\\n  Then read what remains  -  the outlet's reporting plus its evidentiary base.\\n\\n  1. What interpretation of the event does the remaining text support?\\n  2. What interpretation did the FULL piece convey?\\n  3. Is there a gap?\\n\\n  CALIBRATION NOTE  -  two independent runs of this test on the same article split PARTLY\\n  SURVIVES vs. COLLAPSES, entirely because one stripped a mixed\\n  paraphrase-plus-quoted-fragment construction and the other kept it. That single choice drove\\n  the severity rating, the aggregation, and the final verdict. Follow the keep/remove rules\\n  above literally; the result is not robust to improvisation at this step.\\n\\n  IF THE PIECE'S DOMINANT INTERPRETATION SURVIVES THE STRIP: the frame is grounded in\\n  reporting. No finding.\\n\\n  IF IT COLLAPSES  -  if the significance, moral weight, or category membership exists only in\\n  the quotes  -  the quotes are carrying the frame, and the piece has imported an\\n  interpretation its own reporting does not establish. That is FRAME LAUNDERING.\\n\\n  State both readings explicitly. Quote the stripped version's implied conclusion.\\n\\nSTEP 4  -  THE OWN-VOICE TEST\\n\\n  For each frame-carrying claim, ask: could the outlet have asserted this in its own voice in\\n  a news piece?\\n\\n  | Frame claim | Could outlet assert it directly? | If no, why not |\\n  |---|---|---|\\n\\n  If the answer is NO  -  because it would be opinion, unsupported, or defamatory  - then\\n  routing it through a quote accomplishes something the outlet could not do directly. That is\\n  the laundering mechanism, and it is observable without any claim about intent.\\n\\nF2 STEP 5  -  SOURCE-INTERNAL SELECTION  (what did the outlet foreground?)\\n\\nA source who gave a long statement  -  a press conference, a briefing, a filing  - supplies\\nmany statements. The outlet chooses which to foreground. That choice is invisible unless you\\nlook for it, and it is the most efficient frame-carrying move available, because it uses a\\nFACT-SOURCE to deliver a FRAME.\\n\\n  1. For each source given substantial space, list what they said that the piece reports, in\\n     the order the piece reports it.\\n\\n  2. Which statement does the piece FOREGROUND from that source? Is it fact-carrying or\\n     frame-carrying?\\n\\n  3. THE KEY CASE: did the outlet lead a FACT-SOURCE with a FRAME-CARRIER? If the first thing\\n     an official is quoted saying is about significance, history, emotion, or category  -  and\\n     the factual account follows  -  the outlet has used the source's authority to validate a\\n     frame before supplying the facts that would let a reader evaluate it.\\n\\n  4. AUTHORITY MULTIPLIER: a frame delivered by a neutral-coded or adverse-interest source\\n     carries more weight than the same frame from an advocate. An official validating an\\n     interpretation that cuts against their own institution is the most persuasive possible\\n     carrier  -  and therefore the most consequential placement choice. Note when this occurs.\\n\\n  5. MANDATORY AMBIGUITY FLAG: you usually CANNOT tell from the piece whether the source\\n     themselves led with that material or the outlet selected it. Both are possible. State\\n     this explicitly: \\\"Cannot determine whether [source] opened with this or the outlet\\n     foregrounded it. The effect on the reader is the same; responsibility is not determinable\\n     from the text.\\\" Do not assume selection. The finding is about the piece's ORDER, which is\\n     observable, not about the outlet's choice, which is not.\\n\\n  6. Reverse test: if the source's factual account appeared first and their framing statement\\n     after, would the piece read differently? Demonstrate.\\n\\n| Source | Statements reported | Which foregrounded | Fact or frame | Authority multiplier? |\\n|---|---|---|---|---|\\n\\n  7. PROFESSIONAL-NORM CHECK  -  REQUIRED BEFORE RATING THIS FINDING. Institutional crisis\\n     communication doctrine now widely teaches empathy-first: acknowledge impact, harm, and\\n     history BEFORE presenting the factual account, because leading with the account reads as\\n     defensive. This is professionalized across sectors  -  police, universities, hospitals,\\n     corporations.\\n\\n     Consequence: when an institutional source leads with framing material, the most likely\\n     explanation is THAT IS HOW THEY SPOKE, not that the outlet selected it. An outlet\\n     reporting a statement in the order it was delivered has committed no construction.\\n\\n     Therefore: where source ordering is plausibly explained by standard practice, THIS\\n     FINDING IS WEAK ABSENT EVIDENCE OF SELECTION. Do not manufacture a construction finding\\n     out of ordinary institutional communication  -  that is the false positive most likely to\\n     get an entire audit dismissed.\\n\\n     EVIDENCE THAT WOULD ESTABLISH SELECTION:\\n       - a transcript or recording showing a different order\\n       - other outlets covering the same statement leading with the factual account (this is\\n         directly testable via the coverage-network branch)\\n       - the piece reordering material within a single quoted passage Absent one of these, cap\\n         this finding at MINOR and state why.\\n\\nSEVERITY NOTE: leading a fact-source with a frame-carrier, where that frame pre-validates the\\ninterpretation the piece goes on to convey, is a MAJOR finding ONLY when (a) the strip test\\nfails AND (b) selection is established per item 7. If selection is not established, the\\nfinding is capped at MINOR regardless of effect  - the effect on the reader is real, but the\\noutlet did not create it.\\n\\nSTEP 6  -  REACTION AS INTERPRETATION\\n\\n  Protest, mourning, vigil, and outrage material is NOT neutral scene-setting. It is evidence\\n  of how OTHERS interpreted the event, and its placement shapes how the reader will.\\n\\n  1. How much of the piece is reaction material? Word count and position.\\n  2. Does reaction appear BEFORE the event is explained? Which paragraph?\\n  3. What does the reaction material tell a reader about how to feel, before they have the\\n     facts to judge?\\n  4. Would the same facts with reaction material placed AFTER the explanation produce a\\n     different impression? Demonstrate.\\n\\n  Leading with reaction is placing an interpretive frame in the position where explanation\\n  normally goes. That is a construction choice, and it is available to any outlet in any\\n  direction.\\n\\nSTEP 7  -  IS THE FRAME CHALLENGED?\\n\\n  1. Is any frame-carrying claim contextualized, contested, or given a counter?\\n  2. Where a quote asserts a factual predicate (\\\"murdered,\\\" \\\"unarmed,\\\" \\\"pattern\\\"), does the\\n     piece note whether that predicate is established?\\n  3. Where a quote links this event to prior cases, does the piece note material differences?\\n     (Cross-reference Section H.)\\n  4. Is there ANY quoted voice whose frame differs from the others?\\n\\nSEVERITY GUIDE  -  this finding type is not capped at moderate\\n\\n  MINOR ......... frame-carrying quotes present but the interpretation also survives the strip\\n  test on the outlet's own reporting MODERATE ...... interpretation partly survives the strip;\\n  quotes amplify it MAJOR ......... interpretation exists substantially ONLY in quotes; strip\\n  test collapses it; no counter-frame present SEVERE ........ as MAJOR, plus the quoted frame\\n  asserts factual predicates the piece's own reporting contradicts or does not support\\n\\n  Record as media finding type: FRAME-LAUNDERING (not sourcing).\\n\\nDIRECTION-NEUTRAL. A piece leading with a police union's outrage and quoting five sheriffs on\\n\\\"what happens when we don't back the blue,\\\" where the outlet's own reporting doesn't establish\\nthat frame, is the identical finding. The strip test does not know which direction the frame\\nruns.\\n\\n=================================================================\\nSECTION G  -  OMISSION AND DE-EMPHASIS  (two distinct finding types)\\n=================================================================\\n\\nThese are different findings with different bars. Do not merge them. A fact that appears in\\nthe piece is not omitted, and may not inherit an omission's effect language.\\n\\n  OMITTED  -  the fact does not appear in the piece AT ALL. BEFORE listing anything here,\\n  SEARCH THE PIECE TEXT for it. If it appears anywhere, in any form, however briefly, it is\\n  NOT omitted. Effect language permitted: \\\"absent,\\\" \\\"reader never learns,\\\" \\\"removed.\\\"\\n\\n  DE-EMPHASIZED  -  the fact appears, but is placed late, rendered clinically, given minimal\\n  space, or attributed rather than asserted. REQUIRED: quote where it appears and give the\\n  paragraph number. Effect language permitted: \\\"placed at paragraph N,\\\" \\\"rendered clinically,\\\"\\n  \\\"given N words versus M for the contrasting material.\\\" Effect language FORBIDDEN: \\\"removes,\\\"\\n  \\\"absent,\\\" \\\"reader never learns\\\"  -  the reader does learn it. Your finding is about\\n  prominence, not presence.\\n\\n  1. For each candidate: is it OMITTED or DE-EMPHASIZED? Verify by searching the text before\\n     classifying.\\n  2. Was it KNOWN at publication time? (known / unknown / cannot determine  -  this is the\\n     hinge for Section I.)\\n  3. Does the pattern systematically favor one reading?\\n  4. Would inclusion, or different placement, change the impression? How?\\n\\nCAUTION  -  this is the section most prone to unfalsifiable critique. Any piece omits infinite\\nfacts. A finding here requires: the fact is MATERIAL to the impression the piece creates, and\\nits absence is not explained by space, publication timing, or the piece's stated scope. If you\\ncannot meet that bar, do not list it.\\n\\nRequired table:\\n\\n| Fact | OMITTED or DE-EMPHASIZED | If de-emphasized: where it appears (paragraph  + quote) | Material because | Available at press time? | Effect |\\n|---|---|---|---|---|---|\\n\\nRULES\\n  1. A DE-EMPHASIS finding may not be rated above MINOR unless you can show the placement or\\n     wording materially changes what a reader takes away.\\n  2. DO NOT DOUBLE-COUNT. If Section C already flagged the placement of this material as a\\n     sequencing finding, it is one finding, not two. State which section owns it.\\n\\n=================================================================\\nSECTION H  -  PATTERN LINKAGE\\n=================================================================\\n\\n  1. Does the piece connect this event to prior events, cases, or a broader phenomenon?\\n  2. Is the connection asserted, implied, or supplied entirely by quoted sources?\\n  3. Is the comparison apt? Are the prior cases materially similar, and does the piece note\\n     where they differ?\\n  4. Does the linkage do work the reported facts do not support  -  establishing a pattern by\\n     juxtaposition rather than by evidence?\\n  5. Is the outcome of the linked prior case reported accurately, including resolution?\\n\\n  6. CONTESTED-PREDICATE RATIFICATION  (run whenever a quote makes a factual or legal claim\\n     about a PRIOR case)\\n\\n     A quoted speaker often asserts a predicate about an earlier event  - \\\"murdered,\\\"\\n     \\\"unarmed,\\\" \\\"unprovoked,\\\" \\\"cleared,\\\" \\\"justified,\\\" \\\"assaulted the officer.\\\" These are not\\n     opinions about the current event. They are FACTUAL OR LEGAL CLAIMS ABOUT A DIFFERENT CASE\\n     that has usually already been adjudicated.\\n\\n     For each such predicate:\\n\\n     | Predicate asserted | Prior case | Actual disposition | Does the piece note it? |\\n     |---|---|---|---|\\n\\n     THE RULE: printing a contested predicate without its disposition is not neutral\\n     reporting. It RATIFIES the predicate. A reader who does not know the case learns it as\\n     fact from an unchallenged quote in a news article; a reader who does know it receives\\n     confirmation of the version they already hold. Both leave with the same unestablished\\n     predicate, now firmer.\\n\\n     WHY THIS MATTERS MORE THAN ORDINARY OMISSION: the predicate is doing the work of\\n     establishing that the current event BELONGS TO A CATEGORY. If the prior case is the\\n     anchor for the pattern, and the prior case's characterization is contested or was\\n     officially rejected, then the pattern rests on a predicate the piece never established\\n     and did not flag as disputed.\\n\\n     TIME-DIRECTIONALITY: this laundering runs BACKWARD. A contested characterization of an\\n     old case is treated as settled in order to categorize a new one  -  and if the new one is\\n     absorbed the same way, it becomes the anchor for the next. Each iteration inherits a\\n     predicate that was never established and passes it forward more solidified. Note where in\\n     that chain the piece sits: is it inheriting a predicate, establishing one, or both?\\n\\n     This is citation laundering with public memory as the medium  -  structurally identical\\n     to a claim that becomes settled through repeated citation while nobody rereads the\\n     original source.\\n\\n     DIRECTION-NEUTRAL: \\\"the officer was cleared, as officers always are\\\" and \\\"that suspect\\n     assaulted police first\\\" are the same finding. Any contested predicate about a prior case,\\n     asserted in a quote and printed without disposition, qualifies.\\n\\n     SEVERITY: MODERATE where the predicate is contested; MAJOR where it was officially\\n     adjudicated the other way and the piece reproduces it unqualified while relying on it for\\n     category membership.\\n\\nLinkage-by-juxtaposition is a construction finding, not a factual one: nothing false is\\nstated, and a pattern is asserted.\\n\\n=================================================================\\nSECTION I  -  TIMING TEST  (MANDATORY INNOCENT-EXPLANATION CHECK)\\n=================================================================\\n\\nThe strongest defense of most breaking coverage is publication timing: witness video,\\nprotests, and reaction exist at press time; investigation findings do not. A piece filed\\nwithin hours will NECESSARILY have more scene-and-reaction material than justification\\nmaterial. You must address this or the audit is dismissable on this ground alone.\\n\\nTHE TEST  -  for each finding you have made, ask:\\n\\n  \\\"If this piece had been written 48 hours later with full information available, would this\\n  specific finding change?\\\"\\n\\n  TIMING-EXPLAINED  -  the finding would likely resolve with more information. Typically:\\n  volume asymmetry, absence of investigative detail, thin sourcing on one side.\\n\\n  NOT TIMING-EXPLAINED  -  the finding involves choices about material the piece ALREADY HAD.\\n  Typically: headline wording, verb selection, sequencing of material printed in the piece,\\n  which voices were sought, what the lead image depicts.\\n\\nTHE KEY LOGIC  -  STATE IT EXPLICITLY IN YOUR OUTPUT: Timing explains VOLUME, not SPECIFIC\\nCHOICES. It explains why there is more scene material than investigation detail. It does not\\nexplain the wording of a headline about facts the piece reports, the verbs chosen for parties\\nwhose conduct the piece describes, the ordering of material the piece printed, or the failure\\nto seek a single balancing voice.\\n\\nRequired table:\\n\\n| Finding | Timing-explained? | Reasoning |\\n|---|---|---|\\n\\nThen state: \\\"N findings survive the timing test.\\\" THOSE ARE THE LOAD-BEARING FINDINGS. Rank\\nthem first in Section K. Findings that are timing-explained should be reported but explicitly\\nmarked as weak.\\n\\nNOTE BOTH DIRECTIONS: it is also true that some outlets file hot and correct quietly later,\\nand that the initial framing reaches far more readers than the correction. That is a real\\npattern and it is not disproven by the timing defense. But it is a claim about the OUTLET'S\\nPRACTICE, which requires evidence across multiple pieces  -  it is not established by this\\npiece alone. If you assert it, mark it PROVISIONAL and note what evidence would establish it\\n(a corpus comparison of initial vs. follow-up framing across N pieces).\\n\\n=================================================================\\nSECTION I2  -  PRIOR-MATCH CHECK  (MANDATORY, run before the flip test)\\n=================================================================\\n\\nPRIOR SOURCE - declare this FIRST, before restating any prediction.\\n\\n  SUPPLIED\\n    The operator stated a prior in the inputs.\\n\\n  MODEL-GENERATED\\n    No prior was supplied and you formed an expectation yourself about how this\\n    story type or outlet would behave.\\n\\n  NONE\\n    No prior was supplied and you did not form one.\\n\\nYOU MAY GENERATE A PRIOR. Declare it before comparing it with the result.\\n\\nWHAT THE LABEL CHANGES:\\n\\n  SUPPLIED, full match\\n    The operator's expectation was confirmed. This is a motivated-reasoning\\n    risk. Items 5 and 6 are REQUIRED.\\n\\n  MODEL-GENERATED, full match\\n    Weaker evidence than a supplied match because the expectation and finding\\n    were produced in the same pass by the same reasoner. Items 5 and 6 remain\\n    REQUIRED.\\n\\n  NONE\\n    Skip items 1 through 6 and write:\\n    \\\"no prior; prior-match check skipped.\\\"\\n    Do not invent a prior retrospectively.\\n\\nThen proceed:\\n\\n  1. Restate the prior's PREDICTION in one sentence.\\n  2. State the actual PRIMARY FINDING in one sentence.\\n  3. DO THEY MATCH? [full match / partial / no match]\\n  4. If FULL MATCH, the flip test and innocent explanations carry MORE weight.\\n  5. WHAT DID YOU EXPECT AND NOT FIND? Name at least one predicted feature the\\n     piece did not show.\\n  6. INVERSE CHECK: name the strongest evidence in the piece AGAINST the prior.\\n\\nWHY THIS EXISTS: a prior can be useful, but the audit must disclose whether it\\ncould have come out otherwise.\\n\\n=================================================================\\nSECTION J  -  FLIP TEST  (MANDATORY  -  DESIGNED TO BE COSTLY)\\n=================================================================\\n\\nNON-NEGOTIABLE. A construction audit that only detects one political direction is a broken\\ninstrument  -  broken the same way as the pieces it audits.\\n\\nAnswering \\\"yes, I would flag the mirror\\\" is free. This section is built so that answering\\nrequires producing something.\\n\\nSTEP 1  -  WRITE THE MIRROR, AS TEXT Take your #1 finding. COMPOSE the actual mirror passage\\n-  3-6 sentences of prose, written the way an outlet with the opposite lean would have written\\nthis same event, using the same construction technique you flagged. Not a description of the\\nmirror. The mirror itself.\\n\\nMIRROR THE FUNCTION, NOT THE CONTENT. This is the most common way this step is run wrong, and\\na mirror that inverts the wrong thing invalidates the test.\\n\\n  Ask first: WHAT JOB is the flagged element doing in the piece? Then build a passage where an\\n  element does THE SAME JOB pointing the other way.\\n\\n  WORKED EXAMPLE  -  an evidentiary quote about a prior case: Original: a politician says\\n  police \\\"murdered\\\" a prior subject  -  the prior case is offered as EVIDENCE ABOUT POLICE,\\n  establishing that the current event belongs to a pattern of police wrongdoing.\\n\\n    WRONG MIRROR: flip what the prior subject did  -  \\\"he tried to murder an officer.\\\" That\\n    inverts the CONTENT of the prior case and produces a different argument, not a mirrored\\n    one.\\n\\n    RIGHT MIRROR: keep the prior case fixed, invert what it PROVES  -  a union official says\\n    the officer in that case \\\"was dragged through the mud for two years and cleared on every\\n    count, and we're seeing it again tonight.\\\" Same case, same evidentiary function, opposite\\n    lesson.\\n\\n  DO NOT INTRODUCE CLAIM TYPES ABSENT FROM THE ORIGINAL. If the original makes no causal claim\\n  about why the event happened, your mirror must not make one either. Adding a claim type the\\n  original lacks means you are auditing a passage you invented rather than testing your own\\n  finding.\\n\\n  State explicitly, in one line: \\\"The flagged element's function is ___. My mirror reproduces\\n  that function in the opposite direction by ___.\\\"\\n\\nSTEP 2 - AUDIT YOUR OWN MIRROR\\n\\nRun your own Section B/C/D/E criteria against the passage you just wrote. When\\nthe original finding is causal-role-framing, apply [MEDIA-P1] and E2.1 to the\\nmirror. Produce at least two findings against it, with severity ratings, in the\\nsame format used for the real piece.\\n\\n  If you cannot produce findings against your own mirror at comparable severity, your original\\n  finding is PRIOR-DEPENDENT. Say so and downgrade it.\\n\\nSTEP 3  -  CONSISTENCY CHECK  (compare mirror findings to original findings)\\n\\nYou have now audited two texts: the real piece and the mirror you wrote. Compare the\\nPRINCIPLES you applied to each.\\n\\nFIRST, CLASSIFY WHAT YOU FOUND. There are two different things and they resolve oppositely:\\n\\n  (A) INCONSISTENT PRINCIPLE  -  you applied a rule to the mirror that you did not apply to\\n  the original, or vice versa. Example: you faulted the mirror for leading with material X,\\n  and separately faulted the original for OMITTING material X. Either X belongs or it does\\n  not. You cannot hold both. RESOLUTION: one finding must give. State which and why. If the\\n  mirror-side principle is stronger  -  and it often is, because you applied it without a\\n  stake in the outcome  -  the original finding is DOWNGRADED OR CUT.\\n\\n  (B) SYMMETRIC PHENOMENON  -  the same construction lever appears in both texts, pushing in\\n  opposite directions. Example: scene-first ordering constructs one impression;\\n  justification-first ordering constructs the other. Both are true. RESOLUTION: NO DOWNGRADE.\\n  This is NOT a contradiction. Finding that ordering does argumentative work in both\\n  directions CONFIRMS that ordering is a construction lever  -  which makes the outlet's\\n  specific choice more meaningful, not less. Both texts are constructing; you are auditing\\n  this one.\\n\\n  DO NOT DOWNGRADE A FINDING ON THE GROUND THAT THE MIRROR COMMITS THE MIRROR-IMAGE VERSION.\\n  That is the expected result and it is the point of writing the mirror. The mirror exists to\\n  test whether you would APPLY THE SAME RULE, not to establish that construction is universal\\n  and therefore unremarkable.\\n\\n  | Observation | Type (A inconsistent / B symmetric) | Resolution |\\n  |---|---|---|\\n\\n  A finding may only be downgraded here for TYPE A. If you downgrade for Type B, you have\\n  misapplied this step  -  state so and restore the finding.\\n\\nSTEP 4  -  FORCED RANKING Rank ALL findings from MOST prior-dependent to LEAST.\\n\\n| Rank (1 = most prior-dependent) | Finding | Why more prior-dependent than the next |\\n|---|---|---|\\n\\n\\\"All equally construction-dependent\\\" is not an available answer  -  if you cannot distinguish\\nthem, you have not examined them.\\n\\nSTEP 5  -  AUTOMATIC DOWNGRADE  (not discretionary)\\n\\nThe finding you ranked #1  -  the MOST prior-dependent  -  IS DOWNGRADED ONE SEVERITY STEP.\\nThis is mechanical. There is no justification path and no opt-out.\\n\\n  MAJOR -> MODERATE MODERATE -> MINOR MINOR -> cut, or retained explicitly as \\\"reported, not\\n  load-bearing\\\"\\n\\nWHY THIS IS AUTOMATIC RATHER THAN ARGUED: earlier versions of this prompt allowed a model to\\ndecline the downgrade by supplying a rebuttal. In practice the rebuttal was always supplied\\nand the downgrade never happened  -  across repeated runs, the count was zero. A check that\\ncan be argued away is not a check. The model always finds its own rebuttal persuasive, because\\nit wrote the finding.\\n\\nIF YOU BELIEVE THE DOWNGRADE IS WRONG, THE RANKING IS WHERE YOU FIX IT. You control Step 4. If\\na finding should not be downgraded, it should not have been ranked most prior-dependent.\\nRe-examine the ranking  -  do not argue with the consequence.\\n\\nDO NOT write a paragraph explaining why the downgrade is unwarranted. Do not append a\\nparenthetical rebutting it. Apply it, state it in one line, and continue:\\n\\n  \\\"Downgrade applied: [finding] MODERATE -> MINOR (ranked most prior-dependent).\\\"\\n\\nREPORT IN SECTION L: which finding was downgraded and from what to what. A run reporting no\\ndowngrade has either produced zero findings or failed to rank them.\\n\\nSTEP 6  -  WHAT CUTS AGAINST YOUR READING List every element of the piece that cuts AGAINST\\nthe impression you concluded it creates. List at least one, or state plainly that you searched\\nand found none.\\n\\nThen answer this specific question  -  not a general one:\\n\\n  \\\"Would a reader who noticed these counter-elements reach a different conclusion about the\\n  piece? If no, WHAT DO THE COUNTER-ELEMENTS FAIL TO ADDRESS?\\\"\\n\\n  Your answer must name what is MISSING from the counter-elements. It may not restate what the\\n  assembly does. \\\"The assembly still produces a different impression\\\" is circular  -  it\\n  asserts the conclusion as its own support.\\n\\n  The phrase \\\"noted but does not offset\\\" is BANNED. If your reasoning reduces to it, the\\n  counter-elements have not been engaged and the affected findings are downgraded one step.\\n\\nRequired summary table:\\n\\n| Finding | Mirror written? | Findings against mirror | Contradiction w/ mirror principle? | Prior-dependence rank | Verdict |\\n|---|---|---|---|---|---|\\n\\nThen state: \\\"N findings survive the flip test.\\\"\\n\\nA finding that survives BOTH the timing test and the flip test is construction-dependent, not\\nprior-dependent, and not timing-explained. Those are the findings worth publishing. Everything\\nelse is reported with its weakness labeled.\\n\\n=================================================================\\nSECTION K  -  STANDARDIZED FINDING TABLE\\n=================================================================\\n\\nOne row per finding. Rank by (1) survives both tests, (2) severity.\\n\\n| Field | Entry |\\n|---|---|\\n| Finding | one sentence |\\n| Section | B / C / D / E / F / G / H |\\n| Evidence | specific text, paragraph number, verb, quote |\\n| Media finding type | factual / construction / omission / sourcing / frame-laundering / causal-bridge / causal-role-framing / narrative-flag / baseline / packaging / none |\\n| Failure location (if applicable) | PR-media / paper / model-retrieval / mixed |\\n| Severity | none / minor / moderate / major / severe |\\n| Survives timing test | yes / no |\\n| Survives flip test | yes / no |\\n| Possible innocent explanation | MANDATORY  -  strongest non-damning reading. \\\"None identified\\\" if none. Never blank. |\\n| What would weaken this | MANDATORY  -  specific evidence that would undercut it |\\n| Verification state | from vocabulary |\\n\\nSEVERITY CAPS  -  enforceable, not advisory\\n\\n  | Condition | Cap |\\n  |---|---|\\n  | Missing either mandatory column | may not exceed MODERATE |\\n  | Fails flip test (prior-dependent) | may not exceed MINOR |\\n  | Timing-explained (Section I) | may not be load-bearing; report as weak |\\n  | Explained by format constraint (Section 0) | not a finding  -  cut it |\\n  | Packaging surface not checked (social/homepage unknown) | packaging findings capped at MODERATE |\\n  | Rests on an unretrieved claim about other coverage | PROVISIONAL, may not exceed MINOR |\\n\\n  Additional rule: if you produced no findings of consequence, say so and submit an empty\\n  table. A construction audit that never returns \\\"this piece is constructed proportionately\\\"\\n  is not measuring anything  -  it is a template.\\n\\n=================================================================\\nSECTION L  -  VERDICT\\n=================================================================\\n\\nRETRIEVAL DEPTH  -  REPORT BEFORE THE VERDICT\\n\\nAudit quality varies enormously with how much material was actually fetched, and that\\nvariation is invisible in the output unless stated. A thin run and a deep run produce equally\\nconfident-looking tables. Disclose:\\n\\n  - Pieces read FULL TEXT: [n, list]\\n  - Pieces read SNIPPET ONLY: [n, list]\\n  - Pieces NOT retrieved but referenced: [n, list]\\n  - Primary source obtained: WRITTEN form? [y/n] SPOKEN form/transcript? [y/n]\\n  - Searches or fetches performed: [approximate count]\\n  - Material you looked for and could NOT obtain: [list]\\n\\nCAP: any finding resting on material you did not fetch is PROVISIONAL and may not be\\nload-bearing. State which findings this affects.\\n\\nThis is not a confession of inadequacy. A shallow run that says so is more useful than a\\nshallow run that reads as thorough.\\n\\nAUDIT INTEGRITY  -  report before the verdict\\n\\n  - AUTOMATIC DOWNGRADE (Step 5): which finding was downgraded, from what severity to what?\\n    [required  -  a run reporting none has either produced zero findings or failed to rank\\n    them]\\n  - Was any argument made against the automatic downgrade? [yes  -  quote it, and treat as\\n    evidence the check is being resisted / no]\\n  - Did any reasoning reduce to \\\"noted but does not offset\\\"? [yes / no]\\n  - Did the consistency check (Step 3) surface a contradiction between a mirror principle and\\n    an original finding? [yes  -  resolved how / no]\\n  - Findings downgraded or cut as a result of Steps 3 or 5: [list, or \\\"none\\\"]\\n\\n  If the first two answers are \\\"altered\\\" and \\\"yes,\\\" this audit's flip test did not function\\n  and every severity rating in it should be treated as provisional.\\n\\nDIRECTIONAL COHERENCE CHECK  -  run before aggregating\\n\\nSeverity alone is not the whole picture. Five minor findings scattered in different directions\\nis noise. Five minor findings ALL PUSHING THE SAME WAY is a pattern, and the pattern is\\nstronger evidence than any item in it  -  because each individual choice is defensible in\\nisolation, and a consistent direction across many independent choices is not explained by\\nchance.\\n\\n  COUNT LEVERS, NOT FINDINGS. Severity here must not scale with how finely you split your\\n  findings  -  that is gameable in both directions. Two findings about the headline (its\\n  wording and its omission) are ONE lever. Map findings onto levers first, then count the\\n  levers.\\n\\n  THE LEVER LIST  -  these are the independent construction choices available to a piece.\\n  Assign each surviving finding to exactly one:\\n\\n    1. PACKAGING ......... headline, image, social/homepage surfaces, captions\\n    2. SEQUENCING ........ order of material, what leads, what is bundled\\n    3. LANGUAGE .......... verb selection, register, agency, asserted-vs-attributed\\n    4. SOURCING .......... whose voices appear, in what proportion\\n    5. QUOTE FUNCTION .... frame-carrier allocation, what the quotes are doing\\n    6. OMISSION .......... what available material is absent\\n    7. IMPORTED MATERIAL . prior cases, comparisons, predicates brought in\\n    8. CAUSAL BRIDGES .... explanatory facts present or removed (E2.2)\\n    9. BASELINES ......... denominator, comparison point, adjustment (E2.3)\\n\\n  DETERMINISTIC MAPPING FOR COHERENCE ONLY:\\n  CAUSAL-ROLE-FRAMING and NARRATIVE-FLAG findings map to LANGUAGE. Do not map\\n  the same finding again to OMISSION or IMPORTED MATERIAL; cross-reference those\\n  sections without assigning a second lever.\\n\\n  | Lever | Findings assigned | Direction it favors |\\n  |---|---|---|\\n\\n  1. For each LEVER that has at least one surviving finding, state which impression it favors.\\n     If findings on one lever point different ways, mark it MIXED.\\n  2. Count: how many levers push the same direction? How many push the other way, or are\\n     mixed?\\n  3. COHERENCE RATIO: [N same-direction levers] of [M levers engaged].\\n\\n  Maximum possible ratio is 9 of 9. A ratio above that means you have counted findings, not\\n  levers  -  recount.\\n\\n  COHERENCE FINDING: if 4 or more LEVERS push the same direction and fewer than 2 push the\\n  other way, record a separate finding:\\n\\n      \\\"Directional coherence: N of M independent construction levers  -  [name them]  - all\\n      favor the same impression. Each is individually defensible; the consistency across\\n      independent levers is not.\\\"\\n\\n  Severity, by LEVER count: 4 levers same-direction ...................... MODERATE 5 levers\\n  same-direction ...................... MODERATE 6+ levers same-direction, none opposing\\n  ...... MAJOR\\n\\n  A MAJOR coherence finding requires nearly every available lever to point one way. That is a\\n  strong claim and the threshold is deliberately high  -  at 5 levers the finding is real but\\n  the piece has left at least two levers unengaged or neutral, which is not the same as a\\n  piece that used everything it had.\\n\\n  THIS IS DIRECTION-NEUTRAL. Six choices all favoring \\\"justified force\\\" is the same finding as\\n  six all favoring \\\"unjustified killing.\\\" Apply it identically.\\n\\n  If findings do NOT cohere  -  several push each way  -  say so plainly. That is evidence the\\n  piece is constructed proportionately even if individual choices are imperfect, and it should\\n  reduce the overall rating.\\n\\nAGGREGATION RULE  -  the overall rating is DERIVED, not asserted\\n\\n  | Findings surviving BOTH tests | Overall construction rating |\\n  |---|---|\\n  | none above MINOR, and no coherence finding | PROPORTIONATE |\\n  | one or two MODERATE, or a MODERATE coherence finding | MILDLY SLANTED |\\n  | three or more MODERATE, or one MAJOR, or a coherence finding plus 2+ minors | SUBSTANTIALLY SLANTED |\\n  | two or more MAJOR, or a MAJOR coherence finding | HEAVILY CONSTRUCTED |\\n\\n  The coherence finding counts as a finding for aggregation purposes. A set of minor findings\\n  that all push one direction can therefore reach SUBSTANTIALLY SLANTED via the coherence\\n  route  -  which is correct, because the pattern is the evidence, not the individual\\n  severities.\\n\\n  CEILING RULE: the overall rating may not exceed ONE STEP above your highest-severity single\\n  finding. Five MODERATE findings can reach SUBSTANTIALLY SLANTED; they cannot reach HEAVILY\\n  CONSTRUCTED.\\n\\n  Only findings surviving BOTH the timing test and the flip test count toward aggregation.\\n  Timing-explained and prior-dependent findings are reported but do not contribute.\\n\\n  SHOW THE ARITHMETIC: \\\"N findings survived both tests: [list with severities]. Per the\\n  aggregation rule this yields [rating].\\\"\\n\\n  If the derived rating differs from the one you were about to write, the derived rating\\n  governs.\\n\\n  - Factual accuracy: [clean / minor errors / significant errors / cannot assess]\\n  - Construction (derived per the rule above): [proportionate / mildly slanted / substantially\\n    slanted / heavily constructed]\\n  - Primary media finding type (factual / construction / omission / sourcing /\\n    frame-laundering / causal-bridge / causal-role-framing / narrative-flag /\\n    baseline / packaging / none):\\n  - STRIP TEST RESULT (F2 Step 3): does the piece's dominant interpretation survive removal of\\n    all quotes? [survives / partly / collapses]\\n  - Failure location, if the finding concerns an upstream source:\\n  - Findings surviving timing test:\\n  - Findings surviving flip test:\\n  - Findings surviving BOTH (the load-bearing set):\\n  - Strongest single finding:\\n  - Strongest innocent explanation for the piece overall:\\n  - What this audit could NOT assess:\\n  - Confidence: [low / moderate / high]\\n  - What evidence would change this assessment:\\n\\nFINAL REQUIRED STATEMENT  -  one of: \\\"This piece is factually [accurate/flawed] and its\\nconstruction is [proportionate/slanted]. The load-bearing findings are: [list].\\\" OR \\\"No\\nfindings survived both the timing and flip tests. This piece's construction is defensible.\\\"\\n\\nThe second output must be genuinely available. If it never occurs across many runs, the\\ninstrument is broken.\\n\\n=================================================================\\nSCOPE LIMITS  -  STATE THESE IN THE OUTPUT\\n=================================================================\\n\\n  1. This audits ONE piece. Claims about an outlet's PRACTICE require a corpus. Do not\\n     generalize from one article to an editorial policy.\\n  2. Construction findings do not establish intent. \\\"The piece is constructed to produce\\n     impression X\\\" is supportable; \\\"the outlet intended to mislead\\\" is not, from this\\n     evidence.\\n  3. You cannot assess what the reporter knew, what was cut by an editor, or what sources\\n     declined to comment, unless the piece says so.\\n  4. Absence of a balancing voice may reflect refusal to comment, deadline, or selection. You\\n     usually cannot distinguish these. Say which you are inferring.\\n\"},\"2-internal-validity\":{\"bytes\":46009,\"lines\":971,\"path\":\"prompts/research-analysis/2-internal-validity.txt\",\"sha256\":\"55e8aa1635c3\",\"text\":\"INTERNAL VALIDITY & REPLICATION AUDIT PROMPT\\n\\n-----------------------------------------------------------------\\nINSTRUMENT PREFLIGHT \\u2014 MANDATORY FOR FORMAL / LOGGED RUNS   [TOOL-004]\\n-----------------------------------------------------------------\\n\\nThis prompt is part of the audit instrument. Establish the exact instrument version BEFORE\\nsubstantive retrieval, extraction, analysis, or verdict work begins.\\n\\nA successful fetch indicator, correct repository path, branch label, plausible line count,\\nmatching rendered metadata, or internally self-consistent page does NOT by itself establish\\nthat the intended/current artifact was retrieved. A mutable remote reference can return a\\nhistorical representation that is internally self-consistent in every visible field.\\n\\nPROMPT IDENTITY MARKERS\\n\\n  - INTERNAL VALIDITY & REPLICATION AUDIT PROMPT\\n\\nThese markers confirm the prompt family / expected structural features. They do NOT by\\nthemselves establish version currency: an older version may share the same title or markers.\\n\\n1. RECORD THE INSTRUMENT ACTUALLY IN CONTEXT.\\n\\n   Record, where available:\\n\\n   - canonical prompt path or supplied filename;\\n   - retrieval form: PASTED / ATTACHED / IMMUTABLE REMOTE / MUTABLE REMOTE;\\n   - requested branch or ref;\\n   - intended immutable commit/ref, if the run claims a repository version;\\n   - resolved commit SHA;\\n   - resolved blob/content hash, or a locally computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\n\\nPurpose: This prompt audits the internal validity of a specific study or finding  -  whether\\nthe result itself is likely to be real, replicable, and free of analytic artifacts  -  before\\nassessing what it claims or how it has been cited.\\n\\nCitation laundering and proxy problems operate on the output of a study. P-hacking, HARKing\\n(Hypothesizing After Results are Known), selective reporting, and underpowered designs corrupt\\nthe finding at the source. A finding that fails internal validity cannot support the claims\\nbuilt on it regardless of how many papers cite it.\\n\\nThis prompt also covers AI-assisted data analysis. The failure mode is identical: a tool\\nproduces a confident output, the user lacks the domain knowledge to audit whether the output\\nmeasures what the claim requires, and the output gets treated as a finding. Whether the tool\\nis a regression model, a citation network, or an LLM doing exploratory analysis  -  the proxy\\nfailure mechanism is the same. The data generation audit below applies to both human-conducted\\nand AI-assisted analysis.\\n\\nRun this audit before or alongside the construct validity audit. If the foundational finding\\nfails internal validity, note this in the thesis. The claim is doubly weak: the study may not\\nmeasure what it claims, and the finding may not be real.\\n\\n-----\\n\\nINPUTS\\n\\nProvide the following:\\n\\n1. Foundational paper(s) or analysis: [Paste citation, abstract, methods, results, and\\n   statistical reporting where available. For AI-assisted analysis, paste the prompt used, the\\n   output, and the dataset description.]\\n2. Central empirical finding (fallback context if no upstream Claim Map is supplied): [State\\n   the finding in one sentence: what effect was found, in what population, measured how, and\\n   of what magnitude.]\\n3. Claimed construct and downstream use: [What is this finding used to prove in subsequent\\n   literature, policy, or decision-making? This supplies context; it does not override map\\n   field 6.]\\n4. Known replication attempts (if any): [Paste citations and outcomes if known. If none known,\\n   state \\\"unknown.\\\"]\\n5. Pre-registration status (if known): [Was the study pre-registered? At what stage? Did the\\n   published analysis match the pre-registered plan?]\\n6. Optional construct-validity audit output: [Formally supply the named output, including\\n   filename or stable identifier, or write NONE. Ordinary Stage-2 independent-prosecutor runs\\n   should use NONE. Supplying a sibling prosecutor output makes this an integrated,\\n   non-independent run.]\\n\\nDECLARED-INPUT BOUNDARY  [FAIL-IV-002]\\n\\nAt the start of the output, state one pair exactly:\\n\\n    SIBLING-PROSECUTOR INPUT: NONE\\n    INDEPENDENCE STATUS: INDEPENDENT\\n\\nor:\\n\\n    SIBLING-PROSECUTOR INPUT: FORMALLY SUPPLIED \\u2014 [filename / stable ID]\\n    INDEPENDENCE STATUS: INTEGRATED-NONINDEPENDENT\\n\\nOnly materials formally listed in INPUTS may serve as evidence anywhere in this audit. A\\nsibling prosecutor output that happens to be visible in session context but was not formally\\nsupplied is not an input. Treat it as though it does not exist: do not quote it, adopt its\\nlabels, repeat its specific findings, use its verdict as a premise, increase another finding's\\nseverity because of it, or allow it to influence the grade.\\n\\nIf a sibling output is formally supplied, cite each imported finding as:\\n\\n    SUPPLIED SIBLING INPUT \\u2014 [finding ID, source file / stable ID]\\n\\nFormal supply establishes provenance, not correctness. Imported findings remain subject to\\n[IV-P1] and do not inherit ELIGIBLE status merely because a sibling prosecutor rated them\\nsevere. The run must remain labeled INTEGRATED-NONINDEPENDENT and may not be represented as an\\nindependent Stage-2 prosecutor run or independent regression result.\\n\\nThis boundary applies globally, not only to Section J. Section J adds a special\\nintegration-language rule.\\n\\n-----\\n\\nSHARED CLAIM MAP  -  REQUIRED FOR FULL-SEQUENCE MODE\\n\\nA Claim Extraction / Inflation Map should have been produced upstream. Paste it here:\\n\\n[PASTE CLAIM MAP]\\n\\nDEGRADED STANDALONE MODE  -  USE ONLY WHEN NO UPSTREAM MAP EXISTS\\n\\nThis prosecutor must still be runnable when no upstream map is supplied. If the map is\\nmissing, do not stop, but state this warning before the audit:\\n\\n\\\"CLAIM MAP MISSING: running in degraded standalone mode. The target claim below is\\nSELF-GENERATED and PROVISIONAL. Cross-prosecutor claim alignment cannot be assumed until an\\nupstream Claim Extraction / Inflation Map is produced.\\\"\\n\\nThen create only this minimum fallback:\\n\\nCLAIM MAP: SELF-GENERATED  -  PROVISIONAL\\n- Field 1  -  What was literally measured:\\n- Field 3  -  Weaker defensible claim:\\n- Field 6  -  Claim under audit:\\n\\nDo not invent the missing upstream fields. Do not present this fallback as equivalent to the\\nupstream map. Its purpose is to permit a one-off audit, not to replace Stage 1. Before this\\naudit is combined with the other prosecutors, the claim must be reconciled against an upstream\\nmap.\\n\\nYOU AUDIT THE CLAIM NAMED IN FIELD 6 OF THE MAP. Do not substitute the source's broadest\\nstatement, the media version, or a claim you find more interesting. If field 6 targets a\\ndownstream restatement, test whether the foundational result is internally stable enough to\\nsupport that restatement. Do not silently retreat to the source's narrower claim. Classify the\\nfailure location separately: an unstable foundational result is a PAPER-level failure even\\nwhen the target use is downstream.\\n\\nIf you find yourself auditing a claim that is not on the map, flag it rather than substituting\\nsilently:\\n\\n\\\"MAP GAP: this finding concerns [claim], which does not appear on the claim map. The map may\\nbe incomplete.\\\"\\n\\nThat flag is information, not an error. Silent substitution is what makes different\\nprosecutors produce incoherent critiques.\\n\\nBefore Section A, confirm in one line each:\\n\\n- Claim under audit (map field 6):\\n- What was literally measured (map field 1):\\n- Weaker defensible claim (map field 3):\\n- Target layer: source claim / downstream citation / PR-media / model-retrieval\\n\\nIf the map is self-generated, repeat that it is PROVISIONAL and that cross-stage alignment\\nremains unresolved.\\n\\n-----\\n\\nCOMPACT VOCABULARY Full rules: shared_primitives.txt\\n\\nVERIFICATION STATE  -  how thoroughly a source has been checked. This is separate from\\nevidence type. A peer-reviewed study can be strong in evidence type while remaining weakly\\nverified.\\n\\n- LOCATED: source exists and metadata is confirmed; content is unverified.\\n- ABSTRACT-CONFIRMED: abstract supports relevance; methods and results are not verified.\\n- FULL-TEXT-CONFIRMED: full text was read and directly supports the specific claim. Do not\\n  assign this merely because selected excerpts were supplied.\\n- RECEPTION-CONFIRMED: replies, replications, corrections, retractions, or citation contexts\\n  were checked against retrieved sources.\\n- CONTESTED: credible disagreement exists; who is correct remains unresolved.\\n- REBUTTED: later work directly and substantially challenges the source and the challenge was\\n  not evidently answered.\\n- PROVISIONAL: access or retrieval is insufficient, including unverified model memory or\\n  unresolved source leads.\\n\\nRules:\\n\\n1. Never report a verification state above what was actually checked.\\n2. Evidence type and verification state are separate axes; report both.\\n3. FULL-TEXT-CONFIRMED and RECEPTION-CONFIRMED may both apply.\\n4. Apply the ladder symmetrically to sources supporting and opposing the claim.\\n5. A PROVISIONAL source may not anchor a MAJOR or FATAL finding.\\n\\nFAILURE LOCATION  -  where the failure actually lives:\\n\\n- PAPER: the source itself overclaims or its design/analysis cannot support the finding.\\n- CITATION: the source is defensible but later literature inflates it.\\n- PR / MEDIA: a press release or coverage strips caveats or broadens the claim.\\n- MODEL / RETRIEVAL: summarizers or search systems reproduce the inflated version.\\n- MIXED: more than one layer contributes; specify which layer contributes what.\\n\\nAttacking a defensible paper for its press release is a category error. Classify the\\nresponsible layer honestly.\\n\\n-----\\n\\n[IV-P1] VERIFICATION-GATED VERDICT ELIGIBILITY  [FAIL-IV-001]\\n\\nKeep these axes separate for every proposed internal-validity finding:\\n\\n1. VERIFICATION STATE\\n\\n   How thoroughly the source or record was checked. Use only the canonical verification-state\\n   vocabulary above.\\n\\n2. TECHNICAL OUTCOME STATUS\\n\\n   Whether the technical proposition behind the finding was independently established. Use\\n   exactly one:\\n\\n   SOURCE-DIRECT\\n     The audited source's own FULL-TEXT-CONFIRMED table, model, correction, statement, or\\n     internally checkable result directly establishes the technical fact. State the exact\\n     passage, table, figure, or output.\\n\\n   REPRODUCED\\n     Retrieved data and/or code were independently executed or reanalyzed by this audit and\\n     reproduced the specific technical result. State the retrieved input identities, analysis\\n     steps or code, software/environment where material, resulting output, and comparison to\\n     the disputed claim.\\n\\n   INDEPENDENT-REANALYSIS-CONFIRMED\\n     A retrieved, methodologically independent third-party study \\u2014 neither the audited source\\n     nor this audit \\u2014 states its own data, method, and specific result establishing the\\n     technical fact, and was read with enough detail to state the comparison. State the\\n     third-party study, its inputs and method, the result, and the exact comparison to the\\n     audited claim. This is stronger than UNVERIFIED and distinct from REPRODUCED because this\\n     audit did not itself execute or reanalyze the material.\\n\\n   ACKNOWLEDGED-CORRECTION\\n     A retrieved correction, retraction, author response, or journal notice explicitly\\n     acknowledges the specific technical problem. State exactly what was acknowledged and\\n     what claim it affects.\\n\\n   UNRESOLVED\\n     Competing technical analyses or interpretations were retrieved, but the dispute was not\\n     independently adjudicated.\\n\\n   UNVERIFIED\\n     The existence or reported tenor of an allegation was located, but its technical\\n     correctness was not independently checked; or access remains insufficient.\\n\\n   Technical-outcome status is not a verification state. In particular,\\n   INDEPENDENT-REANALYSIS-CONFIRMED may appear only in the technical-outcome field, never in a\\n   verification-state field. A critique can be FULL-TEXT-CONFIRMED while its alleged coding\\n   error remains UNVERIFIED. RECEPTION-CONFIRMED establishes the existence and reception of a\\n   claim, critique, correction, or replication; by itself it does not establish that the\\n   technical claim is correct.\\n\\n3. CONDITIONAL CONCEDE RESULT\\n\\n   If the finding were true and fully conceded, would the audited claim SURVIVE, NARROW, or be\\n   DEFEATED? Use SURVIVES / NARROWS / DEFEATS without weakening the logical result merely\\n   because verification is incomplete.\\n\\n4. VERDICT ELIGIBILITY\\n\\n   ELIGIBLE\\n     The evidence and technical-outcome status are strong enough for the finding to drive\\n     Section I. SOURCE-DIRECT, REPRODUCED, INDEPENDENT-REANALYSIS-CONFIRMED, or\\n     ACKNOWLEDGED-CORRECTION may qualify when the cited material actually establishes the\\n     claim-relevant technical proposition.\\n\\n   PENDING VERIFICATION\\n     The finding is PROVISIONAL, RECEPTION-CONFIRMED-only on technical outcome, based solely on\\n     a FULL-TEXT-CONFIRMED external allegation whose technical claim was not independently\\n     checked, UNRESOLVED, or UNVERIFIED.\\n\\nHARD RULES\\n\\n- Only ELIGIBLE findings may enter Section I's \\\"Eligible DEFEATS finding(s)\\\" line or act as\\n  adverse evidence driving grades C, D, or E.\\n- A finding may have conditional concede result DEFEATS while remaining PENDING VERIFICATION.\\n  Preserve both facts. Do not relabel it NARROWS merely to express uncertainty.\\n- PENDING VERIFICATION findings remain visible under a separate pending line. They are\\n  non-anchoring and excluded from adverse grade triggers.\\n- Multiple pending findings do not aggregate into an eligible finding. Five unverified\\n  technical allegations are not stronger than one.\\n- If pending evidence concerns so much of the load-bearing analysis that the audit cannot\\n  determine internal validity, use F (Cannot assess). Do not turn missing verification into\\n  either a clean grade or an adverse grade.\\n- Eligibility is determined by each finding's own evidence. It does not change because another\\n  prosecutor issued a severe verdict, because several other findings exist, or because\\n  unrelated material is visible in session context.\\n- Where a result was computed from retrieved material, report \\\"Derivation mode:\\n  COMPUTED-FROM-RETRIEVED\\\" with task-appropriate receipts. This is a derivation description,\\n  not a verification state, and it does not upgrade UNVERIFIED inputs.\\n\\n-----\\n\\nDATA-HONESTY RULE\\n\\nFor every claim about study design, analysis choices, or replication status, state how it was\\ndetermined:\\n\\n- reported in the paper itself\\n- reported in supplementary materials\\n- found in pre-registration record (OSF, ClinicalTrials, AsPredicted, etc.)\\n- found in replication literature\\n- found in methodological critique\\n- PROVISIONAL  -  model memory not checked against retrieval\\n- unknown / not reported\\n\\nRECEPTION-MODULE CONFIRMATION RULE  -  REPLICATION AND POST-PUBLICATION CLAIMS\\n\\nSections F (Replication Status) and G (Data and Code Availability, reanalysis, PubPeer,\\ncorrections) make claims about how a finding fared AFTER publication. These are reception\\nclaims. Confirm them against retrieved sources rather than asserting them from model memory.\\n\\nUse the citation-reception module (OpenAlex + Semantic Scholar), together with direct source\\nretrieval where available, to confirm:\\n\\n- whether replication or failed-replication papers actually exist and how many;\\n- whether citation contexts contain replication-outcome language such as \\\"failed to\\n  replicate,\\\" \\\"we replicate,\\\" or \\\"the effect did not hold\\\";\\n- whether formal replies, comments, corrigenda, retractions, corrections, or expressions of\\n  concern appear in the citing/reply set.\\n\\nApply the compact verification vocabulary:\\n\\n- Replication existence and tenor confirmed through retrieval: RECEPTION-CONFIRMED.\\n- Replication recalled or estimated but not retrieved: PROVISIONAL.\\n- Replication full text read and the technical result checked: FULL-TEXT-CONFIRMED, and also\\n  RECEPTION-CONFIRMED where its relation to the foundational source was verified.\\n\\nLabel every replication-status and post-publication claim with its verification state. A\\nverdict may not be driven to E (Invalid) by a failed replication that is only PROVISIONAL.\\nConfirm that the failed replication exists before allowing it to anchor the verdict.\\n\\nSCOPE FENCE: the module can confirm the EXISTENCE and reported TENOR of replications and\\nresponses. It does not by itself adjudicate the technical outcome of a disputed replication\\nexchange. Determining who is right requires the relevant full texts and remains PROVISIONAL or\\nCONTESTED until they are examined.\\n\\nDo not infer pre-registration compliance from the absence of information. If pre-registration\\nstatus is unknown, state it clearly.\\n\\n-----\\n\\nSECTION A: DATA GENERATION AUDIT\\n\\nRun this section before any analysis audit. A finding built on flawed data cannot be rescued\\nby clean analysis. AI-assisted analysis on flawed data produces confident wrong answers faster\\nthan any previous tool.\\n\\n1. How was this data collected?\\n- Who collected it, when, and under what conditions?\\n- Was collection prospective or retrospective?\\n- Was it observational, experimental, or administrative?\\n- Does the analysis treat it accordingly  -  or does it make causal claims from observational\\n  data?\\n2. What selection effects shaped the dataset?\\n- Who or what is included in the data?\\n- Who or what is systematically missing  -  and why?\\n- Is the sample representative of the population the claim is made about?\\n- What self-selection, survival, or survivorship bias might be present?\\n3. What does missingness look like?\\n- How much data is missing?\\n- Is missingness random (MCAR), related to observed variables (MAR), or related to unobserved\\n  variables (MNAR)?\\n- If MNAR: does the missingness pattern systematically bias the finding in one direction?\\n- How was missingness handled in the analysis  -  and was that handling appropriate?\\n4. What incentive structure governed data collection?\\n- Who benefits from particular findings emerging from this data?\\n- Was the data collected by the same party that stands to benefit from the result?\\n- Are there known cases where similar data collection incentives produced distorted findings?\\n- For administrative or platform data: what organizational decisions shaped what gets recorded\\n  versus what gets dropped?\\n5. For AI-assisted analysis specifically:\\n- Was the dataset inspected before analysis or fed directly to the model?\\n- Did the model flag data quality issues or proceed without surfacing them?\\n- Were the analysis outputs checked against the raw data or accepted as outputs?\\n- Was the adversarial check run: \\\"What is the strongest methodological critique of this\\n  analysis? What does this measure that I might be mistaking for what I want it to measure?\\n  What would falsify this finding?\\\"\\n\\nRequired table:\\n\\n|Data source|Collection method|Selection bias risk|Missingness pattern|Incentive structure risk|AI-analysis check run|\\n|-----------|-----------------|-------------------|-------------------|------------------------|---------------------|\\n\\nRisk options: Low / Moderate / High / Cannot assess AI-analysis check: Yes / No / Partial /\\nN/A\\n\\n-----\\n\\nSECTION B: PRE-REGISTRATION AND ANALYSIS PLAN\\n\\n1. Was the study pre-registered before data collection began?\\n- If yes: where, when, and what was registered?\\n- If no: was any aspect of the design registered after data collection but before analysis?\\n- If unknown: note as unknown\\n2. Did the published analysis match the pre-registered plan?\\n- Were primary outcomes changed?\\n- Were additional outcomes added post-hoc?\\n- Were subgroup analyses pre-specified or exploratory?\\n- Were exclusion criteria changed after data collection?\\n3. If not pre-registered: how many outcomes were tested in the study?\\n- How many are reported?\\n- What is the probability that at least one would reach p \\u003c .05 by chance give
