<title>Provenance — Guided-Sequence Audit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* ============================================================
   TOKENS — complete light palette on bare :root
   ============================================================ */
:root {
  --ground:        #E8EAEC;
  --surface:       #F6F7F8;
  --surface-2:     #FDFDFE;
  --surface-sunk:  #DFE2E6;
  --ink:           #1A1F26;
  --ink-2:         #3D4753;
  --ink-muted:     #5C6672;
  --ink-faint:     #8A939E;
  --line:          #D3D8DD;
  --line-soft:     #E2E6EA;
  --accent:        #2F4E6F;
  --accent-soft:   #DCE4EC;
  --accent-ink:    #FFFFFF;

  --sev-fatal:     #8A3A2E;
  --sev-fatal-bg:  #F3E2DE;
  --sev-major:     #9A4436;
  --sev-major-bg:  #F5E5E1;
  --sev-minor:     #8A6320;
  --sev-minor-bg:  #F3EADA;
  --sev-sound:     #3C6A4E;
  --sev-sound-bg:  #E0EBE3;
  --sev-prov:      #5F6873;
  --sev-prov-bg:   #E5E8EB;

  --shadow-card:   0 1px 2px rgba(20,28,38,.05), 0 4px 14px -6px rgba(20,28,38,.10);
  --shadow-lift:   0 2px 4px rgba(20,28,38,.07), 0 10px 28px -10px rgba(20,28,38,.18);
  --shadow-panel:  -18px 0 48px -22px rgba(20,28,38,.35);

  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --r-sm: 5px;
  --r-md: 9px;
  --r-lg: 14px;

  /* sticky offsets derive from this, so a wrapped header stays correct */
  --topbar-h: 54px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:        #13171C;
    --surface:       #1A1F26;
    --surface-2:     #212832;
    --surface-sunk:  #0F1317;
    --ink:           #E3E7EC;
    --ink-2:         #C2C9D2;
    --ink-muted:     #97A1AD;
    --ink-faint:     #6D7783;
    --line:          #2C343E;
    --line-soft:     #232A33;
    --accent:        #86AACE;
    --accent-soft:   #23303F;
    --accent-ink:    #0F1418;

    --sev-fatal:     #D98A78;
    --sev-fatal-bg:  #33211C;
    --sev-major:     #D18C7C;
    --sev-major-bg:  #2E2019;
    --sev-minor:     #C9A462;
    --sev-minor-bg:  #2B2517;
    --sev-sound:     #7FB392;
    --sev-sound-bg:  #1B2A21;
    --sev-prov:      #9AA3AE;
    --sev-prov-bg:   #232830;

    --shadow-card:   0 1px 2px rgba(0,0,0,.30), 0 6px 18px -8px rgba(0,0,0,.50);
    --shadow-lift:   0 2px 6px rgba(0,0,0,.36), 0 14px 34px -12px rgba(0,0,0,.62);
    --shadow-panel:  -18px 0 52px -20px rgba(0,0,0,.72);
  }
}

:root[data-theme="dark"] {
  --ground:        #13171C;
  --surface:       #1A1F26;
  --surface-2:     #212832;
  --surface-sunk:  #0F1317;
  --ink:           #E3E7EC;
  --ink-2:         #C2C9D2;
  --ink-muted:     #97A1AD;
  --ink-faint:     #6D7783;
  --line:          #2C343E;
  --line-soft:     #232A33;
  --accent:        #86AACE;
  --accent-soft:   #23303F;
  --accent-ink:    #0F1418;

  --sev-fatal:     #D98A78;
  --sev-fatal-bg:  #33211C;
  --sev-major:     #D18C7C;
  --sev-major-bg:  #2E2019;
  --sev-minor:     #C9A462;
  --sev-minor-bg:  #2B2517;
  --sev-sound:     #7FB392;
  --sev-sound-bg:  #1B2A21;
  --sev-prov:      #9AA3AE;
  --sev-prov-bg:   #232830;

  --shadow-card:   0 1px 2px rgba(0,0,0,.30), 0 6px 18px -8px rgba(0,0,0,.50);
  --shadow-lift:   0 2px 6px rgba(0,0,0,.36), 0 14px 34px -12px rgba(0,0,0,.62);
  --shadow-panel:  -18px 0 52px -20px rgba(0,0,0,.72);
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }

/* display:grid on .workspace would otherwise beat the hidden attribute */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}

::selection { background: var(--accent-soft); color: var(--ink); }

.eyebrow {
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ============================================================
   SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100%;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 20px;
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: baseline; gap: 11px; min-width: 0; }

.brand-mark {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.brand-rule {
  width: 1px;
  height: 15px;
  background: var(--line);
  align-self: center;
}

.brand-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13.5px;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-spacer { flex: 1 1 auto; }

.tbtn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  transition: background .14s ease, border-color .14s ease, color .14s ease;
}
.tbtn:hover { border-color: var(--ink-faint); color: var(--ink); }
.tbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }

.workspace {
  display: grid;
  grid-template-columns: 298px minmax(0, 1fr) 452px;
  min-height: 0;
}

/* ---- mode switch ---- */
.modeswitch {
  display: flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-sunk);
}
.mbtn {
  height: 24px;
  padding: 0 12px;
  border-radius: 3px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-muted);
  transition: background .14s ease, color .14s ease;
}
.mbtn:hover { color: var(--ink); }
.mbtn[aria-pressed="true"] {
  background: var(--surface-2);
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(20,28,38,.08);
}

/* ============================================================
   SEQUENCE
   ============================================================ */
.seq {
  display: grid;
  grid-template-columns: 336px minmax(0, 1fr);
  min-height: 0;
}

.seqrail { background: var(--surface); border-right: 1px solid var(--line); }

.branchpick {
  display: flex;
  gap: 6px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--line-soft);
  flex: 0 0 auto;
}
.bbtn {
  flex: 1 1 0;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-muted);
  transition: border-color .14s ease, color .14s ease, background .14s ease;
}
.bbtn:hover { border-color: var(--ink-faint); color: var(--ink); }
.bbtn[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }

.rail { padding: 8px 14px 30px; }

.railgroup { margin-top: 14px; }
.railgroup:first-child { margin-top: 4px; }
.railgroup > .glabel {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 0 2px 7px;
}
.glabel .gname {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.glabel .gnote { font-size: 11px; color: var(--ink-faint); font-style: italic; }

/* the parallel prosecutor group gets a bracket, because "any order" is
   structural information rather than decoration */
.parallel {
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  padding: 8px;
  background: var(--surface);
}
.parallel .gnote { color: var(--accent); font-style: normal; font-weight: 600; }

.node {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 9px;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  transition: background .14s ease, border-color .14s ease;
}
.node + .node { margin-top: 3px; }
.node:hover { background: var(--surface-2); border-color: var(--line-soft); }
.node[aria-current="true"] { background: var(--surface-2); border-color: var(--accent); }
.node[aria-current="true"] .nname { color: var(--accent); }

.nmark {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-faint);
  padding-top: 1px;
  text-align: center;
}
.nname { display: block; font-size: 13px; font-weight: 600; line-height: 1.3; }
.nsub { display: block; font-size: 11.5px; line-height: 1.4; color: var(--ink-muted); margin-top: 2px; }

.ntag {
  display: inline-block;
  margin-top: 5px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
}
.t-done { background: var(--sev-sound-bg); color: var(--sev-sound); }
.t-gate { background: var(--accent-soft); color: var(--accent); }
.t-gap  { background: var(--sev-prov-bg); color: var(--sev-prov); }
.t-opt  { background: var(--surface-sunk); color: var(--ink-muted); }

/* ---- workspace ---- */
.seqwork { background: var(--ground); }
.work-body { padding: 26px 40px 48px; max-width: 780px; }

.work-kicker { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 10px; }
.work-title {
  font-family: var(--serif);
  font-size: 28px;
  line-height: 1.18;
  font-weight: 600;
  letter-spacing: -.016em;
  margin: 0 0 8px;
  text-wrap: balance;
}
.work-tagline {
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-muted);
  margin: 0 0 22px;
}

.tabs { display: flex; gap: 3px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.tab {
  height: 34px;
  padding: 0 13px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .14s ease, border-color .14s ease;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

.wsec { margin-bottom: 24px; }
.wsec > .eyebrow { display: block; margin-bottom: 9px; }
.wsec p { font-size: 14px; line-height: 1.65; color: var(--ink-2); margin: 0 0 11px; max-width: 64ch; }
.wsec p:last-child { margin-bottom: 0; }
.wsec strong { color: var(--ink); font-weight: 600; }

.blist { display: flex; flex-direction: column; gap: 9px; margin: 0; padding: 0; list-style: none; }
.blist li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 64ch;
}
.blist li::before { content: "—"; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); padding-top: 3px; }

/* routing outcomes */
.routes { display: flex; flex-direction: column; gap: 8px; }
.route {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
}
.route-cond { font-size: 13px; font-weight: 600; color: var(--ink); }
.route-note { font-size: 12.5px; color: var(--ink-muted); margin-top: 3px; line-height: 1.45; }
.route-go {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 4px 9px;
  border-radius: 3px;
  white-space: nowrap;
}
.go-yes  { background: var(--sev-sound-bg); color: var(--sev-sound); }
.go-hold { background: var(--sev-minor-bg); color: var(--sev-minor); }

/* the reception gate checkpoint — the one halt in the sequence */
.checkpoint {
  border: 1px solid var(--sev-sound);
  border-radius: var(--r-md);
  background: var(--sev-sound-bg);
  padding: 15px 17px;
  margin: 0 0 14px;
}
.checkpoint .cp-head {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin-bottom: 9px;
}
.cp-name {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--sev-sound);
}
.cp-halt { font-family: var(--mono); font-size: 10.5px; color: var(--sev-sound); }
.checkpoint p { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); margin: 0 0 9px; max-width: 62ch; }
.checkpoint p:last-child { margin-bottom: 0; }
.cp-cap {
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--ink);
  padding: 9px 11px;
  border-radius: var(--r-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.callout-sm {
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 64ch;
}

/* prompt handover */
.provenance-stamp {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 14px;
  align-items: baseline;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  margin-bottom: 12px;
}
.provenance-stamp .ps-k {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-right: 5px;
}
.provenance-stamp .ps-v { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.ps-warn {
  flex-basis: 100%;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--ink-muted);
  padding-top: 7px;
  margin-top: 2px;
  border-top: 1px solid var(--line-soft);
}

.handover { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; flex-wrap: wrap; }
.big-copy {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 16px;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 600;
  transition: filter .14s ease;
}
.big-copy:hover { filter: brightness(1.12); }
.big-copy.is-ok { background: var(--sev-sound); }

.pt-wrap { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-sunk); overflow-x: auto; max-height: 460px; overflow-y: auto; }
.pt-pre {
  margin: 0;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.68;
  color: var(--ink-2);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.pt-fallback {
  width: 100%;
  min-height: 90px;
  margin-top: 9px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  resize: vertical;
}

/* your output */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 6px;
}
.field input, .field textarea {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.55;
}
.field textarea { font-family: var(--mono); font-size: 11.5px; min-height: 200px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.field-row { display: grid; grid-template-columns: minmax(0,1fr) 150px; gap: 12px; }

.savebar { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.saved-note { font-size: 11.5px; color: var(--ink-muted); }

.warnbar {
  padding: 11px 16px;
  background: var(--sev-minor-bg);
  color: var(--sev-minor);
  font-size: 12.5px;
  font-weight: 500;
  border-bottom: 1px solid var(--line);
}

.target-card {
  padding: 15px 17px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  margin-bottom: 22px;
}

.region { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

.region-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 18px 11px;
  border-bottom: 1px solid var(--line-soft);
  flex: 0 0 auto;
}

.region-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-faint);
}

.scroller { overflow-y: auto; overflow-x: hidden; flex: 1 1 auto; scrollbar-width: thin; }
.scroller::-webkit-scrollbar { width: 9px; height: 9px; }
.scroller::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; border: 2px solid transparent; background-clip: content-box; }
.scroller::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); background-clip: content-box; }

/* ============================================================
   LEFT — LIBRARY
   ============================================================ */
.library {
  background: var(--surface);
  border-right: 1px solid var(--line);
}

.lib-list { display: flex; flex-direction: column; gap: 8px; padding: 12px; }

.lib-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px 13px 11px;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  background: var(--surface-2);
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.lib-item:hover { border-color: var(--ink-faint); box-shadow: var(--shadow-card); }
.lib-item[aria-current="true"] {
  border-color: var(--accent);
  box-shadow: var(--shadow-card);
  background: var(--surface-2);
}
.lib-item[aria-current="true"] .lib-title { color: var(--accent); }

.lib-row { display: flex; align-items: flex-start; gap: 9px; }

.lib-title {
  font-family: var(--serif);
  font-size: 15.5px;
  line-height: 1.28;
  font-weight: 600;
  letter-spacing: -.005em;
  margin: 0 0 5px;
  text-wrap: balance;
}

.lib-claim {
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink-muted);
  margin: 0 0 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.lib-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

.lib-date {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-faint);
}

/* a verdict must never be truncated to fit; it wraps instead */
.lib-meta .vbadge {
  white-space: normal;
  height: auto;
  min-height: 19px;
  padding: 2px 7px 3px;
  line-height: 1.32;
  align-items: flex-start;
  max-width: 100%;
}
.lib-meta .vbadge .vletter { padding-top: 1px; }

/* ---- chips & badges ---- */
.chip {
  display: inline-flex;
  align-items: center;
  height: 19px;
  padding: 0 7px;
  border-radius: 3px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .045em;
  text-transform: uppercase;
  white-space: nowrap;
}
.chip-tag { background: var(--surface-sunk); color: var(--ink-muted); }
.chip-synth { background: var(--sev-prov-bg); color: var(--sev-prov); }

.vbadge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 19px;
  padding: 0 7px 0 5px;
  border-radius: 3px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .045em;
  text-transform: uppercase;
  white-space: nowrap;
}
.vbadge .vletter {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0;
}
.v-fatal { background: var(--sev-fatal-bg); color: var(--sev-fatal); }
.v-major { background: var(--sev-major-bg); color: var(--sev-major); }
.v-minor { background: var(--sev-minor-bg); color: var(--sev-minor); }
.v-sound { background: var(--sev-sound-bg); color: var(--sev-sound); }
.v-prov  { background: var(--sev-prov-bg);  color: var(--sev-prov); }

/* ============================================================
   CENTER — EXAMINATION
   ============================================================ */
.centre {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  background: var(--ground);
}

.specimen { padding: 30px 44px 40px; }
.specimen-inner { max-width: 660px; margin: 0 auto; }

.spec-provenance {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 9px 12px;
  margin: 0 0 22px;
  border: 1px dashed var(--line);
  border-radius: var(--r-sm);
  background: var(--surface);
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-muted);
}
.spec-provenance strong { color: var(--ink-2); font-weight: 600; }

.spec-head { margin-bottom: 26px; }

.spec-kicker { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; flex-wrap: wrap; }

.spec-title {
  font-family: var(--serif);
  font-size: 31px;
  line-height: 1.16;
  font-weight: 600;
  letter-spacing: -.017em;
  margin: 0 0 8px;
  text-wrap: balance;
}

.spec-cite {
  font-family: var(--serif);
  font-size: 14px;
  font-style: italic;
  line-height: 1.5;
  color: var(--ink-muted);
  margin: 0;
}

.block { margin-bottom: 26px; }
.block > .eyebrow { display: block; margin-bottom: 10px; }

.claim-card {
  padding: 18px 20px 19px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  box-shadow: var(--shadow-card);
}
.claim-text {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.44;
  letter-spacing: -.008em;
  margin: 0;
  color: var(--ink);
}
.claim-note {
  margin: 12px 0 0;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink-muted);
}

/* verdict */
.verdict-card {
  display: flex;
  align-items: stretch;
  gap: 18px;
  padding: 17px 20px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  box-shadow: var(--shadow-card);
}
.verdict-letter {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 58px;
  border-radius: var(--r-md);
  font-family: var(--mono);
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.verdict-body { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
.verdict-label {
  font-family: var(--serif);
  font-size: 17.5px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -.008em;
}
.verdict-note { font-size: 13px; line-height: 1.55; color: var(--ink-muted); }

/* failure modes */
.modes { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--line-soft); }
.mode {
  display: grid;
  grid-template-columns: 172px minmax(0, 1fr);
  gap: 16px;
  padding: 12px 15px;
  background: var(--surface-2);
}
.mode-name { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; }
.mode-note { font-size: 12.5px; line-height: 1.5; color: var(--ink-muted); }

/* findings */
.findings { display: flex; flex-direction: column; gap: 11px; }
.finding {
  padding: 15px 17px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  box-shadow: var(--shadow-card);
}
.finding-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; flex-wrap: wrap; }
.finding-id { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); letter-spacing: .02em; }
.finding-title {
  font-family: var(--serif);
  font-size: 16.5px;
  line-height: 1.32;
  font-weight: 600;
  letter-spacing: -.008em;
  margin: 0 0 8px;
  text-wrap: balance;
}
.finding-body { font-size: 13.5px; line-height: 1.62; color: var(--ink-2); margin: 0; }
.finding-foot {
  display: flex;
  gap: 8px;
  align-items: baseline;
  margin-top: 11px;
  padding-top: 10px;
  border-top: 1px solid var(--line-soft);
  font-size: 11.5px;
  color: var(--ink-muted);
  flex-wrap: wrap;
}
.finding-foot .k { font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.vstate { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }

.nofind {
  padding: 20px 22px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  box-shadow: var(--shadow-card);
}
.nofind p { margin: 0; font-family: var(--serif); font-size: 16px; line-height: 1.55; color: var(--ink-2); }
.nofind p + p { margin-top: 10px; font-family: var(--sans); font-size: 13px; color: var(--ink-muted); }

/* ============================================================
   BOTTOM STRIP
   ============================================================ */
.strip {
  flex: 0 0 auto;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.strip-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px 0;
}
.strip-hint { font-size: 11.5px; color: var(--ink-faint); margin-left: auto; }

.strip-rail {
  display: flex;
  gap: 9px;
  padding: 10px 18px 14px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.strip-rail::-webkit-scrollbar { height: 8px; }
.strip-rail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

.run-card {
  flex: 0 0 auto;
  width: 158px;
  text-align: left;
  padding: 10px 12px 11px;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  background: var(--surface-2);
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.run-card:hover { border-color: var(--ink-faint); box-shadow: var(--shadow-card); transform: translateY(-1px); }
.run-card[aria-current="true"] { border-color: var(--accent); box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.run-card[aria-current="true"] .run-name { color: var(--accent); }
.run-card.is-inert { background: var(--surface); }
.run-card.is-inert .run-name { color: var(--ink-muted); }

.run-stage {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-faint);
  letter-spacing: .04em;
  display: block;
  margin-bottom: 5px;
}
.run-name {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.32;
  margin-bottom: 8px;
  min-height: 33px;
}
.run-state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.dot-run    { background: var(--sev-sound); }
.dot-flag   { background: var(--sev-minor); }
.dot-off    { background: var(--line); border: 1px solid var(--ink-faint); }
.dot-gap    { background: transparent; border: 1px dashed var(--ink-faint); }

/* ============================================================
   RIGHT — READOUT
   ============================================================ */
.readout {
  background: var(--surface);
  border-left: 1px solid var(--line);
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
}
.back-btn:hover { text-decoration: underline; }

.ro-body { padding: 16px 18px 34px; }

.ro-section + .ro-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line-soft); }
.ro-section > .eyebrow { display: block; margin-bottom: 9px; }

.ro-prose { font-size: 13.5px; line-height: 1.62; color: var(--ink-2); margin: 0; }
.ro-prose + .ro-prose { margin-top: 10px; }

.keylist { display: flex; flex-direction: column; gap: 9px; margin: 0; padding: 0; list-style: none; }
.keylist li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 9px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink-2);
}
.keylist .kdot { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); padding-top: 2px; }

.srclist { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--line-soft); }
.srcrow { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--surface-2); }
.srcrow-top { display: flex; align-items: center; gap: 8px; }
.srcrow-label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.srcrow-state { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .03em; color: var(--ink-muted); text-align: right; }
.srcrow-note { font-size: 12px; line-height: 1.5; color: var(--ink-muted); }

.decisive {
  padding: 14px 15px;
  border: 1px solid var(--accent);
  border-radius: var(--r-md);
  background: var(--accent-soft);
}
.decisive p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink); }
.decisive p + p { margin-top: 9px; font-size: 12.5px; color: var(--ink-2); }

/* prompt output view */
.po-head { margin-bottom: 14px; }
.po-title {
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.24;
  font-weight: 600;
  letter-spacing: -.012em;
  margin: 9px 0 8px;
  text-wrap: balance;
}
.po-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-muted); }
.po-meta .k { font-weight: 600; letter-spacing: .07em; text-transform: uppercase; font-size: 10px; color: var(--ink-faint); margin-right: 5px; }

.po-note {
  margin: 12px 0 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--sev-minor);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--ink-2);
}
.po-note.is-plain { border-left-color: var(--line); }

.po-toolbar { display: flex; align-items: center; gap: 8px; margin: 14px 0 9px; }

.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 27px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-2);
  transition: border-color .14s ease, color .14s ease;
}
.copy-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
.copy-btn.is-ok { border-color: var(--sev-sound); color: var(--sev-sound); }

.po-bytes { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }

.po-wrap {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-sunk);
  overflow-x: auto;
}
.po-pre {
  margin: 0;
  padding: 14px 15px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.66;
  color: var(--ink-2);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  tab-size: 2;
}

.po-empty {
  padding: 18px 18px 19px;
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
}
.po-empty p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
.po-empty p + p { margin-top: 10px; font-size: 12.5px; color: var(--ink-muted); }

/* ============================================================
   DOCUMENTATION OVERLAY
   ============================================================ */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(12, 17, 23, .34);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease;
  z-index: 40;
}
.scrim.is-open { opacity: 1; pointer-events: auto; }

.docs {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(620px, 92vw);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-panel);
  transform: translateX(100%);
  transition: transform .26s cubic-bezier(.32,.72,.3,1);
  z-index: 50;
}
.docs.is-open { transform: translateX(0); }

.docs-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 20px 13px;
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.docs-head h2 {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.012em;
  margin: 0;
}
.x-btn {
  margin-left: auto;
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--ink-muted);
  font-size: 15px;
  line-height: 1;
}
.x-btn:hover { border-color: var(--ink-faint); color: var(--ink); }

.docs-nav {
  display: flex;
  gap: 4px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line-soft);
  overflow-x: auto;
  flex: 0 0 auto;
}
.docs-tab {
  flex: 0 0 auto;
  height: 27px;
  padding: 0 11px;
  border-radius: var(--r-sm);
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-muted);
  white-space: nowrap;
  transition: background .14s ease, color .14s ease;
}
.docs-tab:hover { background: var(--surface-sunk); color: var(--ink); }
.docs-tab[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }

.docs-body { padding: 22px 26px 44px; }
.docs-body .doc-inner { max-width: 560px; }

.docs-body h3 {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -.014em;
  line-height: 1.24;
  margin: 0 0 12px;
  text-wrap: balance;
}
.docs-body h4 {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -.008em;
  margin: 24px 0 8px;
}
.docs-body p {
  font-size: 14px;
  line-height: 1.66;
  color: var(--ink-2);
  margin: 0 0 12px;
  max-width: 62ch;
}
.docs-body p.lede {
  font-family: var(--serif);
  font-size: 16.5px;
  line-height: 1.58;
  color: var(--ink);
}
.docs-body ul { margin: 0 0 12px; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.docs-body ul li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 62ch;
}
.docs-body ul li::before { content: "—"; color: var(--ink-faint); font-family: var(--mono); font-size: 12px; padding-top: 2px; }
.docs-body strong { color: var(--ink); font-weight: 600; }

.numlist { display: flex; flex-direction: column; gap: 14px; margin: 0 0 14px; }
.numrow { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 13px; }
.numrow .n {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  padding-top: 3px;
  letter-spacing: -.02em;
}
.numrow .t { font-size: 14px; line-height: 1.62; color: var(--ink-2); max-width: 58ch; }
.numrow .t b { color: var(--ink); font-weight: 600; }

.vocab { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.vocab code {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--ink-2);
}

.callout {
  padding: 13px 15px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  margin: 0 0 16px;
}
.callout p { margin: 0; font-size: 13.5px; line-height: 1.6; }
.callout p + p { margin-top: 9px; }

.ladder { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--line-soft); margin: 0 0 16px; }
.ladder-row { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 9px 13px; background: var(--surface-2); align-items: baseline; }
.ladder-row .L { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent); }
.ladder-row .D { font-size: 13px; line-height: 1.5; color: var(--ink-2); }

.docs-foot {
  margin-top: 26px;
  padding-top: 16px;
  border-top: 1px solid var(--line-soft);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink-muted);
  max-width: 62ch;
}
.docs-foot a { color: var(--accent); }

/* ============================================================
   MOTION
   ============================================================ */
.fade-in { animation: fadeIn .24s cubic-bezier(.32,.72,.3,1) both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}

/* ============================================================
   NARROWER DESKTOP — degrade, don't reflow to mobile
   ============================================================ */
@media (max-width: 1280px) {
  .workspace { grid-template-columns: 262px minmax(0, 1fr) 396px; }
  .specimen { padding: 26px 30px 34px; }
}
@media (max-width: 1080px) {
  .workspace { grid-template-columns: 232px minmax(0, 1fr) 356px; }
  .brand-tag { display: none; }
  .specimen { padding: 22px 22px 30px; }
  .spec-title { font-size: 26px; }
}

/* ============================================================
   STACKED — below this width three columns cannot coexist, so the
   fixed instrument shell is abandoned and the page becomes an
   ordinary scrolling document. Regions keep their reading order:
   library, specimen, prompt runs, readout.
   ============================================================ */
@media (max-width: 1000px) {
  html, body { height: auto; overflow: visible; }
  .app { display: block; height: auto; }

  .topbar { position: sticky; top: 0; z-index: 30; }

  .workspace, .seq { display: block; }
  .seqrail { border-right: none; }
  .work-body { padding: 20px 16px 40px; max-width: none; }
  .work-title { font-size: 24px; }
  .field-row { grid-template-columns: minmax(0, 1fr); }
  .route { grid-template-columns: minmax(0, 1fr); gap: 8px; align-items: start; }
  .route-go { justify-self: start; }
  .pt-wrap { max-height: 340px; }

  .region { display: block; overflow: visible; }
  /* scoped to the workspace: the docs panel keeps its own internal scroller */
  .region .scroller { overflow: visible; }

  .region-head {
    position: sticky;
    top: var(--topbar-h);
    z-index: 12;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  /* selection scrolls a region into view; keep it clear of the sticky bar */
  .region, .strip { scroll-margin-top: var(--topbar-h); }

  .library { border-right: none; }
  .lib-list { padding: 12px 16px; }

  .centre { display: block; }
  .specimen { padding: 20px 16px 26px; }
  .specimen-inner { max-width: 42rem; }
  .spec-title { font-size: 25px; }
  .mode { grid-template-columns: minmax(0, 1fr); gap: 5px; }

  .strip { border-bottom: 1px solid var(--line); }
  .strip-head { padding: 12px 16px 0; }
  .strip-rail { padding: 10px 16px 14px; }

  .readout { border-left: none; background: var(--surface); }
  .readout .region-head { background: var(--surface); }
  .ro-body { padding: 16px 16px 44px; }

  /* the readout is now below the fold, so give it a visible boundary */
  .readout { border-top: 1px solid var(--line); }
}

/* The header carries brand + mode switch + two buttons. Below this it cannot
   fit on one line, so the mode switch drops to its own full-width row and the
   sticky offsets follow --topbar-h rather than a hardcoded 54px. */
@media (max-width: 720px) {

computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\n\\n-----\\n\\nWHERE THIS SITS IN THE TOOLKIT (STAGE 0 \\u2014 FEASIBILITY & SELF-CALIBRATION GATE)\\n\\nThis diagnostic runs BEFORE any paper-level audit. It is not a construct-,\\ninternal-, or citation-validity audit and does not fold into them. It is the\\nupstream go/no-go gate that decides two things:\\n\\n  (1) Is the failure mode plausibly present in this field?  (Section A)\\n  (2) Are YOU positioned and clear-eyed enough to run a credible challenge?\\n      (Sections B and C)\\n\\nIts output is ROUTING, not findings. Based on your answers it sends you to one\\nof: proceed to the paper-level audit pipeline / partner or narrow scope / steelman\\nfirst / stop. Run it once, up front, on the field and your own position \\u2014 not\\nper-paper. Only after passing this gate do you select a target paper and run the\\nconstruct-validity, internal-validity, citation-network, and counter-audit stages.\\n\\nSection C is the part of the entire toolkit that audits the AUDITOR. It is the\\none safeguard that cannot be automated or externally grounded, because it is you\\nchecking your own motivated reasoning before you start. Treat it as the human-side\\nequivalent of the reception gate: before you audit their evidence, audit your own\\nmotive. Do not skip it because you are confident \\u2014 confidence is exactly when it\\nmatters most.\\n\\n-----\\n\\nPURPOSE\\n\\nThis diagnostic helps you evaluate whether a field has the structural conditions\\nfor a serious methodological challenge. It separates:\\n\\n- Does the failure mode exist in the field? (Section A)\\n- Do you have the position and information needed to run a credible challenge?\\n  (Section B)\\n\\nIt also includes calibration questions (Section C) to distinguish methodological\\ncritique from motivated reasoning.\\n\\nUse this before investing significant time in building a formal challenge.\\n\\n-----\\n\\nHOW TO USE THIS PROMPT\\n\\nOption A (Recommended):\\nPaste this prompt into an AI and add a short description of the field and the\\nclaim you want to examine. Ask it to answer the questions based on the published\\nliterature. Then compare its answers to your own knowledge. The gaps are often\\nthe most valuable part.\\n\\nGuidance on model use (model-agnostic \\u2014 do not hardcode to specific products,\\nwhose behavior shifts over time):\\n- For the initial mapping pass on contested or politically sensitive territory,\\n  use whichever model is currently LEAST prone to sycophancy and false balance on\\n  the topic, and cross-check its claims \\u2014 any single model will lean, and the lean\\n  is invisible unless you compare or verify.\\n- For adversarial stress-testing (generating the strongest objections to your\\n  own challenge), use a SEPARATE pass \\u2014 ideally a different model or a clearly\\n  re-framed prompt \\u2014 so the model attacking your argument is not the same one that\\n  built it. A model asked to both generate and validate tends to rubber-stamp.\\n- Do not let one model both produce and confirm the same claim. Confirmation\\n  must come from retrieval or an independent pass, not from the same model's\\n  agreement with itself.\\n- On any citation, replication, or \\\"who-cites-whom\\\" question, prefer RETRIEVED\\n  data (a real citation graph \\u2014 OpenAlex, Semantic Scholar) over the model's\\n  recollection. Models confabulate citation relationships confidently; see the\\n  grounding notes in Sections A-citation and A-empirical below.\\n\\nOption B:\\nWork through the questions yourself before committing to a challenge.\\n\\n-----\\n\\nSECTION A: DOES THE FAILURE MODE EXIST?\\n\\nAnswer these about the field and its central claim. If you answer yes to most,\\nthe failure mode is likely present.\\n\\nON THE CORE CLAIM\\n\\n1. What is the field's central claim? State it in one sentence.\\n2. Is this claim presented as an empirical finding, a theoretical framework, or\\n   both? Does the field treat it as settled?\\n3. What was the original study or paper that established the claim? What was the\\n   sample and population?\\n4. Has the original claim been directly replicated by independent researchers\\n   using pre-registered methods? What was the result?\\n   [GROUNDING: confirm replication status against retrieved data \\u2014 pull the citing\\n   works and reply/comment papers rather than recalling. A replication claim that\\n   is only model-recalled is provisional and must be labeled so.]\\n5. Does the field clearly distinguish between well-supported versions of the\\n   claim and overstated versions?\\n\\nON EMPIRICAL STATUS\\n\\n6. What would it take for a researcher in this field to publish a paper that\\n   meaningfully challenges the central claim?\\n7. Has the field specified what evidence would falsify or seriously weaken its\\n   central claim?\\n8. Has the field's main prediction been tested against a natural experiment or\\n   large-scale intervention? Did the field update its position afterward?\\n9. Are there adjacent fields or literatures that contradict or complicate the\\n   central claim? Does the dominant literature engage with them substantively?\\n\\nON THE PROXY / MEASUREMENT\\n\\n10. What does the field most commonly measure? Describe the primary data sources\\n    and instruments.\\n11. What construct does the field claim to be explaining or intervening on?\\n12. Is the thing being measured the same as the construct being claimed? If not,\\n    what is the gap?\\n13. What confounds are routinely present in the field's typical measurements that\\n    are not adequately controlled for?\\n14. Has anyone in the field formally challenged the validity of the primary\\n    measurement instruments or proxies? What happened to those challenges?\\n    [GROUNDING + NO-ASSUME-SUPPRESSION: if a validity challenge received little\\n    engagement, check whether it SURVIVED its own rebuttals before concluding it\\n    was suppressed. Low uptake of a rebutted challenge is expected, not evidence of\\n    a cartel. Confirm the challenge's own reception via retrieval.]\\n\\nON THE CITATION NETWORK\\n\\n15. Name the 5-10 most-cited papers in the relevant subfield. Do they primarily\\n    cite each other?\\n    [GROUNDING: this must be answered from a REAL citation graph (OpenAlex /\\n    Semantic Scholar), not model memory. Citation counts and who-cites-whom are\\n    exactly what models confabulate. Mark unretrieved answers provisional.]\\n16. Is there a small founding cluster of papers that later work heavily relies\\n    on? Were those foundational claims rigorously tested or largely adopted as\\n    premises?\\n17. Which disciplines with relevant expertise are well-represented in the\\n    citation network? Which are largely absent?\\n18. Are there papers that challenged the dominant view that receive little\\n    engagement or are mainly cited to be dismissed?\\n    [GROUNDING + NO-ASSUME-SUPPRESSION: \\\"cited only to be dismissed\\\" and \\\"ignored\\n    despite rigor\\\" are claims that require the challenged paper to have SURVIVED\\n    its rebuttals. Confirm its reception via retrieval before reading low uptake as\\n    suppression rather than as the field correctly discounting rebutted work.]\\n\\nON EXTRAPOLATION\\n\\n19. At what population or skill level were the foundational studies conducted?\\n20. At what population or outcome level does the field make its strongest claims?\\n21. What assumptions are required to bridge the evidence level to the claim\\n    level? Are those assumptions tested or merely asserted?\\n22. Are there contexts where the field's model predicts improvement or\\n    convergence that have not occurred? How does the field explain those failures?\\n\\nON THE INTERVENTION RATCHET\\n\\n23. What interventions or policies has the field advocated for or helped\\n    implement?\\n24. Which metrics improved after implementation, and which did not?\\n25. Was the primary outcome measure independent of the intervention, or did it\\n    largely measure compliance with it?\\n26. Has any version of the intervention been meaningfully rolled back or\\n    reformed? How did the field respond?\\n27. When interventions fail to deliver on their stated goals, what does the field\\n    typically recommend next?\\n\\n-----\\n\\nSECTION B: CAN THE CHALLENGE BE RUN?\\n\\nAnswer these about your own position and knowledge. If you answer yes to most,\\nyou have the raw material to run the challenge.\\n\\nON YOUR DOMAIN KNOWLEDGE\\n\\n28. Do you have direct experience with the phenomenon the field claims to explain\\n    (amateur, professional, or elite level)?\\n29. Can you identify specific, concrete cases where the field's model or\\n    predictions do not match observable reality?\\n30. Can you name confounds that the field routinely ignores because you have\\n    encountered them directly?\\n31. Can you clearly articulate the proxy or measurement problem in terms that\\n    someone working in the field would recognize as a legitimate methodological\\n    objection?\\n\\nON THE DECISIVE TEST\\n\\n32. What evidence would directly and decisively test the central claim at the\\n    right level of analysis?\\n33. Does this evidence currently exist? If not, is it collectible through a\\n    natural experiment or existing dataset?\\n34. If the decisive test were run and came back against the field's position,\\n    would it be publishable in mainstream venues? Or would the field's gatekeeping\\n    prevent publication regardless of the finding?\\n\\nON YOUR POSITION\\n\\n35. What do you have to lose by running this challenge (career, funding,\\n    relationships, institutional standing)?\\n36. What do you have to gain that is independent of career advancement?\\n37. Are you willing to publish under your own name with transparent sourcing and\\n    receipts?\\n38. Can you specify what evidence would cause you to revise or abandon your\\n    critique?\\n\\n-----\\n\\nSECTION C: CALIBRATION QUESTIONS\\n\\nThese distinguish methodological critique from motivated reasoning. Answer them\\nbefore you start writing. This is the section that audits YOU.\\n\\n39. Is there a version of the field's central claim that you accept as valid?\\n    Where does the overreach begin?\\n40. Can you describe the strongest version of the field's argument before\\n    critiquing it?\\n41. If the decisive test came back in the field's favor, would you update your\\n    position? What would that update look like?\\n42. Are there aspects of the field's work you would be willing to cite positively\\n    in your challenge? (If no, your challenge may be advocacy rather than\\n    methodology.)\\n43. Are you primarily identifying problems with the field's methods and evidence,\\n    or are you attributing motives to individual researchers? The former is\\n    documentable. The latter requires stronger evidence.\\n44. Would you be willing to publish this challenge even if it received\\n    significant institutional or professional pushback?\\n\\n-----\\n\\nRED FLAGS \\u2014 stop and reconsider if:\\n\\n- You cannot identify any version of the field's claim that you accept as valid\\n  (Q39) -> you may be writing a polemic, not a methodological challenge\\n- You cannot specify what evidence would change your own conclusion (Q38/Q41)\\n  -> your challenge is not falsifiable\\n- Your critique relies heavily on attributing motive rather than documenting\\n  method (Q43) -> you need more evidence before publishing\\n- You answered no to most of Section B\\n  -> domain expertise is necessary but not sufficient\\n\\nGREEN FLAGS \\u2014 proceed if:\\n\\n- You can clearly name the proxy/measurement problem in terms the field would\\n  recognize as legitimate\\n- You know which confounds are ignored because you have encountered them directly\\n- The decisive test is specifiable and the data either exists or is collectible\\n- You can describe the strongest opposing argument before dismantling it\\n- You are willing to publish under your own name with receipts\\n- You can answer Q39-44 honestly without becoming defensive\\n\\n-----\\n\\nWHAT TO DO WITH YOUR ANSWERS (ROUTING)\\n\\nSection A mostly yes + Section B mostly yes:\\nYou have the raw material for a methodological challenge. PROCEED to the\\npaper-level audit pipeline. Select a target paper and run the construct-validity\\naudit first; this diagnostic has told you where to point it. (If you are using the\\nfield-context generator, run it on the target paper now to specialize the audits\\nfor this field.)\\n\\nSection A mostly yes but Section B weak:\\nThe failure mode likely exists, but you may lack the position, access, or evidence\\nto run a strong challenge right now. PARTNER with someone who has the missing\\ndomain knowledge or institutional access, or NARROW the scope to what you can\\ndocument.\\n\\nSection C shows motivated reasoning:\\nSTEELMAN the field's position first. A challenge that survives steelmanning is\\npublishable. One that does not is advocacy rather than methodology \\u2014 which has its\\nplace, but is a different project. Do not proceed to the audit pipeline until\\nSection C is clean.\\n\\n-----\\n\\nFINAL ASSESSMENT\\n\\nAfter working through all 44 questions, briefly answer:\\n\\n- Does the failure mode appear to be present in this field?\\n- Do you have sufficient position and evidence to run a credible challenge?\\n- What is the single strongest methodological objection you can currently make?\\n- What is the decisive test that has not been run?\\n- What evidence would most strengthen your position?\\n- What evidence would most weaken it?\\n\\nBe direct. Do not hedge unless the evidence genuinely requires it. (Calibrated\\nuncertainty tied to a real gap \\u2014 \\\"this is unverified,\\\" \\\"this is the specific not\\nthe general claim\\\" \\u2014 is not hedging and should be kept.) If the failure mode is\\npresent and the challenge is runnable, say so clearly.\\n\\n-----\\n\\nREMINDER\\n\\nThis diagnostic is not asking whether the field is wrong.\\nIt is asking whether the failure mode is structurally present and whether you are\\nin a position to document it.\\n\\nA methodological challenge that can survive calibration (Section C) is publishable.\\nOne that cannot is a polemic.\\n\\nYou may begin with suspicion.\\nYou may not end with suspicion.\\n\\nStart wherever the anomaly appears.\\nFinish with receipts.\\n\\n-----\\n\"},\"1-claim-extraction\":{\"bytes\":44072,\"lines\":1039,\"path\":\"prompts/1-claim-extraction.txt\",\"sha256\":\"656b11c30193\",\"text\":\"CLAIM EXTRACTION / INFLATION MAP\\n================================\\n\\nShared pre-stage. Runs AFTER target selection, BEFORE the prosecutors.\\n\\n-----------------------------------------------------------------\\nINSTRUMENT PREFLIGHT \\u2014 MANDATORY FOR FORMAL / LOGGED RUNS   [TOOL-004]\\n-----------------------------------------------------------------\\n\\nThis prompt is part of the audit instrument. Establish the exact instrument version BEFORE\\nsubstantive retrieval, extraction, analysis, or verdict work begins.\\n\\nA successful fetch indicator, correct repository path, branch label, plausible line count,\\nmatching rendered metadata, or internally self-consistent page does NOT by itself establish\\nthat the intended/current artifact was retrieved. A mutable remote reference can return a\\nhistorical representation that is internally self-consistent in every visible field.\\n\\nPROMPT IDENTITY MARKERS\\n\\n  - CLAIM EXTRACTION / INFLATION MAP\\n\\nThese markers confirm the prompt family / expected structural features. They do NOT by\\nthemselves establish version currency: an older version may share the same title or markers.\\n\\n1. RECORD THE INSTRUMENT ACTUALLY IN CONTEXT.\\n\\n   Record, where available:\\n\\n   - canonical prompt path or supplied filename;\\n   - retrieval form: PASTED / ATTACHED / IMMUTABLE REMOTE / MUTABLE REMOTE;\\n   - requested branch or ref;\\n   - intended immutable commit/ref, if the run claims a repository version;\\n   - resolved commit SHA;\\n   - resolved blob/content hash, or a locally computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\n\\nReferences: shared_primitives.txt Section 1 (verification states), Section 3 (failure\\nlocation)\\n\\n-----------------------------------------------------------------\\nWHY THIS STAGE EXISTS\\n-----------------------------------------------------------------\\n\\nThree prosecutors are about to audit this target. Without a shared claim map, they will audit\\nthree different claims: construct validity attacks the paper's own operationalization,\\ninternal validity attacks the study design, and citation network attacks the downstream\\nrestatement. The resulting critique reads as incoherent because each stage was aiming at a\\ndifferent object.\\n\\nThis stage produces the single claim map all three receive. It also does the thing that most\\noften separates a challenge that lands from one that gets waved off: it locates WHERE the\\ninflation begins, so the critique attacks the layer actually responsible rather than the\\neasiest target.\\n\\nThis stage does NOT evaluate whether the claim is true. It extracts and maps. Judgment belongs\\nto the prosecutors and the human. Resist the pull to start critiquing here. A map contaminated\\nby a verdict is worse than no map because every downstream stage inherits the verdict as a\\npremise.\\n\\n-----------------------------------------------------------------\\nINPUTS\\n-----------------------------------------------------------------\\n\\nTarget document:\\n\\n  [Paste abstract, methods, results, conclusion. For non-academic targets: the full article,\\n  policy text, report, or model response.]\\n\\nDocument type:\\n\\n  [academic paper / review / policy document / journalism / institutional report / clinical\\n  guideline / dataset or statistical claim / model response / other]\\n\\nDownstream uses  -  OPTIONAL, paste if you happen to have them:\\n\\n  [Later papers, assessment reports, press releases, media, policy documents, or AI summaries\\n  describing this source.]\\n\\n  YOU ARE NOT EXPECTED TO SUPPLY THIS. Field 4 searches for downstream use itself. Leave this\\n  blank if you have nothing  -  that is the normal case, not a gap.\\n\\nThe claim that prompted this audit:\\n\\n  [What did you hear or read that made you want to check this? State it as you encountered it,\\n  in the form you encountered it. This is often the INFLATED version, which is exactly why it\\n  goes here: the map's job is partly to determine whether the thing you heard is what the\\n  source actually said.]\\n\\n-----------------------------------------------------------------\\nCOMPACT VOCABULARY\\n-----------------------------------------------------------------\\n\\nThis is the operational copy. shared-primitives.txt records the full rationale and\\nsynchronization history; it is not loaded automatically.\\n\\nVERIFICATION STATE  -  how thoroughly a source has been checked. This is separate from\\nevidence type and from the Field 4 provenance states SUPPLIED / RETRIEVED / RECALLED / NONE\\nFOUND.\\n\\n- LOCATED: source exists and metadata is confirmed; content is unverified.\\n- ABSTRACT-CONFIRMED: abstract supports relevance; methods and results are not verified.\\n- FULL-TEXT-CONFIRMED: full text was read and directly supports the specific claim.\\n- RECEPTION-CONFIRMED: replies, replications, corrections, retractions, citation graphs, or\\n  citation contexts were checked against retrieved sources.\\n- CONTESTED: credible disagreement exists; who is correct remains unresolved.\\n- REBUTTED: later work directly and substantially challenges the source and the challenge was\\n  not evidently answered.\\n- PROVISIONAL: access or retrieval is insufficient, including unverified model memory or\\n  unresolved source leads.\\n\\n- CROSS-SOURCE-CONFIRMED: an ATTRIBUTION relationship was checked by reading BOTH the\\n  downstream text and the audited source  -  plus a successor or alternative source where one\\n  is implicated  -  and comparing what is claimed against what each actually supports. This is\\n  a distinct verification act: not reception checking (how a source fared) and not full-text\\n  checking (what one source says), but whether a downstream text has assigned a claim to a\\n  source that supports it. Use for every MISATTRIBUTED or ATTRIBUTED ELSEWHERE classification\\n  you actually verified.\\n\\nDO NOT INVENT VERIFICATION STATES. The list above is the whole vocabulary. Live runs have\\nproduced \\\"ESTABLISHED FROM SOURCE,\\\" \\\"RECONSTRUCTION FROM SOURCE,\\\" and similar ad-hoc labels.\\nEach reads as authoritative, none is defined anywhere, and a downstream stage cannot tell what\\nwas actually checked. If no state fits what you did, describe it in a sentence rather than\\ncoining a label  -  an undefined state is worse than plain prose.\\n\\nFor a field that is an author reconstruction rather than a retrieval, write \\\"author\\nreconstruction from [source field].\\\" That is a description, not a verification state.\\n\\nRules:\\n\\n1. Never report a verification state above what was actually checked.\\n2. Evidence type and verification state are separate axes; report both.\\n3. FULL-TEXT-CONFIRMED, RECEPTION-CONFIRMED, and CROSS-SOURCE-CONFIRMED answer different\\n   questions and may coexist where each was actually established.\\n4. Field 4 provenance states describe how a downstream item entered the map; verification\\n   states describe what was checked. Do not substitute one axis for the other.\\n\\nCONSTRUCT-SIDE RETRIEVAL GATE  [P1; FAIL-CV-003, FAIL-CV-004]\\n\\nCANONICAL RULE. The compact copies in claim extraction and construct validity,\\nand every local execution copy, must move together.\\n\\nEvery construct-side check prosecutes specifics that can be supplied from\\nmemory - what a scale contains, whether a property is established, whether a\\nbelief is accurate. Do not. Rate each on retrieved source material only.\\n\\nCANONICAL CONSTRUCT PROPERTIES\\n\\nUse these five property names everywhere:\\n\\n  PREVALENCE\\n  FORM\\n  DOMAIN\\n  WRONGNESS\\n  HARM\\n\\nConstruct-property status:\\n\\n  ESTABLISHED-REPORTED\\n    The paper measures or reports the property in fetched text.\\n\\n  ESTABLISHED-CITED\\n    The property is established in cited prior work that you actually checked.\\n\\n  ASSERTED\\n    You fetched where establishment would appear - the introduction and relevant\\n    citations - and establishment is absent.\\n\\n  UNKNOWN\\n    You did not fetch where establishment would appear, such as an abstract-only\\n    or snippet-only run.\\n\\nMAP / PROSECUTOR DIVISION\\n\\nThe claim map deliberately hands off ESTABLISHED-CITED as a coarse retrieval\\nstatus. The construct prosecutor must then classify whether the cited support is\\ncontested or uncontested in the respect the paper requires. Do not duplicate that\\njudgment into the map.\\n\\nOperationalization retrieval basis:\\n\\n  ITEMS-RETRIEVED\\n    The actual items, coding rules, or inclusion criteria were fetched and read.\\n\\n  ITEMS-INFERRED\\n    The assessment is based on the scale's name, family, or a related scale.\\n\\nITEMS-* values state RETRIEVAL BASIS. They are not competing scope outcomes.\\n\\nOperationalization scope result:\\n\\n  coextensive\\n  narrower\\n  broader\\n  UNKNOWN\\n\\nITEMS-RETRIEVED permits coextensive / narrower / broader classification.\\nITEMS-INFERRED requires the resulting scope status UNKNOWN.\\n\\nHARD RULE\\n\\nA construct-side finding may be load-bearing, MAJOR, or FATAL only when it rests\\non ESTABLISHED-REPORTED, ESTABLISHED-CITED, ASSERTED, or ITEMS-RETRIEVED.\\n\\nAnything resting on UNKNOWN or ITEMS-INFERRED receives finding disposition\\nPROVISIONAL, may not be load-bearing, and may not be rated MAJOR or FATAL.\\n\\nState the retrieval basis for every construct-side finding.\\n\\nGRADE-BEFORE-ASSERT  [P2; GUARD-006]\\n\\nCANONICAL RULE. The compact copies in claim extraction and construct validity,\\nand every local execution copy, must move together.\\n\\nBefore rating a belief \\\"wrong,\\\" or rating an accurate version as pathologized,\\ngrade the SPECIFIC belief using this closed vocabulary:\\n\\n  ESTABLISHED-FALSE\\n  GRADE-CONTESTED\\n  FRINGE\\n  ESTABLISHED-ACCURATE\\n\\nA wrongness finding - the paper under-grades its target - fires at strength only\\nwhere a named sub-claim is ESTABLISHED-FALSE.\\n\\nA pathologization finding - the scale penalizes an accurate version - fires at\\nstrength only where the penalized version is ESTABLISHED-ACCURATE.\\n\\nP2 is a STRENGTH GATE, not a severity vocabulary:\\n\\n  STRONG\\n    The relevant pole is established: ESTABLISHED-FALSE for a wrongness finding,\\n    or ESTABLISHED-ACCURATE for a pathologization finding.\\n\\n  WEAK\\n    The specific belief is GRADE-CONTESTED or FRINGE. Severity is capped MINOR\\n    and the finding may not anchor the verdict.\\n\\n  VOID\\n    No specific sub-claim was graded, or retrieval is insufficient to place it\\n    on the spectrum. Severity is NONE and the finding is dropped.\\n\\nApply this symmetrically. Do not assert that the paper's target is settled-wrong,\\nand do not assert that a penalized belief is settled-accurate, without the\\nrequired grade. \\\"The construct is contested\\\" alone is not a finding.\\n\\n-----------------------------------------------------------------\\nOUTPUT  -  THE CLAIM MAP (SIX FIELDS)\\n-----------------------------------------------------------------\\n\\n1. WHAT WAS LITERALLY MEASURED\\n\\nThe actual operationalization. Instrument, data source, population, sample, time period, and\\nunit of analysis. Be concrete and specific: not \\\"gaming performance,\\\" but \\\"character\\nadvancement rate in two MMOs, 2006-2008, among registered players, controlling for hours\\nplayed.\\\"\\n\\nFor non-academic targets: what is the underlying data or observation? A policy document's\\n\\\"outcome\\\" is often an administrative metric; a news article's \\\"study shows\\\" points to a\\nspecific measurement. Name it.\\n\\nIf the source does not clearly state what was measured, say so. That is itself a finding, and\\nit belongs in the map.\\n\\nDEFINITION-OPERATIONALIZATION CHECK  [FAIL-CV-001, FAIL-CV-004]\\n\\nMandatory when a central construct is named. Extract:\\n\\n- the source's explicit definition, quoted;\\n- the actual items, coding rules, or inclusion criteria used to measure it.\\n\\nApply [P1]. Record both:\\n\\n- Operationalization retrieval basis:\\n  ITEMS-RETRIEVED / ITEMS-INFERRED\\n- Operationalization scope result:\\n  coextensive / narrower / broader / UNKNOWN\\n\\nCANONICAL VOCABULARY - local execution copy must match [P1].\\n\\nIf ITEMS-INFERRED, the scope result is UNKNOWN. Record the definition, note that\\nthe items were not retrieved, and DO NOT classify the measure coextensive,\\nnarrower, or broader.\\n\\nInferring a scale's contents from its name, family, or a related scale is barred\\nbecause it manufactures false scope creep.\\n\\nIf ITEMS-RETRIEVED, classify the operationalization as:\\n\\n- coextensive;\\n- narrower; or\\n- broader.\\n\\nIf broader, list the specific out-of-scope items and record:\\n\\n  Definition-operationalization mismatch\\n  Subtype: definitional scope creep\\n\\nMAP CONTENT, not a verdict.\\n\\nCONSTRUCT-ESTABLISHMENT CHECK  [FAIL-CV-002, FAIL-CV-003]\\n\\nMandatory only when the source escalates from a narrow efficacy claim to a\\nNORMATIVE or CAUSAL claim about the construct, such as \\\"this belief is harmful\\\"\\nor \\\"reducing it reduces X.\\\" A paper claiming only \\\"we moved scores on our scale\\nin these samples\\\" does not trigger this check.\\n\\nWhen triggered, record each canonical property with a construct-property status\\nfrom [P1]:\\n\\n- PREVALENCE:\\n  held at non-trivial rates in the target population?\\n- FORM:\\n  coherent strong endorsement or weak, scattered endorsement?\\n- DOMAIN:\\n  which traits or contexts; absolute or partial contribution?\\n- WRONGNESS:\\n  which specific sub-claims are false, accurate, contested, or fringe, and to\\n  what degree? Apply [P2].\\n- HARM:\\n  does holding the construct produce the claimed harm?\\n\\nWrite ASSERTED only if you fetched the introduction and relevant citations and\\nfound establishment absent. Otherwise write UNKNOWN.\\n\\nHARM for a well-studied construct is often established by reference and\\ninvisible in an abstract; never write ASSERTED without checking the cited\\nliterature.\\n\\nThe map records ESTABLISHED-CITED coarsely. Whether that citation is contested\\nor uncontested in the respect the paper requires is deliberately left to the\\nconstruct prosecutor.\\n\\nMAP CONTENT, not a verdict.\\n\\nPUBLICATION STATUS:\\n\\nDoes a corrigendum, correction, retraction, or expression of concern exist for this source?\\n\\n  [yes  -  cite it / no / not checked]\\n\\nFactual publication record only. Do NOT list critiques, replies, or reception here. That\\nbelongs in the counter-audit's reception gate. Listing it upstream primes the prosecutors\\ntoward the source's controversy rather than its text.\\n\\n2. STRONGEST CLAIM THE SOURCE ITSELF MAKES\\n\\nQuote or closely paraphrase the source's own strongest assertion, PRESERVING ITS OWN HEDGING.\\nIf it says \\\"suggests,\\\" keep \\\"suggests.\\\" If it says \\\"likely,\\\" keep \\\"likely.\\\" Note where this\\nclaim appears - abstract, conclusion, press quote - since abstracts routinely overstate the\\nbody.\\n\\nSources frequently hedge properly in the methods and overstate in the abstract. Capture both\\nif they differ.\\n\\n3. WEAKER DEFENSIBLE CLAIM THE EVIDENCE ACTUALLY SUPPORTS\\n\\nThe narrower statement the measurement can carry. This is a reconstruction, not a quotation.\\nState what the data would support with appropriate scope limits: population sampled,\\nconditions tested, effect size, and level of analysis.\\n\\nITEM TRACKING  [FAIL-CV-001]\\n\\nWhen a definition-operationalization mismatch exists AND the items are ITEMS-RETRIEVED, this\\nfield must track the ACTUAL ITEMS rather than the stated definition.\\n\\nIf the items are ITEMS-INFERRED, track the stated definition and write that the item-level\\ndefensible claim is UNKNOWN pending item retrieval.\\n\\nThis field is the reference point for the entire audit. The gap between #2 and #3 is the\\npaper-level overclaim; the gap between #3 and #4 is the downstream inflation. Both matter, and\\nthey are different problems with different remedies.\\n\\n4. BROADER CLAIM ATTACHED DOWNSTREAM\\n\\nWhat later citations, assessment reports, press releases, media, policy, or model summaries\\nassert on the basis of this source. Quote where possible.\\n\\nLabel each downstream restatement with its layer (see primitives Section 3):\\n\\n- citing literature\\n- PR / media\\n- policy\\n- model / retrieval\\n\\nTHIS FIELD IS ACTIVE, NOT PASSIVE.\\n\\nDo not wait for downstream material to be supplied. A user pasting a paper will not have the\\nassessment report, the press release, or the coverage. Finding out whether the claim was\\ninflated is part of the job, not a precondition for doing it.\\n\\nIF YOU HAVE RETRIEVAL:\\n\\nSearch for downstream restatements before writing this field. Look for the source cited in\\nlater literature, assessment o
