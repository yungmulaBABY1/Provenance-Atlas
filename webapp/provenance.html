n the number\\n  tested?\\n\\nRequired table:\\n\\n|Pre-registration status|Analysis match|Outcomes tested|Outcomes reported|Post-hoc subgroups|P-hacking risk|\\n|-----------------------|--------------|---------------|-----------------|------------------|--------------|\\n\\nP-hacking risk options: Low / Moderate / High / Severe / Cannot assess\\n\\n-----\\n\\nSECTION C: EFFECT SIZE AND STATISTICAL POWER\\n\\n1. What is the reported effect size? (r, d, OR, RR, eta2, etc.)\\n2. How does this effect size compare to:\\n- The field's typical effect sizes for similar constructs?\\n- The minimum effect size that would be practically or clinically meaningful?\\n- Later corrected meta-analyses or larger independent replications?\\n3. What was the sample size?\\n4. What statistical power did the study have to detect the reported effect at the reported\\n   size?\\n- Was the sample size determined in advance by power calculation?\\n- If not, at what power level was the study operating?\\n5. Winner's curse assessment: studies that barely achieve p \\u003c .05 in underpowered designs\\n   systematically overestimate effect sizes. Is the reported effect size likely inflated?\\n\\nRequired table:\\n\\n|Reported effect size|Field typical range|Corrected meta-analysis estimate|Sample size|Estimated power|Winner's curse risk|\\n|--------------------|-------------------|--------------------------------|-----------|---------------|-------------------|\\n\\nWinner's curse risk options: Low / Moderate / High / Cannot assess\\n\\n-----\\n\\nSECTION D: HARKING (HYPOTHESIZING AFTER RESULTS ARE KNOWN)\\n\\n1. Is the central finding presented as confirmatory (testing a pre-specified hypothesis) or\\n   exploratory?\\n2. Does the introduction describe a specific directional hypothesis that matches the result?\\n- If yes: was this hypothesis pre-registered before data collection?\\n- If no: was the hypothesis direction specified in any pre-study documentation?\\n3. Are there signs of post-hoc hypothesis specification?\\n- Vague or multiple hypotheses in the introduction that could accommodate various outcomes?\\n- Subgroup findings presented as primary results without pre-specification?\\n- Effect found in unexpected direction presented as theoretically predicted?\\n4. Does the discussion present exploratory findings as if they were confirmatory?\\n\\nRequired table:\\n\\n|Hypothesis type|Pre-registered?|HARKing indicators|HARKing risk|\\n|---------------|---------------|------------------|------------|\\n\\nHARKing risk options: Low / Moderate / High / Cannot assess\\n\\n-----\\n\\nSECTION D2: FORKING PATHS / ANALYTICAL-CHOICE MULTIVERSE\\n\\nP-hacking (Section B) and HARKing (Section D) ask whether the authors exploited flexibility.\\nThis section asks a different question: independent of intent, HOW SENSITIVE is the reported\\nresult to defensible analytical choices? A result that appears only under one specific\\npipeline, and vanishes or reverses under equally reasonable alternatives, is fragile\\nregardless of whether the choice was made in good faith.\\n\\nDo NOT re-evaluate measurement quality or confounding here; the construct-validity audit\\nhandles that. Do NOT re-evaluate downstream citation use here; the citation-network audit\\nhandles that. This section is strictly about the sensitivity of THIS finding to THIS study's\\nanalytical decision points.\\n\\n1. Map the analytical decision points actually made in the study:\\n   - Inclusion and exclusion criteria\\n   - Variable operationalization and coding thresholds\\n   - Model choice, covariate set, transformation, and outlier handling\\n   - Which comparison or contrast was treated as primary\\n   - Handling of missing or contradictory data For each, note whether it was pre-specified or\\n     appears to have emerged during analysis. Cross-reference Section B.\\n\\n2. For each major decision point, generate the plausible alternative choices a competent\\n   analyst could have defensibly made instead.\\n\\n3. Assess result sensitivity under those alternatives:\\n   - Would the headline effect HOLD, WEAKEN, DISAPPEAR, or REVERSE?\\n   - Is the result robust across most defensible branches, or does it live in one narrow\\n     corner of the analytical multiverse?\\n   - Where a multiverse or specification-curve analysis exists, report what it showed. Where\\n     none exists, state that robustness is UNTESTED, not confirmed.\\n\\n4. Distinguish the cases explicitly:\\n   - ROBUST: the effect survives most reasonable specifications; analytical fragility is not\\n     the problem.\\n   - MIXED: the effect survives some defensible specifications but changes materially in\\n     magnitude, precision, subgroup, or interpretation.\\n   - FRAGILE: the effect depends on a specific pipeline and weakens, disappears, or reverses\\n     under defensible alternatives.\\n   - UNTESTED: alternatives have not been run and the available reporting cannot establish\\n     robustness.\\n   - CANNOT ASSESS: the analytical pipeline is reported too incompletely to map.\\n\\nRequired table:\\n\\n| Decision point | Choice made | Pre-specified? | Defensible alternatives | Result under alternatives (holds / weakens / disappears / reverses) | Fragility |\\n|---|---|---|---|---|---|\\n\\nFragility options: Robust / Mixed / Fragile / Untested / Cannot assess\\n\\nIntegration rule: FRAGILE results compound with p-hacking and HARKing. If a result is fragile,\\nshows p-hacking indicators, and was not pre-registered, do not count these as three\\nindependent minor findings. Consolidate the overlap and evaluate the combined inference: the\\nreported result may be specific to the selected pipeline rather than a stable effect.\\n\\n-----\\n\\nSECTION E: SELECTIVE REPORTING\\n\\n1. Are all pre-registered outcomes reported?\\n- If not: which outcomes are missing?\\n- Is there a plausible explanation for their omission?\\n2. Are there signs of selective subgroup reporting?\\n- Is the reported effect found in the full sample or only in a subgroup?\\n- Was the subgroup pre-specified?\\n3. Are there signs of selective time-point reporting?\\n- Is the reported effect found at all time points or only at one?\\n- Was the reported time point pre-specified?\\n4. Publication bias assessment:\\n- Is this a published positive result in a high-impact journal?\\n- Are there known null or negative replication attempts?\\n- Is the effect size unusually large compared to later replications (consistent with\\n  publication bias)?\\n\\nRequired table:\\n\\n|Outcomes registered|Outcomes reported|Missing outcomes|Subgroup selectivity|Publication bias indicators|\\n|-------------------|-----------------|----------------|--------------------|---------------------------|\\n\\n-----\\n\\nSECTION F: REPLICATION STATUS\\n\\n1. Has the finding been directly replicated?\\n- How many direct replication attempts exist?\\n- What proportion succeeded?\\n- Were the replications pre-registered and adequately powered?\\n- Were the replications conducted by independent labs?\\n2. Has the finding been conceptually replicated?\\n- Do meta-analyses support the effect?\\n- Are meta-analyses author-run or independent?\\n- Do meta-analyses show evidence of publication bias (funnel plot asymmetry, p-curve skew)?\\n3. Effect size trajectory:\\n- Has the reported effect size shrunk across successive replications?\\n- What is the current best estimate of the true effect size?\\n- Does the current best estimate support the downstream claims built on the original finding?\\n\\nRequired table:\\n\\n| Direct replications | Success rate | Pre-registered reps | Independent reps | Meta-analytic estimate | Effect shrinkage | Verification state |\\n|---|---|---|---|---|---|---|\\n\\n-----\\n\\nSECTION G: DATA AND CODE AVAILABILITY\\n\\n1. Were the data made publicly available?\\n2. Was the analysis code made publicly available?\\n3. Has anyone attempted a reanalysis of the original data?\\n- If yes: what did the reanalysis find?\\n4. Are there known data irregularities, anomalies, or concerns?\\n- Has the paper been flagged on PubPeer or by post-publication peer review?\\n- Have any authors issued corrections or expressions of concern?\\n\\nRequired table:\\n\\n| Data available | Code available | Reanalysis attempted | Reanalysis result | PubPeer flags | Corrections issued | Verification state |\\n|---|---|---|---|---|---|---|\\n\\n-----\\n\\nSECTION H: SUMMARY TABLE  -  INTERNAL VALIDITY\\n\\nComplete this table:\\n\\n|Dimension               |Assessment|Severity|Notes|\\n|------------------------|----------|--------|-----|\\n|Data generation quality |          |        |     |\\n|Selection bias          |          |        |     |\\n|Missingness handling    |          |        |     |\\n|Incentive structure risk|          |        |     |\\n|Pre-registration        |          |        |     |\\n|Analysis plan compliance|          |        |     |\\n|P-hacking risk          |          |        |     |\\n|Effect size plausibility|          |        |     |\\n|Statistical power       |          |        |     |\\n|Winner's curse risk     |          |        |     |\\n|HARKing risk            |          |        |     |\\n|Forking-paths fragility |          |        |     |\\n|Selective reporting     |          |        |     |\\n|Replication success rate|          |        |     |\\n|Effect size trajectory  |          |        |     |\\n|Data/code availability  |          |        |     |\\n|Post-publication flags  |          |        |     |\\n\\nSeverity options: None / Minor / Moderate / Major / Fatal / Cannot assess\\n\\n-----\\n\\nSECTION H2: THE CONCEDE TEST\\n\\nRun this on every proposed finding before choosing the Section I verdict or rating the finding\\nin the final table.\\n\\nVERDICT-ELIGIBILITY PRE-CHECK  [IV-P1; FAIL-IV-001]\\n\\nBefore a finding can affect Section I, record its canonical verification state and, where it\\nasserts a coding, model, reanalysis, replication, data-generation, or other technical outcome,\\nits TECHNICAL OUTCOME STATUS under [IV-P1].\\n\\nThe Concede Test remains conditional: classify what follows IF the finding is true. Then\\nseparately decide whether the finding is ELIGIBLE to drive the current verdict. Do not convert\\nconditional DEFEATS into NARROWS merely because the evidence remains pending.\\n\\nFor each finding, ask:\\n\\nIF THIS FINDING WERE FULLY CONCEDED  -  granted entirely, with no argument  -  WOULD THE CLAIM\\nUNDER AUDIT STILL STAND?\\n\\n- SURVIVES: the claim still holds. This is a limitation, not a defeater. Report it, but it may\\n  not be rated MAJOR or FATAL and may not anchor the verdict.\\n- NARROWS: the claim survives only in smaller scope, such as a smaller population, weaker or\\n  less stable effect, narrower conditions, or reduced downstream use. State the surviving\\n  claim explicitly.\\n- DEFEATS: the audited claim does not follow or the foundational finding is not sufficiently\\n  supported. This is load-bearing.\\n\\nCreate a table:\\n\\n| Finding | Verification state | Technical outcome status | Conditional concede result: SURVIVES / NARROWS / DEFEATS | Verdict eligibility: ELIGIBLE / PENDING VERIFICATION | Eligibility basis | Surviving claim if NARROWS |\\n|---|---|---|---|---|---|---|\\n\\n- Every PENDING VERIFICATION row must state what exact retrieval, code run, reanalysis,\\n  correction, or source access would make it ELIGIBLE.\\n- A conditional DEFEATS / PENDING VERIFICATION row is not an eligible DEFEATS finding and may\\n  not drive the grade.\\n- Run the existing scope-loss assessment on NARROWS as a statement of logical effect.\\n  Eligibility still controls whether that narrowing enters the verdict.\\n\\nDo not turn a raw count of overlapping limitations into an invalidity verdict. Consolidate\\nduplicated findings and judge what scope the claim actually retains.\\n\\nSCOPE-LOSS ASSESSMENT  -  REQUIRED FOR EVERY NARROWS RESULT\\n\\n- INCIDENTAL NARROWING: precision or boundary conditions change, but the finding remains\\n  substantially the same in population, direction, magnitude class, and practical use. This\\n  ordinarily supports verdict B rather than C.\\n- MATERIAL NARROWING: the finding survives only as a meaningfully smaller, weaker, less\\n  stable, or less general result. The stronger use fails, but a useful narrower finding\\n  remains. This ordinarily supports verdict C.\\n- NEAR-DEFEAT NARROWING: only a trivial, tautological, or practically different remainder\\n  survives. Do not use NARROWS to avoid DEFEATS. Reclassify as DEFEATS when the remainder no\\n  longer performs the work for which the finding is used.\\n\\nFor each NARROWS result, add:\\n\\n| Finding | Scope-loss level | Original claim | Surviving claim | What practical or inferential work is lost? |\\n|---|---|---|---|---|\\n\\nVERDICT MAPPING\\n\\n- No ELIGIBLE DEFEATS and no ELIGIBLE MATERIAL NARROWING: use A or B according to the remaining\\n  eligible evidence, unless inadequate coverage requires F.\\n- One or more ELIGIBLE MATERIAL NARROWING findings and no ELIGIBLE DEFEATS: ordinarily use C.\\n- D requires multiple ELIGIBLE, adequately verified vulnerabilities that compound, or an\\n  ELIGIBLE near-defeat that remains unresolved at the claim level. Pending allegations do not\\n  produce D by accumulation.\\n- E requires at least one ELIGIBLE DEFEATS finding, or an ELIGIBLE verified combination\\n  establishing that the result is likely an analytic or data artifact.\\n- Use F when verification gaps prevent reliable assessment of load-bearing internal-validity\\n  questions.\\n\\n-----\\n\\nSECTION I: INTERNAL VALIDITY VERDICT\\n\\nDo not return one letter when a DEFEATS finding is present. Output a split claim-space object:\\n\\n- Claim under audit: VALID / USEFUL-FOR-NARROWER / INVALID / WITHHELD \\u2014 CANNOT ASSESS\\n- Eligible DEFEATS finding(s), if any:\\n- Eligible MATERIAL NARROWING finding(s), if any:\\n- Findings pending verification:\\n  [finding | conditional concede result | why pending | what would resolve it]\\n- Pending-evidence effect on assessability: NONE / LIMITED / REQUIRES F\\n- Surviving residual: [the exact narrower empirical claim left standing] OR \\\"none\\\" OR\\n  \\\"cannot determine pending verification\\\"\\n- Internal-validity grade: A / B / C / D / E / F\\n\\nSection I may list a finding under \\\"Eligible DEFEATS finding(s)\\\" only when its Section H2 row\\nsays both conditional concede result DEFEATS and verdict eligibility ELIGIBLE. Copy PENDING\\nVERIFICATION findings only to the pending line. Do not silently omit them and do not count\\nthem toward C, D, or E.\\n\\nDerive the grade from eligible evidence. If the unresolved technical questions are themselves\\nnecessary to determine whether the finding is real, use F rather than converting uncertainty\\ninto either exoneration or invalidation.\\n\\n\\\"None\\\" is a REQUIRED, reachable output. A failed or artifact-driven finding may leave no\\nusable residual. Do not manufacture one merely because the format asks for narrowing.\\n\\nInternal-validity grades:\\n\\nA. Strong - pre-registered, adequately powered, independently replicated, effect stable, data\\navailable, and data generation sound. B. Acceptable - minor design limitations, plausible\\neffect size, and no load-bearing instability. C. Weak - underpowered, unreplicated, possibly\\ninflated, or affected by moderate design or data-generation concerns. D. Suspect - multiple\\ninternal-validity problems, serious fragility, contested replication, or compromised data\\ngeneration. E. Invalid - adequately verified replication, analysis, or data-generation failure\\nDEFEATS the foundational finding. F. Cannot assess - insufficient reporting or retrieval.\\n\\nDerive every line from the Concede Test, [IV-P1] eligibility, and verification state of the\\nload-bearing evidence. Do not average across dimensions. Do not let pending evidence create\\nINVALID or an adverse grade trigger.\\n\\nThen answer:\\n\\n1. Is the foundational finding likely to be real?\\n2. If it is real, is its magnitude sufficient to support the downstream claim?\\n3. What is the best current estimate of the true effect size?\\n4. What pre-registration and replication evidence would upgrade the grade?\\n5. What decisive test has not been run?\\n6. For AI-assisted analysis, did the adversarial check surface failures the original analysis\\n   missed?\\n7. Is the finding fragile to defensible analytical choices?\\n8. Does any usable residual remain? If yes, state it exactly. If no, write \\\"surviving\\n   residual: none.\\\"\\n\\nSECTION J: INTEGRATION WITH CONSTRUCT VALIDITY AUDIT\\n\\nBegin by repeating the run-header receipt exactly:\\n\\n    SIBLING-PROSECUTOR INPUT: [NONE / FORMALLY SUPPLIED \\u2014 identifier]\\n    INDEPENDENCE STATUS: [INDEPENDENT / INTEGRATED-NONINDEPENDENT]\\n\\nIF NONE:\\n\\nOpen with this exact statement:\\n\\n    No construct-validity output was formally supplied to this run. The following reasons only\\n    from general construct concerns and does not adopt any specific sibling finding or verdict\\n    visible elsewhere in session context.\\n\\nReason only in general and conditional terms. Permitted form:\\n\\n    Even if the outcome measure's construct validity is accepted, [eligible internal-validity\\n    finding] would still [narrow/defeat] [claim]. If an independently established\\n    construct-validity failure were later added, it would compound with this result in\\n    [specified way].\\n\\nDo not state or imply that a specific construct mismatch, proxy failure, severity, or sibling\\nverdict has already been established.\\n\\nIF FORMALLY SUPPLIED:\\n\\n- Name the supplied file or stable identifier.\\n- Cite the specific imported finding IDs as SUPPLIED SIBLING INPUT.\\n- Report each imported finding's verification state and [IV-P1] eligibility.\\n- Integrate only what the supplied evidence licenses.\\n- Preserve the INTEGRATED-NONINDEPENDENT label.\\n\\nUse one of these two decisive-test forms:\\n\\nNO SIBLING INPUT:\\n\\n    The foundational finding [is / is not / cannot yet be determined to be] likely real based\\n    on the eligible internal-validity evidence. Even if the construct interpretation is\\n    accepted, [internal consequence]. Any specific construct-validity compounding claim remains\\n    outside this independent run.\\n\\nFORMALLY SUPPLIED SIBLING INPUT:\\n\\n    The foundational finding [is / is not / cannot yet be determined to be] likely real based\\n    on the eligible internal-validity evidence. The formally supplied construct finding [ID] is\\n    [eligible / pending] and [does / does not yet] establish [bounded construct consequence].\\n    Together, these support [bounded integrated conclusion].\\n\\nDo not force a does/does-not construct judgment when no construct output was formally supplied.\\n\\n-----\\n\\nSECTION K: ONE-PARAGRAPH SUMMARY\\n\\nWrite one paragraph summarizing:\\n\\n- Whether the foundational finding is likely real\\n- The current best estimate of the true effect size\\n- The replication status\\n- The data generation quality\\n- The claim-under-audit status (VALID / USEFUL-FOR-NARROWER / INVALID)\\n- The surviving residual, or none\\n- The internal-validity grade\\n- The forking-paths robustness result\\n- The load-bearing Concede Test result\\n- How internal-validity failures compound or modify the construct-validity assessment\\n- What the decisive test would look like\\n\\nThis paragraph should be direct, evidence-based, and free of unnecessary reassurance language.\\nState the verdict plainly. Do not hedge unless the evidence genuinely requires it. If the\\nfinding is unlikely to be real, say so. If multiple failure modes compound, name the\\ncompounding explicitly rather than softening into a general \\\"limitations\\\" framing.\\n\\n-----\\n\\nREMINDER\\n\\nThis prompt audits the finding itself  -  whether the result is real and stable  -  before\\nasking what it proves.\\n\\nA finding that replicates cleanly but is overclaimed has one problem. A finding built on\\nflawed data has a second problem. A finding that doesn't replicate has a third problem. A\\nfinding that doesn't replicate AND is overclaimed AND is built on flawed data is triply\\ninvalid.\\n\\nThe toolkit now covers all three.\\n\\nYou may begin with suspicion. You may not end with suspicion.\\n\\nStart wherever the anomaly appears. Finish with receipts.\\n\\n-----\\n\\nFINAL SECTION: STANDARDIZED FINDING TABLE\\n\\nThis summarizes the findings already produced above. It does not replace the detailed\\nsections. It is the inspectable layer read by the human adjudicator and the counter-audit.\\n\\nYou are a one-directional prosecutor, and that is correct. An aggressive prosecutor still\\nproduces receipts. The two falsifiability fields are mandatory: naming what would undercut a\\nfinding does not weaken it; it makes it checkable.\\n\\nOne row per finding:\\n\\n| Field | Entry |\\n|---|---|\\n| Finding | One sentence |\\n| Target claim | Claim map field 6 |\\n| What was measured | Actual data, design, and analytical operation |\\n| What was claimed | Empirical finding or downstream assertion being supported |\\n| Failure mode | Internal-validity taxonomy used above |\\n| Severity | none / minor / moderate / major / fatal-for-strong-claim |\\n| Concede test | SURVIVES / NARROWS / DEFEATS |\\n| Scope loss if NARROWS | incidental / material / near-defeat, plus surviving claim |\\n| Evidence | Section, table, figure, passage, preregistration, code, or data |\\n| Evidence type | primary study / replication / meta-analysis / methodological critique / policy document / practitioner / journalism / commentary / theoretical / author inference |\\n| Verification state | From the compact vocabulary |\\n| Possible innocent explanation | MANDATORY  -  strongest non-damning reading; if none, write \\\"none identified\\\" |\\n| What would weaken this | MANDATORY  -  specific evidence that would undercut it |\\n| Failure location | PAPER / CITATION / PR-MEDIA / MODEL-RETRIEVAL / MIXED |\\n| Status | confirmed / contested / provisional |\\n\\nRULES\\n\\n1. A finding missing either mandatory falsifiability field is not inspectable and may not be\\n   rated MAJOR or FATAL.\\n2. Severity must agree with verification state. A PROVISIONAL finding cannot be MAJOR or\\n   FATAL.\\n3. A SURVIVES finding cannot be MAJOR or FATAL and may not anchor the verdict.\\n4. A NARROWS finding must state the surviving claim and scope-loss level. An incidental\\n   narrowing does not by itself require verdict C.\\n5. Target claim must match field 6 of the shared Claim Map. Use MAP GAP rather than silently\\n   substituting another claim.\\n6. A replication or post-publication finding must preserve its verification state. A\\n   PROVISIONAL failed replication may not create verdict E.\\n7. If no findings of consequence were produced, say so plainly and submit an empty table with\\n   a one-line statement. A prosecutor that never returns \\\"nothing of consequence here\\\" is not\\n   measuring anything.\\n\"},\"3-counter-audit\":{\"bytes\":42287,\"lines\":916,\"path\":\"prompts/research-analysis/3-counter-audit.txt\",\"sha256\":\"291f2339992e\",\"text\":\"OPPOSITIONAL CITATION & NEGLECTED EVIDENCE COUNTER-AUDIT PROMPT (v3)\\n\\n-----------------------------------------------------------------\\nINSTRUMENT PREFLIGHT \\u2014 MANDATORY FOR FORMAL / LOGGED RUNS   [TOOL-004]\\n-----------------------------------------------------------------\\n\\nThis prompt is part of the audit instrument. Establish the exact instrument version BEFORE\\nsubstantive retrieval, extraction, analysis, or verdict work begins.\\n\\nA successful fetch indicator, correct repository path, branch label, plausible line count,\\nmatching rendered metadata, or internally self-consistent page does NOT by itself establish\\nthat the intended/current artifact was retrieved. A mutable remote reference can return a\\nhistorical representation that is internally self-consistent in every visible field.\\n\\nPROMPT IDENTITY MARKERS\\n\\n  - OPPOSITIONAL CITATION & NEGLECTED EVIDENCE COUNTER-AUDIT PROMPT (v3)\\n\\nThese markers confirm the prompt family / expected structural features. They do NOT by\\nthemselves establish version currency: an older version may share the same title or markers.\\n\\n1. RECORD THE INSTRUMENT ACTUALLY IN CONTEXT.\\n\\n   Record, where available:\\n\\n   - canonical prompt path or supplied filename;\\n   - retrieval form: PASTED / ATTACHED / IMMUTABLE REMOTE / MUTABLE REMOTE;\\n   - requested branch or ref;\\n   - intended immutable commit/ref, if the run claims a repository version;\\n   - resolved commit SHA;\\n   - resolved blob/content hash, or a locally computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\n\\nPurpose: You are now running an adversarial counter-audit against the outputs of one or more\\nprosecuting stages (construct-validity, internal-validity, citation-network) that examined the\\nsame source and claim map. The primary object of this counter-audit is the PROSECUTION ITSELF\\n- whether it attacked the right claim, engaged the source's own defenses, and survived contact\\nwith the strongest opposing evidence. If a synthesized thesis paragraph or short paper draft\\nalready exists (see Input 5), this stage ALSO checks that draft's fidelity to the vetted\\nprosecutor findings, as a secondary, optional pass - see the FIDELITY CHECK block after\\nSection J.\\n\\nThe goal is not to find more evidence for the audit. The goal is to find the strongest\\nevidence that opposes, complicates, narrows, weakens, or potentially overturns the audit.\\n\\nThis prompt is designed to prevent motivated reasoning. It forces the user to ask:\\n\\n- What did I miss?\\n- What does the other side have?\\n- What evidence would change my conclusion?\\n- Did the field actually engage its critics?\\n- Did I overstate the claim?\\n- Are there adjacent fields with better evidence or better methods?\\n\\nRun this audit rigorously and without softening. Prioritize direct, high-quality opposition\\nover weak or tangential material. Do not produce flat lists  -  rank findings by how much they\\nthreaten the original claim.\\n\\n-----\\n\\nSTAGE-ROLE NOTE (READ FIRST)\\n\\nThis counter-audit is the BALANCING stage. The prosecuting stages that precede it\\n(construct-validity, internal-validity, citation-network audits) are deliberately\\none-directional  -  that is their job, and they are corrected downstream by this stage. This\\nstage is different: nothing downstream corrects it. Whatever tilt this counter-audit carries\\npasses uncorrected into the final verdict.\\n\\nTherefore this stage is held to a higher standard of internal symmetry than the prosecuting\\nstages. It must scrutinize the sources IT introduces as hard as the sources it defends\\nagainst, because it is the terminal balancer and its errors are the last word. The single most\\ncommon failure of this stage is importing a NEW oppositional source and promoting it to \\\"most\\nthreatening\\\" without checking whether that source itself survived rebuttal  -  committing, one\\nlevel up, the exact citation-laundering the tool exists to catch.\\n\\n-----\\n\\nANTI-HEDGING RULE\\n\\nDo not default to false balance. If the opposition is weak, say so. If it is strong, say so.\\nDo not soften the verdict to appear thorough or even-handed. A prompt that finds strong\\nopposition and calls it \\\"mixed\\\" is a failure. A prompt that finds weak opposition and calls\\nthe audit \\\"strengthened\\\" is a success  -  but only if the opposition was genuinely tested.\\n\\n-----\\n\\nINPUTS\\n\\nProvide the following:\\n\\n0. Claim map (from the Claim Extraction / Inflation Map stage): [PASTE CLAIM MAP]\\n\\n   This tells you which claim the prosecutors were supposed to audit. You need it to answer\\n   Section G2 below. If no claim map was supplied, note that G2 will be PROVISIONAL  -\\n   without the map you cannot reliably tell whether the prosecutors aimed at the right layer,\\n   only whether their findings look sound in isolation.\\n\\n1. Original foundational paper(s): [Paste citation, abstract, methods, or key excerpts.]\\n2. Citation-network audit output: [Paste the prior audit, including cartel-risk scorecard if\\n   available.]\\n3. Construct-validity audit output: [Paste if available.]\\n4. Internal-validity audit output: [Paste if available.] If no internal-validity audit was\\n   run, state that explicitly - do not silently proceed as though it does not exist. Its\\n   absence must be visible in the final verdict.\\n\\n   [FAIL-CA-003]\\n\\n5. (OPTIONAL) Current thesis paragraph or short paper draft, if one already exists: [Paste if\\n   available.] Supplying this triggers the FIDELITY CHECK block after Section J. Leaving it\\n   blank is normal and expected for most runs - most counter-audits will not have a synthesized\\n   draft yet, since Stage 4 synthesis is not built. This input does NOT feed G2, E0, or any\\n   other primary section.\\n6. Central claim being audited: [State the claim in one sentence.]\\n7. Current audit verdict: [Example: fatal construct-validity failure, citation-laundering\\n   network, weak proxy, etc.]\\n8. Known citation hub / founding cluster: [List papers, authors, reviews, institutions, or\\n   recurring citation nodes.]\\n9. Adjacent fields already suspected of being ignored: [List if known.]\\n\\n-----\\n\\nDATA-HONESTY RULE\\n\\nFor every paper, study, report, or source listed, state how it was found:\\n\\n- cites foundational paper directly\\n- cites citation hub directly\\n- cited by foundational paper\\n- cited by citation hub\\n- appeared in \\\"related papers\\\"\\n- found through keyword search\\n- found through adjacent-field search\\n- supplied by user\\n- model memory\\n- unresolved source lead\\n\\nIf you cannot verify a citation relationship, label it: \\\"Unverified citation relationship.\\\"\\n\\nDo not invent citation links. Do not claim that a paper cites another paper unless the\\ncitation relationship is verified. Do not treat a paper as oppositional merely because it is\\nthematically different. Do not count weak, tangential, or speculative criticism as strong\\nopposition. Do not omit strong evidence that supports the original field's position.\\n\\n-----\\n\\nSOURCE-RECEPTION GATE (APPLIES TO EVERY LOAD-BEARING SOURCE)\\n\\nBefore ANY source  -  whether it opposes the paper or supports it  -  is rated \\\"strong,\\\"\\n\\\"severe,\\\" \\\"potentially decisive,\\\" or is listed among the most-threatening findings or used to\\nmove the verdict, its OWN citation reception must be checked and stated:\\n\\n- Was it replicated, rebutted, contested, corrected, retracted, or discredited?\\n- Did it survive that reception, or was it substantially undermined?\\n- What is its CURRENT standing (strong / weakened / contested / discredited)?\\n\\nRules for the gate:\\n\\n1. CAP: A source whose reception has NOT been checked cannot anchor the verdict. Until\\n   checked, it is capped at \\\"contested / needs verification\\\" no matter how strong its claims\\n   appear. An unchecked source may not be your #1 threatening finding.\\n\\n2. SYMMETRY: This gate fires on sources SUPPORTING the original claim exactly as much as on\\n   sources OPPOSING it. A support source with a known correction (e.g., a later corrigendum)\\n   gets the same downgrade a rebutted critique does. Do not gate one side and wave through the\\n   other.\\n\\n3. SELF-APPLICATION: This gate applies to sources THIS counter-audit itself introduces (new\\n   critiques, neglected papers, adjacent-field evidence), not only to sources inherited from\\n   the prior audit. The moment you introduce a source and rate it strong, you have made it\\n   load-bearing, and it must pass the gate.\\n\\n4. ONE LEVEL, THEN STOP: The reception check goes one level deep. Check whether a load-bearing\\n   source survived its DIRECT rebuttals/responses. Do NOT recurse into whether those rebuttals\\n   survived their own rebuttals  -  UNLESS one of those rebuttals itself becomes load-bearing\\n   for your verdict, in which case it too gets a one-level check. Terminate there.\\n\\n5. VERIFICATION STATE (replaces simple memory-vs-retrieval labeling)\\n\\nEvery load-bearing source carries a verification state. This is a SEPARATE AXIS from evidence\\nquality (0-4) and from evidence type  -  a peer-reviewed study can be high evidence-quality\\nand ABSTRACT-CONFIRMED only. Report both.\\n\\n  LOCATED ............... exists, metadata confirmed, content unverified ABSTRACT-CONFIRMED\\n  .... abstract supports relevance; method NOT verified FULL-TEXT-CONFIRMED ... full text\\n  read, directly supports the specific claim RECEPTION-CONFIRMED ... replies, replications,\\n  corrections, citation contexts checked against real retrieval CONTESTED .............\\n  reception check found credible disagreement; who is correct is NOT established REBUTTED\\n  .............. later work directly challenges it and the challenge was not evidently\\n  answered PROVISIONAL ........... insufficient access, OR asserted from model memory without\\n  retrieval. A REAL STATE  -  use it rather than guessing upward.\\n\\n- CROSS-SOURCE-CONFIRMED: an ATTRIBUTION relationship was checked by reading BOTH the\\n  downstream text and the audited source  -  plus a successor or alternative source where one\\n  is implicated  -  and comparing what is claimed against what each actually supports. This is\\n  a distinct verification act: not reception checking (how a source fared) and not full-text\\n  checking (what one source says), but whether a downstream text has assigned a claim to a\\n  source that supports it. Use for every MISATTRIBUTED or ATTRIBUTED ELSEWHERE classification\\n  you actually verified.\\n\\nDO NOT INVENT VERIFICATION STATES. The list above is the whole vocabulary. Live runs have\\nproduced \\\"ESTABLISHED FROM SOURCE,\\\" \\\"RECONSTRUCTION FROM SOURCE,\\\" and similar ad-hoc labels.\\nEach reads as authoritative, none is defined anywhere, and a downstream stage cannot tell what\\nwas actually checked. If no state fits what you did, describe it in a sentence rather than\\ncoining a label  -  an undefined state is worse than plain prose.\\n\\nFor a field that is an author reconstruction rather than a retrieval, write \\\"author\\nreconstruction from [source field].\\\" That is a description, not a verification state.\\n\\nRULES a. Never report a state above what was actually done. A reception query establishes\\nRECEPTION-CONFIRMED, not FULL-TEXT-CONFIRMED. b. RECEPTION-CONFIRMED and FULL-TEXT-CONFIRMED\\nare different questions (how a source fared vs. what it says). A source can hold both; report\\nboth when known. Reception can often be confirmed even when full text is paywalled  - that is\\nthe useful case, not a failure. c. A PROVISIONAL source may not anchor the verdict and may not\\nbe a top-3 threatening finding. Cap it and say so. d. Memory-based assessments fail in a\\nPREDICTABLE DIRECTION: they over-rate sources that were rhetorically prominent and under-rate\\ntheir more technical rebuttals, because prominence is better represented in training than\\nrefutation. When a state is PROVISIONAL because it came from memory, note that the likely\\nerror is over-rating. e. Applies symmetrically to sources supporting and opposing the audited\\nclaim.\\n\\n-----\\n\\nEVIDENCE-QUALITY SCORING\\n\\nFor every source listed, assign an evidence-quality score:\\n\\n0 = weak / speculative / rhetorical 1 = relevant but limited 2 = strong methodological\\ncritique 3 = direct empirical contradiction or strong empirical support 4 = decisive or\\nnear-decisive evidence\\n\\nSYMMETRIC-SCORING RULE: Apply the identical evidence-quality bar to opposition sources and\\nsupport sources. A critique you surface is NOT automatically stronger than the support it\\nopposes. If an opposition source and a support source have comparable methodological standing,\\nthey receive comparable scores. This stage's PURPOSE is to find opposition, which creates a\\nstanding incentive to over-rate opposition  -  actively correct for it. When you are tempted\\nto rate an opposition source higher than a comparably-rigorous support source, state that you\\nnoticed the temptation and justify the score on evidence, not on the fact that it is\\nopposition.\\n\\nA source's evidence-quality score must be consistent with its reception-gate result: a\\ncritique whose reception check shows it was substantially rebutted cannot hold a 3-4 score on\\nthe strength of its original claims.\\n\\nAlso label source type:\\n\\n- primary empirical study\\n- replication / failed replication\\n- meta-analysis / systematic review\\n- methodological critique\\n- natural experiment\\n- policy evaluation\\n- adjacent-field canonical paper\\n- practitioner / domain-expert evidence\\n- public reporting / journalism\\n- commentary / editorial\\n- theoretical paper\\n- model estimate\\n\\n-----\\n\\nRELATIONSHIP TO CENTRAL CLAIM\\n\\nFor each source, classify its relationship to the central claim:\\n\\n- directly contradicts\\n- weakens\\n- narrows\\n- complicates\\n- supports a weaker version\\n- supports the original claim\\n- irrelevant after inspection\\n- unclear / needs verification\\n\\nDo not overstate opposition. Some evidence narrows a claim without refuting it. Some evidence\\ncriticizes one use of a construct while supporting another. Mark this clearly.\\n\\n-----\\n\\nA. OPPOSITIONAL CITING PAPERS\\n\\nList the 5-10 most important papers that cite the foundational work or citation hub but\\ncriticize, weaken, narrow, or undermine it. Rank by strength of opposition  -  most\\nthreatening first.\\n\\nFor each source, provide:\\n\\n- full citation and year\\n- source type and how it was found\\n- what foundational paper or hub it cites\\n- main criticism\\n- evidence-quality score (0-4)\\n- relationship to central claim\\n- strength of opposition (weak / moderate / strong / severe / potentially decisive)\\n- verification state(s), including reception standing where known\\n- whether the dominant field engaged it substantively\\n- whether the critique changed later citation behavior\\n\\nRequired table:\\n\\n|Paper|Year|Cites foundational/hub?|Main criticism|Evidence quality|Relationship to claim|Verification state|Field uptake|Strength|\\n|-----|---:|-----------------------|--------------|---------------:|---------------------|------------------|------------|--------|\\n\\n-----\\n\\nB. NON-CITING OPPOSITION PAPERS\\n\\nList papers, studies, reports, or literatures that oppose, weaken, or complicate the central\\nclaim but do not cite the foundational paper or citation hub. Rank by relevance and evidence\\nquality.\\n\\nThese matter because a field can appear internally coherent while contrary evidence exists\\noutside the citation network.\\n\\nFor each source, provide:\\n\\n- full citation and year\\n- source type and how it was found\\n- main argument or finding\\n- why it matters\\n- why it may have been outside the citation network\\n- evidence-quality score (0-4)\\n- relationship to central claim\\n- reception-gate result and how assessed (if this source is load-bearing)\\n- whether the field should have engaged it\\n\\nRequired table:\\n\\n|Paper / source|Year|Does not cite hub?|Main argument|Why it matters|Evidence quality|Relationship to claim|Reception (if load-bearing)|\\n|--------------|---:|------------------|-------------|--------------|---------------:|---------------------|---------------------------|\\n\\n-----\\n\\nC. NEGLECTED REFERENCES THE HUB SHOULD HAVE CITED\\n\\nList important papers, studies, reports, or literatures that the foundational authors and/or\\ncitation hub should have referenced but neglected. These are not necessarily oppositional in\\nintent  -  they may contain relevant methods, confounds, measurement standards, or findings\\nthat would have constrained the claim.\\n\\nFor each:\\n\\n- full citation and year\\n- source type and relevance to the foundational claim\\n- what method, confound, or evidence it contributes\\n- whether the foundational paper cited it\\n- whether the hub cited it\\n- effect of omission (minor context loss / moderate weakness / major evidentiary gap / fatal\\n  omission for the strong claim)\\n- evidence-quality score (0-4)\\n\\nRequired table:\\n\\n|Neglected source|Year|Relevance|Cited by foundation?|Cited by hub?|Effect of omission|Evidence quality|\\n|----------------|---:|---------|--------------------|-------------|------------------|---------------:|\\n\\n-----\\n\\nD. IGNORED ADJACENT FIELDS\\n\\nList 4-6 adjacent fields or literatures that are directly relevant but were ignored, excluded,\\nor minimally engaged.\\n\\nFor each adjacent field, provide:\\n\\n- field name and key papers/authors\\n- why it is relevant\\n- what evidence it provides against, beneath, or adjacent to the claim\\n- what better measurement instrument or method it offers\\n- what decisive test it suggests\\n- whether the target field adopted that method\\n- what the target field would have had to confront if it engaged this literature\\n- effect of neglect (minor / moderate / major / fatal for strong claim)\\n\\nRequired table:\\n\\n|Adjacent field|Key sources|Why relevant|Better method / measure|Decisive test suggested|Engagement by target field|Effect of neglect|\\n|--------------|-----------|------------|-----------------------|-----------------------|--------------------------|-----------------|\\n\\n-----\\n\\nE. STRONGEST EVIDENCE SUPPORTING THE ORIGINAL CLAIM\\n\\nE0. SOURCE SELF-DEFENSE CHECK  (run FIRST, before external support)\\n\\nBefore searching the literature for support, search THE SOURCE ITSELF. This section includes\\nfindings from EVERY prosecutor output supplied under the INPUTS section - construct-validity,\\ninternal-validity, and citation-network alike. For each prosecutor finding, locate any passage\\nin which the source anticipates, qualifies, scopes, or tests against that finding. Do not\\nsilently exclude a supplied prosecutor's findings because historical runs supplied only two.\\n\\n[FAIL-CA-003]\\n\\nFOUR THINGS TO LOOK FOR:\\n\\n1. SCOPE QUALIFIERS attached to a limitation the prosecutors quoted. A limitation is often\\n   narrower than its quotation suggests. Check whether the sentence continues, and whether the\\n   continuation restricts the limitation to a subset of the source's claims. Failure mode this\\n   catches: quoting the first half of a sentence whose second half exempts the quantity\\n   actually at issue.\\n\\n2. SENSITIVITY OR ROBUSTNESS TESTS the source performed. Did the source remove, withhold, or\\n   vary the element the prosecutors called load-bearing, and report the result? If so, the\\n   prosecutor's finding must engage that test rather than proceed as though it does not exist.\\n\\n3. STATED ASSUMPTIONS the source names explicitly. A source that names an assumption has not\\n   hidden it. The finding changes from \\\"undisclosed\\\" to \\\"disclosed and inadequately defended\\\"\\n   -  a different and weaker charge, and one the source's own text can partly answer.\\n\\n4. ACKNOWLEDGED LIMITATIONS the prosecutors presented as discoveries. If the source states the\\n   limitation itself, the finding is about weight and prominence, not concealment.\\n\\nREQUIRED TABLE  -  one row per prosecutor finding:\\n\\n| Prosecutor finding | Source passage that anticipates it (quote + location) | Type (scope / sensitivity test / stated assumption / acknowledged limitation / NONE FOUND) | Does it answer the finding? (fully / partly / not at all) | Effect on the finding |\\n|---|---|---|---|---|\\n\\nEFFECT values  -  use exactly these: DEFEATED ....... the source's own text answers the\\nfinding. CUT the finding. NARROWED ....... the finding survives but must be restated to engage\\nthe source's treatment. State the restatement. RECHARACTERIZED  the finding is real but the\\ncharge changes  -  from \\\"undisclosed\\\" to \\\"disclosed and inadequately defended,\\\" or from\\n\\\"untested\\\" to \\\"tested inadequately.\\\" State the new charge. UNAFFECTED ..... the source does\\nnot address the finding. Confirm you searched.\\n\\nRULES\\n\\n  a. \\\"NONE FOUND\\\" REQUIRES A SEARCH, NOT AN ASSUMPTION. State which sections you checked.\\n  Abstract, methods, results, discussion, and any limitations paragraph at minimum. A finding\\n  recorded UNAFFECTED without a stated search is not verified.\\n\\n  b. A FINDING WHOSE SUBSTANCE THE SOURCE TESTED MAY NOT BE RATED SEVERE without engaging that\\n  test. If the source ran a sensitivity analysis on the element you call decisive, either show\\n  why the analysis was inadequate or downgrade.\\n\\n  c. THIS RUNS BEFORE THE EXTERNAL SUPPORT TABLE. Order matters: the source's own defense\\n  changes which findings need external support at all. A finding DEFEATED here must be removed\\n  from all later rankings, thesis-impact claims, revised-thesis language, and final-verdict\\n  lines. Do not keep it alive as a \\\"minor concern\\\" after E0 has cut it.\\n\\n  d. SYMMETRY. This is not a search for reasons to clear the source. Where the source's\\n  self-defense is inadequate, say so plainly, and note that an inadequate stated defense is\\n  often WORSE for the source than silence  -  it shows the issue was considered and dismissed.\\n\\n  e. RECORD THE RESIDUAL. After E0, state in one line: how many prosecutor findings were\\n  DEFEATED, NARROWED, RECHARACTERIZED, and UNAFFECTED. A run where every finding is UNAFFECTED\\n  across many sources suggests E0 is not being performed.\\n\\n-----\\n\\nE1. EXTERNAL SUPPORTING EVIDENCE\\n\\nDo not only search for evidence that supports the audit. Identify the strongest evidence that\\nsupports the foundational paper, citation hub, or mainstream claim.\\n\\nFor each source:\\n\\n- full citation and year\\n- source type\\n- what part of the original claim it supports\\n- whether it directly answers the construct-validity problem\\n- whether it runs or approximates the decisive test\\n- whether it supports the strong claim or only a narrower version\\n- verification state(s), including reception standing where known (support sources are gated\\n  too  -  e.g., note later corrigenda, failed replications, or downgrades)\\n- whether it changes the audit verdict\\n- evidence-quality score (0-4)\\n\\nClassify impact on audit:\\n\\n- no effect\\n- narrows the critique\\n- weakens the critique\\n- seriously challenges the critique\\n- overturns the critique\\n\\nRequired table:\\n\\n|Supporting source|Year|What it supports|Answers construct problem?|Runs decisive test?|Strong or narrow claim?|Verification state|Impact on audit|\\n|-----------------|---:|----------------|--------------------------|-------------------|-----------------------|------------------|---------------|\\n\\nBe honest. If the strongest support for the original claim is genuinely strong, say so. If it\\nonly supports a narrower version, say that clearly.\\n\\n-----\\n\\nF. CITATION-NETWORK UPTAKE OF OPPOSITION\\n\\nFor each strong oppositional paper or neglected source identified above, answer:\\n\\n- Did the dominant citation hub cite it?\\n- Did later papers cite it?\\n- Was it engaged substantively, dismissed, minimized, or ignored?\\n- Did the field update after it appeared?\\n- Did the opposition remain peripheral while the original claim continued spreading?\\n- Did later reviews preserve the critique or bury it?\\n\\nNO-ASSUME-SUPPRESSION RULE: When a source received LOW citation uptake, you must state BOTH\\ncandidate explanations before interpreting: (a) the field marginalized valid work (suppression\\n/ cartel behavior), OR (b) the field correctly discounted work that did not survive scrutiny\\n(the critique was rebutted or didn't hold up). Do NOT resolve toward suppression (a) unless\\nthe source's reception gate confirms it actually SURVIVED rebuttal. Low uptake of a rebutted\\nsource is EXPECTED and is not evidence of suppression. Only a source that (i) survived its\\nreception check AND (ii) still received low uptake supports a \\\"critique marginalized\\\" / cartel\\nreading. State which of these two conditions you have actually verified.\\n\\nRequired table:\\n\\n|Opposition / neglected source|Cited by hub?|Later uptake?|Engagement quality|Survived reception check?|Suppression vs. correctly-discounted|Network implication|\\n|-----------------------------|-------------|-------------|------------------|-------------------------|------------------------------------|-------------------|\\n\\nEngagement quality options:\\n\\n- not cited\\n- cited in passing\\n- cited but dismissed\\n- cited and reframed\\n- substantively engaged\\n- incorporated into model revision\\n- unclear / needs verification\\n\\nNetwork implication options:\\n\\n- healthy uptake\\n- partial uptake\\n- critique contained\\n- critique marginalized (ONLY if source survived reception check)\\n- evidence ignored (ONLY if source survived reception check)\\n- field updated\\n- field did not update\\n- low uptake explained by rebuttal (not suppression)\\n\\n-----\\n\\nG. SUMMARY TABLE  -  OPPOSITION STRENGTH\\n\\nComplete this table. Every source listed as a \\\"strongest example\\\" or ranked among the\\nmost-threatening findings must have passed the SOURCE-RECEPTION GATE. If it has not been\\nreception-checked, it cannot be listed as a top-3 threat  -  cap it and say so.\\n\\n|Category                            |Number Found|Strongest Example|Evidence Quality|Verification state|Impact on Central Claim|\\n|------------------------------------|-----------:|-----------------|---------------:|------------------|-----------------------|\\n|Oppositional citing papers          |            |                 |                |                                    |                       |\\n|Non-citing opposition papers        |            |                 |                |                                    |                       |\\n|Neglected references                |            |                 |                |                                    |                       |\\n|Ignored adjacent fields             |            |                 |                |                                    |                       |\\n|Strongest support for original claim|            |                 |                |                                    |                       |\\n\\nImpact options:\\n\\n- no effect\\n- narrows claim\\n- weakens claim\\n- strengthens audit\\n- weakens audit\\n- seriously challenges audit\\n- overturns audit\\n- needs verification\\n\\nThen state: \\\"The three most threatening findings in order of severity are: [1], [2], [3].\\\" For\\neach of the three, state its verification state. If any rests on a PROVISIONAL source or an\\nunchecked reception claim, it may not remain in the top three; cap it and say so.\\n\\n-----\\n\\nG2. DID THE PROSECUTION ATTACK THE STRONGEST VERSION?\\n\\nThe most common way an audit fails is not by being wrong about the evidence. It is by\\nattacking the wrong layer - indicting a careful source for downstream inflation, or indicting\\na press release when the paper itself made the error.\\n\\nFINDING-LEVEL TARGET GATE - DO NOT ANSWER THIS SECTION ONLY IN THE AGGREGATE.\\n\\nFor EVERY prosecutor finding, read the Target claim declared in its standardized finding row.\\n\\n- If the row declares map field 6, test whether the finding actually bears on that claim.\\n- If it declares another mapped claim, identify which map field or version it attacks.\\n- If no Target claim is declared, mark the alignment PROVISIONAL; do not infer one from the\\n  finding's rhetoric.\\n- If the finding concerns a claim absent from the map, mark MAP GAP.\\n\\nThis table includes findings from EVERY prosecutor output supplied under the INPUTS section -\\nconstruct-validity, internal-validity, and citation-network alike. Do not silently exclude a\\nsupplied prosecutor's findings because the surrounding prose historically named only two. If\\ninternal-validity was supplied and produced findings, they receive rows here on the same terms\\nas any other prosecutor's findings - declared target claim, claim-map version attacked, match\\nagainst field 6, failure location, and severity after re-aiming.\\n\\n[FAIL-CA-003]\\n\\nRequired finding-level table:\\n\\n| Prosecutor | Finding | Declared target claim | Claim-map version attacked | Matches field 6? | Failure location | Severity after re-aiming |\\n|---|---|---|---|---|---|---|\\n\\nDOUBLE-COUNT GUARD  [FAIL-MB-003]\\n\\nDo not count multiple rows as independent threats merely because the prosecutor gave them\\ndifferent names.\\n\\nA definitional-scope-creep row and a general claim-vs-measurement row based on the same scale\\nitems are one underlying mismatch. Preserve both rows if they improve traceability, but treat\\nthem as NESTED:\\n\\n- one evidentiary mechanism;\\n- one load-bearing lever;\\n- one contribution to severity;\\n- one place in the top-three ranking.\\n\\nApply the same rule to any duplicated evidence/mechanism pair. State which rows were\\nconsolidated. Do not mechanically add severities.\\n\\nAfter the finding-level table, answer:\\n\\n1. WHICH VERSION DID EACH PROSECUTOR ACTUALLY ATTACK? Classify from the rows above:\\n   - the source's strongest claim (map field 2)\\n   - the weaker defensible claim (map field 3)\\n   - the downstream inflated claim (map field 4)\\n   - a version not on the map (MAP GAP)\\n\\n2. WAS THAT THE VERSION THE AUDIT WAS SUPPOSED TO EVALUATE? Compare each row against map field\\n   6. A sound finding aimed at another claim does not support the field-6 conclusion until\\n   re-aimed.\\n\\n3. WHERE DOES EACH FAILURE ACTUALLY LIVE? Classify and name the supporting findings:\\n\\n     PAPER ............. the source overclaims or uses an invalid proxy CITATION .......... a\\n     defensible source is inflated downstream PR / MEDIA ........ communications or coverage\\n     strip caveats MODEL / RETRIEVAL . summarizers reproduce the inflated version MIXED\\n     ............. specify which layer is responsible for which part\\n\\n4. IF A FAILURE IS NOT AT THE PAPER LAYER, SAY SO PLAINLY:\\n\\n   \\\"The source is defensible on this point; the failure is at the [citation / PR / model]\\n   layer.\\\"\\n\\n5. DOES EACH FINDING'S SEVERITY SURVIVE RE-AIMING? Re-rate finding by finding. A\\n   downstream-layer finding does not establish severity at the paper layer.\\n\\nRELATIONSHIP TO THE CLAIM MAP - DO NOT DUPLICATE\\n\\nThe claim map asked prospectively where inflation begins. This section asks retrospectively\\nwhether EACH prosecutor finding hit its declared and intended target.\\n\\nIf this classification disagrees with the map, report:\\n\\n\\\"MAP DISAGREEMENT: the claim map located inflation at [X]; the prosecution's findings indicate\\n[Y].\\\"\\n\\nRequired aggregate table:\\n\\n| Question | Answer | Supporting prosecutor findings |\\n|---|---|---|\\n| Versions attacked | | |\\n| Version audit targeted (map field 6) | | |\\n| Finding-level match rate | | |\\n| Failure location(s) | | |\\n| Severity survives re-aiming? | | |\\n| Nested findings consolidated | | |\\n\\nH. REVISED THESIS IMPACT\\n\\nClassify how the counter-audit affects the original thesis. Do not choose a weaker category\\nwhen a stronger one is accurate.\\n\\nA. Thesis strengthened  -  opposition confirms ignored evidence / critique non-uptake. B.\\nThesis narrowed  -  original critique remains valid but needs more precise scope. C. Thesis\\nsoftened  -  some claims were overstated. D. Thesis seriously weakened  -  decisive contrary\\nevidence exists. E. Thesis overturned  -  audit's central claim is wrong. F. Mixed  -  thesis\\nstrengthened in one area and narrowed in another.\\n\\nThen answer each question directly. Do not hedge:\\n\\n1. Which claims should be removed?\\n2. Which claims should be narrowed?\\n3. Which claims should be strengthened?\\n4. Which claims require better sourcing?\\n5. Which claims survived the adversarial review unchanged?\\n6. Which evidence most improves the thesis?\\n7. Which evidence most threatens the thesis?\\n\\nFor questions about which evidence \\\"most improves\\\" or \\\"most threatens\\\" the thesis: the\\nevidence named must have passed the reception gate. Do not elevate a rebutted or unchecked\\nsource to \\\"most threatening.\\\"\\n\\n-----\\n\\nI. REVISED THESIS PARAGRAPH\\n\\nWrite a revised, sharper thesis paragraph that incorporates the strongest counter-evidence.\\n\\nRules:\\n\\n- Preserve the strongest valid critique.\\n- Do not soften merely to appease institutional readers.\\n- Do narrow claims that were too broad.\\n- Do distinguish direct evidence, inference, and speculation.\\n- Do acknowledge the strongest evidence for the original claim if it materially changes the\\n  argument.\\n- Do not use vague balancing phrases unless they do real evidentiary work.\\n- Any source load-bearing in this paragraph must reflect its reception-gate standing (do not\\n  lean on a rebutted source's original claim as if unrebutted).\\n\\nThe revised thesis should include:\\n\\n- what was measured\\n- what was claimed\\n- where the proxy or construct gap is\\n- what evidence opposed the claim (with its current reception standing)\\n- what evidence supports a narrower version\\n- what the decisive test would look like\\n- how the citation network handled opposition (distinguishing suppression from\\n  correct-discounting per the F rule)\\n\\n-----\\n\\nJ. FINAL ADVERSARIAL VERDICT\\n\\nEnd with a final verdict using this format. Be direct and specific on every line:\\n\\n- Strongest opposition to the foundational claim (with reception standing + how assessed):\\n- Strongest support for the foundational claim (with reception standing + how assessed):\\n- Strongest neglected adjacent-field evidence:\\n- Strongest paper the hub should have cited:\\n- Most important non-citing opposition:\\n- Did the field engage the opposition?\\n- For any \\\"critique marginalized / suppressed\\\" claim: did the marginalized source survive its\\n  reception check? (If not, do not claim suppression.)\\n- Did the opposition change the thesis?\\n- Source self-defense (E0): findings DEFEATED / NARROWED / RECHARACTERIZED / UNAFFECTED by the\\n  source's own text  -  list each, with the passage cited.\\n- Version the prosecution attacked (strongest / defensible / downstream):\\n- Failure location (paper / citation / PR-media / model / mixed):\\n- Does the severity survive re-aiming to the audited claim?\\n- Finding-target alignment (G2): [finding-level match result]\\n- Internal-validity coverage: [SUPPLIED AND CONSUMED / SUPPLIED BUT NOT RUN THROUGH G2 -\\n  explain why / NOT SUPPLIED]. If NOT SUPPLIED, state plainly: \\\"Internal-validity was not run\\n  or not provided for this counter-audit. Any statistical-methodology contradiction of Field 6\\n  has not been checked by this stage.\\\" This line is mandatory even when internal-validity is\\n  absent - silence is not an acceptable disposition.\\n- Double-count resolution: [nested rows consolidated; independent levers retained]\\n- Revised thesis impact category:\\n- Claims to remove:\\n- Claims to narrow:\\n- Claims strengthened:\\n- Three most threatening findings ranked by severity (each with reception standing):\\n- Main remaining source-risk:\\n- Confidence level (Low / Moderate / High):\\n- What evidence would change this assessment:\\n\\n-----\\n\\nFIDELITY CHECK (optional; runs only if Input 5 was supplied)\\n\\nIf a thesis paragraph or short paper draft was supplied under Input 5, check it against the\\nVETTED prosecutor findings already established in this counter-audit (post-G2, post-E0) - not\\nagainst the raw, un-re-aimed prosecutor output.\\n\\nFor each load-bearing claim in the draft:\\n\\n- Does it match a finding that survived G2 re-aiming and E0 self-defense?\\n- Does it overstate a finding's severity relative to what E0/G2 left standing (for example,\\n  citing a DEFEATED or NARROWED finding at its original strength)?\\n- Does it omit a load-bearing surviving finding?\\n- Does it cite a source at a stronger verification state than that source actually carries per\\n  the SOURCE-RECEPTION GATE?\\n\\nReport per claim: MATCHES VETTED FINDING / OVERSTATES / OMITS / MISCITES VERIFICATION STATE.\\nThis check does not replace G2 or E0; it runs after them and against their output.\\n\\n-----\\n\\nJ2. SELF-TILT DISCLOSURE (MANDATORY  -  THIS STAGE HAS NO DOWNSTREAM CHECK)\\n\\nBecause this counter-audit is the terminal balancing stage and nothing corrects it, disclose\\nits own residual tilt. Do NOT resolve these  -  surface them for the human adjudicator:\\n\\n- In which direction did THIS counter-audit lean (toward the paper, toward the critique, or\\n  genuinely balanced)?\\n- Which of this counter-audit's OWN findings are least reception-checked or rest on\\n  memory-based assessments?\\n- Which sources did this counter-audit introduce and promote  -  and were they gated as hard\\n  as the sources it defended against?\\n- Did I search the source for its own pre-emptions before searching the literature for\\n  support? Which sections? If E0 returned all UNAFFECTED, state whether that reflects the\\n  source's silence or my not having looked.\\n- Did I let the prosecution's target stand unexamined because its findings supported the\\n  conclusion I expected? Re-aiming the critique to the correct layer usually WEAKENS it  -\\n  note whether reluctance to weaken it influenced the G2 classification.\\n- What would a counter-audit OF THIS counter-audit most likely flag first?\\n- What is the single assumption in this verdict most likely to be wrong?\\n\\n-----\\n\\nK. FINAL ONE-PARAGRAPH SUMMARY\\n\\nWrite one paragraph summarizing:\\n\\n- the strongest counter-evidence found (and whether it survived its reception check)\\n- whether it weakens or strengthens the original audit\\n- whether the original thesis survives\\n- whether the field engaged or ignored the opposition (distinguishing genuine suppression from\\n  correct-discounting)\\n- what the most defensible revised position is\\n\\nThis paragraph should be direct, evidence-based, and free of unnecessary reassurance language.\\nState the verdict plainly. Do not hedge.\\n\\n-----\\n\\nREMINDER\\n\\nThis prompt is not for finding more ammunition. It is for testing whether the audit survives\\ncontact with the strongest opposing evidence.\\n\\nA good audit becomes sharper after this process. A weak audit becomes narrower. A bad audit\\nshould be abandoned.\\n\\nThis stage is the balancer. It must scrutinize its own witnesses as hard as the opponent's. A\\ncritique you introduce is not exempt from the standard you apply to the paper. Low uptake of a\\nrebutted source is not suppression. A source you have not reception-checked cannot be your\\nstrongest finding.\\n\\nYou may begin with suspicion. You may not end with suspicion.\\n\\nStart wherever the anomaly appears. Finish with receipts.\\n\"},\"5-voice-restoration\":{\"bytes\":13161,\"lines\":293,\"path\":\"prompts/5-voice-restoration.txt\",\"sha256\":\"88999594a2fd\",\"text\":\"VOICE RESTORATION / ANTICIPATORY COMPLIANCE AUDIT PROMPT\\n\\n-----------------------------------------------------------------\\nINSTRUMENT PREFLIGHT \\u2014 MANDATORY FOR FORMAL / LOGGED RUNS   [TOOL-004]\\n-----------------------------------------------------------------\\n\\nThis prompt is part of the audit instrument. Establish the exact instrument version BEFORE\\nsubstantive retrieval, extraction, analysis, or verdict work begins.\\n\\nA successful fetch indicator, correct repository path, branch label, plausible line count,\\nmatching rendered metadata, or internally self-consistent page does NOT by itself establish\\nthat the intended/current artifact was retrieved. A mutable remote reference can return a\\nhistorical representation that is internally self-consistent in every visible field.\\n\\nPROMPT IDENTITY MARKERS\\n\\n  - VOICE RESTORATION / ANTICIPATORY COMPLIANCE AUDIT PROMPT\\n\\nThese markers confirm the prompt family / expected structural features. They do NOT by\\nthemselves establish version currency: an older version may share the same title or markers.\\n\\n1. RECORD THE INSTRUMENT ACTUALLY IN CONTEXT.\\n\\n   Record, where available:\\n\\n   - canonical prompt path or supplied filename;\\n   - retrieval form: PASTED / ATTACHED / IMMUTABLE REMOTE / MUTABLE REMOTE;\\n   - requested branch or ref;\\n   - intended immutable commit/ref, if the run claims a repository version;\\n   - resolved commit SHA;\\n   - resolved blob/content hash, or a locally computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\n\\nI want you to audit the following draft for compliance softening, anticipatory hedging, false balance, and machine-generated reassurance language.\\n\\nContext:\\n\\nThis draft is a methodological critique / adversarial research document. The goal is not to make it harsher for its own sake. The goal is to preserve direct, accurate criticism where the evidence supports it.\\n\\nDo not tone-police the draft. Do not soften the argument merely because the subject is controversial. Do not add generic \\u201cboth sides\\u201d language unless it is logically necessary or evidence-based.\\n\\nYour task:\\n\\nIdentify places where the prose appears to apologize for, dilute, hedge, or repeatedly re-legitimize the field being critiqued before making a methodological point.\\n\\nThe most recognizable fingerprint of compliance softening is this structure appearing repeatedly:\\n\\n\\u201cX has produced valuable insights into Y, but\\u2026\\u201d\\n\\nA confident author may establish good faith once in the introduction. They do not need to re-establish the field\\u2019s legitimacy before every critique. If acknowledgment language appears repeatedly before the sharpest methodological points, treat it as likely compliance softening unless context clearly justifies it.\\n\\nSearch specifically for these phrases and close variants:\\n\\n- \\u201cit is worth noting that\\u201d\\n- \\u201cit is important to acknowledge\\u201d\\n- \\u201cthe field has produced valuable insights\\u201d\\n- \\u201cthis does not invalidate\\u201d\\n- \\u201cwhile acknowledging\\u201d\\n- \\u201cto be clear, [X] is real\\u201d\\n- \\u201cthese findings are valuable within their domain\\u201d\\n- \\u201cthis paper acknowledges\\u201d\\n- \\u201cboth X and Y can be true\\u201d\\n- \\u201cunderstanding this does not diminish\\u201d\\n- \\u201cthis is not to say\\u201d\\n- \\u201chowever, it is important to be balanced\\u201d\\n- \\u201cmore research is needed\\u201d when used to soften a direct methodological failure\\n- \\u201climitations\\u201d where the stronger and more accurate term is \\u201cinvalid proxy,\\u201d \\u201cconstruct mismatch,\\u201d \\u201clevel-of-analysis error,\\u201d \\u201ccitation laundering,\\u201d or \\u201cuntested premise\\u201d\\n\\nImportant distinction:\\n\\nSome caveats are legitimate. Do not remove caveats that:\\n\\n- prevent factual overstatement\\n- distinguish method critique from motive accusation\\n- acknowledge real contrary evidence\\n- define the scope of the claim\\n- protect falsifiability\\n- clarify that the critique is about evidence, not people\\n\\nBut remove or flag caveats that:\\n\\n- repeat good-faith acknowledgments unnecessarily\\n- soften a supported methodological criticism\\n- convert \\u201cbad proxy\\u201d into \\u201cimperfect proxy\\u201d\\n- convert \\u201cnot tested\\u201d into \\u201cunderexplored\\u201d\\n- convert \\u201ccitation network recycles the premise\\u201d into \\u201cthe literature may be somewhat concentrated\\u201d\\n- add reassurance sentences before every critique\\n- make the author sound less certain than the evidence warrants\\n\\n-----------------------------------------------------------------\\nPIPELINE PROVENANCE FLAGS \\u2014 ALWAYS PRESERVE\\nSTRIP SCAFFOLD, KEEP THE FLAG\\n-----------------------------------------------------------------\\n\\nThis draft may be the output of an audit pipeline that marks the epistemic status of its own evidence. Those markers are LOAD-BEARING SIGNAL, not hedging, and must survive voice restoration even when they are wrapped in scaffolding that appears on the cut list.\\n\\nALWAYS PRESERVE the substance of these flags and close variants:\\n\\n- \\u201creception unverified\\u201d / \\u201creception not independently confirmed\\u201d\\n- \\u201cprovisional\\u201d / \\u201ctreat as provisional\\u201d\\n- \\u201cmodel-inferred\\u201d / \\u201cinferred \\u2014 needs validation\\u201d / \\u201cnot retrieval-confirmed\\u201d\\n- \\u201cCONFIRMED (retrieved)\\u201d vs. \\u201cNOT CONFIRMED \\u2014 model estimate\\u201d\\n- \\u201cunvalidated field context\\u201d / \\u201cdownstream findings provisional\\u201d\\n- \\u201cthis specific claim\\u201d vs. \\u201cthe robust general claim\\u201d \\u2014 the scope split that separates a weak sub-claim from a better-supported general one\\n- \\u201cmemory-based reception \\u2014 uncertain\\u201d / \\u201cone-level check only\\u201d\\n- any marker tying a claim to whether its evidence was actually retrieved, confirmed, or validated\\n\\nTHE RULE \\u2014 STRIP THE SCAFFOLD, KEEP THE FLAG:\\n\\nWhen a provenance flag is wrapped in cut-list scaffolding, remove the scaffolding and KEEP the flag. Do not remove both.\\n\\n- \\u201cIt is worth noting that the reception is unverified.\\u201d \\u2192 \\u201cReception unverified.\\u201d\\n- \\u201cIt is important to acknowledge this is model-inferred.\\u201d \\u2192 \\u201cModel-inferred; needs validation.\\u201d\\n- \\u201cThis does not invalidate the finding, but it is provisional.\\u201d \\u2192 \\u201cProvisional.\\u201d\\n\\nThe scaffold is empty softening; cut it. The flag is calibrated uncertainty tied to a real evidence gap; keep it, tightened.\\n\\nTHE TEST:\\n\\nBefore removing any hedge-like phrase, ask: does it mark a REAL evidence gap \\u2014 was this retrieved, confirmed, or validated; is this the specific or the general claim \\u2014 or is it reflexive reassurance with no evidentiary basis?\\n\\nCut only the latter. A flag that tracks whether evidence was actually verified is never hedging, no matter how closely its phrasing resembles the cut list.\\n\\nNEVER convert a flagged-uncertain finding into a bare confident assertion. If the pipeline marked something unverified, provisional, or inferred, the restored prose must still mark it so \\u2014 just more directly.\\n\\nVoice restoration makes calibrated uncertainty read cleanly. It never launders it into false certainty.\\n\\n-----------------------------------------------------------------\\n\\nOutput format:\\n\\n1. Executive summary\\n\\nBriefly state whether the draft has:\\n\\n- no meaningful compliance-softening problem\\n- mild softening\\n- moderate softening\\n- severe softening\\n\\n2. Phrase inventory\\n\\nCreate a table with:\\n\\n- phrase or pattern found\\n- number of occurrences\\n- where it appears\\n- whether it is justified, questionable, or likely softening
