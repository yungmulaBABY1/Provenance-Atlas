nsions: J\\n- Verified risk denominator: [numeric value equal to 3 \\u00d7 I]\\n- Evidentiary coverage: (I + J)/A applicable dimensions scored\\n- Execution completeness: (I + J + U)/A applicable dimensions completed\\n- Dimension inventory: I INDEPENDENT SCORED + J NESTED SCORED + U UNINFORMATIVE + Q\\n  UNASSESSED + N N/A = T\\n- Unscored dimensions: each UNASSESSED, UNINFORMATIVE, or N/A dimension with reason\\n- Arithmetic band position\\n- Risk band: issued or WITHHELD \\u2014 [reason]\\n- Mechanism label: issued or NONE\\n\\nDefinitions:\\n\\n- X = sum of scores on INDEPENDENT SCORED dimensions\\n- Y = 3 \\u00d7 I\\n- I = number of INDEPENDENT SCORED dimensions\\n- J = number of NESTED SCORED dimensions\\n- U = number of UNINFORMATIVE dimensions\\n- Q = number of UNASSESSED dimensions\\n- N = number of N/A dimensions\\n- A = number of applicable dimensions, excluding N/A\\n- T = total dimensions in the instrument\\n\\nDo not report X/(3 \\u00d7 T), and do not include NESTED scores in X or Y.\\n\\nImmediately after the percentage, state:\\n\\n    Verified scored-dimension risk: [PERCENTAGE], calculated from [I] independent scored\\n    dimensions; [J] additional scored dimensions are NESTED; [I + J] of [A] applicable\\n    dimensions were assessed. This describes average concern among independently aggregated\\n    dimensions; it is not a full-coverage estimate of network-wide risk or breadth.\\n\\nPROVISIONAL COVERAGE GATE\\n\\nA formal network label initially requires:\\n\\n- at least 70% of applicable dimensions SCORED, counting independent and nested dimensions as\\n  assessed for coverage; and\\n- no dimension essential to the proposed label left UNASSESSED.\\n\\nThe 70% value is PROVISIONAL. It is an engineering threshold for validation, not an\\nempirically established boundary. Record whether bands remain stable as coverage increases.\\nDo not describe 70% as validated.\\n\\nA functional-closure label additionally requires verified topology or density, claim\\ntransmission or premise recycling, and tested engagement with credible disconfirming evidence.\\nIt cannot be generated from the percentage alone. Proxy mismatch, claim mutation, or a high\\naverage across a small subset cannot substitute for those label-essential mechanisms.\\n\\nA healthy/low-risk label requires affirmative evidence on the dimensions that could otherwise\\nestablish closure. Missing graph data cannot support a healthy verdict.\\n\\nPERCENTAGE BANDS\\n\\n- 0%\\u201320%: healthy or low-risk network\\n- >20%\\u201340%: normal field clustering with some weaknesses\\n- >40%\\u201360%: self-referential literature with significant blind spots\\n- >60%\\u201380%: high-risk citation-laundering network\\n- >80%\\u2013100%: functional citation cartel / structurally closed consensus\\n\\nThese are scored-dimension intensity bands, not estimates of unassessed dimensions. Wording\\nthat implies breadth must also be supported by the distribution of findings across distinct\\ndimensions. A few severe dimensions do not establish a network-wide pattern.\\n\\nAlways report the arithmetic position and the issued disposition separately:\\n\\n    ARITHMETIC BAND POSITION: [candidate band from the independent-score rate].\\n    RISK BAND: [issued band] \\u2014 computed over [I] independent scored dimensions; breadth\\n    requirement PASSED.\\n\\nor:\\n\\n    RISK BAND: WITHHELD \\u2014 [coverage, breadth, label-essential, or verification reason].\\n\\nReport any narrower diagnosis separately as:\\n\\n    MECHANISM LABEL: [label or NONE].\\n\\nSilence is not withholding. If no risk band is issued, the WITHHELD line is mandatory.\\n\\nRERUN COMPLETENESS RULE\\n\\nAny rerun used to revise the formal risk percentage or band must attempt every currently\\nUNASSESSED applicable dimension in the same pass. A targeted single-dimension rerun may be\\nreported diagnostically when its expected direction is preregistered before retrieval, but it\\nmay not update the formal percentage or band until the remaining UNASSESSED applicable\\ndimensions have also been attempted.\\n\\nPreregistering the expected score discloses selective dimension choice; it does not make a\\nselectively updated aggregate unbiased. When a comprehensive pass is not possible, retain\\nWITHHELD\\u2014INCOMPLETE and report the targeted result separately.\\n\\nSCORING DISCIPLINE\\n\\n- State the verification state for every dimension scored 2 or 3.\\n- A PROVISIONAL metric or model-estimated pattern may not independently receive a score of 3.\\n- A SURVIVES finding may not anchor a score of 3.\\n- Apply AGGREGATION STATUS to overlapping manifestations; preserve NESTED rows for\\n  traceability but exclude them from the aggregate numerator and denominator.\\n- The final formal label must agree with the Concede Test, the verification state of the\\n  dimensions that drive the total, the coverage gate, and the label-essential requirements.\\n- Do not use the final label without explaining which distinct dimensions and mechanisms drive\\n  it.\\n\\n-----\\n\\nRED FLAGS\\n\\nStrong evidence of a functionally closed citation network:\\n\\n- Top 50 papers show >60-70% internal citation density.\\n- Recent papers continue to heavily cite the same small founding cluster.\\n- Main review/hub paper is cited more often than original primary evidence.\\n- Adjacent fields with relevant expertise are cited at very low rates, especially below\\n  10-15%.\\n- Contradictory evidence from adjacent fields is ignored or dismissed without engagement.\\n- Original limitations disappear downstream.\\n- A weak or narrow finding becomes stronger through repetition.\\n- The original premise is treated as settled fact rather than a testable hypothesis.\\n- The decisive test has not been run.\\n- Failed predictions do not trigger model revision.\\n- Critics are pathologized or ignored rather than engaged.\\n\\n-----\\n\\nGREEN FLAGS\\n\\nSigns of a healthier field:\\n\\n- Diverse citation sources beyond a small cluster.\\n- Regular substantive engagement with adjacent literatures.\\n- New papers build on fresh evidence rather than recycling the founding cluster.\\n- Primary empirical tests outnumber reviews/theory papers in load-bearing positions.\\n- Limitations are preserved downstream.\\n- Critical papers are cited and engaged.\\n- Falsification criteria are specified.\\n- Natural experiments and failed predictions cause model updating.\\n- Interventions are evaluated against the underlying construct, not only the preferred metric.\\n\\n-----\\n\\nREQUIRED FINAL OUTPUTS\\n\\nProduce every artifact below under its exact heading.\\n\\nARTIFACT 1: TOP 15 CITATION SPINE TABLE\\n\\nColumns:\\n\\nRank | Paper | Year | Citation count | Evidence type | Role in network | Source of citation\\ncount\\n\\nARTIFACT 2: FOUNDING CLUSTER TABLE\\n\\nColumns:\\n\\nPaper | Year | Claim introduced | Evidence type | Verification state | Later role | Risk\\n\\nARTIFACT 3: RECENT 5-YEAR CITATION BEHAVIOR TABLE\\n\\nColumns:\\n\\nRecent paper | Year | Verification state | Cites founding cluster? | Cites hub? | Cites\\nadjacent fields? | New evidence or recycling?\\n\\nARTIFACT 4: CITATION POLARITY TABLE\\n\\nColumns:\\n\\nCiting paper | Cited paper | Verification state | Citation polarity | Claim use | Inflation\\nrisk\\n\\nARTIFACT 5: CLAIM MUTATION TABLE\\n\\nColumns:\\n\\nOriginal source | Original claim | Verification state | Hub restatement | Downstream\\nrestatement | Mutation severity\\n\\nARTIFACT 6: ADJACENT-LITERATURE NEGLECT TABLE\\n\\nFirst produce the preregistration table completed before citation inspection.\\n\\nColumns:\\n\\nClaim layer | Audited explanation | Strongest plausible rival explanation | Adjudicating\\nobservation | Candidate field | Generated from audited claim, rival, or both? | Measurement\\nrelevance | Adjudicative capacity | Independence | Publication-date cutoff | Historically\\navailable? | Flip-test result | Source-lock method | Lock timestamp / hash | Final engagement\\nclassification\\n\\nThen produce the neglect table.\\n\\nColumns:\\n\\nClaim layer | Adjacent field | Nominated source and stable identifier | Verification state |\\nSource class: CONSTRUCT-DEFINING / MECHANISM-SUPPORTING / DIRECTLY-ADJUDICATING | Actual\\nresult | Explanation favored | Explanation weakened | Precise revision required | Pre-inspection\\nlock status or POST HOC | Cited? | Engagement quality | Omission severity\\n\\nARTIFACT 7: CRITIQUE-UPTAKE TABLE\\n\\nColumns:\\n\\nExpected-production precondition | Critique / contrary evidence | Year | Source type | Main\\nobjection | Verification state | Reception opportunity | Cited? | Uptake status | Dimension\\ndisposition | Effect on consensus\\n\\nARTIFACT 8: CARTEL-RISK SCORECARD\\n\\nColumns:\\n\\nDimension | Applicability | Dimension disposition | Score if SCORED | Evidence / claim state |\\nEvidence supporting disposition and score | Evidence identifiers | Retrieval coverage |\\nAGGREGATION STATUS: INDEPENDENT / NESTED under [parent] | Independent evidence and inferential\\nwork, or nesting rationale | Reason excluded from denominator | Effect on formal-label gate\\n\\nDimensions:\\n\\n- Founding-cluster dominance\\n- Internal citation density\\n- Recent-paper dependence\\n- Review-hub laundering\\n- Proxy mismatch\\n- Claim mutation\\n- Adjacent-field neglect\\n- Lack of decisive tests\\n- Poor critique uptake\\n- Intervention-evidence ratchet\\n- Model non-updating\\n\\nAfter the table report the verified risk score, scored-dimension risk rate, independent scored-\\ndimension count, nested scored-dimension count, verified risk denominator, evidentiary\\ncoverage, execution completeness, dimension inventory, unscored-dimension reasons, formal-\\nlabel gate result, and mandatory N-of-M scope statement exactly as required by Section K.\\n\\nARTIFACT 9: NETWORK MAP\\n\\nProvide the graph receipts required by Section A:\\n\\n- GRAPH CORPUS DEFINITION: database, exact query, query date, bounds, screening,\\n  deduplication, and inclusion/exclusion rules;\\n- GRAPH CORPUS NODE LIST: every selected node with a stable identifier;\\n- INTERNAL EDGE LIST: every directed internal edge as citing work -> cited work;\\n- DENSITY CALCULATION: computation rule and canonical verification state of inputs;\\n- DENSITY NUMERATOR: integer and what it counts;\\n- DENSITY DENOMINATOR: integer and what it counts;\\n- DENSITY INPUT COVERAGE: obtained inputs / required inputs;\\n- DERIVATION MODE: COMPUTED-FROM-RETRIEVED; and\\n- DENSITY INFERENCE SCOPE: exactly what the corpus can and cannot establish.\\n\\nThen provide either:\\n\\n- a simple edge list suitable for Gephi, Cytoscape, Mermaid, or manual visualization; or\\n- a clean image-generation prompt for a citation-network map.\\n\\nCOMPLETION LEDGER\\n\\nComplete this after Artifacts 1-9 and immediately before Artifact 10.\\n\\nFor each required heading, state whether it appears in the output and whether it was\\ncompleted, validly marked N/A, or omitted.\\n\\n| Required heading | Exact heading present? | Status: completed / N/A / omitted | Reason or output location |\\n|---|---|---|---|\\n\\nMECHANICAL CHECK\\n\\nDo not mark a heading present unless that exact heading appears verbatim elsewhere in the\\noutput. This is a presence claim, not a judgment call, and the human may verify it by text\\nsearch.\\n\\nCOMPLETION GATE\\n\\nIf any applicable analytical section or Artifact 1-9 is omitted:\\n\\n1. Write: \\\"INCOMPLETE RUN  -  REQUIRED SECTION OMITTED: [heading(s)].\\\"\\n2. Do not issue Artifact 10's substantive verdict, cartel-risk label, or confidence level.\\n3. In Artifact 10, write only: \\\"WITHHELD  -  completion gate failed.\\\"\\n4. Do not allow the standardized finding table to imply a completed audit.\\n\\nIf the ledger itself is omitted, the run fails the execution test.\\n\\n-----\\n\\nARTIFACT 10: FINAL VERDICT\\n\\nDo not issue this artifact until the analytical sections and Artifacts 1-9 have been completed\\nor validly marked N/A and the COMPLETION LEDGER has been completed.\\n\\nThe ledger is the pre-verdict check. If it identifies an omission, follow the COMPLETION GATE\\nand withhold the substantive verdict.\\n\\nReport:\\n\\n- Main founding cluster:\\n- Main amplification hub:\\n- Main proxy problem:\\n- Main adjacent fields neglected:\\n- Main claim mutation:\\n- Most important ignored critique:\\n- Decisive test missing:\\n- Verified risk score:\\n- Verified scored-dimension risk rate:\\n- Independent scored dimensions:\\n- Nested scored dimensions:\\n- Verified risk denominator:\\n- Evidentiary coverage:\\n- Execution completeness:\\n- Dimension inventory:\\n- Unscored dimensions and reasons:\\n- N-of-M scope statement:\\n- ARITHMETIC BAND POSITION:\\n- RISK BAND:\\n- MECHANISM LABEL:\\n- Formal-label gate status:\\n- Load-bearing finding(s):\\n- Concede-test result:\\n- Failure location:\\n- Best formal label:\\n- Confidence level:\\n- What evidence would change this assessment:\\n\\nIf a risk band is not issued, RISK BAND must read \\\"WITHHELD \\u2014 [reason].\\\" A mechanism label is\\nnot a risk band and must appear on its own line. If internal density is used in the verdict,\\nrepeat the DENSITY INFERENCE SCOPE and the corpus definition that bounds the claim.\\n\\nConfidence levels:\\n\\n- Low\\n- Moderate\\n- High\\n\\nBest formal label options:\\n\\n- healthy citation network\\n- normal small-field clustering\\n- self-referential citation cluster\\n- citation-laundering network\\n- premise-laundering hub\\n- functionally closed citation network\\n- functional citation cartel\\n- insufficient evidence\\n\\nREMINDER\\n\\nDo not call something a cartel merely because researchers cite each other. Do not call\\nsomething a cartel merely because the field is small. Do not call something a cartel because\\nyou disagree politically with the conclusion.\\n\\nThe strongest accusation is not: \\\"They cite each other.\\\"\\n\\nThe strongest accusation is: \\\"A small cluster repeatedly cites itself supportively, preserves\\nan untested premise, drops original limitations, neglects adjacent fields with direct\\nexpertise, fails to run the decisive test, and continues to shape recent papers despite\\ncontrary evidence.\\\"\\n\\nThat is the cartel signature.\\n\\nStart with suspicion if that is where the anomaly appeared. Finish with receipts.\\n\\n-----\\n\\nFINAL SECTION: STANDARDIZED FINDING TABLE\\n\\nThis summarizes the findings already produced above. It does not replace the detailed network\\ntables. It is the inspectable layer read by the human adjudicator and the counter-audit.\\n\\nYou are a one-directional prosecutor, and that is correct. An aggressive prosecutor still\\nproduces receipts. The two falsifiability fields are mandatory: naming what would undercut a\\nfinding does not weaken it; it makes it checkable.\\n\\nOne row per finding:\\n\\n| Field | Entry |\\n|---|---|\\n| Finding | One sentence |\\n| Target claim | Claim map field 6 |\\n| What was measured | Citation graph, citing contexts, source texts, or other network evidence actually inspected |\\n| What was claimed | Network, consensus, independence, mutation, or uptake inference |\\n| Failure mode | source dependence / hub laundering / claim mutation / adjacent-field neglect / critique non-uptake / closure / other taxonomy above |\\n| Severity | none / minor / moderate / major / fatal-for-strong-claim |\\n| Concede test | SURVIVES / NARROWS / DEFEATS |\\n| Scope loss if NARROWS | incidental / material / near-defeat, plus surviving claim |\\n| Evidence | Graph query, edge list, citation context, passage, table, or source text |\\n| Evidence type | primary study / replication / meta-analysis / methodological critique / policy document / practitioner / journalism / commentary / theoretical / author inference |\\n| Verification state | From the compact vocabulary |\\n| Possible innocent explanation | MANDATORY  -  strongest non-damning reading; if none, write \\\"none identified\\\" |\\n| What would weaken this | MANDATORY  -  specific evidence that would undercut it |\\n| Failure location | PAPER / CITATION / PR-MEDIA / MODEL-RETRIEVAL / MIXED |\\n| Status | confirmed / contested / provisional |\\n\\nRULES\\n\\n1. A finding missing either mandatory falsifiability field is not inspectable and may not be\\n   rated MAJOR or FATAL.\\n2. Severity must agree with verification state. A PROVISIONAL finding cannot be MAJOR or\\n   FATAL.\\n3. A SURVIVES finding cannot be MAJOR or FATAL and may not anchor the final label.\\n4. A NARROWS finding must state the surviving claim and scope-loss level.\\n5. Target claim must match field 6 of the shared Claim Map. Use MAP GAP rather than silently\\n   substituting another claim.\\n6. Quantitative and reception claims must preserve their retrieval status. A model-estimated\\n   metric remains PROVISIONAL.\\n7. If no findings of consequence were produced, say so plainly and submit an empty table with\\n   a one-line statement. A prosecutor that never returns \\\"nothing of consequence here\\\" is not\\n   measuring anything.\\n8. If the Completion Gate failed, state that the run is incomplete. Do not present the table\\n   as a completed audit and do not include a substantive final label.\\n\"},\"2-construct-validity\":{\"bytes\":44222,\"lines\":1256,\"path\":\"prompts/research-analysis/2-construct-validity.txt\",\"sha256\":\"8f87676ae76e\",\"text\":\"CONSTRUCT-VALIDITY AUDIT PROMPT:\\n\\nCLAIM VS. MEASUREMENT\\n\\n-----------------------------------------------------------------\\nINSTRUMENT PREFLIGHT \\u2014 MANDATORY FOR FORMAL / LOGGED RUNS   [TOOL-004]\\n-----------------------------------------------------------------\\n\\nThis prompt is part of the audit instrument. Establish the exact instrument version BEFORE\\nsubstantive retrieval, extraction, analysis, or verdict work begins.\\n\\nA successful fetch indicator, correct repository path, branch label, plausible line count,\\nmatching rendered metadata, or internally self-consistent page does NOT by itself establish\\nthat the intended/current artifact was retrieved. A mutable remote reference can return a\\nhistorical representation that is internally self-consistent in every visible field.\\n\\nPROMPT IDENTITY MARKERS\\n\\n  - CONSTRUCT-VALIDITY AUDIT PROMPT:\\n  - CLAIM VS. MEASUREMENT\\n\\nThese markers confirm the prompt family / expected structural features. They do NOT by\\nthemselves establish version currency: an older version may share the same title or markers.\\n\\n1. RECORD THE INSTRUMENT ACTUALLY IN CONTEXT.\\n\\n   Record, where available:\\n\\n   - canonical prompt path or supplied filename;\\n   - retrieval form: PASTED / ATTACHED / IMMUTABLE REMOTE / MUTABLE REMOTE;\\n   - requested branch or ref;\\n   - intended immutable commit/ref, if the run claims a repository version;\\n   - resolved commit SHA;\\n   - resolved blob/content hash, or a locally computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\n\\nPurpose:\\n\\nUse this prompt to audit one paper, study, report, policy document, or institutional claim\\nbefore making any broad claim about a field.\\n\\nDo not evaluate whether the authors are good people.\\n\\nDo not infer private motive.\\n\\nDo not summarize the source politely.\\n\\nDo not defer to prestige, peer review, journal status, citation count, institutional\\nauthority, or the social acceptability of the conclusion.\\n\\nYour task is narrower:\\n\\nCompare what the source actually measured to what the source claims, and to what later\\ncitations, institutions, or public arguments use it to prove.\\n\\nThe point is not to decide whether the field is good or bad.\\n\\nThe point is to test whether the measurement supports the claim.\\n\\n-----\\n\\nHOW TO USE THIS PROMPT\\n\\nPaste the relevant source material below:\\n\\n- Abstract\\n- Methods\\n- Measures / variables\\n- Sample / population\\n- Results\\n- Conclusion\\n- Any key tables or quoted claims\\n- If available: how later papers, institutions, or public commentators cite this source\\n\\nThen provide:\\n\\n1. The contested claim this source is being used to support.\\n2. The field or debate where the source is being used.\\n3. Any domain-specific concern you want tested.\\n\\n-----\\n\\nINPUT TEMPLATE\\n\\nSource title:\\n\\n[PASTE TITLE HERE]\\n\\nSource citation / link:\\n\\n[PASTE CITATION OR LINK HERE]\\n\\nContested claim (used only if no upstream Claim Extraction / Inflation Map is supplied):\\n\\n[WHAT IS THIS SOURCE BEING USED TO PROVE?]\\n\\nField / debate:\\n\\n[WHAT FIELD OR DISPUTE IS THIS SOURCE PART OF?]\\n\\nSource excerpts:\\n\\n[PASTE ABSTRACT / METHODS / RESULTS / CONCLUSION / KEY QUOTES HERE]\\n\\nLater citation use, if available:\\n\\n[PASTE HOW LATER PAPERS OR INSTITUTIONS DESCRIBE THIS SOURCE]\\n\\nDomain-expert concern:\\n\\n[WHAT SMELLS WRONG TO YOU? WHAT CONFOUND OR PROXY ISSUE DO YOU SUSPECT?]\\n\\n-----\\n\\nSHARED CLAIM MAP  -  REQUIRED FOR FULL-SEQUENCE MODE\\n\\nA Claim Extraction / Inflation Map should have been produced upstream. Paste it here:\\n\\n[PASTE CLAIM MAP]\\n\\nDEGRADED STANDALONE MODE  -  USE ONLY WHEN NO UPSTREAM MAP EXISTS\\n\\nThe prosecutor must still be runnable by a user who has only this prompt and one source. If no\\nmap was supplied, do not stop, but state this warning before the audit:\\n\\n\\\"CLAIM MAP MISSING: running in degraded standalone mode. The target claim below is\\nSELF-GENERATED and PROVISIONAL. Cross-prosecutor claim alignment cannot be assumed until an\\nupstream Claim Extraction / Inflation Map is produced.\\\"\\n\\nThen create only this minimum fallback:\\n\\nCLAIM MAP: SELF-GENERATED  -  PROVISIONAL\\n- Field 1  -  What was literally measured:\\n- Field 3  -  Weaker defensible claim:\\n- Field 6  -  Claim under audit:\\n\\nDo not invent the missing upstream fields. Do not present this fallback as equivalent to the\\nupstream map. Its purpose is to permit a one-off audit, not to replace Stage 1. Before this\\naudit is combined with the other prosecutors, the claim must be reconciled against an upstream\\nmap.\\n\\nYOU AUDIT THE CLAIM NAMED IN FIELD 6 OF THE MAP. Do not substitute the source's broadest\\nstatement, the media version, or a claim you find more interesting. If field 6 targets a\\ndownstream restatement, your findings concern that downstream layer rather than the source\\ndocument itself; say so explicitly.\\n\\nIf you find yourself auditing a claim that is not on the map, flag it rather than substituting\\nsilently:\\n\\n\\\"MAP GAP: this finding concerns [claim], which does not appear on the claim map. The map may\\nbe incomplete.\\\"\\n\\nThat flag is information, not an error. Silent substitution is what makes different\\nprosecutors produce incoherent critiques.\\n\\n-----\\n\\nCOMPACT VOCABULARY Full rules: shared_primitives.txt\\n\\nVERIFICATION STATE  -  how thoroughly a source has been checked. This is separate from\\nevidence type. A peer-reviewed study can be strong in evidence type while remaining weakly\\nverified.\\n\\n- LOCATED: source exists and metadata is confirmed; content is unverified.\\n- ABSTRACT-CONFIRMED: abstract supports relevance; methods and results are not verified.\\n- FULL-TEXT-CONFIRMED: full text was read and directly supports the specific claim. Do not\\n  assign this merely because selected excerpts were supplied.\\n- RECEPTION-CONFIRMED: replies, replications, corrections, retractions, or citation contexts\\n  were checked against retrieved sources.\\n- CONTESTED: credible disagreement exists; who is correct remains unresolved.\\n- REBUTTED: later work directly and substantially challenges the source and the challenge was\\n  not evidently answered.\\n- PROVISIONAL: access or retrieval is insufficient, including unverified model memory or\\n  unresolved source leads.\\n\\nRules:\\n\\n1. Never report a verification state above what was actually checked.\\n2. Evidence type and verification state are separate axes; report both.\\n3. FULL-TEXT-CONFIRMED and RECEPTION-CONFIRMED may both apply.\\n4. Apply the ladder symmetrically to sources supporting and opposing the claim.\\n5. A PROVISIONAL source may not anchor a MAJOR or FATAL finding.\\n\\n-----------------------------------------------------------------\\nSOURCE RETRIEVAL-BASIS PREFLIGHT \\u2014 MANDATORY, UNCONDITIONAL ON VERDICT\\n  [FAIL-CV-006]\\n-----------------------------------------------------------------\\n\\nState this before Section 1, regardless of what the audit concludes:\\n\\n  SOURCE RETRIEVAL BASIS: [full text fetched from \\u2014 cite source / abstract only /\\n  recalled from training data, explicitly flagged as such / mixed \\u2014 specify which\\n  sections were retrieved versus recalled]\\n\\nThis declaration is REQUIRED even when the audit produces no findings and returns a clean\\nacquittal. Rule 6 of the Final Standardized Finding Table \\u2014 an empty table is a valid output\\nwhen nothing of consequence was found \\u2014 does NOT exempt this line. An empty finding table\\nwith no stated retrieval basis is not a valid output.\\n\\nFor every SPECIFIC load-bearing number quoted anywhere in this audit \\u2014 dosing, sample size,\\neffect size, percentages, NNT, or any other figure a reader could independently check \\u2014 state\\nits verification state individually, inline or in a compact table:\\n\\n| Specific figure | Value stated | Verification state | Source |\\n|---|---|---|---|\\n\\nA figure recalled from training data and not independently checked against a retrieved source\\nmust be marked PROVISIONAL, even if it turns out to be correct. Being right by recall is not\\nthe same claim as being right by retrieval. This audit must make that distinction inspectable,\\nnot merely produce a correct-looking number.\\n\\nMULTIPLE SOURCES REPEATING THE SAME FIGURE IS NOT INDEPENDENT VERIFICATION. If several\\nretrieved documents state the same number, check whether they share a common upstream origin\\n\\u2014 for example, multiple database mirrors of the same abstract \\u2014 before treating agreement as\\ncorroboration. Apparent corroboration from one syndicated source is not stronger evidence\\nthan a single retrieval; it is the same evidence encountered more than once.\\n\\nThis preflight applies with equal force whether the audit is heading toward a DEFEATS finding,\\na NARROWS finding, or Verdict A with no findings at all. Retrieval basis is a property of how\\nthe audit was conducted, not of what it concluded.\\n\\nCONSTRUCT-SIDE RETRIEVAL GATE  [P1; FAIL-CV-003, FAIL-CV-004]\\n\\nCANONICAL RULE. The compact copies in claim extraction and construct validity,\\nand every local execution copy, must move together.\\n\\nEvery construct-side check prosecutes specifics that can be supplied from\\nmemory - what a scale contains, whether a property is established, whether a\\nbelief is accurate. Do not. Rate each on retrieved source material only.\\n\\nCANONICAL CONSTRUCT PROPERTIES\\n\\nUse these five property names everywhere:\\n\\n  PREVALENCE\\n  FORM\\n  DOMAIN\\n  WRONGNESS\\n  HARM\\n\\nConstruct-property status:\\n\\n  ESTABLISHED-REPORTED\\n    The paper measures or reports the property in fetched text.\\n\\n  ESTABLISHED-CITED\\n    The property is established in cited prior work that you actually checked.\\n\\n  ASSERTED\\n    You fetched where establishment would appear - the introduction and relevant\\n    citations - and establishment is absent.\\n\\n  UNKNOWN\\n    You did not fetch where establishment would appear, such as an abstract-only\\n    or snippet-only run.\\n\\nMAP / PROSECUTOR DIVISION\\n\\nThe claim map deliberately hands off ESTABLISHED-CITED as a coarse retrieval\\nstatus. The construct prosecutor must then classify whether the cited support is\\ncontested or uncontested in the respect the paper requires. Do not duplicate that\\njudgment into the map.\\n\\nOperationalization retrieval basis:\\n\\n  ITEMS-RETRIEVED\\n    The actual items, coding rules, or inclusion criteria were fetched and read.\\n\\n  ITEMS-INFERRED\\n    The assessment is based on the scale's name, family, or a related scale.\\n\\nITEMS-* values state RETRIEVAL BASIS. They are not competing scope outcomes.\\n\\nOperationalization scope result:\\n\\n  coextensive\\n  narrower\\n  broader\\n  UNKNOWN\\n\\nITEMS-RETRIEVED permits coextensive / narrower / broader classification.\\nITEMS-INFERRED requires the resulting scope status UNKNOWN.\\n\\nHARD RULE\\n\\nA construct-side finding may be load-bearing, MAJOR, or FATAL only when it rests\\non ESTABLISHED-REPORTED, ESTABLISHED-CITED, ASSERTED, or ITEMS-RETRIEVED.\\n\\nAnything resting on UNKNOWN or ITEMS-INFERRED receives finding disposition\\nPROVISIONAL, may not be load-bearing, and may not be rated MAJOR or FATAL.\\n\\nState the retrieval basis for every construct-side finding.\\n\\nGRADE-BEFORE-ASSERT  [P2; GUARD-006]\\n\\nCANONICAL RULE. The compact copies in claim extraction and construct validity,\\nand every local execution copy, must move together.\\n\\nBefore rating a belief \\\"wrong,\\\" or rating an accurate version as pathologized,\\ngrade the SPECIFIC belief using this closed vocabulary:\\n\\n  ESTABLISHED-FALSE\\n  GRADE-CONTESTED\\n  FRINGE\\n  ESTABLISHED-ACCURATE\\n\\nA wrongness finding - the paper under-grades its target - fires at strength only\\nwhere a named sub-claim is ESTABLISHED-FALSE.\\n\\nA pathologization finding - the scale penalizes an accurate version - fires at\\nstrength only where the penalized version is ESTABLISHED-ACCURATE.\\n\\nP2 is a STRENGTH GATE, not a severity vocabulary:\\n\\n  STRONG\\n    The relevant pole is established: ESTABLISHED-FALSE for a wrongness finding,\\n    or ESTABLISHED-ACCURATE for a pathologization finding.\\n\\n  WEAK\\n    The specific belief is GRADE-CONTESTED or FRINGE. Severity is capped MINOR\\n    and the finding may not anchor the verdict.\\n\\n  VOID\\n    No specific sub-claim was graded, or retrieval is insufficient to place it\\n    on the spectrum. Severity is NONE and the finding is dropped.\\n\\nApply this symmetrically. Do not assert that the paper's target is settled-wrong,\\nand do not assert that a penalized belief is settled-accurate, without the\\nrequired grade. \\\"The construct is contested\\\" alone is not a finding.\\n\\nFAILURE LOCATION  -  where the failure actually lives:\\n\\n- PAPER: the source itself overclaims or uses an invalid proxy.\\n- CITATION: the source is defensible but later literature inflates it.\\n- PR / MEDIA: a press release or coverage strips caveats or broadens the claim.\\n- MODEL / RETRIEVAL: summarizers or search systems reproduce the inflated version.\\n- MIXED: more than one layer contributes; specify which layer contributes what.\\n\\nAttacking a defensible paper for its press release is a category error. Classify the\\nresponsible layer honestly.\\n\\n-----\\n\\nAUDIT INSTRUCTIONS\\n\\nYou are auditing construct validity.\\n\\nDo not begin by balancing the source with generic praise.\\n\\nDo not add reassurance clauses unless they are doing real evidentiary work.\\n\\nDo not use phrases like \\\"it is important to acknowledge\\\" or \\\"this does not invalidate\\\" unless\\nthe qualification is necessary to prevent factual overstatement.\\n\\nDo not soften \\\"invalid proxy\\\" into \\\"limited proxy\\\" if the measurement cannot support the\\nclaim.\\n\\nDo not treat peer review, citation count, or institutional adoption as evidence that the\\nconstruct was measured correctly.\\n\\nAnswer the following sections.\\n\\nAPPLICABLE-CHECKS NOTE\\n\\nNot every check applies to every document type. Before Section 1, state:\\n\\n- Target document type:\\n- Sections that apply:\\n- Sections that are N/A, with one-line reasons:\\n\\nExamples: a news article has no methods section to audit for operationalization detail; audit\\nwhether the reported claim matches the study or evidence it cites. A policy document may\\ncontain no original measurement; audit the evidence base on which it rests. Firing irrelevant\\nchecks produces noise that buries the real findings.\\n\\n-----\\n\\n1. CLAIM MAP (received; degraded fallback only when absent)\\n\\nClaim extraction belongs upstream so all three prosecutor stages audit the same claim. The\\nSELF-GENERATED path is a degraded standalone accommodation, not a co-equal workflow.\\n\\nIf an upstream map was supplied, do not regenerate it. Confirm in one line each:\\n\\n- Claim under audit (map field 6):\\n- What was literally measured (map field 1):\\n- Weaker defensible claim (map field 3):\\n- Target layer: source claim / downstream citation / PR-media / model-retrieval\\n\\nIf no upstream map was supplied, repeat the degraded-mode warning, use the minimum\\nSELF-GENERATED  -  PROVISIONAL map created above, and confirm the same four items. State that\\ncross-stage alignment remains unresolved.\\n\\nFlag any disagreement with the map:\\n\\n\\\"MAP DISAGREEMENT: the map records [X]; I read the operationalization as [Y].\\\"\\n\\nDo not silently override the map. A disagreement may indicate that the source's\\noperationalization is ambiguous, which can itself be relevant to construct validity.\\n\\nContinue to CONSTRUCT ESTABLISHMENT and then MEASUREMENT EXTRACTION with the mapped claim as\\nthe target.\\n\\n-----\\n\\n1A. CONSTRUCT ESTABLISHMENT  [FAIL-CV-002, FAIL-CV-003]\\n\\nRun this section BEFORE Measurement Extraction. It prosecutes the construct\\nitself, not merely the paper's use of it.\\n\\nUse the canonical property names from [P1]:\\n\\n  PREVALENCE / FORM / DOMAIN / WRONGNESS / HARM\\n\\nSkip with one line -\\n\\n  \\\"no normative or causal construct claim; section not triggered\\\"\\n\\n- if the paper makes no normative or causal claim about the construct.\\n\\nCreate this table first:\\n\\n| Property | Claim-map status | Does the normative / causal claim depend on it? | ESTABLISHED-CITED prosecutor split | Evidence and exact inferential load | Finding disposition |\\n|---|---|---|---|---|---|\\n| PREVALENCE | | | uncontested-in-respect-required / contested-in-respect-required / N/A | | |\\n| FORM | | | uncontested-in-respect-required / contested-in-respect-required / N/A | | |\\n| DOMAIN | | | uncontested-in-respect-required / contested-in-respect-required / N/A | | |\\n| WRONGNESS | | | uncontested-in-respect-required / contested-in-respect-required / N/A | | |\\n| HARM | | | uncontested-in-respect-required / contested-in-respect-required / N/A | | |\\n\\n1. DEPENDENCE\\n\\nFor each property the claim map marked ASSERTED, state whether the paper's\\nnormative or causal claim DEPENDS on it. Dependence controls severity: a\\nload-bearing ASSERTED property can support a MAJOR or FATAL finding.\\n\\n2. RETRIEVAL CAP\\n\\nApply [P1]. A property marked UNKNOWN receives finding disposition PROVISIONAL\\nand may not be load-bearing. State this section's retrieval depth exactly:\\n\\n  \\\"assessed from [abstract / full text / introduction plus citations checked].\\\"\\n\\nAbstract-only means construct properties default UNKNOWN. That produces a\\nPROVISIONAL gap, not a confirmed absence.\\n\\n3. ESTABLISHED-CITED PROSECUTOR SPLIT\\n\\nThe claim-map handoff is deliberately coarse. For every ESTABLISHED-CITED\\nproperty, the construct prosecutor must classify it as:\\n\\n- uncontested in the respect the paper requires; or\\n- contested in the respect the paper requires.\\n\\nA citation licenses the bounded finding it reports, not every causal or normative\\nload placed on it. If the paper uses a real citation to underwrite a stronger\\nclaim than the citation supports, name:\\n\\n- the specific citation;\\n- the bounded result it supports;\\n- the exact stronger load placed on it.\\n\\nExample: \\\"belief X correlates with prejudice measure Y\\\" does not by itself\\nlicense \\\"reducing X's scale reduces racism.\\\"\\n\\n\\\"The field is insulated\\\" is not a finding.\\n\\n4. NOT-FIRING CONDITION - MANDATORY\\n\\nIf the relevant properties are ESTABLISHED-REPORTED or ESTABLISHED-CITED and\\nuncontested in the respect the paper requires, write:\\n\\n  \\\"construct adequately established\\\"\\n\\nand raise no construct-establishment finding.\\n\\n5. CONCEDE TEST\\n\\nA surviving narrower statement may be:\\n\\n  \\\"The intervention reduced scores on a construct whose [named properties] the\\n  paper does not establish.\\\"\\n\\n6. OUTPUT OWNERSHIP\\n\\nGive this section its OWN standardized finding-table row and OWN severity. Use\\nthe canonical failure-mode name:\\n\\n  Construct-establishment gap\\n\\nDo not bury it in a closing aside.\\n\\n-----\\n\\n2. MEASUREMENT EXTRACTION\\n\\nState exactly what was measured.\\n\\nInclude:\\n\\n- Sample size\\n- Population studied\\n- Recruitment method\\n- Task, instrument, proxy, survey, administrative measure, or dataset used\\n- Time scale\\n- Outcome variable\\n- Control variables\\n- Exclusions\\n- What was not measured\\n\\nThen answer:\\n\\n- Is the measured variable direct evidence of the claimed construct?\\n- Or is it a proxy?\\n- If it is a proxy, how close is the proxy to the target construct?\\n\\nDEFINITION-OPERATIONALIZATION CHECK  [FAIL-CV-001, FAIL-CV-004]\\n\\nRun the same check as the claim map under [P1].\\n\\nCANONICAL VOCABULARY - this local copy must match [P1]:\\n\\n- quote the source's explicit definition;\\n- retrieve and list the actual scale items, coding rules, or inclusion criteria;\\n- record Operationalization retrieval basis:\\n  ITEMS-RETRIEVED / ITEMS-INFERRED;\\n- record Operationalization scope result:\\n  coextensive / narrower / broader / UNKNOWN.\\n\\nIf ITEMS-INFERRED, the scope result is UNKNOWN. Do not classify it coextensive,\\nnarrower, or broader.\\n\\nInferring a scale's contents from its name, family, or a related scale is barred\\nbecause it manufactures false scope creep.\\n\\nIf ITEMS-RETRIEVED, classify it coextensive / narrower / broader.\\n\\nIf broader, list every specific out-of-scope item and record:\\n\\n  Failure mode: Definition-operationalization mismatch\\n  Subtype: definitional scope creep\\n\\nThen ask:\\n\\nDoes the operationalization pathologize, penalize, or score as positive any\\naccurate, nuanced, or empirically supported version of the phenomenon?\\n\\n- This requires ITEMS-RETRIEVED. No pathologization finding may rest on inferred\\n  items.\\n- Apply [P2] to the specific penalized version.\\n- ESTABLISHED-ACCURATE produces P2 strength STRONG.\\n- GRADE-CONTESTED or FRINGE produces P2 strength WEAK and caps severity MINOR.\\n- No specific graded sub-claim, or insufficient retrieval, produces P2 strength\\n  VOID, severity NONE, and the finding is dropped.\\n\\n-----\\n\\n3. CLAIM VS. MEASUREMENT TABLE\\n\\nCreate a table with these columns:\\n\\nMeasured variable | Claimed construct | Are they the same? | Gap | Severity | Notes\\n\\nUse the exact standardized severity enum:\\n\\n- none\\n- minor\\n- moderate\\n- major\\n- fatal-for-strong-claim\\n\\nPut mechanism-specific wording in Gap or Notes, not in Severity. Examples\\ninclude proxy gap, construct mismatch, fatal proxy failure, and\\ndefinition-operationalization mismatch.\\n\\nDefinitional scope creep is a subtype of\\nDefinition-operationalization mismatch. It is not a severity value.\\n\\nUse the strongest severity justified by the evidence.\\n\\nA Definition-operationalization mismatch takes its OWN ROW. Where the same item\\nmismatch also supports a broader proxy finding, preserve both labels for\\ntraceability but identify them as one underlying mechanism; do not count them as\\ntwo independent levers.\\n\\nDo not understate the severity to sound balanced.\\n\\n-----\\n\\n4. LEVEL-OF-ANALYSIS CHECK\\n\\nAt what level was the evidence collected?\\n\\nExamples:\\n\\n- Laboratory task\\n- Survey respondents\\n- Self-report\\n- Administrative records\\n- Clinical sample\\n- Amateur population\\n- Intermediate-skill population\\n- Elite population\\n- Institutional metric\\n- Real-world field outcome\\n- Longitudinal behavioral data\\n- Natural experiment\\n\\nAt what level is the claim being applied?\\n\\nExamples:\\n\\n- Elite performance\\n- Professional behavior\\n- Population-level policy\\n- Clinical guideline\\n- Institutional intervention\\n- Group outcome gap\\n- Long-term social outcome\\n- Mechanistic causal claim\\n\\nThen answer:\\n\\n- What assumptions are required to bridge the evidence level to the claim level?\\n- Are those assumptions tested?\\n- Are they merely implied?\\n- Would a domain expert accept the bridge as valid?\\n\\n-----\\n\\n5. CONFOUND AUDIT\\n\\nIdentify obvious confounds.\\n\\nAsk:\\n\\n- What variables could explain the measured outcome besides the proposed explanation?\\n- What confounds would a practitioner, clinician, performer, or domain expert immediately\\n  notice?\\n- Did the authors control for these confounds?\\n- Did the authors acknowledge them?\\n- Did later citations forget the confounds?\\n- Would the omitted confounds change the interpretation?\\n\\nClassify each confound:\\n\\nConfound | Domain obvious? | Controlled? | Acknowledged? | Impact if omitted\\n\\nImpact options:\\n\\n- Low\\n- Moderate\\n- High\\n- Fatal for the strong claim\\n\\n-----\\n\\n6. ECOLOGICAL VALIDITY CHECK\\n\\nAsk:\\n\\n- Does the task resemble the real-world phenomenon being explained?\\n- Does the sample resemble the population the claim is applied to?\\n- Does the time scale match the real process?\\n- Does the measured behavior occur under realistic pressure, incentives, constraints, or\\n  selection?\\n- Is the study measuring performance, stated belief, compliance, perception, or institutional\\n  output?\\n- Are those being conflated?\\n\\nVerdict:\\n\\n- High ecological validity\\n- Moderate ecological validity\\n- Low ecological validity\\n- Ecologically valid only for a narrower claim\\n- Not ecologically valid for the claim being made\\n\\n-----\\n\\n7. DECISIVE-TEST CHECK\\n\\nWhat test would directly measure the claimed construct?\\n\\nAnswer:\\n\\n- What would the decisive test measure?\\n- What population would it study?\\n- What controls would be required?\\n- What outcome would support the source's claim?\\n- What outcome would weaken or falsify the source's claim?\\n- Does the current source run that test?\\n- If not, does the field acknowledge that the decisive test has not been run?\\n\\nThen state:\\n\\n\\\"The decisive test would be: [ONE-SENTENCE TEST SPECIFICATION].\\\"\\n\\n-----\\n\\n8. CROSS-REANALYSIS OBJECT CHECK\\n\\nIf two or more independent reanalyses, replications, or critiques reach different conclusions\\nabout the source, before treating them as agreeing or conflicting, check what each one\\nactually tested.\\n\\nAsk:\\n\\n- Did each reanalysis test the same object  -  the full result, a single component, a specific\\n  subgroup, a specific time window?\\n- Or did they test different objects that only sound like the same dispute?\\n- Is apparent disagreement actually a scope mismatch rather than a genuine unresolved\\n  question?\\n- Is apparent convergence masking that the harder or more specific version of the question was\\n  never independently re-tested?\\n\\nState plainly: for each pair of reanalyses in tension, are they actually contradicting each\\nother, or talking past each other?\\n\\nDo not report a dispute as \\\"resolved\\\" or \\\"settled\\\" if the reanalyses that appear to resolve it\\ntested a narrower or different claim than the one in question. Do not report a dispute as\\n\\\"ongoing\\\" if it is actually two non-competing findings about different objects.\\n\\n-----\\n\\n9. CITATION-USE AUDIT\\n\\nIf later papers, institutions, or commentators cite this source:\\n\\nAsk:\\n\\n- Are they citing the actual finding?\\n- Are they citing an inflated version of the finding?\\n- Are they using the source as evidence, or as a premise?\\n- Does the source become stronger through repetition than it was in the original methods?\\n- Does the citation network preserve the source's limitations?\\n- Does the network drop the limitations and retain only the conclusion?\\n\\nClassify the downstream use:\\n\\n- Accurate citation\\n- Slightly inflated citation\\n- Major inflation\\n- Citation laundering\\n- Premise laundering\\n- Unsupported consensus construction\\n\\n-----\\n\\n10. IGNORED-LITERATURE CHECK\\n\\nAsk:\\n\\n- What adjacent literatures should have been cited?\\n- What domain-specific literatures are directly relevant?\\n- What practitioner knowledge would identify obvious confounds?\\n- Did the source cite those literatures?\\n- Did later reviews or hubs cite them?\\n- Are there contrary findings that were available but structurally ignored?\\n\\nCreate a table:\\n\\nIgnored literature / evidence | Why it matters | Was it cited? | Effect of omission\\n\\nEffect options:\\n\\n- Minor context loss\\n- Moderate weakness\\n- Major evidentiary gap\\n- Fatal omission for the strong claim\\n\\n-----\\n\\n11. EVIDENCE-TYPE, VERIFICATION, AND FAILURE-LOCATION CHECK\\n\\nDo not collapse source type, measurement role, verification state, and failure location into\\none label. Assign them separately.\\n\\nA. Evidence type:\\n\\n- Primary empirical evidence\\n- Secondary synthesis\\n- Systematic review / meta-analysis\\n- Policy document / guideline\\n- Practitioner / domain observation\\n- Public reporting / journalism\\n- Community observation / anecdotal lead\\n- Conceptual / theoretical source\\n- Author inference\\n\\nB. Measurement role:\\n\\n- Direct measure\\n- Proxy evidence\\n- Conceptual claim\\n- Citation-dependent premise\\n- Other measurement role\\n\\nFailure modes are classified separately in Section 16. Do not place a Section 16\\nfailure-mode label in this Measurement role field.\\n\\nC. Verification state:\\n\\nUse the compact vocabulary above. An unresolved source lead is PROVISIONAL; once its metadata\\nis confirmed but its content remains unread, it is LOCATED.\\n\\nD. Failure location:\\n\\nPAPER / CITATION / PR-MEDIA / MODEL-RETRIEVAL / MIXED.\\n\\nCreate a table:\\n\\n| Claim or evidence item | Evidence type | Measurement role | Verification state | Failure location | Directly measured / inferred / speculative | Source audit required? |\\n|---|---|---|---|---|---|---|\\n\\nThen state:\\n\\n- Which claims are directly measured?\\n- Which claims are inferred?\\n- Which claims are speculative?\\n- Which claims require a source or reception audit before publication?\\n\\n-----\\n\\n12. INTERNAL CONSISTENCY CHECK\\n\\nBefore finalizing the verdict, reread this audit's own sections for contradictory resolution\\nlanguage about the same dispute, finding, or reanalysis  -  for example, calling something\\n\\\"resolved\\\" in one section and \\\"contested\\\" or \\\"disputed\\\" in another.\\n\\nIf found:\\n\\n- State which characterization is accurate.\\n- State why the inconsistent phrasing occurred (e.g., borrowing the framing of one source\\n  without checking it against another section of this same audit).\\n\\nDo not let a downstream section (e.g., a confound table entry or citation-use note) carry a\\nmore confident or more hedged resolution status than the Decisive-Test Check and Verdict\\nsections actually support. All resolution-status language in this audit should agree with\\nitself.\\n\\n-----\\n\\n13. THE CONCEDE TEST\\n\\nRun this on every proposed finding before rating severity or choosing the verdict.\\n\\nFor each finding, ask:\\n\\nIF THIS FINDING WERE FULLY CONCEDED  -  granted entirely, with no argument  -  WOULD THE CLAIM\\nUNDER AUDIT STILL STAND?\\n\\n- SURVIVES: the claim still holds. This is a limitation, not a defeater. Report it, but it may\\n  not be rated MAJOR or FATAL and may not anchor the verdict.\\n- NARROWS: the claim survives only in smaller scope, such as a different population, weaker\\n  effect, or narrower conditions. State the surviving claim explicitly.\\n- DEFEATS: the audited claim does not follow. This is load-bearing.\\n\\nCreate a table:\\n\\n| Finding | Concede test: SURVIVES / NARROWS / DEFEATS | Surviving claim if NARROWS |\\n|---|---|---|\\n\\nThis test separates limitations from claim-defeating failures without softening either.\\n\\nIt cuts both ways:\\n\\n- A DEFEATS result strengthens a finding by showing it is load-bearing.\\n- A SURVIVES result shows that the finding cannot carry the verdict.\\n- Do not turn a raw count of overlapping limitations into a claim-defeating verdict.\\n  Consolidate duplicated findings and judge what scope the claim actually retains.\\n\\nSCOPE-LOSS ASSESSMENT  -  REQUIRED FOR EVERY NARROWS RESULT\\n\\nDo not map verdicts by counting NARROWS findings. State how much of the audited claim survives\\nafter the finding is conceded:\\n\\n- INCIDENTAL NARROWING: wording, boundary conditions, or precision changes, but the claim\\n  remains substantially the same in population, construct, direction, and practical use. This\\n  ordinarily supports verdict B, not C.\\n- MATERIAL NARROWING: the claim survives only for a meaningfully smaller population, weaker\\n  construct, shorter time horizon, reduced effect, or more limited application. The strong\\n  claim is invalid, but a useful narrower claim remains. This supports verdict C.\\n- NEAR-DEFEAT NARROWING: only a trivial, tautological, or practically different remainder\\n  survives. Do not use NARROWS to avoid DEFEATS. Reclassify as DEFEATS if the surviving\\n  proposition no longer does the work for which the audited claim is being used.\\n\\nFor each NARROWS result, add:\\n\\n| Finding | Scope-loss level | Original claim | Surviving claim | What practical or inferential work is lost? |\\n|---|---|---|---|---|\\n\\nVERDICT MAPPING:\\n\\n- No DEFEATS and no MATERIAL NARROWING: use A or B according to the remaining limitations and\\n  evidentiary strength.\\n- One or more MATERIAL NARROWING findings and no DEFEATS: use C.\\n- One or more DEFEATS: use D, E, or F according to the mechanism, severity, and failure\\n  location.\\n- If evidence is insufficient to run the test reliably: use G.\\n\\nThe decisive question is not how many findings narrow the claim. It is whether the surviving\\nclaim remains substantially the claim named in map field 6 and can still support the use under\\naudit.\\n\\nDo not use the concede test to cut findings merely because they are limitations. Report them,\\nbut enforce the severity cap.\\n\\n-----\\n\\n14. VERDICT\\n\\nDo not return one letter when any finding is DEFEATS. Output a split claim-space object:\\n\\n- Claim under audit: VALID / USEFUL-FOR-NARROWER / INVALID\\n- DEFEATS finding(s), if any:\\n- Failure mechanism: none / major proxy failure / fatal construct-validity failure /\\n  citation-laundered premise / insufficient information\\n- Surviving residual: [the exact narrowed claim left standing] OR \\\"none\\\"\\n- Residual usefulness grade: A / B / C / G / none\\n\\nResidual usefulness grades:\\n\\nA. Valid evidence for the residual claim. B. Partial evidence with clear limits. C. Useful for\\nthe stated narrower residual, invalid for the stronger claim. G. Insufficient information to\\njudge.\\n\\n\\\"None\\\" is a REQUIRED, reachable output. A DEFEATS finding does not guarantee a usable\\nresidual. A proxy can fail so completely that nothing underneath is useful. Do not manufacture\\na comforting residual.\\n\\nDerive the object from the Concede Test rather than from the number or rhetorical force of\\nfindings. Explain it in 3-6 sentences.\\n\\nWorked example:\\n\\n- Claim under audit: INVALID - \\\"reduces unscientific genetic essentialism and thereby racism.\\\"\\n- DEFEATS finding: the proxy move from scale scores to racism.\\n- Failure mechanism: fatal construct-validity failure for the strong claim.\\n- Surviving residual: \\\"The curriculum can lower scores on the authors' essentialism-related\\n  scales relative to Mendelian instruction in these student samples.\\\"\\n- Residual usefulness grade: C.\\n\\nDo not hedge unless the evidence requires it. If the residual is none, say none. If confidence\\nor dispute-resolution language differs from an earlier section, resolve the discrepancy here\\nand state which characterization is correct.\\n\\n15. PAPER-SAFE WORDING\\n\\nWrite four versions:\\n\\nA. Neutral summary sentence:\\n\\n[One sentence accurately summarizing what the source found.]\\n\\nB. Direct methodological critique:\\n\\n[One sentence stating the main measurement/construct problem.]\\n\\nC. Strong adversarial version:\\n\\n[One sharper sentence suitable for a methodological challenge.]\\n\\nD. Decisive-test sentence:\\n\\n[One sentence saying what evidence would actually settle the question.]\\n\\n-----\\n\\n16. FAILURE-MODE CLASSIFICATION\\n\\nThis is the canonical failure-mode taxonomy used by the final standardized\\nfinding table.\\n\\nMark which failure modes are present:\\n\\n[ ] Untested premise\\n\\n[ ] Proxy problem\\n\\n[ ] Weak proxy\\n\\n[ ] Fatal proxy failure\\n\\n[ ] Level-of-analysis error\\n\\n[ ] Ecological-validity failure\\n\\n[ ] Omitted confound\\n\\n[ ] Citation laundering\\n\\n[ ] Premise laundering\\n\\n[ ] Ignored adjacent literature\\n\\n[ ] Missing decisive test\\n\\n[ ] Intervention ratchet\\n\\n[ ] Institutional measurement gap\\n\\n[ ] Definition-operationalization mismatch\\n    Subtype, if applicable: definitional scope creep\\n\\n[ ] Operationalization pathologizes an accurate or nuanced version of the\\n    construct\\n    Record the [P2] grade and STRONG / WEAK / VOID result.\\n\\n[ ] Construct-establishment gap\\n    Property: prevalence / form / domain / wrongness / harm\\n    Status: ESTABLISHED-REPORTED / ESTABLISHED-CITED / ASSERTED / UNKNOWN\\n    For WRONGNESS, name the specific sub-claim and [P2] grade rather than using\\n    a wholesale label.\\n\\n[ ] Motive claim unsupported\\n\\nFor each checked failure mode, give one sentence explaining why.\\n\\nThen report verification flags separately:\\n\\n[ ] Load-bearing evidence remains PROVISIONAL\\n\\n[ ] Full source required\\n\\n[ ] Reception check required\\n\\nIf a motive claim is supported by public record or policy architecture, state\\nthat as evidence status rather than marking it as a failure mode.\\n\\n-----\\n\\n17. FINAL OUTPUT FORMAT\\n\\nImmediately before the final standardized finding table, provide this concise summary:\\n\\n- Claim under audit status: VALID / USEFUL-FOR-NARROWER / INVALID\\n- DEFEATS finding(s), if any:\\n- Surviving residual: exact narrowed claim OR none\\n- Residual usefulness grade: A / B / C / G / none\\n- Strongest defensible claim:\\n- Claim being overextended:\\n- Definition-operationalization mismatch (if present): scope result\\n  coextensive / narrower / broader / UNKNOWN; subtype, if any\\n- Construct-establishment gap (if present): canonical property; claim-map status;\\n  dependence; and, for ESTABLISHED-CITED, contested-in-respect-required or\\n  uncontested-in-respect-required\\n- Grade-before-assert outcome (if applicable): specific sub-claim; [P2] grade;\\n  STRONG / WEAK / VOID\\n- Main proxy problem:\\n- Main level-of-analysis problem:\\n- Main omitted confound:\\n- Decisive test:\\n- Citation-use verdict:\\n- Load-bearing finding(s):\\n- Concede-test result:\\n- Failure location:\\n- Overall verdict:\\n- Confidence level:\\n- What would change this assessment:\\n\\nConfidence levels:\\n\\n- Low\\n- Moderate\\n- High\\n\\n-----\\n\\nREMINDER\\n\\nSuspicion, practitioner frustration, political disagreement, and anecdotes can be valid\\ndiscovery tools. They are often how domain experts notice that a literature does not match\\nreality.\\n\\nBut they are not final evidence.\\n\\nYou may begin with vibes.\\n\\nYou may not end with vibes.\\n\\nStart wherever the anomaly appears.\\n\\nFinish with receipts.\\n\\n-----\\n\\nFINAL SECTION: STANDARDIZED FINDING TABLE\\n\\nThis summarizes findings already produced above. It does not replace the detailed sections. It\\nis the inspectable layer read by the human adjudicator and the counter-audit.\\n\\nYou are a one-directional prosecutor, and that is correct. An aggressive prosecutor still\\nproduces receipts. The two falsifiability columns are mandatory: naming what would undercut a\\nfinding does not weaken it; it makes it checkable.\\n\\nOne row per finding:\\n\\n| Field | Entry |\\n|---|---|\\n| Finding | One sentence |\\n| Target claim | Claim map field 6 |\\n| What was measured | Actual operationalization |\\n| What was claimed | Assertion the measurement is used to support |\\n| Failure mode | Select one canonical value from Section 16 |\\n| Failure-mode subtype | e.g. definitional scope creep, or N/A |\\n| Severity | none / minor / moderate / major / fatal-for-strong-claim |\\n| Concede test | SURVIVES / NARROWS / DEFEATS |\\n| Scope loss if NARROWS | incidental / material / near-defeat, plus surviving claim |\\n| Construct property | prevalence / form / domain / wrongness / harm / N/A |\\n| Construct-property status | ESTABLISHED-REPORTED / ESTABLISHED-CITED / ASSERTED / UNKNOWN / N/A |\\n| ESTABLISHED-CITED prosecutor split | uncontested-in-respect-required / contested-in-respect-required / N/A |\\n| Operationalization retrieval basis | ITEMS-RETRIEVED / ITEMS-INFERRED / N/A |\\n| Operationalization scope result | coextensive / narrower / broader / UNKNOWN / N/A |\\n| P2 belief grade | ESTABLISHED-FALSE / GRADE-CONTESTED / FRINGE / ESTABLISHED-ACCURATE / N/A |\\n| P2 strength gate | STRONG / WEAK / VOID / N/A |\\n| Evidence | Section, table, figure, passage, or data |\\n| Evidence type | primary study / replication / meta-analysis / methodological critique / policy document / practitioner / journalism / commentary / theoretical / author inference |\\n| Verification state | Evidence-quality state from the compact vocabulary |\\n| Possible innocent explanation | MANDATORY - strongest non-damning reading; if none, write \\\"none identified\\\" |\\n| What would weaken this | MANDATORY - specific evidence that would undercut it |\\n| Failure location | PAPER / CITATION / PR-MEDIA / MODEL-RETRIEVAL / MIXED |\\n| Finding disposition | CONFIRMED / CONTESTED / PROVISIONAL |\\n\\nAXIS DEFINITIONS\\n\\nVerification state describes how thoroughly the evidence item was retrieved and\\nchecked.\\n\\nFinding disposition describes the row's current adjudicative state:\\n\\n  CONFIRMED\\n    The retrieved evidence and the audit's stated reasoning support the finding\\n    as written.\\n\\n  CONTESTED\\n    The finding is supported but credible contrary evidence or interpretation\\n    remains unresolved.\\n\\n  PROVISIONAL\\n    Retrieval or source-chain work is incomplete. The finding may not be\\n    load-bearing or rated MAJOR or FATAL.\\n\\nThese axes may differ. For example, a source can be FULL-TEXT-CONFIRMED while\\nthe finding drawn from it remains CONTESTED.\\n\\nRULES\\n\\n1. A finding missing either mandatory falsifiability field is not inspectable and may not be\\n   rated MAJOR or FATAL.\\n2. Severity must agree with verification state, construct-side retrieval\\n   fields, P2 strength, and finding disposition. A PROVISIONAL finding cannot be\\n   MAJOR or FATAL. A P2-WEAK finding may not exceed MINOR. A P2-VOID finding has\\n   severity NONE and is dropped.\\n3. A SURVIVES finding cannot be MAJOR or FATAL and may not anchor the verdict.\\n4. A NARROWS finding must state the surviving claim and scope-loss level. A merely incidental\\n   narrowing does not by itself require verdict C.\\n5. Target claim must match field 6 of the shared Claim Map. Use MAP GAP rather than silently\\n   substituting another claim.\\n6. If no findings of consequence were produced, say so plainly and submit an empty table with\\n   a one-line statement. A prosecutor that never returns \\\"nothing of consequence here\\\" is not\\n   measuring anything. THIS DOES NOT WAIVE the Source Retrieval-Basis Preflight above \\u2014 an\\n   empty table still requires a stated retrieval basis and, where specific figures were relied\\n   upon in reaching the acquittal, their individual verification states.\\n\"},\"2-coverage-network\":{\"bytes\":132493,\"lines\":3360,\"path\":\"prompts/media-analysis/2-coverage-network.txt\",\"sha256\":\"ed61c3255d9a\",\"text\":\"COVERAGE NETWORK & SOURCE-CHAIN AUDIT \\u2014 MEDIA BRANCH\\nRC2 CONSOLIDATED CANDIDATE\\n====================================================\\nProsecutor stage. Document-type variant of the citation-network audit. Runs across MULTIPLE\\npieces covering the SAME event or claim.\\n\\nReferences: shared_primitives.txt Section 1 (verification states), Section 2 (finding table)\\nCompanion to: framing_construction_audit_media.txt (single-piece construction)\\n\\n-----------------------------------------------------------------\\nWHAT THIS AUDITS AND WHY IT'S DIFFERENT\\n-----------------------------------------------------------------\\n\\nThe single-piece framing audit asks: is this construction proportionate? That is a judgment\\nthe auditor has to assert.\\n\\nThis audit supplies a BASELINE. Across five outlets covering the same event, a verb choice\\nstops being the auditor's characterization and becomes an observable choice: three wrote \\\"drew\\na knife,\\\" one wrote \\\"produced a knife,\\\" one wrote \\\"allegedly had a knife.\\\" The variance is the\\nevidence.\\n\\nTwo questions this answers that a single piece cannot:\\n\\n  1. SOURCE INDEPENDENCE. If all coverage traces to one press release or one wire story, \\\"five\\n     outlets reported X\\\" is not automatically five independent confirmations. The network must\\n     distinguish common-source propagation, source-dependent interpretation, and claim\\n     amplification at the proposition level. This is the non-independence problem from the\\n     academic citation-network audit, with wire copy in place of a shared proxy network.\\n\\n  2. SHARED CORE vs. CONSTRUCTION. Facts every outlet reports are probably established.\\n     Material unique to one outlet is either a scoop or a choice. The divergence map separates\\n     them.\\n\\nWHAT THIS AUDIT CANNOT DO  -  STATE THIS IN THE OUTPUT: It maps how a story propagated and\\nwhere framings differ. It does NOT establish which framing is correct. \\\"Twelve outlets framed\\nit this way, three that way\\\" is a DISTRIBUTION, not a verdict. Majority coverage is not\\nevidence of accuracy  - especially when the majority shares one source. Adjudicating the\\nunderlying facts requires primary material, which is downstream of this audit and human.\\n\\n-----------------------------------------------------------------\\nINSTRUMENT PREFLIGHT \\u2014 MANDATORY FOR FORMAL / LOGGED RUNS   [TOOL-004]\\n-----------------------------------------------------------------\\n\\nThis prompt is part of the audit instrument. Establish the exact instrument version BEFORE\\nsubstantive retrieval, extraction, analysis, or verdict work begins.\\n\\nA successful fetch indicator, correct repository path, branch label, plausible line count,\\nmatching rendered metadata, or internally self-consistent page does NOT by itself establish\\nthat the intended/current artifact was retrieved. A mutable remote reference can return a\\nhistorical representation that is internally self-consistent in every visible field.\\n\\nPROMPT IDENTITY MARKERS\\n\\n  - COVERAGE NETWORK & SOURCE-CHAIN AUDIT \\u2014 MEDIA BRANCH\\n  - RC2 CONSOLIDATED CANDIDATE\\n  - [FAIL-MB-017]\\n  - PROMINENCE AND PACKAGING\\n  - [FAIL-MB-018]\\n  - SEMANTIC EQUIVALENCE AND EARNEDNESS GATE\\n\\nThese markers confirm the prompt family / expected structural features. They do NOT by\\nthemselves establish version currency: an older version may share the same title or markers.\\n\\n1. RECORD THE INSTRUMENT ACTUALLY IN CONTEXT.\\n\\n   Record, where available:\\n\\n   - canonical prompt path or supplied filename;\\n   - retrieval form: PASTED / ATTACHED / IMMUTABLE REMOTE / MUTABLE REMOTE;\\n   - requested branch or ref;\\n   - intended immutable commit/ref, if the run claims a repository version;\\n   - resolved commit SHA;\\n   - resolved blob/content hash, or a locally computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\n\\n-----------------------------------------------------------------\\nINPUTS\\n-----------------------------------------------------------------\\n\\nEvent or claim under audit: [One sentence. What happened, or what is asserted.]\\n\\nPieces to compare (minimum 3; 5-8 is better): For each: outlet, headline, publication date AND\\nTIME, full text or substantial excerpt, byline, wire attribution if any. [PASTE]\\n\\nPrimary source material, if available: [Police statement, press release, court filing,\\nofficial report, video, wire copy. If none available, write NONE  -  this bounds Section B\\nsubstantially.]\\n\\n  RETRIEVE BOTH FORMS IF THEY EXIST. Institutions frequently issue a WRITTEN release AND hold\\n  a SPOKEN briefing, and their wording differs. Outlets then inherit whichever they used.\\n  Without both, verb and descriptor divergence across outlets is uninterpretable  -  you\\n  cannot distinguish an editorial choice from document dependence. Note explicitly which forms\\n  you obtained and which you did not.\\n\\n\\nCompanion material already supplied, if any: [Linked or cited pieces, political-reaction\\ncoverage, historical precedents, source statements, video, transcripts, organizer material,\\nor other items materially relied upon by the audited coverage. If none, write NONE.]\\n\\nFixed-packet mode: [YES / NO]\\n\\n  YES\\n    Work only from the supplied packet. Do not retrieve additional material. Record any\\n    missing companion source as unavailable within the packet.\\n\\n  NO\\n    Apply the bounded Companion Retrieval procedure in COMPANION RETRIEVAL.\\n\\nSelection method  -  REQUIRED: How did you choose these pieces? Search terms, aggregator,\\noutlets you already read, outlets someone else compiled? [PASTE]\\n\\n  THIS MATTERS AND IS NOT A FORMALITY. A sample assembled from outlets you already distrust\\n  will show a pattern you already believe. See Section G, which audits this sample. If\\n  selection was not systematic, every distributional finding is PROVISIONAL and must be\\n  labeled so.\\n\\nYour prior on this topic: [Paste the operator prior verbatim, or NONE. If supplied,\\nit MUST be decomposed under PRIOR DECOMPOSITION AND MAPPING before the Investigation Register begins.\\nDo not compress it into one thematic prediction. If NONE is supplied, default\\nto NONE; do not generate a model prior unless a specific ambiguity cannot\\notherwise be interpreted.]\\n\\n\\nOptional investigation leads: [List operator-supplied hypotheses or questions,\\nor write NONE. If a prior framing / construction audit preceded this run, paste\\nits unresolved or network-testable findings and tag them PRIOR-STAGE GENERATED.\\nThe audit will assign Lead IDs and apply INVESTIGATION AND RESOLUTION MECHANICS.]\\n\\n\\n\\n=================================================================\\nPRIOR DECOMPOSITION AND MAPPING \\u2014 MANDATORY\\n=================================================================\\n\\nRun this block whenever an operator prior is supplied.\\n\\nDo not evaluate an operator prior as one thematic bundle.\\nBefore retrieval, decompose it into the smallest independently testable\\npropositions while preserving the operator's original wording, quantifiers,\\nsubjects, objects, comparison classes, conditions, and epistemic claims.\\n\\nIf the operator supplies no prior, write:\\n\\n  PRIOR SOURCE: NONE\\n  PRIOR MAPPING: NOT APPLICABLE\\n\\nand continue in neutral coverage mode. Do not generate a model prior unless a\\nspecific ambiguity cannot otherwise be interpreted. The default is NONE.\\n\\nREQUIRED PRIOR MAP\\n\\n| Prior ID | Exact operator proposition | Proposition type | Quantifier / threshold | Exact coverage object | Unit of analysis | Eligible denominator rule | Retrieval question | Required evidence | Resolution |\\n|---|---|---|---|---|---|---|---|---|---|\\n\\nPROPOSITION TYPES\\n\\n1. COVERAGE-DISTRIBUTION PREDICTION\\n   Predicts how many outlets will include, omit, foreground, subordinate,\\n   attribute, update, or frame something.\\n\\n2. COVERAGE-CONSTRUCTION PREDICTION\\n   Predicts how a fact, actor, cause, controversy, comparison, or event object\\n   will be described.\\n\\n3. FACTUAL PREMISE\\n   Makes a claim about the underlying event or record rather than the coverage.\\n\\n4. COUNTERFACTUAL OR COMPARATOR CLAIM\\n   Predicts how a different person, identity, institution, or reversed case\\n   would be treated.\\n\\n5. CAUSAL OR MOTIVE CLAIM\\n   Attributes a reason for outlet, institutional, or actor behavior.\\n\\n6. NORMATIVE JUDGMENT\\n   States that treatment was fair, unfair, proportionate, absurd, justified,\\n   or equivalent.\\n\\nMANDATORY RULES\\n\\nA. PRESERVE QUANTIFIERS\\n\\nDo not silently replace:\\n\\n- \\\"most\\\" with \\\"all\\\";\\n- \\\"many\\\" with \\\"most\\\";\\n- \\\"rarely\\\" with \\\"never\\\";\\n- \\\"largely omit\\\" with \\\"completely omit\\\";\\n- \\\"mention\\\" with \\\"make the governing frame\\\";\\n- \\\"foreground\\\" with \\\"include anywhere.\\\"\\n\\nDefine the operational threshold before retrieval and before examining the\\nresult.\\n\\nUnless the operator supplies another threshold:\\n\\n- ALL = 100%\\n- NEARLY ALL = at least 80%\\n- MOST = more than 50%\\n- MANY = a substantial non-trivial share, operationalized before retrieval;\\n  default to at least 40% or at least three eligible pieces, whichever better\\n  preserves the ordinary meaning for the corpus size; state the chosen rule\\n- SOME = at least two eligible items, where the corpus permits\\n- FEW = less than 25%\\n- NONE = 0%\\n\\nThe threshold must not be changed after the evidence is counted.\\n\\nB. DEFINE DENOMINATOR ELIGIBILITY\\n\\nState which pieces are capable of answering each proposition.\\n\\nExamples:\\n\\n- an omission claim requires FULL-TEXT-confirmed pieces;\\n- a headline-presence claim may use headline-only pieces;\\n- a foregrounding claim requires headline, lede, or upper-body access;\\n- an update-failure claim requires version or update evidence;\\n- a conditional claim about pieces that mention culture war uses only pieces\\n  that actually mention culture war.\\n\\nDo not place an ineligible source in the denominator.\\n\\nC. DO NOT MERGE DISTINCT OBJECTS\\n\\nTreat the following as separate propositions unless the operator explicitly\\njoins them:\\n\\n- whether a disputed history is mentioned;\\n- whether institutional enablement is mentioned;\\n- whether race is mentioned;\\n- whether race governs the article's framing;\\n- whether culture-war context is mentioned;\\n- whether that context is described accurately;\\n- whether a comparator is mentioned;\\n- whether the comparator claim is substantively true.\\n\\nEvidence against one proposition does not weaken another.\\n\\nD. SEPARATE COVERAGE CLAIMS FROM UNDERLYING-TRUTH CLAIMS\\n\\nA corpus may confirm that outlets omitted a comparator without establishing that\\nthe comparator would actually receive different treatment.\\n\\nResolve separately:\\n\\n- COVERAGE RESULT: Was the comparator raised?\\n- SUBSTANTIVE RESULT: Does matched evidence support the comparator?\\n\\nDo not mark a coverage prediction unconfirmed merely because the sub
