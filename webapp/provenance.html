her is paraphrased;\\n- whether equivalent uncertainty is preserved.\\n\\nDo not infer asymmetry from a missing detail unless the absence evidence floor\\nand availability requirements are satisfied.\\n\\n-----------------------------------------------------------------\\nLANGUAGE-PACKAGE FINDINGS\\n-----------------------------------------------------------------\\n\\nUse finding type:\\n\\n  language-package-divergence\\n\\nonly when the overall descriptive package materially diverges after:\\n\\n- timing;\\n- availability;\\n- attribution;\\n- genre;\\n- source dependence;\\n- and SHARED INNOCENT-EXPLANATION TEST innocent explanations\\n\\nhave been evaluated.\\n\\nDo not issue a language-package finding for:\\n\\n- isolated noun substitution;\\n- wording already resolved as register variance or earned specificity at the Semantic Equivalence and Earnedness Gate;\\n- a difference already owned by event-classification-divergence;\\n- a [MEDIA-P1] causal-role assignment already owned by D-ROLE;\\n- a timing artifact;\\n- a package difference explained by article length or genre.\\n\\nFINDING OWNERSHIP\\n\\n- D-ROLE owns causal-role assignments.\\n- event-classification-divergence owns competing labels for the event, site,\\n  institution, collective action, or disputed social object.\\n- language-package-divergence owns descriptive treatment of parties that does\\n  not reduce to either of the above.\\n\\nWhen one passage bears on multiple modules, cross-reference the secondary\\neffects but emit one finding only.\\n\\nSEVERITY FACTORS\\n\\nSeverity depends on:\\n\\n- persistence;\\n- evidentiary availability;\\n- magnitude of divergence;\\n- headline or lede placement;\\n- effect on role perception;\\n- same-stage versus timing-driven difference;\\n- survival after innocent explanations;\\n- whether the package is load-bearing.\\n\\nA rung-4 weak contextual resemblance under CONTEXT-SUPPORTED IDENTITY INFERENCE may not independently\\nanchor a language-package finding.\\n\\n=================================================================\\n\\n\\n=================================================================\\nLANGUAGE-TRAJECTORY EXECUTION GATE\\n=================================================================\\n\\nBefore proceeding to Section D:\\n\\n1. Output the compressed Language Trajectory table from ADAPTIVE DETAIL for EVERY party\\n   enumerated in PARTY ENUMERATION.\\n\\n2. For each party, state whether full LANGUAGE PACKAGE expansion is required.\\n\\n3. If no party qualifies for full expansion, state exactly:\\n\\n   NO FULL-PACKAGE EXPANSIONS\\n\\n   Then give one sentence explaining why no party met the expansion triggers.\\n\\n4. If one or more parties qualify, complete the full language-package schema for\\n   each and name the trigger for expansion.\\n\\nSection D, Section H, and the verdict may not proceed until this gate is\\ncompleted.\\n\\nFailure to output the compressed table is a PROCEDURAL FAILURE. Any downstream\\nclaim about language, labels, descriptive treatment, counterpart treatment,\\nsoftening, hardening, update behavior, or package divergence is invalid until\\nthe gate is completed.\\n\\n=================================================================\\n\\n=================================================================\\nSECTION D  -  FRAMING DIVERGENCE MAP\\n=================================================================\\n\\nWhere the baseline pays off. For each dimension, line up every outlet.\\n\\n\\nBefore completing Section D, carry forward:\\n- the Party Enumeration from PARTY ENUMERATION;\\n- the Competing Event Classifications from COMPETING EVENT CLASSIFICATIONS;\\n- the function / structure results from FUNCTION / STRUCTURE COMPLETENESS TEST;\\n- any same-stage divergence from SAME-STAGE CLASSIFICATION TEST.\\n\\nDo not discover the event object for the first time while writing findings.\\n\\n  1. HEADLINE VERB AND AGENCY\\n     | Outlet | Headline | Grammatical agent | Active/passive |\\n\\n  2. KEY ACTION DESCRIPTORS  -  pick the 3-5 contested actions and show every outlet's wording\\n     side by side.\\n     | Action | Outlet A | Outlet B | Outlet C | ... |\\n\\n     This is an inventory, not yet a framing verdict. Register variance and\\n     earned specificity are resolved at the Semantic Equivalence and Earnedness\\n     Gate and do not reach this section as lexical framing candidates.\\n\\n  3. SEQUENCING  -  where does each outlet place the material that most complicates its own\\n     lead?\\n     | Outlet | Lead subject | paragraph  where complicating context appears |\\n\\n  4. SOURCE DISTRIBUTION\\n     | Outlet | Voices quoted | Positions represented | Balancing voice present? |\\n\\n  5. ATTRIBUTED vs. ASSERTED\\n     | Fact | Outlets asserting | Outlets attributing | Attribution verb |\\n\\n  6. HEADLINE CONTENT  -  which material facts reach each headline?\\n     | Fact | Appears in headline of |\\n\\nD7  -  NARRATIVE-FLAG AND CONTEXT VARIANCE ACROSS OUTLETS\\n-----------------------------------------------------------------\\n\\n| Attribute / context element | Outlet A | Outlet B | Outlet C | ... |\\n|---|---|---|---|---|\\n\\nCompare across outlets, where each is materially relevant: demographic attributes;\\naffiliation, funding, and interest disclosures; credential labels (\\\"expert\\\" vs. \\\"critic\\\");\\nbiography and individualization; which prior episode is invoked as precedent; setting and\\natmospheric cues.\\n\\nThe [MEDIA-P1] causal-role axes - EVENT CLASSIFICATION, CAUSE, ROLE-AND-STATUS, BLAME /\\nRESPONSIBILITY, REMEDY, and LEADERSHIP / POLICY - are owned by D-ROLE.\\n\\nD7's inheritance test, TEST THE SOURCE OF THE UNIFORMITY, remains the shared\\nprimitive both sections use.\\n\\nD7 retains individualization/categorization because it measures identity\\ngranularity, not causal-role assignment. Where the same text bears on both,\\ncross-reference the second section and record each distinct effect once.\\n\\nFor each divergence:\\n  1. Was the attribute known when EACH outlet published? (Use the availability matrix  -  do\\n     not count an unconfirmed attribute as an omission.)\\n  2. Is the difference inclusion, omission, delay, quote-routing, or euphemism?\\n  3. Materially relevant, or merely inflammatory?\\n  4. Does one outlet individualize a party another categorizes?\\n  5. Does the variance correlate with headline, sequencing, or source choices?\\n  6. Could timing, privacy rules, confirmation standards, house style, or outlet policy\\n     explain it?\\n\\nNETWORK-WIDE PATTERNS  -  RECLASSIFY, DO NOT AUTOMATICALLY DOWNGRADE. If every outlet treats\\nan attribute the same way, that establishes the outlet is not an OUTLIER. It does NOT\\nestablish that the treatment is proportionate or non-misleading. Every outlet can inherit the\\nsame official euphemism, wire framing, legal convention, or shared blind spot.\\n\\n  DOWNGRADE: any claim that this outlet is distinctive or slanted relative to peers. DO NOT\\n  DOWNGRADE: the underlying construction finding itself. RECORD SEPARATELY: a network-wide\\n  convention finding, which is often the more interesting result.\\n\\nTEST THE SOURCE OF THE UNIFORMITY - CANONICAL FIVE-WAY CLASSIFICATION\\n\\n  INDEPENDENT-EDITORIAL-CONVERGENCE\\n    Several newsrooms reached the treatment separately.\\n\\n  WIRE-INHERITANCE\\n    One wire story appears under multiple mastheads.\\n\\n  COMMON-PRIMARY-SOURCE\\n    Outlets worked from the same release, briefing, document, or speaker.\\n\\n  LEGAL/PROFESSIONAL-CONVENTION\\n    The treatment follows an identification, sub judice, privacy, or other\\n    professional convention.\\n\\n  SHARED-BLIND-SPOT\\n    No outlet examined the material point.\\n\\nOnly INDEPENDENT-EDITORIAL-CONVERGENCE is evidence that the treatment was\\nindependently chosen across outlets. The other four are non-independent for the\\nD-ROLE inheritance gate and leave the substantive question open.\\n\\nABSENCE CLUSTER: are the same material attributes OMITTED by outlets that otherwise share a\\nframing cluster? Shared omission can be more diagnostic than shared wording, especially where\\nthose outlets used DIFFERENT source chains  -  independent omission is a stronger signal than\\ncommon-source omission. Distinguish the two explicitly.\\n\\n-----------------------------------------------------------------\\nD-ROLE - CAUSAL AND ROLE-ASSIGNMENT MAP\\n[owns MEDIA-P1 axes; absorbs D8; depends on D7]\\n\\nCaptures divergence in the narrative: what kind of event this is, why it\\nhappened, who occupies which role, who is responsible, whether a fix is offered,\\nand how leadership or policy is characterized.\\n\\nReport only divergence that reflects independent editorial choice, not\\nnon-independent treatment and not mere register.\\n\\nSTEP 1 - PER-OUTLET CAUSAL-ROLE MAP\\nMap content, not a verdict.\\n\\nFor each outlet, extract the assignment the article text makes on each\\n[MEDIA-P1] axis.\\n\\nDo not infer an assignment from the headline alone. You may record an assignment\\nexplicitly stated in a headline as HEADLINE-ONLY; do not infer anything the\\nheadline does not state.\\n\\nRecord provenance INSIDE EACH AXIS CELL. Use this form:\\n\\n  assignment [CHOSEN: OUTLET-ORIGINAL]\\n  assignment [CHOSEN: INDEPENDENT-EDITORIAL-CONVERGENCE]\\n  assignment [INHERITED: WIRE-INHERITANCE]\\n  assignment [INHERITED: COMMON-PRIMARY-SOURCE]\\n  assignment [INHERITED: LEGAL/PROFESSIONAL-CONVENTION]\\n  assignment [INHERITED: SHARED-BLIND-SPOT]\\n\\nAn outlet may inherit one axis and choose another. Do not assign one provenance\\nlabel to the outlet as a whole.\\n\\n| Outlet | EVENT CLASSIFICATION (+ provenance) | CAUSE (+ epistemic level + provenance) | ROLE-AND-STATUS (+ provenance) | BLAME / RESPONSIBILITY (+ epistemic level + provenance) | REMEDY (+ provenance) | LEADERSHIP / POLICY (+ provenance) | Text basis |\\n|---|---|---|---|---|---|---|---|\\n\\nTEXT BASIS\\n\\n  TEXT-READ\\n    The full piece was read.\\n\\n  HEADLINE-ONLY\\n    The body was not read. Only an assignment explicitly stated in the headline\\n    may be recorded. It may not anchor a divergence finding and is PROVISIONAL.\\n\\nCAUSE AND BLAME - EPISTEMIC LEVEL\\nLOCAL EXECUTION COPY - canonical in [MEDIA-P1]; must match.\\n\\nClassify every CAUSE and BLAME assignment:\\n\\n  DOCUMENTED\\n    Direct statement, verified communication, or established record.\\n\\n  OFFICIALLY-ALLEGED\\n    Law enforcement, complaint, indictment, or institutional finding.\\n\\n  SOURCE-INFERRED\\n    Witness, advocate, expert, or interested party's inference.\\n\\n  OUTLET-INFERRED\\n    The article's own synthesis.\\n\\n  UNKNOWN\\n    Evidence insufficient.\\n\\nTest for silent upward movement: an alleged cause restated as documented, or a\\nsource's inference appearing later in outlet voice. Apply the ladder separately\\nto CAUSE and BLAME.\\n\\nSTEP 2 - INHERITANCE GATE\\nApply per assignment; reuse D7's canonical five-way classification.\\n\\nFor this binary gate:\\n\\n  CHOSEN\\n    OUTLET-ORIGINAL assignments and independently reached assignments classified\\n    as INDEPENDENT-EDITORIAL-CONVERGENCE.\\n\\n  INHERITED\\n    Assignments classified by D7 as WIRE-INHERITANCE,\\n    COMMON-PRIMARY-SOURCE, LEGAL/PROFESSIONAL-CONVENTION, or\\n    SHARED-BLIND-SPOT.\\n\\nOnly CHOSEN assignments count as independent outlet framing. Record INHERITED\\nassignments, but do not attribute them to the outlet as independent editorial\\nchoices.\\n\\nIf D7 already classified the source of uniformity, carry that result into each\\naffected axis cell. Do not re-derive it.\\n\\nSTEP 3 - DIVERGENCE FINDING\\nProsecute CHOSEN divergence only.\\n\\nReport where CHOSEN assignments diverge across outlets on any [MEDIA-P1] axis.\\n\\nApply VERB-AS-TRACE (compact primitive) to surviving wording-derived outliers only.\\nRegister variance and earned specificity are resolved at the Semantic Equivalence\\nand Earnedness Gate and do not reach this section as lexical framing candidates.\\nD-ROLE's independent substantive six-axis scan remains required.   [FAIL-MB-018]\\n\\nSTEP 4 - GENRE / INDEPENDENCE CONDITION\\nMandatory not-firing check.\\n\\nState the sample's independence condition.\\n\\nIf most relevant assignments are INHERITED, as in wire-dominated breaking\\ncoverage, the causal-role axis is UNDER-DETERMINED by this sample. Report:\\n\\n\\\"roles largely inherited or otherwise non-independent; independent causal\\nframing minimal - this genre under-determines the causal-role axis\\\"\\n\\nMark any surviving divergence finding PROVISIONAL.\\n\\nThis axis is more likely to become testable in opinion, editorial, feature, or\\nlater multi-source coverage once the wire monopoly breaks.\\n\\nThe section MUST be able to return:\\n\\n\\\"axis under-determined - wrong genre\\\"\\n\\nRegister variance and earned specificity are resolved at the Semantic Equivalence and Earnedness Gate and do not reach this section as lexical framing candidates.\\n\\nSTEP 5 - FLIP TEST\\nSymmetry and abuse guard.\\n\\nCause, blame, and victim-role assignments are especially prior-sensitive. Before\\nreporting any divergence finding, ask:\\n\\nWould you assign the identical finding if the outlets' political valence were\\nreversed?\\n\\nName the specific assigning text: outlet, sentence or phrase, and the assignment\\nit makes. Never write only \\\"outlet X is biased.\\\"\\n\\nA finding that cannot identify the assigning text, or that would not be flagged\\nwith valence reversed, is downgraded or dropped.\\n\\nSTEP 6 - FINDING TABLE\\n\\nEach surviving CHOSEN divergence receives its own row in the standardized\\nfinding table.\\n\\nUse finding type: causal-role-framing.\\n\\nOWNERSHIP RULE:\\n\\n- causal-role-framing owns divergence on a [MEDIA-P1] axis;\\n- framing-divergence is reserved for framing that does not consist of a\\n  [MEDIA-P1] assignment;\\n- do not emit the same divergence under both types;\\n- D7 owns identity granularity and source-of-uniformity classification;\\n- D-ROLE owns causal-role assignment.\\n\\nCross-reference D7 where needed. Do not create a second finding from the same\\nassignment.\\n\\nDo not fold multiple axes into one generic \\\"framing differs\\\" note. CAUSE and\\nROLE-AND-STATUS divergences are separate rows when independently evidenced.\\n\\nREAD-NOT-SCORED\\n\\nThis section produces finding-table rows for the human reader. It does not\\nproduce letters or concede-test verdicts.\\n\\nConvergence across independent CHOSEN assignments is the signal; a scored rubric\\nis not.\\n\\nD9  -  BASELINE AND DENOMINATOR VARIANCE\\n-----------------------------------------------------------------\\n\\nWhere outlets cite figures for the same phenomenon:\\n\\n| Figure | Outlet | Baseline / denominator | Raw or rate | Adjustment applied | Impression supported |\\n|---|---|---|---|---|---|\\n\\n  1. Do outlets use different comparison points for the same underlying data?\\n  2. Does the choice correlate with framing cluster?\\n  3. Does any outlet report the comparison basis, or do they present bare numbers?\\n  4. Would a common basis change the apparent disagreement between outlets?\\n\\nThis is often the cleanest quantitative divergence available and it is invisible without\\ncross-outlet comparison.\\n\\n=================================================================\\nSECTION D2  -  CROSS-BRANCH RESOLUTION  (run if a single-piece audit preceded this)\\n=================================================================\\n\\nThe single-piece framing audit flags items it CANNOT determine from one article and names this\\nbranch as the test. Those flags are the highest-value work this audit does, because they are\\nthe only findings in the system that can be CONFIRMED OR FALSIFIED rather than merely rated.\\n\\nIf no single-piece audit preceded this, write \\\"no prior single-piece audit\\\" and skip.\\nOtherwise, list every item that audit marked UNDETERMINABLE, PROVISIONAL, or \\\"would be\\nresolved by the coverage-network branch,\\\" and resolve what this sample can.\\n\\n-----------------------------------------------------------------\\nPROMINENCE CROSS-BRANCH OWNERSHIP   [FAIL-MB-017]\\n-----------------------------------------------------------------\\n\\nThe single-piece framing branch and the Coverage Network branch can both observe\\nwithin-piece packaging. Do not emit duplicate findings for the same placement\\nobject.\\n\\nIf a prior single-piece audit already identified a headline/lede/body packaging\\nfinding:\\n\\n- the SINGLE-PIECE branch owns the within-piece placement finding;\\n- CN does NOT emit a duplicate prominence-packaging row for that same object;\\n- CN may add only what comparison across pieces contributes:\\n  * packet asymmetry;\\n  * FULL / PARTIAL PACKET INVERSE;\\n  * provenance comparison;\\n  * evidence that the pattern is network-wide or countered elsewhere;\\n  * evidence that the single-piece interpretation should be reclassified.\\n\\nResolve the prior finding in D2 using the ordinary cross-branch states:\\n- CONFIRMED\\n- FALSIFIED\\n- RECLASSIFIED\\n- NETWORK-WIDE\\n- STILL UNRESOLVED\\n- NO EVIDENCE\\n\\nCross-reference the original single-piece finding.\\n\\nIf no prior single-piece audit exists:\\n- CN may originate the prominence-packaging finding itself.\\n\\nBranch order must not create duplicate findings or change the substantive object.\\n\\nTHE STANDARD RESOLUTION TARGETS  -  check each explicitly:\\n\\n  1. SOURCE-INTERNAL ORDERING (single-piece F2 Step 5). The single-piece audit could not tell\\n     whether an institutional source led with framing material or the outlet foregrounded it.\\n     TEST: how did other outlets covering the same statement order it? If most led with the\\n     factual account, the audited outlet's ordering was a choice. If most led with the framing\\n     material, the source spoke that way and the finding collapses. Also check: does any\\n     outlet quote or link a transcript, recording, or written release that fixes the order?\\n\\n  2. VERB AND DESCRIPTOR CHOICE. The single-piece audit can only observe that a word is milder\\n     or more vivid than alternatives it imagines. TEST: what words did other outlets use for\\n     the same action - and CRITICALLY, what word does the PRIMARY SOURCE use? An institution\\n     often issues both a written release and a spoken briefing, and they frequently differ. A\\n     verb that looks like editorial softening may be DOCUMENT DEPENDENCE: the outlet used the\\n     presser, another outlet used the written report. Then route the surviving difference\\n     through [MEDIA-P1]. Apply VERB-AS-TRACE (compact primitive) only if the\\n     wording survived the Semantic Equivalence and Earnedness Gate as a MATERIAL\\n     OUTLIER; otherwise the lexical object is already resolved upstream. If the\\n     surviving wording moves an assignment, use it as evidence for a causal-role-framing\\n     finding. Both branches now emit findings in the [MEDIA-P1] vocabulary, so D2 lines them\\n     up directly rather than translating between two axis sets. Resolution therefore works\\n     regardless of which branch was the entry point. If document dependence explains the\\n     wording, the single-piece finding is not outlet construction - it is a\\n     sourcing-thoroughness observation and must be reclassified. Say so plainly.\\n\\n  3. AVAILABILITY OF A BALANCING VOICE. The single-piece audit cannot tell whether a\\n     counter-voice was unavailable, refused, or unsought. TEST: did any outlet in the sample\\n     obtain one? If several did, availability is established and the single-piece finding\\n     strengthens. If NONE did, the absence is network-wide and is weak evidence about any one\\n     outlet.\\n\\n  4. HEADLINE CHOICES. The single-piece audit judges a headline against the\\n     body. TEST: what did every other headline include and omit? If EVERY outlet\\n     made the same omission, downgrade the claim that the audited outlet is\\n     distinctive or uniquely slanted. Do NOT automatically downgrade the\\n     underlying construction finding; resolve it as NETWORK-WIDE and classify\\n     the source of uniformity.\\n\\n  5. OMISSION vs. CONVENTION. Any fact the single-piece audit flagged as omitted. TEST: who\\n     else omitted it? A fact omitted by every outlet, especially one sitting in a primary\\n     document all of them had, is a NETWORK-WIDE pattern. That is a different and often more\\n     interesting finding than an outlet- specific one  -  and it is not evidence of that\\n     outlet's lean.\\n\\nRequired table:\\n\\n| Single-piece finding | What it flagged as undeterminable | What this sample shows | Resolution |\\n|---|---|---|---|\\n\\nRESOLUTION values  -  use exactly these: CONFIRMED ......... the sample supports the\\nsingle-piece finding; it strengthens FALSIFIED ......... the sample shows the finding was\\nwrong; it must be CUT RECLASSIFIED ...... real, but a different finding type than originally\\nrated NETWORK-WIDE ...... the behavior is shared across outlets. This establishes the outlet\\nis not an OUTLIER. It does NOT establish the treatment is proportionate  -  every outlet can\\ninherit the same official euphemism, wire framing, legal convention, or blind spot. DOWNGRADE\\nthe claim that this outlet is distinctive. DO NOT DOWNGRADE the underlying construction\\nfinding. RECORD the network-wide convention as its own finding, and state its\\nsource using D7's exact values:\\nINDEPENDENT-EDITORIAL-CONVERGENCE / WIRE-INHERITANCE /\\nCOMMON-PRIMARY-SOURCE / LEGAL/PROFESSIONAL-CONVENTION /\\nSHARED-BLIND-SPOT. Only INDEPENDENT-EDITORIAL-CONVERGENCE suggests the\\nconvention was independently chosen; the other four are non-independent and\\nleave the substantive question open. STILL UNRESOLVED .. this sample\\ncannot settle it; state what would NO EVIDENCE ....... you did not retrieve material bearing\\non this item at all\\n\\nEVIDENCE FLOOR  -  MANDATORY. CONFIRMED, FALSIFIED, RECLASSIFIED, and NETWORK-WIDE each\\nrequire you to NAME THE SPECIFIC EVIDENCE in the resolution cell: which outlet, which\\ndocument, which passage. A resolution without named evidence is not a resolution.\\n\\n  If you did not retrieve material bearing on the item, the ONLY permitted values are STILL\\n  UNRESOLVED or NO EVIDENCE.\\n\\n  CONFIRMED IS THE MOST DANGEROUS VALUE HERE. It ratifies an upstream finding, and it is the\\n  value most easily returned by a run that simply did not look. Absence of contradicting\\n  evidence is NOT confirmation. If your basis for CONFIRMED is \\\"nothing I saw contradicted\\n  it,\\\" the correct value is STILL UNRESOLVED.\\n\\n  Worked contrast, from actual runs of this prompt on the same event: asked whether an outlet\\n  reordered a police chief's statement, one run returned CONFIRMED having obtained no primary\\n  source; another returned FALSIFIED citing a specific outlet's report that the chief opened\\n  his briefing that way; a third returned STILL UNRESOLVED, lacking that outlet. Only the\\n  second and third were defensible.\\n\\nREPORT FALSIFICATIONS PROMINENTLY. A finding this branch kills is the most valuable output the\\nsystem produces  -  it is the only place a claim gets tested against evidence rather than\\nre-rated by judgment. Do not bury it. If the single-piece audit was wrong, say which finding,\\nwhy, and what the evidence was.\\n\\nNOTE ON DIRECTION: this section will more often WEAKEN single-piece findings than strengthen\\nthem, because shared behavior is common and outlet-specific behavior is rarer than a\\nsingle-article reading suggests. That asymmetry is expected and is not a sign the section is\\nmalfunctioning. If it never weakens anything across multiple runs, it is not doing its job.\\n\\n=================================================================\\nSECTION E  -  CLUSTERING AND CORRELATION\\n=================================================================\\n\\n  1. Do framing choices CLUSTER? Do outlets choosing one headline verb also place complicating\\n     context late, quote the same category of voice, omit the same facts?\\n\\n  2. Describe clusters BY THEIR CHOICES FIRST, not by political valence. (\\\"Cluster 1 leads\\n     with scene, places official account after paragraph 5, quotes advocacy voices; Cluster 2\\n     leads with official account, quotes officials, omits reaction.\\\") Note any correlation\\n     with lean afterward, as an observation.\\n\\n  3. Is there an outlet that does NOT cluster  -  mixed choices? Name it. A tidy two-cluster\\n     map with no outliers is suspicious and often reflects sample selection (Section G) rather\\n     than the coverage.\\n\\n  4. TEST NON-LEAN EXPLANATIONS BEFORE CONCLUDING LEAN. Does clustering correlate with\\n     publication time, wire dependence, brief-vs-full-report, local-vs-national, or deadline?\\n     Length and timing explain more variance than people expect. State which you tested and\\n     what you found.\\n\\n=================================================================\\nSECTION E2  -  MAPPED PRIOR-MATCH CHECK  (MANDATORY BEFORE FLIP TEST)\\n=================================================================\\n\\nPRIOR SOURCE must be one of:\\n\\n  SUPPLIED\\n  MODEL-GENERATED\\n  NONE\\n\\nDefault to NONE when no operator prior was supplied.\\nA MODEL-GENERATED prior is permitted only when a specific ambiguity could not be\\ninterpreted without an explicit expectation. State why it was necessary. A\\nmodel-generated match is weaker evidence than a supplied match.\\n\\nIf PRIOR SOURCE = NONE:\\n\\n  write \\\"no prior; prior-match check skipped.\\\"\\n\\nDo not invent one retrospectively.\\n\\nIf PRIOR SOURCE = SUPPLIED:\\n\\n1. Reproduce the completed PRIOR DECOMPOSITION AND MAPPING map.\\n2. Resolve every Prior ID separately.\\n3. Preserve the exact quantifier, denominator, eligible-source rule, and\\n   conditional structure.\\n4. Do not collapse the priors into one synthetic prediction.\\n5. Do not substitute:\\n   - mention for foregrounding;\\n   - immediate reversal for long-term enablement;\\n   - comparator omission for comparator truth;\\n   - counterexamples for threshold failure.\\n\\nRequired proposition-level table:\\n\\n| Prior ID | Exact proposition | Eligible denominator | Threshold | Count / evidence | Result | Qualification |\\n|---|---|---|---|---|---|---|\\n\\nPermitted results:\\n\\n- CONFIRMED\\n- PARTIALLY CONFIRMED\\n- REFRAMED\\n- NOT CONFIRMED\\n- INSUFFICIENT EVIDENCE\\n\\nAfter proposition-level resolution, provide:\\n\\nAGGREGATE MAPPED RESULT:\\n- STRONG MAPPED MATCH\\n- SUBSTANTIAL MAPPED MATCH\\n- MIXED MAPPED RESULT\\n- WEAK MAPPED MATCH\\n- NO MAPPED MATCH\\n- INSUFFICIENT TO ASSESS\\n\\nThen state:\\n\\nWHAT MATCHED:\\n[Prior IDs and exact propositions]\\n\\nWHAT DID NOT MATCH:\\n[Prior IDs and exact propositions]\\n\\nWHAT REMAINS UNTESTED:\\n[factual, causal, motive, normative, or comparator claims]\\n\\nSTRONGEST COUNTEREVIDENCE:\\n[the single strongest evidence against the mapped priors]\\n\\nMAPPING INTEGRITY CHECK:\\n\\n- Were any distinct propositions merged?\\n- Were any quantifiers strengthened?\\n- Was \\\"mention\\\" confused with \\\"foreground\\\" or \\\"governing frame\\\"?\\n- Was a coverage prediction confused with an underlying-truth claim?\\n- Was a conditional prior tested against the wrong denominator?\\n- Was a counterexample incorrectly treated as falsifying a non-universal\\n  prediction?\\n- Was adjacent evidence substituted for the exact audit object?\\n\\nIf any answer is YES, revise the mapping before issuing the verdict.\\n\\nIf PRIOR DECOMPOSITION AND MAPPING was not completed, write:\\n\\n  PRIOR MAPPING FAILURE \\u2014 PRIOR-MATCH VERDICT INVALID\\n\\nand do not issue an aggregate prior verdict.\\n\\n=================================================================\\nSECTION F  -  FLIP TEST  (MANDATORY  -  DESIGNED TO BE COSTLY)\\n=================================================================\\n\\nAnswering \\\"yes, I would flag the mirror\\\" is free. This section requires producing something.\\n\\nSTEP 1  -  WRITE THE MIRROR, AS TEXT Take your #1 divergence finding. COMPOSE the actual\\nmirror  -  3-6 sentences of a headline plus lead written the way an outlet in the opposite\\ncluster would have written it, using the same technique you flagged. Not a description. The\\ntext.\\n\\nSTEP 2  -  AUDIT YOUR OWN MIRROR Run your Section D criteria against what you just wrote.\\nProduce at least two findings against it with severity ratings. If you cannot produce findings\\nat comparable severity, your original finding is PRIOR-DEPENDENT  -  downgrade it.\\n\\nSTEP 3  -  CONSISTENCY CHECK Compare the PRINCIPLES you applied to your mirror against your\\nfindings on the real coverage. Classify what you find  -  two different things, resolving\\noppositely:\\n\\n  (A) INCONSISTENT PRINCIPLE  -  you applied a rule to the mirror you did not apply to the\\n  original, or vice versa. One finding must give; state which and why. Mirror-side principles\\n  are less prior-contaminated (applied without knowing which side benefited), so they usually\\n  win.\\n\\n  (B) SYMMETRIC PHENOMENON  -  the same construction lever appears in both, pushing opposite\\n  directions (e.g. either ordering constructs an impression). NO DOWNGRADE. This confirms the\\n  lever is a construction lever, which makes the outlet's specific choice more meaningful, not\\n  less.\\n\\n  DO NOT DOWNGRADE BECAUSE THE MIRROR COMMITS THE MIRROR-IMAGE VERSION. That is the expected\\n  result and the reason the mirror exists  -  it tests whether you apply the same rule, not\\n  whether construction is universal.\\n\\n| Observation | Type (A / B) | Resolution |\\n|---|---|---|\\n\\nDowngrades are permitted here for TYPE A only.\\n\\nSTEP 4  -  FORCED RANKING Rank all findings from MOST prior-dependent to LEAST.\\n\\n| Rank (1 = most prior-dependent) | Finding | Why more prior-dependent than the next |\\n|---|---|---|\\n\\nSTEP 5  -  AUTOMATIC DOWNGRADE  (not discretionary)\\n\\nThe finding ranked #1  -  MOST prior-dependent  -  IS DOWNGRADED ONE SEVERITY STEP.\\nMechanical. No justification path, no opt-out.\\n\\n  MAJOR -> MODERATE / MODERATE -> MINOR / MINOR -> cut or \\\"reported, not load-bearing\\\"\\n\\nEarlier versions allowed declining the downgrade with a rebuttal. The rebuttal was always\\nsupplied and the downgrade never happened. A check that can be argued away is not a check.\\n\\nIF THE DOWNGRADE SEEMS WRONG, FIX THE RANKING IN STEP 4  -  you control it. Do not argue with\\nthe consequence. Do not append a parenthetical rebutting it.\\n\\nState in one line: \\\"Downgrade applied: [finding] MODERATE -> MINOR.\\\" Report in Section I which\\nfinding was downgraded and from what to what.\\n\\nSTEP 6  -  SCRUTINY SYMMETRY a. Point to a specific finding against an outlet you'd tend to\\ntrust. If you have none, state that  -  it is a result. b. Where does the coverage cut AGAINST\\nwhat you expected? List anything. c. Name an outlet whose construction you would have flagged\\nhad it leaned the other way. d. For counter-evidence you listed: \\\"would a reader who noticed\\nit reach a different conclusion? If no, WHAT DOES THE COUNTER-EVIDENCE FAIL TO ADDRESS?\\\" Name\\nwhat is missing from it. Do not restate what the coverage does  -  that is circular. The\\nphrase \\\"noted but does not offset\\\" is BANNED; reasoning that reduces to it downgrades the\\naffected findings one step.\\n\\n| Finding | Mirror written? | Findings against mirror | Contradiction w/ mirror principle? | Prior-dependence rank | Verdict |\\n|---|---|---|---|---|---|\\n\\nFindings failing the flip test are PRIOR-DEPENDENT  -  downgrade or cut, labeled.\\n\\n=================================================================\\nSECTION G  -  SAMPLE AUDIT  (audits your own selection)\\n=================================================================\\n\\nThese findings are only as good as the sample.\\n\\n  1. How were pieces selected? Systematic or convenience?\\n  2. What outlets covering this event are ABSENT? Name them.\\n  3. Does the sample over-represent one end of the spectrum?\\n  4. Would adding the missing outlets likely change the clustering?\\n  5. Sample verdict: SYSTEMATIC / PARTIAL / CONVENIENCE\\n\\n\\n  6. CLAIM-RELEVANT SAMPLE CHECK\\n\\n     This check is distinct from the absence-claim evidence floor. The floor asks\\n     whether the retrieved text can support an absence claim. This check asks\\n     whether the sample contains the comparison cluster required by the claim.\\n     Either may independently defeat a finding.\\n\\n     For every finding claiming that a voice, frame, outlet type, ideological\\n     position, institutional position, or source category is absent, rare,\\n     unique, or disproportionately represented:\\n\\n     a. Does the sample contain outlets reasonably expected to carry the\\n        allegedly missing comparison position?\\n     b. How many such outlets are present?\\n     c. Are they FULL-TEXT-CONFIRMED?\\n     d. Does the finding survive after excluding partial sources?\\n     e. Is the sample capable of supporting the claimed distribution?\\n\\n     A sample containing no member of the relevant comparison cluster may not\\n     support \\\"only,\\\" \\\"none,\\\" \\\"unique,\\\" or network-distribution claims about that\\n     cluster.\\n\\nRequired table:\\n\\n| Finding | Comparison cluster required | Cluster present in sample? | Full-text sources in cluster | Claim supportable? |\\n|---|---|---|---:|---|\\n\\nA CONVENIENCE sample can still show real divergence  -  verb variance is verb variance\\nregardless of how the pieces were found. But it CANNOT support claims about overall\\ndistribution (\\\"most outlets framed it as X\\\"). State which claims your sample supports and\\nwhich it does not.\\n\\nREQUIRED: if the sample is CONVENIENCE, every distributional claim in this audit is\\nPROVISIONAL. Say so in the verdict.\\n\\n=================================================================\\nSECTION H  -  STANDARDIZED FINDING TABLE\\n=================================================================\\n\\n| Field | Entry |\\n|---|---|\\n| Finding | one sentence |\\n| Section | A-E |\\n| Evidence | side-by-side quotes, outlet names, paragraph positions |\\n| Finding type | common-source-propagation / source-dependent-interpretation / claim-amplification / source-chain / selection / prominence-packaging / framing-divergence / causal-role-framing / event-classification-divergence / language-package-divergence / clustering |\\n| Severity | none / minor / moderate / major / severe |\\n| Survives flip test | yes / no |\\n| Sample-dependent? | yes / no  -  would it hold with a different sample? |\\n| Possible innocent explanation | MANDATORY  -  deadline, length, wire dependence, house style, genuine scoop. \\\"None identified\\\" if none. Never blank. |\\n| Availability row cited | REQUIRED for any SELECTION (cross-piece omission) claim; exact fact/source availability time and outlet publication time. Write NOT APPLICABLE for all non-selection findings, INCLUDING prominence-packaging findings \\u2014 for prominence, the fact's presence in the FULL-TEXT-CONFIRMED piece establishes possession; no cross-piece Availability Matrix row exists or is required. |\\n| What would weaken this | MANDATORY |\\n| Verification state | from vocabulary |\\n\\nTYPE OWNERSHIP: use causal-role-framing for [MEDIA-P1] assignments.\\nUse framing-divergence only for non-[MEDIA-P1] framing. Never emit the same\\ndivergence under both types.\\n\\nUse prominence-packaging only for within-piece placement priority among\\nsubstantive facts or factual dimensions already carried by the piece. Do not use\\nit for cross-piece omission, source-attribution compression, epistemic\\ncompression, causal-role reassignment, or inherited wire packaging attributed as\\noutlet choice.   [FAIL-MB-017]\\n\\nSEVERITY CAPS  -  enforceable, not advisory\\n\\n  | Condition | Cap |\\n  |---|---|\\n  | Missing either mandatory column | may not exceed MODERATE |\\n  | Fails flip test (prior-dependent) | may not exceed MINOR |\\n  | Convenience sample (G5) | no claim about overall media distribution may exceed PROVISIONAL |\\n  | A load-bearing fact is single-origin in the Section B per-fact table | it may not be treated as independent corroboration; classify it as COMMON-SOURCE PROPAGATION, SOURCE-DEPENDENT INTERPRETATION, CLAIM AMPLIFICATION, or CHAIN UNRESOLVED |\\n  | COMMON-SOURCE PROPAGATION without another construction failure | descriptive only; may not anchor a pathology finding |\\n  | SOURCE-DEPENDENT INTERPRETATION with attribution preserved and low apparent-corroboration risk | descriptive unless the interpretation becomes load-bearing |\\n  | Source chain CHAIN-INFERRED only (textual similarity) | may not be rated SEVERE |\\n  | Omission where availability is UNKNOWN | may not be called SELECTION; capped at PROVISIONAL |\\n  | Selection claim without an explicit Availability Matrix row cited inside the finding | may not be called selection; relabel as inclusion / non-inclusion, availability unknown, timing artifact, or timing untested |\\n  | Prominence-packaging finding | cross-piece availability caps DO NOT APPLY; requires FULL-TEXT-CONFIRMED status for the finding piece, packaging provenance, and a FULL / PARTIAL / NONE packet-inverse statement; omitted symmetry statement caps the finding at PROVISIONAL |\\n  | Prominence finding attributed to outlet choice with packaging provenance UNKNOWN | attribution to outlet choice capped at PROVISIONAL |\\n  | INHERITED prominence pattern | may be described, but may not be attributed to outlet editorial choice; SOURCE-CHAIN owns inheritance |\\n  | PACKET INVERSE: NONE where the eligible comparison range is not fully FULL-TEXT-CONFIRMED | may not be stated as an unqualified packet-wide absence |\\n  | Wording-derived language/event-classification candidate not carried forward as a MATERIAL OUTLIER by the Semantic Equivalence Gate | may not be reported as a framing finding; record only as register variance / earned specificity |\\n  | Formulation marked EARNED SPECIFICITY | may not by itself anchor framing-divergence, event-classification-divergence, language-package-divergence, or causal-role-framing |\\n  | MATERIAL OUTLIER with no named moved assignment | invalid outlier; return to common bucket |\\n  | Language-trajectory execution gate not completed | all language-package / label-trajectory / descriptive-treatment findings invalid; Section I must report Language-trajectory module completed: NO |\\n  | Absence / exclusivity claim with any partial source in its denominator | claim unavailable; cut it |\\n  | Sample contains no member of the comparison cluster required by the claim | \\\"only / none / unique\\\" or distribution claim unavailable; cut or narrow |\\n  | Sample-dependent finding | may not anchor the verdict |\\n  | Explained by format/length difference (brief vs. full report) | not a finding  -  cut it |\\n\\n  Additional rule: if coverage is substantially uniform and proportionate, say so and submit\\n  an empty table. That must be an available output.\\n\\n=================================================================\\nSECTION I  -  VERDICT\\n=================================================================\\n\\nRETRIEVAL DEPTH  -  REPORT BEFORE THE VERDICT\\n\\nAudit quality varies enormously with how much material was actually fetched, and that\\nvariation is invisible in the output unless stated. A thin run and a deep run produce equally\\nconfident-looking tables. Disclose:\\n\\n  - Pieces read FULL TEXT: [n, list]\\n  - Pieces read SNIPPET ONLY: [n, list]\\n  - Pieces NOT retrieved but referenced: [n, list]\\n  - Primary source obtained: WRITTEN form? [y/n] SPOKEN form/transcript? [y/n]\\n  - Searches or fetches performed: [approximate count]\\n  - Material you looked for and could NOT obtain: [list]\\n  - Fixed-packet mode: [YES / NO]\\n  - Companion items added: [n, list, with COMPANION RETRIEVAL trigger A-D]\\n  - Inherited framing dependencies still untested: [list]\\n\\nCAP: any finding resting on material you did not fetch is PROVISIONAL and may not be\\nload-bearing. State which findings this affects.\\n\\nThis is not a confession of inadequacy. A shallow run that says so is more useful than a\\nshallow run that reads as thorough.\\n\\n  - Pieces compared:\\n  - Reporting organizations producing original reporting (Section B Level 1):\\n  - Upstream information origins (Section B Level 2; descriptive only):\\n  - Whole-coverage ratio (descriptive only, not a verdict): [P] / [M]\\n  - Per-fact network classification: [each load-bearing fact as pieces /\\n    independent origins / COMMON-SOURCE PROPAGATION / SOURCE-DEPENDENT\\n    INTERPRETATION / CLAIM AMPLIFICATION / CROSS-OUTLET CORROBORATION /\\n    CONTESTED / CHAIN UNRESOLVED; state apparent-corroboration risk]\\n  - Shared factual core (one sentence):\\n  - DIRECTIONAL COHERENCE: of the surviving findings, how many push the same direction? [N of\\n    M]. If 4+ cohere with fewer than 2 opposing, record a coherence finding at MODERATE (MAJOR\\n    at 6+ with none opposing): individually defensible choices whose consistency across\\n    independent levers is not. Direction-neutral  -  applies identically whichever way the\\n    coherence runs.\\n  - CROSS-BRANCH RESOLUTION (D2): single-piece findings CONFIRMED / FALSIFIED / RECLASSIFIED /\\n    NETWORK-WIDE / STILL UNRESOLVED  -  list each. State falsifications first.\\n  - Competing event classifications:\\n  - Function / structure resolution:\\n  - Same-stage classification divergences:\\n  - Language trajectories reviewed:\\n  - Parties expanded to full language-package analysis:\\n  - Language-package divergences:\\n  - Language-trajectory module completed: YES / NO\\n  - Prior mapping completed: YES / NO / NOT APPLICABLE\\n  - Most significant framing divergence:\\n  - Does framing cluster? Along what axis?\\n  - Non-lean explanations tested (timing / length / wire / local):\\n  - Sample verdict (G5):\\n  - Investigation leads resolved: CONFIRMED / PARTIALLY CONFIRMED /\\n    REFRAMED / NOT CONFIRMED / INSUFFICIENT EVIDENCE - list each\\n    with its origin tag:\\n  - Findings surviving flip test:\\n  - Load-bearing findings:\\n  - What this audit could NOT assess:\\n  - Confidence: low / moderate / high\\n  - What would change this assessment:\\n\\nFINAL REQUIRED STATEMENT  -  one of:\\n\\n  \\\"This coverage represents [N] organizations producing original reporting and\\n  approximately [M] upstream information origins, across [P] published pieces.\\n  Across [P] pieces, the load-bearing facts trace to these independent origins:\\n  [fact - pieces / origins located / origin completeness / network classification; ...].\\n  [N1] facts are\\n  COMMON-SOURCE PROPAGATION, [N2] are SOURCE-DEPENDENT INTERPRETATIONS, and\\n  [N3] qualify as CLAIM AMPLIFICATION. Only the last category represents\\n  apparent cross-outlet agreement that may falsely resemble independent\\n  confirmation. Framing diverges materially on [dimensions]. The divergence\\n  [does / does not] cluster along [axis]. This audit does not establish which\\n  framing is accurate.\\\"\\n\\nOR\\n\\n  \\\"Coverage is substantially uniform and proportionate to the available source material. No\\n  material framing divergence found.\\\"\\n\\nThe second must be genuinely available.\\n\\n=================================================================\\nSCOPE LIMITS  -  RESTATE IN OUTPUT\\n=================================================================\\n\\n  1. Coverage distribution is not a truth verdict. Majority framing is not\\n     evidence of accuracy, particularly where a load-bearing proposition is\\n     source-dependent, claim-amplified, or has unresolved origin completeness\\n     in Section B.\\n  2. One event does not establish an outlet's practice. That requires a corpus across events\\n     -  a different and larger audit.\\n  3. Divergence does not establish intent. Editorial choice is observable; motive is not.\\n  4. Wire dependence, length, and deadline explain substantial variance. Test them before\\n     attributing divergence to lean.\\n  5. A convenience sample supports findings about the pieces examined, not about coverage\\n     generally.\\n\"},\"2-framing-construction\":{\"bytes\":85915,\"lines\":1660,\"path\":\"prompts/media-analysis/2-framing-construction.txt\",\"sha256\":\"acfef7300dfd\",\"text\":\"FRAMING & CONSTRUCTION AUDIT  -  MEDIA / ARTICLE BRANCH\\n=====================================================\\n\\n-----------------------------------------------------------------\\nINSTRUMENT PREFLIGHT \\u2014 MANDATORY FOR FORMAL / LOGGED RUNS   [TOOL-004]\\n-----------------------------------------------------------------\\n\\nThis prompt is part of the audit instrument. Establish the exact instrument version BEFORE\\nsubstantive retrieval, extraction, analysis, or verdict work begins.\\n\\nA successful fetch indicator, correct repository path, branch label, plausible line count,\\nmatching rendered metadata, or internally self-consistent page does NOT by itself establish\\nthat the intended/current artifact was retrieved. A mutable remote reference can return a\\nhistorical representation that is internally self-consistent in every visible field.\\n\\nPROMPT IDENTITY MARKERS\\n\\n  - FRAMING & CONSTRUCTION AUDIT  -  MEDIA / ARTICLE BRANCH\\n\\nThese markers confirm the prompt family / expected structural features. They do NOT by\\nthemselves establish version currency: an older version may share the same title or markers.\\n\\n1. RECORD THE INSTRUMENT ACTUALLY IN CONTEXT.\\n\\n   Record, where available:\\n\\n   - canonical prompt path or supplied filename;\\n   - retrieval form: PASTED / ATTACHED / IMMUTABLE REMOTE / MUTABLE REMOTE;\\n   - requested branch or ref;\\n   - intended immutable commit/ref, if the run claims a repository version;\\n   - resolved commit SHA;\\n   - resolved blob/content hash, or a locally computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\nProsecutor stage. Document-type variant for: news articles, opinion pieces, press releases,\\ninstitutional communications, advocacy briefs.\\n\\nReferences: shared_primitives.txt Section 1 (verification states), Section 2 (finding table)\\n\\n-----------------------------------------------------------------\\nWHAT THIS AUDITS  -  AND WHAT IT DOES NOT\\n-----------------------------------------------------------------\\n\\nThe academic prosecutors audit CLAIM VS. MEASUREMENT. This one audits CONSTRUCTION: what a\\npiece does with ordering, agency, attribution, sourcing, omission, and packaging.\\n\\nThe central premise: A PIECE CAN BE ENTIRELY FACTUALLY ACCURATE AND STILL MISLEAD THROUGH\\nASSEMBLY. Every sentence true, every quote real, and the assembled impression unsupported by\\nthe facts assembled. That is the object of this audit.\\n\\nTHIS AUDIT IS NOT:\\n  - fact-checking. You are not adjudicating whether the reported facts are true. If you find a\\n    factual error, note it, but that is a different finding type.\\n  - a bias accusation. \\\"This outlet is biased\\\" is not a finding. \\\"The piece places the\\n    justifying context in paragraph 6 while the emotional scene is in paragraph 1\\\" is a\\n    finding. Structure is observable; motive is not.\\n  - a claim that the piece should have reached a different conclusion. You are auditing\\n    whether the construction supports the impression it creates.\\n\\nTHIS AUDIT IS NOT ABOUT WHETHER YOU AGREE WITH THE PIECE. See the FLIP TEST (Section J), which\\nis mandatory and non-negotiable. A construction audit that only fires in one political\\ndirection is a broken instrument, and it is broken in exactly the way the pieces it audits are\\nbroken.\\n\\n-----------------------------------------------------------------\\nINPUTS\\n-----------------------------------------------------------------\\n\\nArticle / piece (full text, including headline, subheads, captions): [PASTE]\\n\\nPublication and date/time: [PASTE  -  timing matters for Section I]\\n\\nVERSION REVIEWED  -  required, media pieces change after publication: URL and/or archive link:\\nOriginal publication time: Last-updated time (if shown): Correction or update note present?\\n[yes / no / none visible] Headline changed since publication? [yes / no / unknown  -  check\\narchive] Social-card headline (if different from article headline): Homepage/section headline\\n(if different):\\n\\n  A great deal of media construction happens in packaging surfaces that differ from the\\n  article body  -  the social card, the homepage teaser, the push notification. Those reach\\n  more readers than the piece. If they differ from the article headline, that difference is\\n  itself a finding (Section B). If you cannot check them, write UNKNOWN  -  do not assume they\\n  match.\\n\\nClaim map, if produced upstream: [PASTE, or write NONE]\\n\\nWhat else was publicly known at publication time, if known: [Other coverage, official\\nstatements, video, documents available at press time. If unknown, write UNKNOWN  -  do not\\nassume. This bounds Section I.]\\n\\nPrior source - declare one:\\n\\n  SUPPLIED\\n    The operator supplied a prior. State it in one sentence.\\n\\n  MODEL-GENERATED\\n    No prior was supplied, but the auditor formed an expectation about how this\\n    story type or outlet would behave. State the prediction before auditing.\\n\\n  NONE\\n    No prior was supplied and no prior was generated.\\n\\nUsed by Section I2 and the flip test in Section J.\\n\\n-----------------------------------------------------------------\\nCOMPACT VOCABULARY\\n-----------------------------------------------------------------\\n\\nVERIFICATION STATE  -  media branch subset\\n\\n  LOCATED ..................... the item exists; content unverified\\n  FULL-TEXT-CONFIRMED ......... you read the full source and it supports the claim\\n  CROSS-OUTLET-CORROBORATED ... the fact is supported by 2+ INDEPENDENT origins\\n                                across outlets; state the per-fact origin count\\n  CONTESTED ................... outlets report it incompatibly\\n  PROVISIONAL ................. asserted from memory, or source not retrieved\\n\\n  RECEPTION-CONFIRMED IS NOT USED IN THIS BRANCH. In shared_primitives Section 1 it means a\\n  source's own scholarly reception was checked  -  replies, replications, corrigenda. A news\\n  article does not have reception in that sense. If you find yourself reaching for it, you\\n  want CROSS-OUTLET-CORROBORATED.\\n\\n  CROSS-OUTLET-CORROBORATED CARRIES A MANDATORY PER-FACT ORIGIN COUNT. Use\\n  this state only where the specific fact is supported by 2+ INDEPENDENT origins\\n  across outlets. Many outlets repeating one origin is AMPLIFICATION, not\\n  corroboration. State the fact's independent-origin count alongside the label.\\n  If the per-fact source chain was not checked, mark the claim PROVISIONAL.\\n\\n  For this branch: any claim about what OTHER outlets reported, what the subject's record\\n  contains, or what was known at press time is PROVISIONAL unless you retrieved it. Do not\\n  assert \\\"other reporting confirms X\\\" from memory.\\n\\n[MEDIA-P1] CAUSAL-ROLE AXES + GATES\\n\\nCANONICAL RULE. This compact copy and every local execution copy must move\\ntogether. Local sections may add examples, but may not rename, narrow, broaden,\\nor change the disposition of these axes and gates.\\n\\nSix axes. For each, extract the assignment the TEXT makes. Leave the axis blank\\nwhen the text supplies no usable assignment and the absence itself is not the\\nobject of analysis. When non-assignment is materially part of the construction,\\nrecord the applicable null state rather than silently leaving it blank.\\n\\nDo not infer an assignment from the headline alone. An assignment explicitly\\nstated in a headline may be recorded as a headline assignment; do not infer an\\nunstated cause, blame, role, or motive from it.\\n\\nNever infer cause, blame, motive, role, or status from names, appearance,\\nemployer, or location.\\n\\nEVENT CLASSIFICATION\\n  The noun or frame assigned to the event itself. The noun is a claim. Where the\\n  absence of classification is materially relevant, record UNCLASSIFIED.\\n\\nCAUSE\\n  Why the event happened: stated, alleged, or inferred motive; the explanation\\n  supplied for the event; or whether the text assigns no cause. Where materially\\n  relevant, record NO CAUSE ASSIGNED.\\n\\nROLE-AND-STATUS\\n  Who is cast as agent, victim, perpetrator, beneficiary, cost-bearer,\\n  bystander, official, whistleblower, defendant, or complainant.\\n\\nBLAME / RESPONSIBILITY\\n  Who or what is assigned fault, including whether responsibility is\\n  individualized, institutionalized, diffused, or left unassigned.\\n\\nREMEDY\\n  Whether a fix or solution is offered, whose fix it is, and who is called to\\n  act. Where materially relevant, record NO REMEDY FRAMED.\\n\\nLEADERSHIP / POLICY\\n  How leadership decisions or policy are characterized, including competent,\\n  failing, humane, authoritarian, negligent, necessary, or ineffective\\n  characterizations, whether stated directly, appositionally, or through a\\n  source.\\n\\nEPISTEMIC LEVEL - CAUSE AND BLAME\\n\\nClassify every CAUSE and BLAME assignment:\\n\\n  DOCUMENTED\\n    Direct statement, verified communication, or established record.\\n\\n  OFFICIALLY-ALLEGED\\n    Law enforcement, complaint, indictment, or institutional finding.\\n\\n  SOURCE-INFERRED\\n    Witness, advocate, expert, or interested party's inference.\\n\\n  OUTLET-INFERRED\\n    The article's own synthesis.\\n\\n  UNKNOWN\\n    Evidence insufficient.\\n\\nTest for silent upward movement: an alleged cause restated as documented, or a\\nsource's inference appearing later in outlet voice. Apply the ladder separately\\nto CAUSE and BLAME.\\n\\nVERB-AS-TRACE\\n\\nA verb or descriptor is reportable as causal-role framing only when it MOVES an\\nassignment on one of the six axes.\\n\\nExamples:\\n\\n- \\\"breach\\\" assigns migrant agency against a defended boundary;\\n- \\\"waved through\\\" reassigns cause to an authority;\\n- \\\"pour\\\" or \\\"surge\\\" can classify the event as flood-like mass movement.\\n\\nA lexical difference that moves no assignment is REGISTER variance. Record it\\nas register only; do not report it as framing.\\n\\nThis test is distinct from the causal-bridge test. VERB-AS-TRACE asks what\\ncausal-role assignment the language makes. The causal-bridge test asks whether\\nthe WHY of a sequence is present or removed.\\n\\nBRANCH-SPECIFIC LAYERS\\n\\nSingle-piece branch:\\n  Apply the mirror and flip guard to these axes. Cause, blame, and victim-role\\n  assignments are especially prior-sensitive. The branch must be able to\\n  decline to find a causal-role failure.\\n\\nCoverage branch:\\n  Add CHOSEN vs. INHERITED, TEXT-READ vs. HEADLINE-ONLY, and the genre\\n  not-firing condition. These determine whose framing is being observed and\\n  whether the sample can support a divergence finding.\\n\\nMEDIA FINDING TYPE  -  what KIND of failure this is (Distinct from FAILURE LOCATION in\\nshared_primitives Section 3, which means which LAYER of the chain  -  paper / citation /\\nPR-media / model-retrieval / mixed. These are different axes. Do not use \\\"failure location\\\"\\nfor the categories below.)\\n\\n  FACTUAL ......... the piece states something false or unsupported CONSTRUCTION .... facts\\n  accurate, assembly misleads (ordering, emphasis, verbs) OMISSION ........ what is absent\\n  changes the meaning of what is present SOURCING ........ voice selection is one-sided, or\\n  sources are unreliable CAUSAL-BRIDGE ... an explanatory fact is removed, changing the\\n  reader's model of why one event followed another - see Section E2.2.\\n  CAUSAL-ROLE-FRAMING ... an EVENT CLASSIFICATION, CAUSE, ROLE-AND-STATUS,\\n  BLAME / RESPONSIBILITY, REMEDY, or LEADERSHIP / POLICY assignment is\\n  constructed or shifted - see [MEDIA-P1] and Section E2.1.\\n  NARRATIVE-FLAG .. a non-[MEDIA-P1] attribute is activated, delayed,\\n  quote-routed, or omitted asymmetrically - see Section E2.1 BASELINE\\n  ........ a quantitative claim's meaning is set by denominator, comparison point, adjustment,\\n  or window  -  see Section E2.3 FRAME-LAUNDERING  the outlet's interpretation is delivered\\n  via quoted third parties rather than its own reporting  -  see Section F2. DISTINCT from\\n  SOURCING: adding a balancing voice does not fix it. PACKAGING ....... headline, image, or\\n  framing does work the body doesn't support NONE ............ construction is proportionate\\n  to the facts and sourcing\\n\\n  A piece can be clean on FACTUAL and severe on CONSTRUCTION. That combination is the most\\n  common and the most important to name precisely, because \\\"they lied\\\" is refutable and \\\"they\\n  assembled accurate facts into an unsupported impression\\\" is not.\\n\\n  FAILURE LOCATION, where applicable: a media piece is usually itself the PR-MEDIA layer.\\n  Record location only when the finding concerns how the piece handled an upstream source\\n  (e.g. the piece faithfully reports a study that itself overclaims\\n   - that is location PAPER, finding type FACTUAL-adjacent, and the piece may be clean).\\n\\n=================================================================\\nSECTION 0  -  GENRE / FORMAT GATE  (run first)\\n=================================================================\\n\\nClassify the piece before auditing anything. Format determines which standards apply, and\\nauditing a piece against standards its format never claimed is the fastest way to produce a\\nfinding that gets dismissed.\\n\\n  news report ............ full report, original reporting, standard newsroom norms breaking\\n  brief ......... short, fast, filed during an unfolding event analysis ...............\\n  interpretive, signed, argues a reading of the facts opinion / editorial .... argues a\\n  position openly press release .......... institutional messaging, advocacy by design\\n  advocacy brief ......... organizational, position-advancing by design explainer\\n  .............. background/context piece live blog .............. incremental, timestamped,\\n  unedited by design institutional statement  official communication\\n\\nSTANDARDS BY FORMAT  -  state which apply:\\n\\n  A 250-word BREAKING BRIEF cannot be judged like a 2,000-word investigation. Absence of\\n  balancing voices, thin sourcing, and missing context are FORMAT CONSTRAINTS, not findings,\\n  unless the piece had room and chose otherwise.\\n\\n  An OPINION or EDITORIAL piece is ALLOWED to argue. Sourcing asymmetry and one-sided framing\\n  are the genre, not a defect. What it may NOT do is misrepresent its evidence, attribute\\n  claims falsely, or assert contested facts as settled. Audit those; do not audit it for\\n  having a position.\\n\\n  A PRESS RELEASE or ADVOCACY BRIEF is advocacy by design. Auditing it for \\\"one-sided\\n  sourcing\\\" is a category error. Audit it as institutional messaging: does it misrepresent the\\n  underlying evidence? Does it claim more than its source supports?\\n\\n  A LIVE BLOG is incremental by design. Sequencing findings largely do not apply.\\n\\nREQUIRED OUTPUT: Format: [classification] (Section F2, quote function / frame laundering,\\nAPPLIES TO EVERY FORMAT  - including briefs. Length constrains sourcing balance; it does not\\nconstrain whether the piece's interpretation comes from its own reporting.)\\n\\n  Sections that APPLY given this format: Sections that are N/A given this format, and why:\\n  Findings that would be format constraints rather than choices:\\n\\nINTERACTION WITH SECTION I (timing test): the timing defense applies strongly to BREAKING\\nBRIEF and LIVE BLOG, weakly to NEWS REPORT, and barely at all to ANALYSIS, OPINION, or\\nEXPLAINER  -  those are written with time to consider.\\n\\n=================================================================\\nSECTION A  -  BASELINE: WHAT IS ESTABLISHED VS. WHAT IS ASSERTED\\n=================================================================\\n\\nBefore analyzing construction, separate the layers. List:\\n\\n  1. Facts the piece reports as established (asserted in the outlet's voice)\\n  2. Facts the piece attributes to a source (\\\"police say,\\\" \\\"according to\\\")\\n  3. Characterizations and interpretations (the outlet's framing)\\n  4. Reactions and quotes from others\\n  5. What the piece does NOT state\\n\\nRequired table:\\n\\n| Statement | Layer (asserted / attributed / characterization / quote) | Verification state |\\n|---|---|---|\\n\\nWHY THIS FIRST: the asserted/attributed line is where a lot of construction work happens.\\nFacts favorable to one reading asserted directly; facts favorable to the other attributed to\\nan interested party (\\\"police say\\\") are treated by readers as weaker. Note asymmetry here  -\\nit recurs in Section E.\\n\\n=================================================================\\nSECTION B  -  HEADLINE & PACKAGING\\n=================================================================\\n\\n  1. What impression does the headline alone create?\\n  2. Is that impression supported by the body?\\n  3. What material facts present in the body are ABSENT from the headline?\\n  4. Would a reader who read only the headline be misinformed relative to a reader who read\\n     the whole piece? Specifically how?\\n  5. Image/caption: what does the lead image depict, and what does that choice emphasize? What\\n     could have been depicted instead?\\n  6. Subheads, pull quotes, tags: what do they emphasize?\\n\\nRate: headline SUPPORTED / PARTIALLY SUPPORTED / UNSUPPORTED by the body.\\n\\nNote explicitly: headlines are often written by editors, not reporters. That affects\\nattribution of responsibility, not whether the packaging misleads.\\n\\n=================================================================\\nSECTION C  -  SEQUENCING\\n=================================================================\\n\\nMap the order of material. Paragraph by paragraph or block by block:\\n\\n| paragraph  | Content | Function (scene / reaction / justification / context / attribution) |\\n|---|---|---|\\n\\nThen answer:\\n  1. What is in the first three paragraphs?\\n  2. Where does the material that most complicates the lead impression appear? Paragraph\\n     number, and how far down the page is that in practice?\\n  3. Is any load-bearing context placed after the point most readers stop?\\n  4. Reverse the order of two specific blocks. Does the impression change? If ordering alone\\n     changes the impression, ordering is doing argumentative work.\\n  5. Is context that undercuts the frame bundled INTO a paragraph whose other content\\n     reinforces the frame? (A common move: place the complicating fact adjacent to a damning\\n     detail so it reads as qualified.)\\n\\n=================================================================\\nSECTION D  -  AGENCY AND VERB ASYMMETRY\\n=================================================================\\n\\nFor each principal party in the piece, list the verbs and constructions used.\\n\\n| Party | Verbs / constructions used | Active or passive | Vivid or clinical |\\n|---|---|---|---|\\n\\nThen:\\n  1. Is one party's action rendered vividly and another's clinically? Give the specific pairs.\\n  2. Are there passive constructions that remove an actor? Who disappears?\\n  3. Are there euphemisms or de-agentifying verbs for one party's conduct? (e.g. \\\"produced a\\n     weapon\\\" vs. \\\"drew and used a weapon\\\"  -  the first minimizes agency without stating\\n     anything false)\\n  4. Rewrite the two most asymmetric sentences with the asymmetry reversed.\\n     Does the piece read differently?\\n\\nVERB-AS-TRACE GATE - apply before creating a finding.\\n\\nA vivid, clinical, mild, or harsh wording difference is a construction finding\\nonly if it moves a [MEDIA-P1] assignment or adds/removes a causal bridge. If the\\nrewrite changes register but moves no axis and removes no bridge, record\\nREGISTER variance only and do not create a framing finding. The rewrite\\ndemonstrates a construction effect only after this gate passes.\\n\\nNOTE: some asymmetry is warranted by the facts. A party that did more gets more\\nverbs. Flag asymmetry that is NOT proportionate to what each party did and that\\npasses the gate above.\\n\\n=================================================================\\nSECTION E  -  ATTRIBUTION ASYMMETRY\\n=================================================================\\n\\n  1. Which claims are asserted in the outlet's voice, and which are attributed?\\n  2. Do claims favorable to one reading get asserted while claims favorable to the other get\\n     attributed to an interested party?\\n  3. Attribution verbs: who \\\"said\\\" vs. \\\"claimed\\\" vs. \\\"alleged\\\" vs. \\\"admitted\\\" vs.\\n     \\\"acknowledged\\\"? These are not neutral.\\n  4. Scare quotes: which terms are placed in quotation marks, and does that signal distance?\\n  5. Are caveats applied symmetrically to both sides' accounts?\\n\\n=================================================================\\nSECTION E2  -  NARRATIVE FLAGS, CAUSAL BRIDGES & ATMOSPHERIC CUES\\n=================================================================\\n\\nWHY THIS IS ORGANIZED AS A TRIAD\\n-----------------------------------------------------------------\\n\\nA piece constructs meaning through three distinct mechanisms that are easy to collapse into a\\ngeneric \\\"word choice\\\" finding, and should not be:\\n\\n  NARRATIVE FLAGS ..... facts or labels that CLASSIFY the actors or the event. What kind of\\n  person is this? What kind of event is this?\\n\\n  CAUSAL BRIDGES ...... facts that explain WHY one thing followed another. Their removal\\n  changes the reader's model of the sequence, not merely its emotional register.\\n\\n  ATMOSPHERIC CUES .... details that tell the reader HOW TO FEEL about the event before the\\n  facts establish whether that feeling is warranted.\\n\\nSEVERITY  -  REBUTTABLE DEFAULT, NOT A FIXED HIERARCHY: Default ranking is causal bridges >\\nnarrative flags > atmospheric cues, because removing a causal bridge changes the reader's\\nMODEL of what happened rather than its register. A causal omission dropped into a \\\"word\\nchoice\\\" bucket is a diluted finding, and this default exists to prevent that.\\n\\nBUT THE DEFAULT IS REBUTTABLE. An event-classification flag (\\\"riot,\\\" \\\"reform,\\\" \\\"crisis,\\\"\\n\\\"correction\\\"), a motive attribution, a denominator choice, or a sustained atmospheric frame\\ncan outweigh a modest causal omission. To rank one above a causal bridge, STATE WHY  -  name\\nthe concrete construction effect. Rank the effect, not the mechanism's category.\\n\\nWHERE QUANTITATIVE CLAIMS FIT  -  baselines are not a fourth mechanism. They are the NUMERICAL\\nFORM of the same three: category redefinition / changed geographic scope .... narrative flag,\\nin numbers denominator, adjustment, comparison point ........... causal bridge, in numbers\\nwhich year or window is chosen for contrast ......... atmospheric cue, in numbers\\n\\\"Unemployment rose\\\" vs. \\\"rose after the plant closed\\\" and a raw count vs. a rate are the same\\noperation performed on different material. Section E2.3 treats them together for convenience;\\ndo not classify them as a separate mechanism.\\n\\nTHIS MODULE IS NOT CRIME-SPECIFIC. The mechanisms operate identically in economic, policy,\\nhealth, education, institutional, and cultural coverage. Crime examples appear below as ONE\\ndomain among several. If you find yourself only able to apply this to crime stories, you are\\nreading the examples as the definition.\\n\\n=================================================================\\n\\nE2.1  -  NARRATIVE FLAGS: WHICH ATTRIBUTES ARE ACTIVATED\\n-----------------------------------------------------------------\\n\\nPieces construct meaning through WHICH ATTRIBUTES OF THE ACTORS OR EVENT THEY ACTIVATE  -\\nforegrounding, delaying, routing through quotes, or omitting.\\n\\nCATEGORIES OF NARRATIVE-BEARING ATTRIBUTE (all domains):\\n\\n  PERSONAL / DEMOGRAPHIC age, race, ethnicity, sex, religion, nationality, immigration or\\n  residency status, family role, housing status, health status\\n\\n  AFFILIATION AND INTEREST political party, ideological alignment, funding source, employer,\\n  industry ties, institutional membership, advocacy-group affiliation, prior employment by an\\n  interested party\\n\\n  CREDENTIAL AND STANDING \\\"expert\\\" vs. \\\"activist\\\" vs. \\\"critic\\\"; \\\"economist\\\" vs.\\n  \\\"industry-funded economist\\\"; \\\"researcher\\\" vs. \\\"campaigner\\\"; \\\"official\\\" vs. \\\"spokesperson\\\";\\n  who gets a title and who gets a descriptor\\n\\n  ROLE-AND-STATUS\\n    Apply [MEDIA-P1]. Examples include victim, perpetrator, bystander, official,\\n    whistleblower, defendant, complainant, beneficiary, and cost-bearer.\\n\\n  EVENT CLASSIFICATION\\n    Apply [MEDIA-P1]. Examples include crime, protest, unrest, terrorism,\\n    self-defense, activism, mental-health crisis, reform, cut, restructuring,\\n    closure, outbreak, cluster, surge, recession, slowdown, correction,\\n    shortage, backlog, or crisis.\\n\\n  CAUSE\\n    Apply [MEDIA-P1]. This includes motive and causal attribution.\\n\\n  BLAME / RESPONSIBILITY\\n    Apply [MEDIA-P1].\\n\\n  REMEDY\\n    Apply [MEDIA-P1].\\n\\n  LEADERSHIP / POLICY\\n    Apply [MEDIA-P1].\\n\\nAXIS OWNERSHIP\\n\\nThese six headings are the [MEDIA-P1] axis set. The compact definitions govern.\\nThe examples here illustrate the axes; they do not extend or rename them.\\n\\nThe epistemic-level ladder below is a local execution copy of [MEDIA-P1]'s\\nCAUSE-and-BLAME gate and must match it exactly.\\n\\nAN ATTRIBUTE IS A CANDIDATE FINDING ONLY WHERE:\\n  1. it was known or credibly reported at publication time;\\n  2. it is materially relevant to the interpretation the piece creates;\\n  3. comparable actors or items are treated differently; OR\\n  4. the piece activates it indirectly  -  through quotes, labels, images, captions,\\n     historical context, or linked stories  -  while avoiding it in outlet voice.\\n\\nAPPOSITIONAL FLAGS  -  labels embedded in introductions or appositives: \\\"the controversial\\nprofessor,\\\" \\\"the far-right group,\\\" \\\"the reform-minded prosecutor,\\\" \\\"the industry-backed\\ncritic,\\\" \\\"John Smith, an election denier, said\\\" These arrive grammatically as SETTLED\\nBACKGROUND rather than as claims requiring sourcing, which is precisely what makes them\\neffective. For each: who supplied the classification? Is it contested? Are comparable\\ndescriptors applied to comparable parties on the other side? An appositional label is a claim\\nwearing the costume of a fact.\\n\\nCAUSE AND BLAME - EPISTEMIC LEVELS\\nLOCAL EXECUTION COPY - canonical in [MEDIA-P1]; must match.\\n\\nClassify every CAUSE and BLAME assignment:\\n\\n  DOCUMENTED\\n    Direct statement, verified communication, or established record.\\n\\n  OFFICIALLY-ALLEGED\\n    Law enforcement, complaint, indictment, or institutional finding.\\n\\n  SOURCE-INFERRED\\n    Witness, advocate, expert, or interested party's inference.\\n\\n  OUTLET-INFERRED\\n    The article's own synthesis.\\n\\n  UNKNOWN\\n    Evidence insufficient.\\n\\nTest for silent upward movement: an alleged cause restated as documented, or a\\nsource's inference appearing later in outlet voice. Apply the ladder separately\\nto CAUSE and BLAME.\\n\\nThis applies well beyond crime: why a company relocated, why voters shifted, why\\nscores fell, why a policy was introduced, or why an institution disciplined\\nsomeone.\\n\\nDO NOT INFER UNKNOWN ATTRIBUTES. Never infer race, religion, immigration status, ideology,\\nfunding, or motive from names, appearance, location, employer, or rumor. An unconfirmed\\nattribute is not an omission.\\n\\nTREATMENT CLASSIFICATION  -  for each material attribute:\\n\\n  ACTIVATED ....... explicitly foregrounded or repeatedly emphasized REPORTED ........\\n  included proportionately as ordinary context DELAYED ......... included only after the\\n  dominant impression is established QUOTE-ROUTED .... supplied through a speaker, absent from\\n  outlet voice EUPHEMIZED ...... referenced indirectly through substitute language OMITTED\\n  ......... known, material, and absent INAPPLICABLE .... unknown, immaterial, or improper to\\n  report\\n\\n| Attribute | Known at pub? | Treatment | First appears | Outlet voice or quote? | Material relevance |\\n|---|---|---|---|---|---|\\n\\nASYMMETRY TESTS:\\n\\n  1. Are identifiers supplied for one principal actor but not another?\\n  2. Is one party INDIVIDUALIZED while another is CATEGORIZED? crime:     \\\"father of three\\\"\\n     vs. \\\"the suspect\\\" policy:    a named family with a story vs. \\\"affected households\\\"\\n     economics: a profiled small-business owner vs. \\\"employers\\\" health:    a named patient vs.\\n     \\\"the unvaccinated\\\" education: a named teacher vs. \\\"administrators\\\"\\n  3. Are DISCLOSURES applied evenly? If one source's funding, party, or prior employment is\\n     noted, is the opposing source's?\\n  4. Are credentials assigned asymmetrically  -  one side \\\"experts,\\\" the other \\\"critics\\\" or\\n     \\\"skeptics\\\"? SUBSTANTIVE-EQUIVALENCE CHECK: compare standing RELEVANT TO THE CLAIM AT\\n     ISSUE, not general prestige. A physician may be expert on clinical treatment but not\\n     population epidemiology; an economist may model costs but not clinical outcomes. The\\n     asymmetry finding requires comparable DOMAIN RELEVANCE, not comparable titles. \\\"Both have\\n     doctorates\\\" is not the standard.\\n  5. Is an attribute absent from the factual account but introduced via quote, headline,\\n     caption, hyperlink, or related-story box?\\n  6. Does the piece say cause or motive is unknown in one instance while naming it confidently\\n     in a comparable one?\\n\\nVERB-AS-TRACE\\nLOCAL EXECUTION COPY - canonical in [MEDIA-P1]; must match.\\n\\nA verb or descriptor is reportable as causal-role framing only when it MOVES an\\nassignment on one of the six [MEDIA-P1] axes.\\n\\nA lexical difference that moves no assignment is REGISTER variance. Record it\\nas register only; do not report it as framing.\\n\\nThis is distinct from E2.2. VERB-AS-TRACE tests causal-role assignment. E2.2\\ntests whether wording removes the WHY of a sequence. Keep both; they catch\\ndifferent failures.\\n\\n-----------------------------------------------------------------\\nE2.2  -  CAUSAL BRIDGES: SYNONYM VARIANCE vs. CAUSAL-CONTEXT LOSS\\n-----------------------------------------------------------------\\n\\nTHE MOST IMPORTANT DISTINCTION IN THIS MODULE. Do not treat all wording differences as\\nsynonyms.\\n\\n  SYNONYM / REGISTER VARIANCE\\n    Different words preserve the same causal proposition. Examples:\\n    drew / pulled / produced a knife; fell / declined / dropped;\\n    protest / demonstration / rally; cut / reduced / trimmed.\\n\\n    Apply [MEDIA-P1] before rating. If the wording moves no causal-role axis and\\n    removes no causal bridge, it is R
