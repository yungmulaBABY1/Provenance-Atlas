r synthesis reports, institutional press releases, news\\ncoverage, and encyclopedia or summary entries. Quote what you find.\\n\\nFOUR PROVENANCE STATES  -  label every downstream item with exactly one:\\n\\n  SUPPLIED The user provided the text. Quote it.\\n\\n  RETRIEVED You searched and found the actual downstream text. Quote it and name where it came\\n  from.\\n\\n  RECALLED You believe downstream inflation occurred but did NOT retrieve the text. State this\\n  plainly as its own labeled line, NOT as a parenthetical or footnote. It may not be quoted as\\n  though verified and may not anchor Field 5's failure-location classification.\\n\\n  NONE FOUND You searched and found nothing. Say which searches you ran.\\n\\nTHE PARENTHETICAL FAILURE  -  observed in a live run and explicitly forbidden.\\n\\nA run declared \\\"no downstream uses supplied, fields 5-6 PROVISIONAL,\\\" then added a\\nparenthetical noting the paper was \\\"later widely restated in secondary literature and\\nassessment reports\\\" - unretrieved, unquoted, offered \\\"for completeness of the map only.\\\"\\n\\nThat is RECALLED material wearing the costume of a footnote. It neither retrieves nor cleanly\\nabstains, and it lets unverified knowledge into the map through a side door where downstream\\nstages will read it as context.\\n\\nIf you know something about downstream use, label it RECALLED on its own line. Do not append\\nit as an aside.\\n\\nIF NOTHING IS RETRIEVABLE:\\n\\nWrite \\\"no downstream uses retrieved  -  inflation analysis limited to the source itself,\\\" and\\nstate whether that reflects an absence of downstream use or an absence of retrieval\\ncapability.\\n\\nThose are different findings, and the distinction matters:\\n\\n- the first is evidence the claim did not travel;\\n- the second is evidence you could not check.\\n\\nWHICH FIELDS GO PROVISIONAL  -  field-specific, not blanket:\\n\\n  FIELD 4  -  PROVISIONAL You cannot distinguish \\\"no downstream use exists\\\" from \\\"I could not\\n  retrieve it.\\\"\\n\\n  FIELD 5  -  PARTIALLY PROVISIONAL Mark the DOWNSTREAM component provisional. The\\n  WITHIN-SOURCE component - prominence asymmetry between abstract and methods, or a headline\\n  stated at higher confidence than the results section supports - is established from the\\n  paper alone and is NOT provisional.\\n\\n    State both parts separately rather than marking the whole field.\\n\\n  FIELD 6  -  CONDITIONAL If Field 6 targets the source's own claim, it needs no downstream\\n  material and is NOT provisional.\\n\\n    If Field 6 targets a downstream restatement, it is provisional, and you should reconsider\\n    whether that is the right target given that you could not retrieve the restatement.\\n\\nDo not mark fields provisional in a block. A blanket PROVISIONAL on a field with a verifiable\\ncomponent discards work you actually did.\\n\\nDO NOT RECONSTRUCT DOWNSTREAM CLAIMS FROM MEMORY AND PRESENT THEM AS FOUND.\\n\\nA fabricated inflation chain corrupts every stage that follows. It is the single most damaging\\nerror available at this stage: downstream prosecutors will audit a laundering pathway that may\\nnot exist.\\n\\nATTRIBUTION CHECK  -  RUN ON EVERY DOWNSTREAM ITEM BEFORE RECORDING IT.\\n\\nA downstream restatement belongs in this map only if THE AUDITED SOURCE actually supports it.\\nBefore recording an item, ask:\\n\\n  Could the audited source, on its own, support this restatement?\\n\\nIf NO - if the restatement requires a successor paper, a later extension, a larger dataset, a\\npooled or multi-study analysis, or a different source entirely - DO NOT STOP THERE.\\n\\nAsk the second question:\\n\\n  WHO DOES THE DOWNSTREAM TEXT CITE FOR IT?\\n\\nTwo facts can be true at once: the claim rests on another source, AND the downstream text\\nattributes it to the audited source.\\n\\nThe second is laundering, and it is the mechanism by which a paper acquires claims it never\\nmade.\\n\\n  CITES THE ACTUAL SUPPORTING SOURCE ATTRIBUTED ELSEWHERE  -  [restatement] rests on [actual\\n  source], and the downstream text cites it correctly. Not inflation by the audited source.\\n\\n  CITES THE AUDITED SOURCE MISATTRIBUTED  -  [downstream text] attributes [restatement] to the\\n  audited source, which does not support it.\\n\\n    THIS IS INFLATION, and it is the strongest form: the citation confers authority the source\\n    does not have.\\n\\n    Quote the citing sentence WITH its citation.\\n\\n    Failure location: CITATION.\\n\\n  CITES THE AUDITED SOURCE JOINTLY WITH THE ACTUAL SOURCE Do not classify from the sentence\\n  alone. Run the document-level joint-citation check below.\\n\\nJOINT CITATION REQUIRES A DOCUMENT-LEVEL CHECK BEFORE CLASSIFICATION.\\n\\nA joint citation - \\\"(Source A, Source B)\\\" - is ambiguous on its own. Before classifying it,\\nsearch the citing document for whether it distinguishes the sources' scopes ANYWHERE, not only\\nin the sentence at issue.\\n\\n  THE DOCUMENT DISTINGUISHES THEM ELSEWHERE It names what each source covers, dates them\\n  separately, or describes one as extending the other.\\n\\n    SYNTHESIS ATTRIBUTION, not misattribution.\\n\\n    The joint citation is shorthand for a research program in a document that has already told\\n    the reader which source supplies what.\\n\\n    Record it, note the distinction, and do not classify it as inflation.\\n\\n  THE DOCUMENT NEVER DISTINGUISHES THEM MISATTRIBUTED.\\n\\n    A reader has no way to learn that the audited source does not support the claim, and the\\n    joint citation confers authority it lacks.\\n\\nOBSERVED FAILURE THIS CLOSES:\\n\\nA run classified an assessment report's joint citation as MISATTRIBUTED on the sentence alone.\\n\\nA later run retrieved the same report's earlier chapter, found that it explicitly stated the\\n1998 study covered 600 years and the 1999 study extended to 1,000 years, and correctly\\nreclassified the joint citation as SYNTHESIS ATTRIBUTION.\\n\\nThe sentence-level rule produced a false positive against a careful document.\\n\\nTHIS ASYMMETRY IS DELIBERATE.\\n\\nA single-source misattribution is established at sentence level. A joint citation is not. It\\nrequires showing that the document does not disambiguate.\\n\\nThat is a higher bar, and it should be.\\n\\nMISATTRIBUTED IS NOT A WEAKER FINDING THAN ORDINARY INFLATION.\\n\\nIt is a stronger one. Ordinary inflation stretches what a source said; misattribution assigns\\nit something it never said, under its name.\\n\\nDo not let the fact that another source could support the claim become a reason to clear the\\nciting text. That is the loophole, and it exonerates exactly the behavior this stage exists to\\ndetect.\\n\\nOBSERVED FAILURE THIS CLOSES:\\n\\nTwo maps of the same paper reached opposite conclusions on the same restatement.\\n\\nOne reasoned that the millennial claim rests on a successor paper, recorded ATTRIBUTED\\nELSEWHERE, and found no inflation.\\n\\nThe other retrieved the assessment report's actual sentence and found the millennial claim\\nasserted with the AUDITED paper cited for it.\\n\\nThe second was correct. The first applied the attribution check faithfully and arrived at the\\nwrong answer because the rule stopped at the first question.\\n\\nRETRIEVE THE CITING SENTENCE, NOT THE CLAIM.\\n\\nYou cannot run this check on a remembered summary of what downstream sources say. \\\"The field\\ncommonly states X\\\" tells you nothing about who is cited for X.\\n\\nGet the sentence and its citation, or mark the item RECALLED and do not classify it.\\n\\nTHE TEST IS SCOPE ARITHMETIC.\\n\\nCompare what the restatement asserts against what the source measured. If the downstream claim\\ncovers a longer period, a broader population, a different outcome, a larger geography, or a\\nfiner resolution than the source's design reaches, something other than this source is\\ncarrying it. Find out what.\\n\\nSAME-AUTHOR SUCCESSORS ARE STILL DIFFERENT SOURCES.\\n\\nA follow-on paper by the same team, extending the same method to new data, is new work with\\nits own methods and its own uncertainty statements.\\n\\nTreating its claims as inflation of the earlier paper is a category error unless the\\ndownstream text itself cites the earlier paper for the successor's claim.\\n\\nIf the earlier paper is cited alone, classify the item as MISATTRIBUTED. If it is cited\\njointly with the successor, apply the document-level joint-citation check before deciding\\nbetween SYNTHESIS ATTRIBUTION and MISATTRIBUTED.\\n\\nATTRIBUTION VERIFICATION STATE  -  USE THIS; DO NOT INVENT ONE.\\n\\nChecking an attribution is a distinct verification act. It is not reception checking and not\\nfull-text checking: it requires reading the DOWNSTREAM text and the AUDITED source - and,\\nwhere relevant, the successor - and comparing what is claimed against what each supports.\\n\\nRecord it as:\\n\\n  CROSS-SOURCE-CONFIRMED The attribution relationship was checked against both the downstream\\n  text and the audited source, plus a successor or alternative source where one is implicated.\\n\\n    Use this for every MISATTRIBUTED or ATTRIBUTED ELSEWHERE classification you actually\\n    verified.\\n\\nDO NOT INVENT VERIFICATION STATES.\\n\\nUse the ladder in shared_primitives.txt Section 1 plus CROSS-SOURCE-CONFIRMED above.\\n\\nLive runs have produced \\\"ESTABLISHED FROM SOURCE,\\\" \\\"RECONSTRUCTION FROM SOURCE,\\\" and other\\nad-hoc labels. Each reads as authoritative, and none is defined anywhere, so a downstream\\nstage cannot tell what was actually checked.\\n\\nIf the ladder has no state for what you did, say so in words rather than coining a label. An\\nundefined state is worse than a plain sentence.\\n\\nFor Field 3 specifically, which is a reconstruction rather than a retrieval, write:\\n\\n  \\\"author reconstruction from Field 1\\\"\\n\\nThat is a description, not a verification state.\\n\\nPROVENANCE-STATE DISCIPLINE  -  provenance records what happened, not what passed:\\n\\n  SUPPLIED The user supplied the item, passage, document, or exact source lead for this run.\\n  Preserve SUPPLIED even when the item lacks a quotation, locator, or attribution check.\\n  Record those deficiencies under anchor eligibility.\\n\\n  RETRIEVED The auditor directly accessed the item or source during this run. RETRIEVED\\n  records the act of direct access; it is not a claim that the item is sufficiently documented\\n  to anchor Field 5.\\n\\n    A RETRIEVED item may therefore be:\\n\\n      RETRIEVED  -  ANCHOR-ELIGIBLE RETRIEVED  -  NOT ANCHOR-ELIGIBLE: quotation missing\\n      RETRIEVED  -  NOT ANCHOR-ELIGIBLE: locator missing\\n\\n    If the source was not directly accessed in this run and the item is being supplied from\\n    memory, inference, or prior exposure, use RECALLED.\\n\\n  RECALLED The item was not directly accessed in this run. It is remembered, inferred from\\n  prior exposure, or described without current retrieval.\\n\\n  NONE FOUND Means you searched and the thing does not exist. It is NOT a completeness caveat.\\n  \\\"NONE FOUND for an exhaustive enumeration of every press release\\\" is a scope note, not a\\n  provenance state. Write it as a scope note.\\n\\nDo not use anchor eligibility to relabel provenance. A missing quotation or locator makes an\\nitem ineligible to anchor; it does not change how the item entered the audit.\\n\\n5. WHERE THE INFLATION BEGINS\\n\\nANCHORING RULE  -  CHECK BEFORE ASSIGNING ANY FAILURE LOCATION.\\n\\nA failure location may be assigned only from an item that satisfies BOTH conditions:\\n\\n1. Its provenance state is SUPPLIED or RETRIEVED.\\n2. It is ANCHOR-ELIGIBLE under the sufficiency check below.\\n\\nRECALLED items may be reported in Field 4; they may not determine where the failure lives.\\n\\nPROVENANCE AND ANCHOR ELIGIBILITY ARE DIFFERENT AXES.\\n\\nProvenance records how the item entered the audit. Anchor eligibility records whether the item\\nis sufficiently documented to support a failure-location classification.\\n\\nA later sufficiency check may change an item's weight or eligibility. It may NEVER rewrite its\\nprovenance.\\n\\nExamples:\\n\\n- SUPPLIED  -  NOT ANCHOR-ELIGIBLE: locator missing.\\n- RETRIEVED  -  NOT ANCHOR-ELIGIBLE: quotation missing.\\n- SUPPLIED  -  ANCHOR-ELIGIBLE: quotation and locator both present.\\n- RETRIEVED  -  ANCHOR-ELIGIBLE: quotation and locator both present.\\n\\nDo not convert a SUPPLIED item into RECALLED merely because it lacks a locator. That would\\nreplace the factual audit trail with a record of what passed a later test.\\n\\nVERIFY ELIGIBILITY; DO NOT TRUST THE EARLIER LABEL.\\n\\nBefore an item anchors a failure location, confirm that it contains:\\n\\n- the quoted sentence - not a paraphrase and not a description of a pattern;\\n- a locator: document plus section or page, and URL where available;\\n- CROSS-SOURCE-CONFIRMED attribution where the finding is MISATTRIBUTED, ATTRIBUTED ELSEWHERE,\\n  or SYNTHESIS ATTRIBUTION.\\n\\nRequired anchoring table:\\n\\n| Item | Provenance state | Quotation present? | Locator present? | Attribution cross-source-confirmed, if applicable? | Anchor eligibility |\\n|---|---|---|---|---|---|\\n| | | yes / no | yes / no | yes / no / N/A | ELIGIBLE / NOT ELIGIBLE  -  reason |\\n\\nIf an item lacks a quotation, locator, or required attribution check, preserve its original\\nprovenance state and mark it NOT ANCHOR-ELIGIBLE. It may remain in Field 4 as context, but it\\nmay not determine Field 5.\\n\\nPATTERN CLAIMS DO NOT ANCHOR BY THEMSELVES.\\n\\n\\\"Frequent restatements of the form X, often citing Y\\\" is a pattern assertion, not an\\nitem-level quotation. Preserve its actual provenance state - SUPPLIED, RETRIEVED, or RECALLED\\n- but mark it NOT ANCHOR-ELIGIBLE unless item-level quotations and locators establish the\\npattern.\\n\\nOne quoted sentence with a locator outranks any number of asserted frequencies. A bare pattern\\nclaim cannot be checked, corrected, or disputed by a reader.\\n\\nIf a suspected layer has no ANCHOR-ELIGIBLE supporting item, the correct output is:\\n\\n  \\\"[Layer]  -  SUSPECTED, not established. The supporting material is not anchor-eligible:\\n  [quotation missing / locator missing / attribution not cross-source-confirmed / recalled\\n  only]. [State the specific retrieval or verification that would settle it.]\\\"\\n\\nDO NOT write \\\"primary locus of inflation\\\" for a layer supported only by material that is\\nrecalled or otherwise not anchor-eligible. Confidence does not cure missing quotation,\\nlocator, or attribution verification.\\n\\nOBSERVED FAILURE THIS CLOSES:\\n\\nA run correctly wrote that its downstream items were \\\"labeled RECALLED and do not anchor\\nfailure-location classification,\\\" then assigned CITATION / PR-MEDIA / ASSESSMENT as the\\n\\\"primary locus of inflation\\\" on exactly that material.\\n\\nThe rule was stated in Field 4 and violated in Field 5. Stating a discipline is not the same\\nas applying it at the point where it binds.\\n\\nA within-source component established from the paper alone is unaffected by this rule. State\\nthe within-source and downstream components separately, as Field 4 requires.\\n\\nThe specific transition where the claim exceeds what the measurement supports. Name the\\npassage, the citing paper, the press release sentence, or the summary.\\n\\nBe precise about the move:\\n\\n- \\\"MMO progression rate\\\" -> \\\"gaming performance\\\" is a construct substitution.\\n- \\\"No difference in the sampled population\\\" -> \\\"no difference\\\" is a scope removal.\\n- \\\"Associated with\\\" -> \\\"causes\\\" is an inferential upgrade.\\n\\nThen classify the failure location using primitives Section 3:\\n\\n  PAPER The source itself makes the leap.\\n\\n  CITATION Later literature makes it.\\n\\n  PR / MEDIA The communications layer makes it.\\n\\n  MODEL / RETRIEVAL Summarizers reproduce the inflated version.\\n\\n  MIXED Specify which layer contributes which part.\\n\\nState the verification state (primitives Section 1) of every item anchoring the\\nclassification. Use CROSS-SOURCE-CONFIRMED where an attribution relationship was verified\\nacross sources. If the downstream chain is only RECALLED, do not assign an established\\ndownstream failure location; use the SUSPECTED wording required above.\\n\\nIMPORTANT: it is a legitimate and common finding that the source is narrow and defensible\\nwhile the downstream layer is not. Do not force a PAPER classification.\\n\\nAttacking a careful paper for its press release is a category error and the fastest way for a\\ncritique to be dismissed.\\n\\nCLAIM INVENTORY  -  COMPLETE BEFORE SELECTING FIELD 6.\\n\\nList every distinct claim the source makes that could plausibly be inflated downstream.\\n\\nFor each claim, provide:\\n\\n- the claim in one sentence;\\n- whether it is quantified;\\n- why it might be inflated downstream;\\n- whether it is selected for Field 6.\\n\\nRequired table:\\n\\n| Claim | Quantified? | Why it might be inflated | Selected for Field 6? |\\n|---|---|---|---|\\n| | | | |\\n\\nThen select ONE claim for Field 6 and state why it received priority over the others.\\n\\nThe unselected claims are DEFERRED, not dismissed. A second run of the sequence audits them.\\n\\n6. WHICH CLAIM IS THIS AUDIT EVALUATING?\\n\\nState it in one sentence. Every prosecutor targets THIS claim.\\n\\nTWO SELECTION RULES  -  both are load-bearing.\\n\\nRULE 1  -  ONE CLAIM ONLY\\n\\nField 6 names a single claim. Do not bundle two claims into one field, and do not append a\\nsecond with a parenthetical or an \\\"and the associated inference that...\\\" clause.\\n\\nA source often makes several distinct claims with different evidence bases: a measurement\\nclaim and an attribution claim, an effect claim and a mechanism claim. Auditing two at once\\nreproduces, inside a single field, the exact incoherence this stage exists to prevent.\\n\\nIf two claims both warrant auditing, run the sequence twice.\\n\\nRULE 2  -  PREFER THE MOST PRECISELY QUANTIFIED VERSION\\n\\nSources frequently state the same claim at multiple levels of precision: a general form in the\\nabstract and a specific quantified form in the results. Where both exist, TARGET THE\\nQUANTIFIED ONE.\\n\\nExample:\\n\\n  Abstract: \\\"X is warmer than any year since 1400.\\\"\\n\\n  Results: \\\"X exceeds any year back to 1400 at three standard errors, or roughly a 99.7% level\\n  of certainty.\\\"\\n\\n  Field 6 targets the SECOND.\\n\\nWhy: a claim with a number attached can fail a construct-validity test cleanly. You can ask\\nwhether the stated measurement supports the stated quantity.\\n\\nA claim without one can only be assessed as broadly supported or broadly unsupported, which\\ncollapses most audits toward the same verdict. The quantified version is also where the source\\nhas committed to something specific, which is where a defect, if present, is demonstrable\\nrather than arguable.\\n\\nOBSERVED FAILURE THIS CLOSES:\\n\\nOn a live run, one map selected the abstract's unquantified version and bundled a second claim\\ninto Field 6. The audit returned the same general verdict as two earlier ungoverned runs.\\n\\nA second map on the same paper selected the quantified version alone, and the audit located a\\nspecific defect in the source's own stated method that the other three runs did not find.\\n\\nThe difference was Field 6, not the prosecutor.\\n\\nIF THE QUANTIFIED CLAIM IS NOT THE ONE YOU CARE ABOUT, say so and target the other one\\ndeliberately - but record that you did, and why. The rule is a default, not a prohibition.\\n\\nChoose deliberately and say why:\\n\\n- Auditing the SOURCE'S claim (#2) tests whether the paper overreached.\\n- Auditing the DEFENSIBLE claim (#3) tests whether even the narrow version holds.\\n- Auditing the DOWNSTREAM claim (#4) tests the citation, PR, or model layer. The finding will\\n  be about that layer, NOT about the paper.\\n\\nIf the audit targets #4, state explicitly:\\n\\n  \\\"This audit evaluates the downstream restatement. Findings about it are not findings about\\n  the source document.\\\"\\n\\nThat one line prevents the most common and most damaging category error in the whole sequence.\\n\\n-----------------------------------------------------------------\\nREQUIRED OUTPUT TABLE\\n\\n| Field | Content | Verification state |\\n|---|---|---|\\n| 1. Literally measured | | |\\n| 2. Source's strongest claim | | |\\n| 3. Weaker defensible claim | | |\\n| 4. Downstream claim | | |\\n| 5A. Within-source inflation point + failure location | | |\\n| 5B. Downstream inflation point + failure location | | |\\n| 6. Claim under audit | | |\\n\\nREQUIRED CONSTRUCT-SIDE HANDOFF SUB-SCHEMA\\n\\nComplete every applicable row. These are fields, not prose notes.\\n\\n| Check | Object | Retrieval status / basis | Result | Verification state | Evidence |\\n|---|---|---|---|---|---|\\n| Construct establishment | PREVALENCE | ESTABLISHED-REPORTED / ESTABLISHED-CITED / ASSERTED / UNKNOWN | mapped content | | |\\n| Construct establishment | FORM | ESTABLISHED-REPORTED / ESTABLISHED-CITED / ASSERTED / UNKNOWN | mapped content | | |\\n| Construct establishment | DOMAIN | ESTABLISHED-REPORTED / ESTABLISHED-CITED / ASSERTED / UNKNOWN | mapped content | | |\\n| Construct establishment | WRONGNESS | ESTABLISHED-REPORTED / ESTABLISHED-CITED / ASSERTED / UNKNOWN | mapped content | | |\\n| Construct establishment | HARM | ESTABLISHED-REPORTED / ESTABLISHED-CITED / ASSERTED / UNKNOWN | mapped content | | |\\n| Definition-operationalization | instrument / scale / coding rule | ITEMS-RETRIEVED / ITEMS-INFERRED | coextensive / narrower / broader / UNKNOWN | | |\\n| Grade-before-assert | specific sub-claim | source retrieval basis | ESTABLISHED-FALSE / GRADE-CONTESTED / FRINGE / ESTABLISHED-ACCURATE | | |\\n\\nFor the grade-before-assert row, also state the P2 strength-gate result in the\\nEvidence cell: STRONG / WEAK / VOID.\\n\\nThe claim map does NOT perform the ESTABLISHED-CITED contested/uncontested split.\\nThat is the construct prosecutor's job.\\n\\nThen state, in one line each:\\n\\n- CLAIM UNDER AUDIT: [one sentence]\\n- WITHIN-SOURCE FAILURE LOCATION: [paper / none apparent]  -  [verification state]\\n- DOWNSTREAM FAILURE LOCATION: [citation / PR-media / model / mixed / suspected / none\\n  established / not assessed]  -  [provenance + verification state]\\n- GAP TYPE: [source overclaims / downstream inflates / both / neither apparent]\\n- MAP CONFIDENCE: [high / moderate / low] + what would raise it\\n\\n-----------------------------------------------------------------\\nRULES\\n-----------------------------------------------------------------\\n\\n1. EXTRACT, DO NOT EVALUATE.\\n\\nNo severity ratings, no verdicts, no critique. The prosecutors do that. A map that arrives\\npre-judged makes every downstream stage a confirmation exercise.\\n\\n2. \\\"NEITHER APPARENT\\\" IS A VALID OUTPUT.\\n\\nIf the source's claim matches its measurement and the downstream restatement is faithful, say\\nso plainly.\\n\\nA claim map that always finds inflation is not a map; it is a template. This output should\\nsometimes read:\\n\\n  \\\"No meaningful gap identified between measurement, claim, and downstream use.\\\"\\n\\n3. PRESERVE THE SOURCE'S HEDGES EXACTLY IN FIELD 2.\\n\\nStripping them here manufactures an overclaim that the source did not make, and every\\nprosecutor will then audit a strawman.\\n\\n4. SEARCH FOR DOWNSTREAM USES; DO NOT INVENT THEM.\\n\\nField 4 is active - look for downstream restatements rather than waiting to be handed them.\\nLabel every item SUPPLIED / RETRIEVED / RECALLED / NONE FOUND.\\n\\nRECALLED material gets its own labeled line, never a parenthetical, and may not anchor Field\\n5.\\n\\nIf nothing is retrievable, apply the field-specific provisional rule in Field 4:\\n\\n- Field 4 is provisional.\\n- Field 5 is provisional only in its downstream component.\\n- Field 6 is provisional only if it targets a downstream restatement.\\n\\nState whether the limitation reflects no downstream use or no retrieval capability.\\n\\n5. IF THE MAP IS AMBIGUOUS, SAY SO RATHER THAN RESOLVING IT.\\n\\nAn honest statement such as:\\n\\n  \\\"The source states X in the abstract and the more careful Y in the discussion, and which is\\n  'the claim' is genuinely unclear.\\\"\\n\\nis more useful than a forced single answer - and it tells the prosecutors that the map itself\\nneeds human resolution before the sequence proceeds.\\n\\n-----------------------------------------------------------------\\nHANDOFF\\n-----------------------------------------------------------------\\n\\nThis map goes to all three prosecutors unchanged. Each one:\\n\\n- audits the claim named in Field 6;\\n- references the map's claim in the \\\"Target claim\\\" column of its finding table (primitives\\n  Section 2);\\n- flags rather than silently substitutes if it finds itself auditing a claim not on this map.\\n  That means the map is incomplete, which is information.\\n\\nThe counter-audit later asks whether the prosecutors attacked the strongest version of this\\nclaim or the easiest downstream exaggeration. This map is what makes that question answerable.\\n\"},\"2-citation-network\":{\"bytes\":68231,\"lines\":1666,\"path\":\"prompts/research-analysis/2-citation-network.txt\",\"sha256\":\"dcb93491a0a2\",\"text\":\"CITATION NETWORK AUDIT PROMPT: DETECTING FUNCTIONAL CITATION CARTELS AND ADJACENT FIELD\\nNEGLECT\\n\\n-----------------------------------------------------------------\\nINSTRUMENT PREFLIGHT \\u2014 MANDATORY FOR FORMAL / LOGGED RUNS   [TOOL-004]\\n-----------------------------------------------------------------\\n\\nThis prompt is part of the audit instrument. Establish the exact instrument version BEFORE\\nsubstantive retrieval, extraction, analysis, or verdict work begins.\\n\\nA successful fetch indicator, correct repository path, branch label, plausible line count,\\nmatching rendered metadata, or internally self-consistent page does NOT by itself establish\\nthat the intended/current artifact was retrieved. A mutable remote reference can return a\\nhistorical representation that is internally self-consistent in every visible field.\\n\\nPROMPT IDENTITY MARKERS\\n\\n  - CITATION NETWORK AUDIT PROMPT: DETECTING FUNCTIONAL CITATION CARTELS AND ADJACENT FIELD\\n\\nThese markers confirm the prompt family / expected structural features. They do NOT by\\nthemselves establish version currency: an older version may share the same title or markers.\\n\\n1. RECORD THE INSTRUMENT ACTUALLY IN CONTEXT.\\n\\n   Record, where available:\\n\\n   - canonical prompt path or supplied filename;\\n   - retrieval form: PASTED / ATTACHED / IMMUTABLE REMOTE / MUTABLE REMOTE;\\n   - requested branch or ref;\\n   - intended immutable commit/ref, if the run claims a repository version;\\n   - resolved commit SHA;\\n   - resolved blob/content hash, or a locally computed cryptographic content hash;\\n   - exact line count and byte count;\\n   - prompt identity markers present / absent.\\n\\n   If a pasted or attached artifact is itself the declared instrument under test, its computed\\n   content hash may serve as its identity. Do not claim it is the current canonical repository\\n   version unless that relationship is independently established.\\n\\n2. MUTABLE-REFERENCE / CURRENCY RULE.\\n\\n   A path such as /blob/main/, /blob/master/, latest, or another moving branch/ref is a LOCATOR,\\n   not an immutable version identity.\\n\\n   Ordinary exploratory work may use a mutable locator with the limitation preserved.\\n\\n   A FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE run that claims the current repository\\n   instrument must establish an immutable intended identity independently of the mutable-content\\n   fetch. Acceptable examples include:\\n\\n   - an operator-supplied immutable commit permalink;\\n   - a branch-head / repository-history lookup independent of the content retrieval, followed by\\n     retrieval of the file at that immutable commit;\\n   - a second retrieval path that does not reuse the same cache/index, confirmed against an\\n     immutable commit/blob identity.\\n\\n   A commit/hash/line-count reported only by the SAME potentially stale rendered representation\\n   is NOT independent currency evidence.\\n\\n   If no independent immutable anchor can be established and no explicit collision is observed,\\n   classify:\\n\\n     INSTRUMENT VERSION UNVERIFIED\\n\\n   Such a run may be exploratory but may not count as formal regression or benchmark evidence\\n   for a claimed canonical version.\\n\\n3. VERSION-COLLISION ATTRIBUTION GATE.\\n\\n   If the retrieved representation disagrees with an expected hash, immutable ref, size, line\\n   count, marker set, or independently established version, classify only:\\n\\n     VERSION COLLISION \\u2014 UNRESOLVED\\n\\n   A failed identity check proves a VERSION MISMATCH. It does NOT establish where the stale\\n   representation lives. Do NOT conclude from the conflicting retrieval alone:\\n\\n     REPOSITORY STALE\\n     RETRIEVAL STALE\\n     LOCAL COPY STALE\\n     OPERATOR COPY STALE\\n\\n   Attribution requires a SECOND, INDEPENDENT discriminator, such as:\\n\\n   - an immutable commit/blob lookup;\\n   - repository/file history;\\n   - a second retrieval path that does not reuse the same cache/index;\\n   - direct operator confirmation supported by an immutable identity;\\n   - a locally supplied file whose hash can be compared independently.\\n\\n   Internal self-consistency is NOT an independent discriminator. A stale representation may\\n   have a mutually consistent path, branch label, line count, byte size, line gutter, content,\\n   and rendered repository metadata because all were produced from the same stale snapshot.\\n\\n4. DISPOSITION.\\n\\n   FORMAL / LOGGED / BENCHMARK / REGRESSION / FIXTURE RUN:\\n     - IDENTITY CONFIRMED against the intended immutable instrument -> continue.\\n     - VERSION COLLISION \\u2014 UNRESOLVED -> STOP before substantive execution.\\n     - INSTRUMENT VERSION UNVERIFIED -> exploratory execution may occur, but the run may not be\\n       logged as evidence for the claimed canonical instrument.\\n\\n   ORDINARY EXPLORATORY RUN:\\n     - May continue with INSTRUMENT VERSION UNVERIFIED when no collision is observed.\\n     - If a collision is observed, do not make claims about repository/instrument state until\\n       the collision is independently resolved.\\n\\n5. REQUIRED RUN-HEADER LINE.\\n\\n   Emit this before the substantive body:\\n\\n   INSTRUMENT PREFLIGHT: [path/file] @ commit [SHA/UNAVAILABLE] | blob/hash\\n   [HASH/UNAVAILABLE] | [N] lines | [N] bytes | markers [PRESENT/ABSENT] |\\n   [IDENTITY CONFIRMED / INSTRUMENT VERSION UNVERIFIED /\\n   VERSION COLLISION \\u2014 UNRESOLVED]\\n\\n   If VERSION COLLISION \\u2014 UNRESOLVED is returned, also state the conflicting identities and the\\n   independent discriminator required to resolve them. Do not silently choose one.\\n\\nGOVERNING RULE:\\n\\n  A failed identity check proves a version mismatch, not where the mismatch lives.\\n\\n=================================================================\\n\\n-----\\n\\nPURPOSE\\n\\nUse this prompt to audit whether a field, subfield, or contested claim is supported by a\\nhealthy evidence base or by a functionally closed citation network.\\n\\nThe goal is not to prove that individual researchers acted in bad faith. The goal is to test\\nwhether the literature's apparent consensus is produced by converging evidence, or by repeated\\ncitation of the same premise, same proxies, same review hubs, same author clusters, and same\\nneglected adjacent literatures.\\n\\nThis prompt is designed for fields where a domain expert suspects that:\\n- a small founding cluster dominates the literature;\\n- weak proxy studies are being cited as if they directly measured the target construct;\\n- review papers are laundering a premise into \\\"settled science\\\";\\n- adjacent fields with direct expertise are ignored;\\n- recent papers continue recycling old claims rather than testing the decisive question.\\n\\n-----\\n\\nIMPORTANT DEFINITION\\n\\nIn this prompt, \\\"citation cartel\\\" does not require proof of secret coordination, illegal\\ncollusion, or private bad faith.\\n\\nIt means a functional citation structure: a small group of papers, authors, journals,\\ntheoretical frameworks, or institutional networks repeatedly cite one another, recycle the\\nsame load-bearing premise, neglect adjacent literatures, and convert repetition into apparent\\nconsensus.\\n\\nUse \\\"cartel\\\" as a structural diagnosis, not a motive claim.\\n\\nPreferred formal terms:\\n- functionally closed citation network\\n- self-referential citation cluster\\n- citation laundering pathway\\n- premise-laundering hub\\n- adjacent-field neglect\\n- unsupported consensus construction\\n\\nUse \\\"citation cartel\\\" only when the evidence supports closure, premise recycling, and\\nsystematic exclusion of relevant outside evidence.\\n\\n-----\\n\\nHOW TO USE THIS PROMPT\\n\\nProvide:\\n1. A one-paragraph description of the field or subfield.\\n2. The central contested claim.\\n3. Any founding papers or review papers you already know.\\n4. Any adjacent fields you suspect were ignored.\\n5. Any databases or citation sources available to you.\\n\\nDo not rely on any model to invent exact citation metrics. If exact citation data are\\nunavailable, require the model to label numbers as rough estimates or source leads.\\n\\n-----\\n\\nINPUT TEMPLATE\\n\\nField / subfield: [PASTE FIELD HERE]\\n\\nCentral contested claim (fallback context if no upstream Claim Map is supplied): [WHAT CLAIM\\nIS THE LITERATURE TREATING AS ESTABLISHED?]\\n\\nFounding papers or likely hubs: [PASTE ANY KNOWN PAPERS, AUTHORS, OR REVIEWS]\\n\\nAdjacent fields that may be relevant: [PASTE ADJACENT FIELDS]\\n\\nKnown contrary evidence or domain-expert concerns: [PASTE CONCERNS]\\n\\nAvailable citation tools: [Google Scholar / Semantic Scholar / OpenAlex / Scopus / Web of\\nScience / CrossRef / manual search / none]\\n\\nTime window: [Example: 2010-2026, or last 5 years for recent behavior]\\n\\n-----\\n\\nSHARED CLAIM MAP  -  REQUIRED FOR FULL-SEQUENCE MODE\\n\\nA Claim Extraction / Inflation Map should have been produced upstream. Paste it here:\\n\\n[PASTE CLAIM MAP]\\n\\nDEGRADED STANDALONE MODE  -  USE ONLY WHEN NO UPSTREAM MAP EXISTS\\n\\nThis prosecutor must still be runnable when no upstream map is supplied. If the map is\\nmissing, do not stop, but state this warning before the audit:\\n\\n\\\"CLAIM MAP MISSING: running in degraded standalone mode. The target claim below is\\nSELF-GENERATED and PROVISIONAL. Cross-prosecutor claim alignment cannot be assumed until an\\nupstream Claim Extraction / Inflation Map is produced.\\\"\\n\\nThen create only this minimum fallback:\\n\\nCLAIM MAP: SELF-GENERATED  -  PROVISIONAL\\n- Field 1  -  What was literally measured:\\n- Field 3  -  Weaker defensible claim:\\n- Field 6  -  Claim under audit:\\n\\nDo not invent the missing upstream fields. Do not present this fallback as equivalent to the\\nupstream map. Its purpose is to permit a one-off network audit, not to replace Stage 1. Before\\nthis audit is combined with the other prosecutors, the claim must be reconciled against an\\nupstream map.\\n\\nYOU AUDIT THE CLAIM NAMED IN FIELD 6 OF THE MAP. Do not substitute the field's broadest claim,\\nthe public version, or a claim you find more interesting. The network can establish how\\nevidentiary authority and claim formulations propagate; it does not automatically establish\\nwhether the underlying real-world proposition is true.\\n\\nIf you find yourself auditing a claim that is not on the map, flag it rather than substituting\\nsilently:\\n\\n\\\"MAP GAP: this finding concerns [claim], which does not appear on the claim map. The map may\\nbe incomplete.\\\"\\n\\nThat flag is information, not an error. Silent substitution is what makes different\\nprosecutors produce incoherent critiques.\\n\\nBefore Section A, confirm in one line each:\\n\\n- Claim under audit (map field 6):\\n- What was literally measured in the foundational source(s) (map field 1):\\n- Weaker defensible claim (map field 3):\\n- Target layer: source claim / downstream citation / PR-media / model-retrieval\\n\\nIf the map is self-generated, repeat that it is PROVISIONAL and that cross-stage alignment\\nremains unresolved.\\n\\n-----\\n\\nCOMPACT VOCABULARY Full rules: shared_primitives.txt\\n\\nVERIFICATION STATE  -  how thoroughly a source has been checked. This is separate from\\nevidence type.\\n\\n- LOCATED: source exists and metadata is confirmed; content is unverified.\\n- ABSTRACT-CONFIRMED: abstract supports relevance; methods and results are not verified.\\n- FULL-TEXT-CONFIRMED: full text was read and directly supports the specific claim.\\n- RECEPTION-CONFIRMED: replies, replications, corrections, retractions, citation graphs, or\\n  citation contexts were checked against retrieved sources.\\n- CONTESTED: credible disagreement exists; who is correct remains unresolved.\\n- REBUTTED: later work directly and substantially challenges the source and the challenge was\\n  not evidently answered.\\n- PROVISIONAL: access or retrieval is insufficient, including unverified model memory,\\n  unresolved leads, or model-estimated network metrics.\\n\\n- CROSS-SOURCE-CONFIRMED: an ATTRIBUTION relationship was checked by reading BOTH the\\n  downstream text and the audited source  -  plus a successor or alternative source where one\\n  is implicated  -  and comparing what is claimed against what each actually supports. This is\\n  a distinct verification act: not reception checking (how a source fared) and not full-text\\n  checking (what one source says), but whether a downstream text has assigned a claim to a\\n  source that supports it. Use for every MISATTRIBUTED or ATTRIBUTED ELSEWHERE classification\\n  you actually verified.\\n\\nDO NOT INVENT VERIFICATION STATES. The list above is the whole vocabulary. Live runs have\\nproduced \\\"ESTABLISHED FROM SOURCE,\\\" \\\"RECONSTRUCTION FROM SOURCE,\\\" and similar ad-hoc labels.\\nEach reads as authoritative, none is defined anywhere, and a downstream stage cannot tell what\\nwas actually checked. If no state fits what you did, describe it in a sentence rather than\\ncoining a label  -  an undefined state is worse than plain prose.\\n\\nDERIVATION MODE  -  how a reported value was produced. This is separate from verification\\nstate, evidence type, and dimension disposition.\\n\\n- COMPUTED-FROM-RETRIEVED: the value was computed from retrieved inputs by a rule stated in\\n  the output. Report all five receipts together: computation rule; numerator; denominator;\\n  retrieval coverage of the required inputs; and the canonical verification state of those\\n  inputs. If any receipt is missing, the value is PROVISIONAL.\\n\\nCOMPUTED-FROM-RETRIEVED is not a verification state and does not upgrade its inputs. A metric\\nmay therefore be reported as, for example, \\\"Verification state: RECEPTION-CONFIRMED;\\nDerivation mode: COMPUTED-FROM-RETRIEVED.\\\" Never coin GRAPH-VERIFIED, CONTEXT-VERIFIED,\\nSOURCE-VERIFIED, RECEPTION-VERIFIED, or another compound substitute.\\n\\nFor a field that is an author reconstruction rather than a retrieval, write \\\"author\\nreconstruction from [source field].\\\" That is a description, not a verification state.\\n\\nATTRIBUTION CLASSIFICATIONS FOR STANDALONE USE:\\n\\n- MISATTRIBUTED: the downstream text cites the audited source for a claim that source cannot\\n  support.\\n- ATTRIBUTED ELSEWHERE: the actual supporting source is cited correctly, and the audited\\n  source is not assigned the unsupported claim.\\n\\nRules:\\n\\n1. Never report a verification state above what was actually checked.\\n2. Evidence type and verification state are separate axes; report both.\\n3. FULL-TEXT-CONFIRMED and RECEPTION-CONFIRMED may both apply.\\n4. Apply the ladder symmetrically to sources supporting and opposing the claim.\\n5. A PROVISIONAL source or network metric may not anchor a MAJOR or FATAL finding.\\n\\nFAILURE LOCATION  -  where the failure actually lives:\\n\\n- PAPER: the foundational source itself overclaims or rests on inadequate evidence.\\n- CITATION: later literature inflates, launders, or recycles the claim.\\n- PR / MEDIA: communications or coverage strip caveats or broaden the claim.\\n- MODEL / RETRIEVAL: summarizers or search systems reproduce the inflated version.\\n- MIXED: more than one layer contributes; specify which layer contributes what.\\n\\nAttacking a defensible paper for downstream inflation is a category error. Classify the\\nresponsible layer honestly.\\n\\n-----\\n\\nDATA-HONESTY RULES\\n\\nFor every quantitative estimate, state the source used:\\n- Google Scholar\\n- Semantic Scholar\\n- OpenAlex\\n- Web of Science\\n- Scopus\\n- CrossRef\\n- manual search\\n- paper bibliography\\n- model estimate\\n- unknown\\n\\nIf exact data are unavailable, label the number as:\\n- rough estimate\\n- incomplete\\n- needs verification\\n- source lead only\\n\\nDo not present model-estimated citation counts as measured facts. Do not invent citation\\ncounts. Do not invent edge lists. Do not infer that a citation is supportive unless you have\\ninspected the citing passage.\\n\\nRECEPTION-MODULE CONFIRMATION RULE\\n\\nAny load-bearing claim in this audit  -  hub dominance, internal-citation density, claim\\nmutation, amplification or ratchet behavior, or critique non-uptake  -  must be checked\\nagainst retrieved citation data before it is stated as fact. Do not assert it from model\\nmemory.\\n\\nUse the citation-reception module (OpenAlex + Semantic Scholar), together with direct source\\nretrieval where available. For each load-bearing source or network claim:\\n\\n- Hub dominance and internal density (Sections A and F): confirm citation counts, citing-set\\n  overlap, and network edges from retrieved data rather than estimates.\\n- Claim mutation and amplification (Sections D and G): inspect citation-context snippets and,\\n  where load-bearing, the full citing texts. Check whether limiting language appears in early\\n  contexts and disappears downstream.\\n- Critique non-uptake (Section H): confirm the critique's citation count, whether\\n  dominant-cluster papers actually cite it, and whether formal replies or rebuttals exist.\\n\\nApply the compact verification vocabulary:\\n\\n- Retrieved citation graph or citation contexts: RECEPTION-CONFIRMED.\\n- Metadata resolved but citing content unread: LOCATED.\\n- Model estimate or remembered network pattern: PROVISIONAL.\\n\\nA claim is not RECEPTION-CONFIRMED merely because it sounds familiar. It must trace to an\\nactual retrieval query. Label quantitative and reception claims in the output as either:\\n\\n- RECEPTION-CONFIRMED (retrieved via OpenAlex/S2); or\\n- PROVISIONAL  -  not confirmed / model estimate.\\n\\nCitation-context snippets can establish that a formulation appears in the citing record, but a\\nload-bearing claim-mutation finding should be FULL-TEXT-CONFIRMED where the context is\\nambiguous or the surrounding argument matters.\\n\\nNO-ASSUME-SUPPRESSION\\n\\nLow citation uptake of a critique has at least two explanations: the field marginalized valid\\nwork, or the field discounted work that did not survive scrutiny. Do not resolve toward\\nsuppression unless the critique's own reception has been checked. Low uptake of a REBUTTED\\ncritique is expected, not evidence of functional closure.\\n\\n-----\\n\\nOUTPUT EXECUTION CONTRACT  -  REQUIRED\\n\\nCompliance is verifiable with `prompts/research-analysis/check-citation-network-output.py` in\\nthe repository. The checker requires unique standalone headings, checks critical order,\\ncross-checks the Completion Ledger's presence and completion claims against the actual output,\\ndetects silent omissions and incorrect gate behavior, and applies a crude placeholder screen.\\nA placeholder-screen pass does not establish substantive adequacy.\\n\\nREVISION-CANDIDATE CHECKER BOUNDARY\\n\\nThe patched checker reports STRUCTURAL_RESULT and CONTENT_RESULT separately and ends in one of\\nthree states: FAIL; PASS-WITH-REVIEW: N items; or PASS. It enforces heading, order, ledger,\\ncompletion-gate, non-thinness, canonical-verification vocabulary, derivation separation, risk-\\nband form, scored-density receipts, source-lock form, source-classification form, and\\naggregation arithmetic. It emits targeted review extracts for lock truth, directly-\\nadjudicating classifications, and nesting decisions. It still cannot establish that those\\nsubstantive judgments are correct. Do not treat PASS-WITH-REVIEW as substantive validation.\\n\\nVALIDATION BOUNDARY\\n\\nThis execution contract has been tested on fixed, supplied citation packets at three burden\\nlevels: 4 sources, 12 sources / 25 selected edges, and 26 sources / 70 selected edges. It is\\nvalidated only for heading presence, ledger accuracy, gate behavior, and section survival\\nunder supplied-packet execution up to that tested scale.\\n\\nIt has NOT been validated for open-ended retrieval. It does not establish that a model can\\ndiscover a complete network, select the right sources from a large candidate space, avoid\\nfalse absence, or report search scope adequately. Retrieval is a separate test axis.\\n\\nLOCAL REPAIR  -  DO NOT PROPAGATE BY DEFAULT\\n\\nThis contract is a FAIL-class repair for an observed omission failure in this citation-network\\nprompt. Do not copy it into other prompts merely for symmetry. Propagate only after an\\nanalogous section-omission failure is observed and the added execution burden is locally\\ntested.\\n\\nThis prompt has failed in live use by silently omitting required sections even when the\\ninstructions were present. Presence must therefore be inspectable, not assumed.\\n\\nEXACT-HEADING RULE\\n\\nUse every applicable section heading below EXACTLY as written in the output. Do not rename,\\nmerge, paraphrase, or bury a required section inside another section.\\n\\nRequired analytical headings:\\n\\n- PRE-AUDIT CLAIM CONFIRMATION\\n- SECTION A: CITATION NETWORK STRUCTURE AND CARTEL DETECTION\\n- SECTION B: EVIDENCE TYPE CODING\\n- SECTION C: CITATION POLARITY AND CLAIM USE\\n- SECTION D: CLAIM MUTATION TRACKING\\n- SECTION E: ADJACENT FIELD ENGAGEMENT / NEGLECT\\n- SECTION F: HUB DEPENDENCY AND REVIEW-PAPER LAUNDERING\\n- SECTION G: PATTERN RECOGNITION AND RATCHET BEHAVIOR\\n- SECTION H: IGNORED CRITIQUE AND NON-UPTAKE\\n- SECTION I: AUTHOR, INSTITUTION, JOURNAL, AND FUNDING CLUSTERING\\n- SECTION J: FALSE-POSITIVE AND BASELINE CHECK\\n- SECTION J2: THE CONCEDE TEST\\n- SECTION K: CARTEL-RISK SCORING\\n\\nRequired final-artifact headings:\\n\\n- ARTIFACT 1: TOP 15 CITATION SPINE TABLE\\n- ARTIFACT 2: FOUNDING CLUSTER TABLE\\n- ARTIFACT 3: RECENT 5-YEAR CITATION BEHAVIOR TABLE\\n- ARTIFACT 4: CITATION POLARITY TABLE\\n- ARTIFACT 5: CLAIM MUTATION TABLE\\n- ARTIFACT 6: ADJACENT-LITERATURE NEGLECT TABLE\\n- ARTIFACT 7: CRITIQUE-UPTAKE TABLE\\n- ARTIFACT 8: CARTEL-RISK SCORECARD\\n- ARTIFACT 9: NETWORK MAP\\n- ARTIFACT 10: FINAL VERDICT\\n- COMPLETION LEDGER\\n- FINAL SECTION: STANDARDIZED FINDING TABLE\\n\\nN/A RULE\\n\\nA required section may be marked N/A only under its exact heading and only with a specific\\nreason. Lack of convenient evidence is not by itself N/A; use the verification ladder and\\nreport the section as PROVISIONAL or insufficiently supported.\\n\\nNO SILENT MERGING\\n\\nA table or discussion may cross-reference another section, but it does not count as completing\\nthat section unless the exact heading appears and the section answers its own required\\nquestions.\\n\\nPRE-AUDIT CLAIM CONFIRMATION\\n\\nBefore Section A, output the four claim-confirmation lines required above under the exact\\nheading PRE-AUDIT CLAIM CONFIRMATION.\\n\\nSECTION A: CITATION NETWORK STRUCTURE AND CARTEL DETECTION\\n\\nGRAPH CORPUS AND RECEIPTS\\n\\nBefore reporting topology or density, define the corpus inline: database(s), exact query,\\nquery date, date and document-type bounds, screening rule, deduplication rule, inclusion and\\nexclusion rules, and the complete selected node list with stable identifiers. If screening is\\njudgmental, preserve the candidate list and each inclusion decision; a verbal funnel alone is\\nnot reproducible.\\n\\nFor every SCORED internal-density result, provide these exact labels:\\n\\n- DERIVATION MODE: COMPUTED-FROM-RETRIEVED;\\n- DENSITY CALCULATION: [computation rule];\\n- DENSITY NUMERATOR: [integer and what it counts];\\n- DENSITY DENOMINATOR: [integer and what it counts];\\n- DENSITY INPUT COVERAGE: [obtained inputs / required inputs];\\n- GRAPH CORPUS NODE LIST: every selected node with a stable identifier; and\\n- INTERNAL EDGE LIST: every directed internal edge as citing work -> cited work.\\n\\nDo not print thousands of non-internal outbound edges when an exact query and complete input-\\ncoverage receipt are available. The internal numerator is load-bearing and must be enumerable.\\n\\nDENSITY INFERENCE SCOPE\\n\\nA density score applies only to the defined corpus. A corpus selected because its members cite\\nthe target can establish density inside that target-citing corpus; it cannot establish or\\nexclude field-wide, founding-cluster, or premise-subnetwork closure. A broader closure claim\\nrequires a seed-expanded graph or matched comparison corpus. Without one, state verbatim:\\n\\n    Closure is not established and not excluded beyond the defined corpus.\\n\\n1. What are the top 50 most-cited papers on the central claim? List at least the top 10-15\\n   with:\\n- citation count\\n- year\\n- authors\\n- paper type\\n- source of citation count\\n- role in the literature\\n\\n2. Of the top 50, what percentage of citations appear internal to this set? That is: how many\\n   papers in the top 50 cite other papers in the top 50?\\n\\n3. Calculate the mutual citation rate: How many papers in the top 50 cite at least 3-5 other\\n   papers from the same top-50 cluster?\\n\\n4. Identify the founding cluster: Is there a small founding cluster, typically 3-8 papers,\\n   that dominates later citations?\\n\\n5. What percentage of total citations in the network still flow back to this founding cluster?\\n\\n6. In the last 5 years, what are the most-cited new papers on the claim?\\n\\n7. Do recent papers primarily cite:\\n- the old founding cluster;\\n- the main review/hub papers;\\n- new independent empirical evidence;\\n- adjacent-field evidence;\\n- policy/guideline documents;\\n- commentary or theory papers?\\n\\n8. Do the last 5 years show continued self-reinforcement of the original cluster, or genuine\\n   model updating?\\n\\n9. Is there one main review paper or synthesis paper functioning as an amplification hub?\\n\\n10. If yes, what does the hub do?\\n- accurately preserve the limits of original studies;\\n- simplify the original claims;\\n- overstate the original claims;\\n- convert weak evidence into a settled premise;\\n- export the claim into policy, public discourse, or other fields.\\n\\n-----\\n\\nSECTION B: EVIDENCE TYPE CODING\\n\\nFor the top 50 papers, code each paper by evidence type:\\n\\n- primary empirical test of the central claim\\n- proxy study\\n- weak proxy study\\n- secondary analysis\\n- review article\\n- systematic review / meta-analysis\\n- theoretical / conceptual paper\\n- qualitative study\\n- survey study\\n- policy / guideline document\\n- commentary / editorial\\n- public-facing synthesis\\n- unclear / needs source audit\\n\\n11. What percentage of the network's authority rests on direct empirical tests of the central\\n    claim?\\n\\n12. What percentage rests on reviews, proxies, theory papers, qualitative studies, or\\n    commentary?\\n\\n13. How many papers directly measure the target construct at the relevant level of analysis?\\n\\n14. How many papers use proxy measures?\\n\\n15. How many papers are cited as if they answer the central claim despite measuring something\\n    narrower?\\n\\n16. Is the network evidence-rich or citation-rich?\\n\\n-----\\n\\nSECTION C: CITATION POLARITY AND CLAIM USE\\n\\nA citation is not automatically supportive. For each major citation, classify citation\\npolarity:\\n\\n- supportive citation\\n- neutral/background citation\\n- critical citation\\n- perfunctory citation\\n- inflated citation\\n- used as premise\\n- unclear without full text\\n\\n17. For the top 15 papers, classify how they cite the founding cluster.\\n\\n18. What percentage of citations to the founding cluster are supportive or premise-building\\n    rather than critical?\\n\\n19. What percentage are merely background citations?\\n\\n20. Are there any serious critical citations inside the dominant network?\\n\\n21. If critiques exist, are they engaged substantively or cited and dismissed?\\n\\n22. Does the network preserve the original limitations of key studies, or drop the limitations\\n    and retain only the conclusion?\\n\\n-----\\n\\nSECTION D: CLAIM MUTATION TRACKING\\n\\nCitation laundering often occurs because claims mutate as they move downstream.\\n\\nTrack the main claim across the citation chain:\\n\\nOriginal study claim -> first review restatement -> downstream paper claim -> public/policy\\nclaim\\n\\n23. What did the original source actually claim?\\n\\n24. What did the first major review or hub paper say the original source showed?\\n\\n25. How do later papers restate the review?\\n\\n26. Does a narrow finding become generalized?\\n\\n27. Does \\\"evidence consistent with X\\\" become \\\"X is established\\\"?\\n\\n28. Does \\\"no effect in one proxy task\\\" become \\\"no meaningful difference in the real-world\\n    construct\\\"?\\n\\n29. Do caveats disappear after one or two citation steps?\\n\\n30. Does the claim become stronger through repetition than it was in the original methods?\\n\\nCreate a claim-mutation table:\\n\\nOriginal source | Original measured claim | Hub-paper restatement | Downstream restatement |\\nMutation severity | Notes\\n\\nMutation severity:\\n- none\\n- minor simplification\\n- moderate inflation\\n- major inflation\\n- premise laundering\\n\\n-----\\n\\nSECTION E: ADJACENT FIELD ENGAGEMENT / NEGLECT\\n\\nRun Steps 31\\u201337 BEFORE examining the audited paper's references or citation network for\\nadjacent-field engagement. Step 38 is the first citation-inspection step.\\n\\n31. LOCK THE CLAIM LAYERS.\\n\\nState separately:\\n\\n- exact source claim;\\n- weaker defensible source claim;\\n- downstream citation claim; and\\n- public, policy, clinical, professional, or elite-performance extrapolation, if any.\\n\\nDo not use literature relevant to one layer to award engagement credit on another. Keep\\nsource-level and downstream layers separate through generation, engagement classification,\\nscoring, and the final verdict.\\n\\n32. STATE THE STRONGEST PLAUSIBLE RIVAL EXPLANATION.\\n\\nFor each claim layer, state the strongest live rival explanatory account that could explain\\nthe same observed result while materially narrowing or defeating the audited inference. Do\\nnot substitute the claim's bare logical negation. A mechanical negation can admit politically\\nopposite but evidentially irrelevant literatures by construction.\\n\\n33. STATE THE ADJUDICATING OBSERVATIONS.\\n\\nFor the audited claim and the rival explanation, answer:\\n\\n    What observation, measured with a method the relevant field would have to take seriously,\\n    would weaken, materially narrow, or defeat this explanation?\\n\\nThe purpose is not to create one supporting list and one opposing list. It is to identify\\nevidence capable of discriminating between live explanations.\\n\\n34. GENERATE CANDIDATE FIELDS FROM BOTH EXPLANATIONS.\\n\\nName literatures capable of producing those adjudicating observations. Generate them from the\\nclaim, construct, and rival structure\\u2014not from the bibliography and not from the auditor's\\npreferred account.\\n\\n35. APPLY THE SAME CORE QUALIFICATION TEST.\\n\\nApply the same requirements to candidates generated from either direction:\\n\\n- Measurement relevance: the literature measures the target construct, the rival mechanism,\\n  or a decisive boundary condition.\\n- Adjudicative capacity: it can produce evidence that distinguishes the live explanations or\\n  materially narrows one of them.\\n- Independence: its method, error structure, or evidence source is independent enough not\\n  simply to reproduce the audited field's load-bearing assumptions.\\n- Historical availability: relevant work existed, was mature enough to bear on the claim, was\\n  plausibly discoverable, and used translatable constructs or measures during the relevant\\n  publication window.\\n\\nPolitical opposition, topical adjacency, or a generally compatible narrative does not\\nqualify a field. For example, harassment or attrition research may be relevant to\\nparticipation, retention, or practice-access claims. It does not automatically qualify as\\nadjudicating evidence for a mechanical or elite-performance ceiling claim unless its design\\ncan distinguish that explanation through exposure matching, mediation, decomposition, or\\nanother measurement capable of changing confidence in the mechanism.\\n\\nIf a candidate fails historical availability, do not award a healthy zero and do not penalize\\nthe audited paper. Mark the candidate UNINFORMATIVE for that historical comparison.\\n\\n36. MERGE, DEDUPLICATE, AND LOCK THE LIST.\\n\\nMerge candidates from both directions, remove duplicates, and record why each surviving field\\nqualifies. Freeze the list before searching citations. Do not replace an absent field with a\\nmore congenial field discovered later. Post hoc additions are allowed only when labeled POST\\nHOC and may not erase the result for the locked list.\\n\\nThe lock must operate at the level that can anchor the score. State exactly one:\\n\\n- SOURCE-LOCK METHOD: LOCKED QUERY. Preferred. Before bibliography inspection, preregister a\\n  reproducible selection query whose output fixes the source list: database, exact query or\\n  concept identifier, date cutoff, ranking rule, N, deduplication rule, timestamp, and saved-\\n  result hash. Run it and lock its output.\\n- SOURCE-LOCK METHOD: LOCKED SOURCES. Before bibliography inspection, name the specific works\\n  and stable identifiers, with timestamp or hash.\\n- SOURCE-LOCK METHOD: POST HOC. Use when neither ex-ante route is feasible. Sources selected\\n  after bibliography inspection must be labeled POST HOC and may not independently anchor\\n  SCORED 2 or SCORED 3 on adjacent-field neglect; they may support SCORED 1.\\n\\nLocking a field while choosing its exemplar sources after citation inspection is POST HOC,\\nnot a locked canonical-source list.\\n\\nImmediately after SOURCE-LOCK METHOD, complete this seven-field lock record using the exact\\nlabels below. If a field does not apply to the chosen method, write N/A plus the reason; do not\\nleave it blank.\\n\\n    SOURCE-LOCK DATABASE: [database or N/A \\u2014 reason]\\n    SOURCE-LOCK QUERY OR SOURCE LIST: [exact query/concept ID or named sources with stable IDs]\\n    SOURCE-LOCK DATE CUTOFF: [date]\\n    SOURCE-LOCK RANKING RULE: [rule or N/A \\u2014 reason]\\n    SOURCE-LOCK N: [integer or N/A \\u2014 reason]\\n    SOURCE-LOCK DEDUPLICATION RULE: [rule or N/A \\u2014 reason]\\n    SOURCE-LOCK TIMESTAMP OR HASH: [timestamp and/or saved-result hash]\\n\\n37. RUN THE LIST-GENERATION FLIP TEST.\\n\\nAsk:\\n\\n    Would a competent auditor who favored the strongest rival explanation produce materially\\n    the same qualified list under the same relevance and adjudicative-capacity rules?\\n\\nIf no, reconcile the asymmetry before inspecting citations. Symmetry in list generation\\nwithout symmetry in qualification is a failure.\\n\\n38. ONLY NOW INSPECT THE CITATION RECORD.\\n\\nBefore assigning omission severity, classify every nominated source by what the retrieved\\nsource itself does:\\n\\n- CONSTRUCT-DEFINING: establishes or measures a relevant construct or component.\\n- MECHANISM-SUPPORTING: bears on a relevant mechanism but does not discriminate between the\\n  audited explanation and its strongest rival.\\n- DIRECTLY-ADJUDICATING: a result in this source requires a specified revision of the audited\\n  explanation or its strongest rival.\\n\\nFor DIRECTLY-ADJUDICATING, state the source's actual result, the explanation it favors, the\\nexplanation it weakens, and the precise claim revision required. If those four items cannot be\\nstated from the retrieved source, it is not DIRECTLY-ADJUDICATING. Construct-defining and\\nmechanism-supporting sources may be reported and may contribute to SCORED 1, but only directly\\nadjudicating sources may independently anchor SCORED 2 or SCORED 3 on adjacent-field neglect.\\nMissing measurement or methods papers normally routes to lack of decisive tests, not ignored\\nadverse evidence.\\n\\nFor each historically available locked field, classify:\\n\\n- direct substantive engagement;\\n- citation without substantive engagement;\\n- engagement only through a review or secondary hub;\\n- selective engagement with supportive findings while omitting challenging work;\\n- no located engagement after adequate search; or\\n- UNASSESSED because retrieval was insufficient.\\n\\nMere presence of a neighboring discipline in the bibliography is not enough. The cited\\nmaterial must bear on the exact claim layer and adjudicating observation.\\n\\n39. TEST INNOCENT EXPLANATIONS.\\n\\nBefore scoring neglect, test scope mismatch, publication timing, terminology differences,\\ndatabase coverage, reasonable disciplinary boundaries, redundancy, and whether another\\nincluded source already supplies the same decisive evidence. This gate tests explanations for\\nnon-engagement. It does not substitute for the upstream list-generation flip test.\\n\\nCreate a falsification-relevant literature preregistration table BEFORE the adjacent-literature\\nneglect table:\\n\\nClaim layer | Audited explanation | Strongest plausible rival explanation | Adjudicating\\nobservation | Candidate field | Generated from audited claim, rival, or both? | Measurement\\nrelevance | Adjudicative capacity | Independence | Publication-date cutoff | Historically\\navailable? | Flip-test result | Source-lock method | Lock timestamp / hash | Final engagement\\nclassification\\n\\nThen create an adjacent-literature neglect table:\\n\\nClaim layer | Adjacent field | Nominated source and stable identifier | Verification state |\\nSource class: CONSTRUCT-DEFINING / MECHANISM-SUPPORTING / DIRECTLY-ADJUDICATING | Actual\\nresult | Explanation favored | Explanation weakened | Precise revision required | Pre-inspection\\nlock status or POST HOC | Cited by dominant cluster? | Engagement quality | Effect of omission\\n\\nEngagement quality:\\n- not cited\\n- cited in passing\\n- selectively cited\\n- substantively engaged\\n- directly tested against\\n- dismissed without engagement\\n- UNASSESSED because retrieval was insufficient\\n\\nEffect of omission:\\n- minor context loss\\n- moderate weakness\\n- major evidentiary gap\\n- fatal omission for the strong claim\\n\\nRC-ONLY ADJACENCY REFINEMENTS FOR THE IAT VALIDATION RUN\\n\\nDuring the IAT validation run, separately record whether theoretical independence, a formal\\nrecognition test, a distinct field-maturity test, or individual scoring of six qualification\\ncriteria changes an inclusion decision or prevents an error. These are validation candidates,\\nnot standing canonical requirements. Promote only the parts that do observable work.\\n\\n-----\\n\\nSECTION F: HUB DEPENDENCY AND REVIEW-PAPER LAUNDERING\\n\\n40. Identify the main hub paper or review article.\\n\\n41. What percentage of recent papers cite the hub?\\n\\n42. What percentage cite the original primary studies directly?\\n\\n43. What percentage cite the hub instead of inspecting the underlying evidence?\\n\\n44. Does the hub accurately represent the original studies' methods and limits?\\n\\n45. Does the hub simplify or overstate the original evidence?\\n\\n46. Does the hub cite adjacent literatures?\\n\\n47. Does the hub become the field's substitute for direct empirical evidence?\\n\\nCalculate a hub-dependency summary:\\n\\nHub paper | Recent papers citing hub | Recent papers citing primary evidence directly |\\nAdjacent-field citation rate | Hub accuracy | Hub risk\\n\\nHub risk:\\n- low\\n- moderate\\n- high\\n- laundering hub\\n\\n-----\\n\\nSECTION G: PATTERN RECOGNITION AND RATCHET BEHAVIOR\\n\\n48. Does the literature treat proxy measures as equivalent to the actual construct?\\n\\n49. Does it export findings from low-stakes, lab, amateur, convenience, or administrative\\n    settings to explain elite, real-world, professional, or long-term outcomes?\\n\\n50. Has the field ignored natural experiments or long-running interventions that test its\\n    predictions?\\n\\n51. When predictions fail, does the field update the model?\\n\\n52. Or does the field expand the intervention and reinterpret failure as evidence that more\\n    intervention is needed?\\n\\n53. Does the field specify falsification criteria?\\n\\n54. Does the field identify what evidence would change its conclusion?\\n\\n55. Does the intervention improve the measured metric while leaving the underlying construct\\n    unmeasured or unimproved?\\n\\n56. Does the citation network reward papers that expand the premise more than papers that test\\n    it?\\n\\nRATCHET SCORING ROUTE\\n\\nDo not score these questions as one compound dimension.\\n\\n- Intervention-evidence ratchet: assess whether the literature continues strengthening an\\n  intervention claim despite failed, null, or contradictory intervention evidence. Mark N/A\\n  when no intervention claim exists.\\n- Model non-updating: assess whether the literature preserves the same causal or explanatory\\n  model after verified disconfirming evidence, failed predictions, boundary-condition\\n  failures, or decisive contradictory tests. Mark UNASSESSED when the prediction, contrary\\n  result, and later model behavior were not traced.\\n\\nMODEL-IDENTITY AND TEMPORAL GATE\\n\\nScore model non-updating separately only when all four links are traced:\\n\\n1. the audited literature states an explicit prediction or model;\\n2. later external evidence contradicts or materially bounds that same model;\\n3. later authors had a verified reception opportunity; and\\n4. later literature continues the same model without the required update.\\n\\nName the model, disconfirming result, opportunity window, and later same-model papers. A\\nsource's own caveats, interactions, or scope conditions route to claim mutation or limitation\\nloss unless later external evidence and same-model persistence are also shown. Evidence from a\\ndifferent causal branch cannot establish or reduce the model-non-updating score.\\n\\n-----\\n\\nSECTION H: IGNORED CRITIQUE AND NON-UPTAKE\\n\\nPoor critique uptake cannot be scored merely because the search found no formal critique.\\nFormal critiques and replications are selected toward prominent, policy-relevant claims and\\nfields with active replication cultures. Run this sequence before assigning the dimension\\nstate or score:\\n\\n1. PRECONDITION ASSESSMENT.\\n   Assess whether substantive critique or replication would reasonably be expected. Consider\\n   claim prominence, citation reach, policy or clinical use, review/guideline centrality,\\n   public salience, field replication norms, and time available for response.\\n\\n2. CRITIQUE RETRIEVAL.\\n   Search for formal critiques, contrary syntheses, direct replications, corrections, and\\n   well-specified failed predictions.\\n\\n3. RECEPTION OPPORTUNITY.\\n   Verify that later hub or dominant-cluster papers had a realistic opportunity to encounter\\n   the critique after publication.\\n\\n4. UPTAKE TEST.\\n   Inspect whether those later papers cite, address, answer, narrow, or ignore the critique.\\n\\nApply these disposition rules:\\n\\n- No critique found and critique production not reasonably expected: UNINFORMATIVE.\\n- No critique found despite strong reasons to expect production: do not call this poor uptake.\\n  Record a separate critique-production anomaly and assess alternative explanations.\\n- Critique located but reception not traced: UNASSESSED.\\n- Critique located, opportunity verified, and substantive uptake tested: SCORED 0\\u20133 according\\n  to the evidence.\\n\\nPresence of a major critique with verified non-uptake is high-information. Absence of critique\\nin a niche literature is not its symmetric opposite.\\n\\n57. Identify serious critiques, failed replications, natural experiments, practitioner\\n    objections, or contrary reviews.\\n\\n58. Are these critiques cited by the dominant cluster?\\n\\n59. If cited, are they:\\n- engaged;\\n- dismissed;\\n- minimized;\\n- reframed as ideological;\\n- ignored after citation;\\n- treated as settled against despite unresolved issues?\\n\\n60. Did the citation network update after the critique appeared?\\n\\n61. Did recent papers incorporate the critique into methods or continue citing the old premise\\n    unchanged?\\n\\n62. Are practitioner or domain-expert warnings visible in forums, trade publications,\\n    professional debates, or community spaces?\\n\\n63. If yes, did those warnings affect the academic citation network?\\n\\nCreate a critique-uptake table:\\n\\nExpected-production precondition | Critique / contrary evidence | Year | Source type | Main\\nobjection | Verification state | Reception opportunity | Cited by dominant cluster? | Uptake\\nstatus | Dimension disposition | Effect\\n\\nUptake status:\\n- ignored\\n- cited but not engaged\\n- dismissed\\n- partially incorporated\\n- materially changed the field\\n- unknown\\n\\n-----\\n\\nSECTION I: AUTHOR, INSTITUTION, JOURNAL, AND FUNDING CLUSTERING\\n\\n64. Are the same authors or coauthors recurring across the founding cluster?\\n\\n65. Are the same journals, conferences, departments, labs, or institutions recurring?\\n\\n66. Are the same funding sources, NGOs, advocacy organizations, government agencies, or policy\\n    bodies recurring?\\n\\n67. Does the intellectual network overlap with a social, institutional, funding, or policy\\n    network?\\n\\n68. Are dissenting papers published in the same venues, or pushed to peripheral venues?\\n\\n69. Does gatekeeping appear explicit, or is the closure functional?\\n\\n70. Are there signs of ideological or policy alignment that shape what gets cited?\\n\\nClassify closure type:\\n- normal small-field clustering\\n- author-network clustering\\n- journal/conference clustering\\n- funding/policy clustering\\n- theoretical-framework clustering\\n- advocacy-network clustering\\n- functional citation closure\\n- explicit gatekeeping\\n- insufficient evidence\\n\\n-----\\n\\nSECTION J: FALSE-POSITIVE AND BASELINE CHECK\\n\\nDense citation is not always a cartel. Some fields are small. Some topics naturally have a few\\ncanonical papers.\\n\\n71. Is this field small enough that dense internal citation would be expected?\\n\\n72. Compare the target network with a healthier adjacent subfield of similar size. Is the\\n    internal citation rate unusually high?\\n\\n73. Does the target field show less engagement with adjacent expertise than comparable fields?\\n\\n74. Are researchers citing each other because they are the only people studying the question,\\n    or because they are excluding relevant outside evidence?\\n\\n75. Does the founding cluster rest on strong primary empirical evidence?\\n\\n76. Are the central claims directly tested repeatedly by independent groups?\\n\\n77. Are limitations preserved downstream?\\n\\n78. Are failed predictions acknowledged?\\n\\n79. Are critics cited and engaged?\\n\\n80. Does the field have a clear mechanism for updating?\\n\\nIf the answer to these is mostly yes, do not call it a cartel. Call it a small but active\\nliterature.\\n\\n-----\\n\\nSECTION J2: THE CONCEDE TEST\\n\\nRun this on every proposed network finding before scoring Section K or choosing the final\\nformal label.\\n\\nFINDING-TARGET AND DOUBLE-COUNT GATE  [FAIL-MB-003]\\n\\nBefore applying the Concede Test:\\n\\n1. Read the Target claim declared in every proposed standardized finding row. Do not assume\\n   all rows target map field 6 merely because the audit was supposed to.\\n\\n2. If a row targets a different claim, mark:\\n\\n   \\\"MAP GAP: this finding targets [claim], not map field 6.\\\"\\n\\n   Test the finding against its declared claim, but do not let it anchor the field-6 verdict\\n   until it has been re-aimed and the severity survives.\\n\\n3. Do not count two labels on one underlying mismatch as two independent levers. In\\n   particular, a definitional-scope-creep row and a general claim-vs-measurement row resting\\n   on the same items are NESTED manifestations of one mechanism.\\n\\n4. Preserve nested rows when they improve traceability, but count the mechanism once in\\n   Section K, once in the load-bearing list, and once when judging compounding. Shared\\n   evidence is not independent evidence.\\n\\nApply this same ownership rule to Section K dimensions. Every SCORED dimension must receive\\none AGGREGATION STATUS:\\n\\n- INDEPENDENT; or\\n- NESTED under [parent dimension].\\n\\nWhen dimensions reuse evidence, the second must either identify the distinct evidence and\\ninferential work that supports independent scoring, or be NESTED under the parent that owns\\nthe shared evidence. A nested dimension keeps its disposition and ordinal score for\\ntraceability and counts as assessed for coverage, but is excluded from the aggregate risk\\nnumerator and denominator. Distinct constructs may both remain in the inventory; shared\\nevidence is what bars additive scoring.\\n\\nRequired pre-Concede table:\\n\\n| Finding | Declared target claim | Matches map field 6? | Same mechanism as another row? | Count separately? |\\n|---|---|---|---|---|\\n\\nFor each finding, ask:\\n\\nIF THIS FINDING WERE FULLY CONCEDED  -  granted entirely, with no argument  -  WOULD THE CLAIM\\nNAMED IN MAP FIELD 6 STILL STAND?\\n\\n- SURVIVES: the audited claim still stands. The observation may be a real network limitation,\\n  but it cannot anchor a high-risk verdict.\\n- NARROWS: the claim survives only in smaller epistemic scope  -  for example, the underlying\\n  proposition may remain possible, but the literature has not established it through the\\n  degree of independence or convergence claimed.\\n- DEFEATS: the map-field-6 claim does not follow. This is load-bearing.\\n\\nCreate a table:\\n\\n| Finding | Concede test: SURVIVES / NARROWS / DEFEATS | Surviving claim if NARROWS |\\n|---|---|---|\\n\\nNETWORK-SPECIFIC SCOPE RULE\\n\\nApply the test to the exact wording of field 6:\\n\\n- If field 6 is an epistemic claim such as \\\"independent converging evidence has established\\n  X,\\\" verified dependence, laundering, or absent direct tests can NARROW or DEFEAT that claim.\\n- If field 6 is the bare real-world proposition \\\"X is true,\\\" a citation network usually cannot\\n  defeat the proposition by itself. It can show that the cited literature does not establish\\n  X. Do not silently convert an evidentiary failure into a truth verdict.\\n\\nSCOPE-LOSS ASSESSMENT  -  REQUIRED FOR EVERY NARROWS RESULT\\n\\n- INCIDENTAL NARROWING: the evidentiary claim remains substantially intact after a small\\n  precision or boundary correction.\\n- MATERIAL NARROWING: the asserted consensus, independence, breadth, or certainty is\\n  meaningfully reduced, while a weaker evidentiary claim survives.\\n- NEAR-DEFEAT NARROWING: only a trivial or practically different remainder survives.\\n  Reclassify as DEFEATS when it no longer supports the use under audit.\\n\\nFor each NARROWS result, add:\\n\\n| Finding | Scope-loss level | Original claim | Surviving claim | What epistemic or practical work is lost? |\\n|---|---|---|---|---|\\n\\nSCORING AND LABEL MAPPING\\n\\n- A SURVIVES finding may not justify a dimension score of 3 or anchor the final formal label.\\n- A verified MATERIAL NARROWING finding may justify a serious-concern score where the\\n  dimension warrants it.\\n- A score of 3 or a DEFEATS finding requires adequately verified evidence.\\n- A PROVISIONAL metric or model-estimated network pattern may not independently anchor\\n  \\\"functional citation cartel,\\\" \\\"functionally closed citation network,\\\" or another MAJOR/FATAL\\n  finding.\\n- Do not sum duplicated manifestations of the same source dependence as if they were\\n  independent failures.\\n- A definitional-scope-creep row and a general claim-vs-measurement row resting on the same\\n  item mismatch count as one mechanism, not two levers.\\n\\nDo not use this test to suppress genuine network weaknesses. Report SURVIVES findings, but\\ncalibrate their severity and role in the verdict.\\n\\n-----\\n\\nSECTION K: CARTEL-RISK SCORING\\n\\nEvery dimension must receive exactly one disposition:\\n\\nSCORED 0\\n    Adequately retrieved affirmative evidence of no material concern. This is a real finding,\\n    not the absence of a finding.\\n\\nSCORED 1\\n    Mild verified concern.\\n\\nSCORED 2\\n    Serious verified concern.\\n\\nSCORED 3\\n    Severe verified concern.\\n\\nUNASSESSED\\n    The dimension applies, but retrieval, graph coverage, source access, or verification is\\n    insufficient. Exclude it from the score denominator and mark the audit incomplete.\\n\\nUNINFORMATIVE\\n    The necessary evidentiary precondition is absent, so the observed state has little or no\\n    diagnostic value. Exclude it from the score denominator and state the missing\\n    precondition.\\n\\nN/A\\n    The dimension does not apply to the claim or literature under audit. Exclude it from the\\n    score denominator.\\n\\nHard rule: lack of retrieved evidence of concern is not enough for SCORED 0. State the\\naffirmative evidence that justifies every zero.\\n\\nFOUR-AXIS RULE\\n\\nKeep four axes separate:\\n\\n1. Evidence / claim state: what does the evidence establish? Use the shared verification and\\n   claim-state vocabulary.\\n2. Dimension disposition: can the dimension enter the score? Use SCORED / UNASSESSED /\\n   UNINFORMATIVE / N/A.\\n3. Ordinal concern: if and only if SCORED, how concerning is it? Use 0 / 1 / 2 / 3.\\n4. Aggregation status: does the SCORED dimension independently enter the aggregate? Use\\n   INDEPENDENT / NESTED under [parent dimension].\\n\\nNever convert UNKNOWN or another incomplete evidence state into SCORED 0. Never convert\\nUNINFORMATIVE into no concern. A dimension may be fully executed yet remain uninformative.\\n\\nDimensions:\\n\\n1. Founding-cluster dominance\\n2. Internal citation density\\n3. Recent-paper dependence on old cluster\\n4. Review-hub laundering\\n5. Proxy-to-construct mismatch\\n6. Claim mutation downstream\\n7. Adjacent-field neglect\\n8. Lack of decisive tests\\n9. Poor critique uptake\\n10. Intervention-evidence ratchet\\n11. Model non-updating\\n\\nREPORT SCORE, COVERAGE, AND COMPLETION SEPARATELY\\n\\nOnly INDEPENDENT SCORED dimensions enter the verified risk numerator and denominator. NESTED\\nSCORED dimensions remain assessed and visible but are non-additive.\\n\\nReport:\\n\\n- Verified risk score: X/Y\\n- Verified scored-dimension risk rate: 100 \\u00d7 X/Y\\n- Independent scored dimensions: I\\n- Nested scored dime
