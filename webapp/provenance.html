stantive\\ncounterfactual remains untested.\\n\\nE. ALLOW ONE PRIOR TO PRODUCE MULTIPLE LEADS\\n\\nA single operator sentence may contain several propositions. Assign each its own\\nPrior ID and Lead ID.\\n\\nExample:\\n\\n  \\\"Most will mention it as part of the culture war, but not accurately describe\\n  why.\\\"\\n\\nmust become at least:\\n\\n- P1: Most eligible pieces mention culture-war context.\\n- P2: In pieces mentioning that context, it is materially relevant rather than\\n  incidental.\\n- P3: In pieces firing the context, the stated explanation omits or misstates\\n  the mechanism identified by the operator.\\n\\nEach receives its own denominator, retrieval question, and resolution.\\n\\nF. PRESERVE CONDITIONAL STRUCTURE\\n\\nFor a prior of the form \\\"where X occurs, Y follows,\\\" test Y only within pieces\\nwhere X occurs.\\n\\nDo not test the consequent against the entire corpus.\\n\\nG. MATCH EVIDENCE TO THE EXACT PREDICATE\\n\\nA mention of Cambridge's immediate defence does not satisfy a prior about years\\nof institutional enablement and elevation.\\n\\nA piece satisfies a broader proposition only if it materially addresses the\\nrelevant chain, such as:\\n\\n- promotion or appointment history;\\n- awards, honorary degrees, platforms, or institutional celebration;\\n- earlier warnings or contradictory evidence;\\n- institutional defence or shielding;\\n- failure to investigate;\\n- later reversal after scrutiny.\\n\\nDo not substitute adjacent evidence for the exact audit object.\\n\\nH. TRANSLATE LOADED LANGUAGE WITHOUT WEAKENING THE PREDICTION\\n\\nPreserve the original wording and create an auditable evidentiary translation.\\n\\nExample:\\n\\n  \\\"history of lies\\\"\\n\\nmay become:\\n\\n  \\\"documented disputed, corrected, contradicted, denied, or unsupported claims.\\\"\\n\\nThe audit may refuse the moral label while still testing the underlying\\ncoverage-distribution prediction.\\n\\nI. RESOLVE EACH PRIOR BEFORE AGGREGATING\\n\\nUse:\\n\\n- CONFIRMED\\n- PARTIALLY CONFIRMED\\n- REFRAMED\\n- NOT CONFIRMED\\n- INSUFFICIENT EVIDENCE\\n\\nPARTIALLY CONFIRMED applies only when the same proposition is supported in part.\\n\\nDo not use \\\"partial\\\" merely because some propositions in a multi-part prior were\\nconfirmed and others were not.\\n\\nRequired proposition-level result:\\n\\n| Prior ID | Exact proposition | Result | Corpus count / evidence | Qualification |\\n|---|---|---|---|---|\\n\\nOnly after every proposition is resolved may the audit issue one aggregate:\\n\\n- STRONG MAPPED MATCH\\n- SUBSTANTIAL MAPPED MATCH\\n- MIXED MAPPED RESULT\\n- WEAK MAPPED MATCH\\n- NO MAPPED MATCH\\n- INSUFFICIENT TO ASSESS\\n\\nThe aggregate must summarize the proposition-level results. It may not replace\\nthem.\\n\\nJ. COUNTEREXAMPLES NARROW; THEY DO NOT AUTOMATICALLY FALSIFY\\n\\nFor every non-universal distributional prediction, report:\\n\\n- number matching;\\n- number not matching;\\n- eligible denominator;\\n- whether the stated threshold was met.\\n\\nDo not describe a prediction as overbroad merely because it allowed exceptions\\nand exceptions occurred.\\n\\nPRIOR-MATCH OUTPUT\\n\\nFor every operator prior, output:\\n\\nORIGINAL PRIOR:\\n[verbatim or minimally normalized text]\\n\\nDECOMPOSED PROPOSITIONS:\\n[list of Prior IDs]\\n\\nPROPOSITION-LEVEL RESULTS:\\n[table]\\n\\nAGGREGATE MAPPED RESULT:\\n[result]\\n\\nWHAT MATCHED:\\n[exact propositions]\\n\\nWHAT DID NOT MATCH:\\n[exact propositions]\\n\\nWHAT REMAINS UNTESTED:\\n[factual, causal, motive, normative, or comparator claims the corpus cannot\\nresolve]\\n\\nMAPPING INTEGRITY CHECK\\n\\n- Were any distinct propositions merged?\\n- Were any quantifiers strengthened?\\n- Was \\\"mention\\\" confused with \\\"foreground\\\" or \\\"governing frame\\\"?\\n- Was a coverage prediction confused with an underlying-truth claim?\\n- Was a conditional prior tested against the wrong denominator?\\n- Was a counterexample incorrectly treated as falsifying a non-universal\\n  prediction?\\n- Was adjacent evidence substituted for the exact object of the prior?\\n\\nIf any answer is YES, revise the mapping before issuing the verdict.\\n\\nEXECUTION GATE\\n\\nThe Investigation Register may not begin until:\\n\\n- every supplied prior has a Prior ID;\\n- compound priors have been split;\\n- each quantifier and threshold has been stated;\\n- each eligible denominator rule has been stated;\\n- conditional priors preserve their condition;\\n- corpus-level claims have been separated from single-event claims.\\n\\nIf this mapping is not completed, Section E2 must state:\\n\\n  PRIOR MAPPING FAILURE \\u2014 PRIOR-MATCH VERDICT INVALID\\n\\n=================================================================\\n\\n=================================================================\\nINVESTIGATION AND RESOLUTION MECHANICS\\n=================================================================\\n\\n-----------------------------------------------------------------\\nINVESTIGATION REGISTER AND LEAD ORIGIN\\n-----------------------------------------------------------------\\n\\nThe audit may begin with no hypothesis, an operator-supplied hypothesis, or a\\nlead generated by an earlier stage. Retrieval may also produce a bounded\\nemergent lead.\\n\\nTag every lead using exactly one origin:\\n\\n  OPERATOR\\n  PRIOR-STAGE GENERATED\\n  EXTRACTOR GENERATED\\n  RETRIEVAL EMERGENT\\n\\nFor every lead, record:\\n\\n| Lead ID | Origin | Initial formulation | Trigger | Retrieval question | Resolution |\\n|---|---|---|---|---|---|\\n\\nGOVERNING RULE:\\n\\n  Operator hypotheses influence retrieval, not conclusions.\\n  Retrieval influences conclusions.\\n\\nA lead is not a finding. It may guide retrieval. It may not lower the\\nevidentiary threshold.\\n\\nIf no lead exists, continue in neutral coverage mode. Do not manufacture one.\\n\\n-----------------------------------------------------------------\\nBALANCED HYPOTHESIS RETRIEVAL\\n-----------------------------------------------------------------\\n\\nFor every lead, perform a support-side and weakening-side check before\\nresolution.\\n\\nFULL BALANCED RETRIEVAL is mandatory when the lead is:\\n- OPERATOR-supplied or derived from a mapped operator prior;\\n- PRIOR-STAGE GENERATED;\\n- load-bearing or contested;\\n- capable of materially changing retrieval scope, finding ownership, severity,\\n  or the verdict.\\n\\nFor those leads:\\n\\n1. Translate the lead into one or more falsifiable retrieval questions.\\n2. Document the search performed for evidence that would SUPPORT it.\\n3. Document the search performed for evidence that would WEAKEN, REFRAME, or\\n   FALSIFY it.\\n4. Apply comparable effort to both search directions.\\n5. Do not resolve the lead until both search paths are documented.\\n6. Searching only for confirming evidence is a procedural failure.\\n\\n| Lead ID | Supporting search | Weakening / disconfirming search | Evidence recovered | Missing evidence |\\n|---|---|---|---|---|\\n\\nFor a non-load-bearing RETRIEVAL EMERGENT lead, a compact paired check is enough:\\nrecord the best supporting item and the best weakening item or state why one\\nside could not be tested. Do not run a full search dossier unless the lead\\nbecomes load-bearing.\\n\\nAbsence of contradicting evidence is not confirmation.\\n\\n-----------------------------------------------------------------\\nBOUNDED EMERGENT LEADS\\n-----------------------------------------------------------------\\n\\nA RETRIEVAL EMERGENT lead may be introduced only when required to explain an\\ninconsistency, omission, attribution chain, framing divergence, or dependency\\nalready identified within the current audit object.\\n\\nIt may not broaden the audit object.\\n\\nAn emergent lead is invalid when it:\\n- follows an interesting but non-load-bearing tangent;\\n- opens a new controversy not required to resolve the current object;\\n- expands retrieval merely because adjacent material was discovered;\\n- substitutes a broader target for the supplied target.\\n\\n| Trigger inside current object | Why necessary | Scope boundary | Supporting search | Weakening search |\\n|---|---|---|---|---|\\n\\nIf the lead cannot state its scope boundary in one sentence, do not admit it.\\n\\n-----------------------------------------------------------------\\nSHARED INNOCENT-EXPLANATION TEST\\n-----------------------------------------------------------------\\n\\nBefore reporting any asymmetry, selection, divergence, or failure, test whether\\nit can instead be explained by a non-directional constraint.\\n\\nCandidate explanations include:\\n- breaking-news uncertainty;\\n- publication timing;\\n- legal or privacy restrictions;\\n- attribution limits;\\n- headline economy;\\n- article length or format;\\n- incomplete investigation;\\n- wire dependence;\\n- story assignment;\\n- missing primary material;\\n- genuine scoop;\\n- disputed facts;\\n- house style or professional convention.\\n\\n| Candidate explanation | Evidence supporting it | Evidence weakening it | Residual difference |\\n|---|---|---|---|\\n\\nAn innocent explanation is not automatic acquittal. Report only the residual\\ndifference that survives the test.\\n\\n-----------------------------------------------------------------\\nREFRAMED RESOLUTION STATE\\n-----------------------------------------------------------------\\n\\nUse REFRAMED when the originating concern was directionally meaningful but the\\nretrieved evidence identifies a materially different mechanism, location,\\nscope, role, causal step, or formulation.\\n\\nWhen using REFRAMED, state:\\n1. ORIGINAL FORMULATION\\n2. EVIDENCE-SUPPORTED REFORMULATION\\n3. WHAT MOVED\\n4. WHY THE OTHER RESOLUTION STATES ARE LESS ACCURATE\\n\\nGeneral investigation-lead resolution vocabulary:\\n  CONFIRMED\\n  PARTIALLY CONFIRMED\\n  REFRAMED\\n  NOT CONFIRMED\\n  INSUFFICIENT EVIDENCE\\n\\nSection D2 retains its own formal cross-branch vocabulary:\\nCONFIRMED / FALSIFIED / RECLASSIFIED / NETWORK-WIDE /\\nSTILL UNRESOLVED / NO EVIDENCE.\\n\\nA D2 RECLASSIFIED result may note that the underlying concern was REFRAMED, but\\nthe formal D2 value remains RECLASSIFIED.\\n\\n=================================================================\\n\\n-----------------------------------------------------------------\\nCOMPACT MEDIA PRIMITIVE\\n-----------------------------------------------------------------\\n\\n[MEDIA-P1] CAUSAL-ROLE AXES + GATES\\n\\nCANONICAL RULE. This compact copy and every local execution copy must move\\ntogether. Local sections may add examples, but may not rename, narrow, broaden,\\nor change the disposition of these axes and gates.\\n\\nSix axes. For each, extract the assignment the TEXT makes. Leave the axis blank\\nwhen the text supplies no usable assignment and the absence itself is not the\\nobject of analysis. When non-assignment is materially part of the construction,\\nrecord the applicable null state rather than silently leaving it blank.\\n\\nDo not infer an assignment from the headline alone. An assignment explicitly\\nstated in a headline may be recorded as a headline assignment; do not infer an\\nunstated cause, blame, role, or motive from it.\\n\\nNever infer cause, blame, motive, role, or status from names, appearance,\\nemployer, or location.\\n\\nEVENT CLASSIFICATION\\n  The noun or frame assigned to the event itself. The noun is a claim. Where the\\n  absence of classification is materially relevant, record UNCLASSIFIED.\\n\\nCAUSE\\n  Why the event happened: stated, alleged, or inferred motive; the explanation\\n  supplied for the event; or whether the text assigns no cause. Where materially\\n  relevant, record NO CAUSE ASSIGNED.\\n\\nROLE-AND-STATUS\\n  Who is cast as agent, victim, perpetrator, beneficiary, cost-bearer,\\n  bystander, official, whistleblower, defendant, or complainant.\\n\\nBLAME / RESPONSIBILITY\\n  Who or what is assigned fault, including whether responsibility is\\n  individualized, institutionalized, diffused, or left unassigned.\\n\\nREMEDY\\n  Whether a fix or solution is offered, whose fix it is, and who is called to\\n  act. Where materially relevant, record NO REMEDY FRAMED.\\n\\nLEADERSHIP / POLICY\\n  How leadership decisions or policy are characterized, including competent,\\n  failing, humane, authoritarian, negligent, necessary, or ineffective\\n  characterizations, whether stated directly, appositionally, or through a\\n  source.\\n\\nEPISTEMIC LEVEL - CAUSE AND BLAME\\n\\nClassify every CAUSE and BLAME assignment:\\n\\n  DOCUMENTED\\n    Direct statement, verified communication, or established record.\\n\\n  OFFICIALLY-ALLEGED\\n    Law enforcement, complaint, indictment, or institutional finding.\\n\\n  SOURCE-INFERRED\\n    Witness, advocate, expert, or interested party's inference.\\n\\n  OUTLET-INFERRED\\n    The article's own synthesis.\\n\\n  UNKNOWN\\n    Evidence insufficient.\\n\\nTest for silent upward movement: an alleged cause restated as documented, or a\\nsource's inference appearing later in outlet voice. Apply the ladder separately\\nto CAUSE and BLAME.\\n\\nVERB-AS-TRACE\\n(for wording-derived candidates that survive the Semantic Equivalence and Earnedness Gate)   [FAIL-MB-018]\\n\\nIn the Coverage Network branch, apply VERB-AS-TRACE only to lexical/formulation\\ncandidates that survived the Semantic Equivalence and Earnedness Gate as\\nMATERIAL OUTLIERS. Do not apply it to candidates already resolved as REGISTER\\nVARIANCE or EARNED SPECIFICITY. This limitation does not prevent D-ROLE from\\nindependently discovering a substantive causal-role assignment difference.\\n\\nA verb or descriptor is reportable as causal-role framing only when it MOVES an\\nassignment on one of the six axes.\\n\\nExamples:\\n\\n- \\\"breach\\\" assigns migrant agency against a defended boundary;\\n- \\\"waved through\\\" reassigns cause to an authority;\\n- \\\"pour\\\" or \\\"surge\\\" can classify the event as flood-like mass movement.\\n\\nA lexical difference that moves no assignment is REGISTER variance. Record it\\nas register only; do not report it as framing.\\n\\nThis test is distinct from the causal-bridge test. VERB-AS-TRACE asks what\\ncausal-role assignment the language makes. The causal-bridge test asks whether\\nthe WHY of a sequence is present or removed.\\n\\nBRANCH-SPECIFIC LAYERS\\n\\nSingle-piece branch:\\n  Apply the mirror and flip guard to these axes. Cause, blame, and victim-role\\n  assignments are especially prior-sensitive. The branch must be able to\\n  decline to find a causal-role failure.\\n\\nCoverage branch:\\n  Add CHOSEN vs. INHERITED, TEXT-READ vs. HEADLINE-ONLY, and the genre\\n  not-firing condition. These determine whose framing is being observed and\\n  whether the sample can support a divergence finding.\\n\\n\\n=================================================================\\nMEDIA RETRIEVAL, CONTEXTUAL INFERENCE, AND QUOTATION PAIRS\\n=================================================================\\n\\n-----------------------------------------------------------------\\nCOMPANION RETRIEVAL\\n-----------------------------------------------------------------\\n\\nThe initial event-keyword packet may omit the material that supplies the\\ncoverage's inherited historical, causal, political, moral, organizational, or\\nclassificatory frame.\\n\\nWhen Fixed-packet mode is NO, retrieve companion material meeting at least one\\nof these triggers:\\n\\nMECHANICAL TRIGGERS\\n  A. LINKED OR CITED\\n     The audited piece directly links, cites, embeds, quotes, or names the item.\\n\\n  B. MATERIALLY RELIED UPON\\n     The audited piece depends on the item for a load-bearing factual,\\n     chronological, legal, causal, or attribution claim.\\n\\nJUDGMENT-REQUIRING TRIGGERS\\n  C. INHERITED FRAME\\n     The item supplies a historical analogy, precedent, moral comparison,\\n     political frame, organizational characterization, or event classification\\n     materially used by the audited coverage.\\n\\n  D. DEMONSTRABLY UPSTREAM\\n     Publication sequence, explicit attribution, repeated phrasing, or source\\n     tracing shows that the item is upstream of a later framing choice.\\n\\nMechanical triggers qualify automatically when the item can be obtained.\\n\\nJudgment-requiring triggers must satisfy all of the following:\\n\\n  1. Name the exact framing claim or classification the companion item is needed\\n     to evaluate.\\n  2. Identify the passage in the audited coverage that materially relies on it.\\n  3. State what the companion item could confirm, weaken, reframe, or falsify.\\n  4. Bound the retrieval to that dependency.\\n  5. Stop once the dependency can be resolved or further retrieval ceases to\\n     change its evidentiary status.\\n\\nDo not retrieve an item merely because it is topically adjacent, politically\\ninteresting, or likely to contain useful criticism.\\n\\nRequired table:\\n\\n| Companion item | Trigger (A-D) | Dependency in audited coverage | Retrieval result | Effect on finding |\\n|---|---|---|---|---|\\n\\nGOVERNING RULE:\\n\\n  Retrieve inherited framing before auditing inherited framing.\\n\\nPACKET-BOUNDARY OUTPUT\\n\\nState:\\n- Initial packet boundary\\n- Companion items added\\n- Why each qualified\\n- Material sought but unavailable\\n- Which findings would have differed under the initial packet alone\\n\\nWhen Fixed-packet mode is YES, do not widen retrieval. Instead state which\\npotential companion dependencies remain untested because the packet is closed.\\n\\n-----------------------------------------------------------------\\nCONTEXT-SUPPORTED IDENTITY INFERENCE\\n-----------------------------------------------------------------\\n\\nAn ideological, organizational, movement, or group characterization may be\\nsupported when multiple observable indicators in the retrieved material converge\\non that characterization.\\n\\nDo not import general background knowledge about who typically uses a tactic,\\nsymbol, slogan, organizational form, or style unless that background material\\nwas separately retrieved and shown to be relevant.\\n\\nINFERENCE LADDER\\n\\nClassify the inference at exactly one level:\\n\\n  1. VERIFIED ORGANIZATIONAL IDENTITY OR CONTROL\\n     Direct evidence establishes identifiable membership, authorization,\\n     leadership, command, governance, formal affiliation, organizational\\n     responsibility, or equivalent control.\\n\\n  2. CONTEXT-SUPPORTED IDEOLOGICAL ALIGNMENT\\n     Multiple retrieved indicators support alignment with a recognizable\\n     ideological or movement framework, but formal identity or command is not\\n     established.\\n\\n  3. CONTEXT-SUPPORTED TACTICAL OR MOVEMENT RESEMBLANCE\\n     Retrieved conduct, symbols, slogans, structure, or tactics materially\\n     resemble a recognizable movement pattern, but alignment and formal\\n     affiliation remain unverified.\\n\\n  4. WEAK CONTEXTUAL RESEMBLANCE\\n     One or more indicators suggest resemblance, but the evidence is limited,\\n     ambiguous, heterogeneous, or nonexclusive.\\n\\n  5. UNSUPPORTED ATTRIBUTION\\n     The retrieved record does not support the proposed characterization.\\n\\nFORMAL-CONTROL EVIDENCE FLOOR\\n\\nNo combination of slogans, symbols, rhetoric, tactics, political alignment,\\nmovement resemblance, or accumulated lower-rung indicators may establish rung 1\\nby itself.\\n\\nRung 1 requires direct evidence of membership, leadership, authorization,\\ncommand, governance, organizational responsibility, formal affiliation, or an\\nequivalent organizational connection.\\n\\nIf that evidence is absent, the classification may not exceed rung 2.\\n\\nMANDATORY INFERENCE-PARITY CHECK\\n\\nApply this check to every affirmative classification at rungs 1 through 4.\\nRung 5 is exempt because it makes no affirmative inference.\\n\\n1. ENUMERATE THE ORIGINAL INDICATORS\\n   List every retrieved indicator supporting the classification.\\n\\n2. STATE THE EXACT INFERENCE\\n   Specify the rung and whether the finding asserts control, alignment,\\n   resemblance, or weak resemblance.\\n\\n3. BUILD THE MIRROR CANDIDATE\\n   Identify the strongest materially comparable inference in the opposite\\n   ideological, political, organizational, or institutional direction that the\\n   same retrieved record might license.\\n\\n4. APPLY THE SAME LADDER\\n   Enumerate the mirror indicators and classify the mirror candidate using the\\n   same five-rung ladder. Do not merely state that the rule could apply.\\n\\n5. EXPLAIN ANY DIFFERENT RESOLUTION\\n   Identify the material evidentiary distinction. Political valence,\\n   familiarity, presumed legitimacy, or agreement with the cause are not\\n   evidentiary distinctions.\\n\\n6. REMOVE DIRECTIONAL FRAMING\\n   Reassess the original indicators without relying on the political,\\n   ideological, or institutional direction of the classification.\\n\\n7. CONSEQUENCE\\n   If parity fails, downgrade the original inference to the highest rung\\n   independently supported after directional framing is removed. Do not apply\\n   an automatic one-rung decrement.\\n\\n   A parity failure may produce:\\n   - one-level downgrade;\\n   - multi-level downgrade;\\n   - UNSUPPORTED ATTRIBUTION.\\n\\n   A finding that fails parity may not remain load-bearing unless its revised\\n   classification independently supports the finding.\\n\\nNO VALID MIRROR\\n\\nIf no materially comparable mirror candidate exists:\\n- explain why;\\n- identify the missing structural counterpart;\\n- do not invent an artificial mirror.\\n\\nRequired table:\\n\\n| Candidate | Retrieved indicators | Ladder classification | Evidentiary distinction |\\n|---|---|---|---|\\n| Original | | | |\\n| Mirror | | | |\\n\\nThen state:\\n\\n  INFERENCE PARITY: PASSES / FAILS / NO VALID MIRROR\\n\\nIf FAILS, also state:\\n\\n  REVISED CLASSIFICATION:\\n  LOAD-BEARING STATUS: RETAINS / NARROWS / REMOVED\\n\\nWEAK-RESEMBLANCE LIMIT\\n\\nA rung-4 finding:\\n- may be reported descriptively;\\n- may guide additional bounded retrieval;\\n- may serve as corroboration;\\n- may not independently anchor a major or load-bearing conclusion;\\n- may not be stacked with other rung-4 findings to imply a stronger\\n  classification without separately meeting rung-2 or rung-3 requirements.\\n\\n-----------------------------------------------------------------\\nQUOTATION-PAIR PRESERVATION\\n-----------------------------------------------------------------\\n\\nWhen adjacent or same-stage formulations differ materially in specificity,\\nagency, certainty, epistemic level, role, or event classification, preserve the\\npair.\\n\\nDo not collapse a consequential pair into a generic topical summary when the\\nrelation between the formulations is itself evidence.\\n\\nRecord:\\n\\n| Quotation A | Quotation B | Speaker / source | Evidentiary stage | Material contrast |\\n|---|---|---|---|---|\\n\\nThen analyze:\\n- agency assignment in each;\\n- categorical specificity in each;\\n- attribution status;\\n- whether the formulations serve different functions;\\n- whether timing explains the difference;\\n- residual difference after SHARED INNOCENT-EXPLANATION TEST.\\n\\nThis applies to:\\n- two statements by the same speaker;\\n- written release versus spoken briefing;\\n- headline versus body;\\n- original version versus update;\\n- source wording versus outlet paraphrase;\\n- adjacent classifications that materially change interpretation.\\n\\nDo not force quotation pairing where the formulations concern different facts.\\n\\n\\n=================================================================\\n\\n=================================================================\\nSECTION A  -  COVERAGE INVENTORY\\n=================================================================\\n\\n| Outlet | Headline | Pub date/time | Last updated | Correction note? | Headline changed? | Social/homepage headline if different | Byline | Wire attribution | Word count | Lead image subject |\\n|---|---|---|---|---|---|---|---|---|---|---|\\n\\nVERSION NOTE: media pieces change after publication. Where a headline was revised or a\\ncorrection appended, compare against an archive capture if available. A headline that was\\nchanged after publication  -  especially without a correction note  -  is itself a finding.\\nWhere you cannot check, write UNKNOWN rather than assuming the current version is the\\noriginal.\\n\\nThen note:\\n  1. Publication sequence  -  which came first? Which appeared later and could have drawn on\\n     the earlier ones?\\n  2. Which carry a wire credit (AP, Reuters, local wire) versus original reporting?\\n  3. Which are briefs versus full reports? Length constrains what construction is even\\n     possible  -  a 200-word brief cannot include balancing voices.\\n\\n=================================================================\\nSECTION B  -  SOURCE CHAIN  (highest-value section)\\n=================================================================\\n\\nTrace where each piece's information originates.\\n\\n| Outlet | Named sources | Primary docs cited | Original reporting? | Traces to |\\n|---|---|---|---|---|\\n\\n\\nBefore finalizing this section, apply COMPANION RETRIEVAL to any load-bearing inherited\\nanalogy, organizational characterization, event classification, or upstream\\nframe. Source-chain tracing is incomplete when the immediate factual source is\\nknown but the source of the inherited framing has not been retrieved.\\n\\nCOUNTING UNIT - STATE IT BEFORE GIVING ANY NUMBER.   [FAIL-MB-008][FAIL-MB-009]\\n\\n\\\"Independent source\\\" is ambiguous and the ambiguity is not resolvable by judgment. Count at\\nBOTH levels below and report BOTH as DESCRIPTION. Neither whole-coverage number carries a\\nclaim-amplification verdict. Proposition-level network classification is determined by the\\nper-fact table further down. Do not skip that table.\\n\\nLEVEL 1 - REPORTING ORGANIZATIONS (descriptive; comparatively stable) How many distinct\\norganizations produced original reporting - sent a journalist, conducted an interview,\\nobtained a document, or made a direct observation? An outlet that only republishes or\\nsynthesizes does not count.\\n\\nLEVEL 2 - UPSTREAM INFORMATION ORIGINS (descriptive; granularity-sensitive) How many\\ndistinct origins does the reported material trace back to? Report it, but DO NOT read the\\nLevel-1-vs-Level-2 relationship as a finding. Level 1 counts only original reporters (often\\nfew); Level 2 counts every upstream origin (often many), so Level 2 routinely EXCEEDS Level\\n1. That direction carries no meaning, and the whole-coverage count is not comparable\\nrun-to-run - the same coverage is defensibly counted at very different granularities.\\n\\nWHOLE-COVERAGE RATIO - DESCRIPTIVE ONLY. NOT AN AMPLIFICATION VERDICT. pieces / Level 2 is\\ngranularity-sensitive and misleads. A ratio near or below 1 is NOT evidence of independence:\\na story can trace every disputed number to one source while its total origin count looks\\nlarge. State the number if you wish; it may not support any corroboration or claim-\\namplification conclusion. The next table determines proposition-level network classification.\\n\\nSINGLE-ORIGIN PROPAGATION VS. CLAIM AMPLIFICATION \\u2014 LOAD-BEARING STEP, DO NOT SKIP\\n\\nA fact appearing in many pieces but tracing to one origin is SINGLE-ORIGIN\\nPROPAGATION. That is a source-chain description, not automatically an\\namplification finding.\\n\\nSource dependence describes where information came from.\\nAmplification describes what repetition does to the apparent evidentiary weight\\nof a contestable claim.\\n\\nBuild this table for every load-bearing or contested fact:\\n\\n| Fact or claim | Pieces asserting it | Origins located | Origin completeness | Single-origin confirmed? | Origin authority | Claim contestability | Attribution behavior | Apparent-corroboration risk | Network classification |\\n|---|---:|---:|---|---|---|---|---|---|---|\\n\\n\\nORIGIN COMPLETENESS \\u2014 DO NOT TURN POSITIVE TRACING INTO AN ABSENCE CLAIM\\n\\n\\\"Origins located\\\" is a positive count and may be reported whenever the origins\\nare actually retrieved or preserved.\\n\\n\\\"Single-origin confirmed\\\" is stronger: it asserts that no additional origin\\nappears in the eligible source range. Set it to YES only when retrieval is\\nsufficiently complete to support that negative determination.\\n\\nUse:\\n\\n- COMPLETE \\u2014 eligible source range is sufficiently retrieved for origin\\n  exclusivity.\\n- PARTIAL \\u2014 one or more relevant pieces or upstream dependencies are incomplete.\\n- UNKNOWN \\u2014 completeness cannot be assessed.\\n\\nWhen completeness is PARTIAL or UNKNOWN:\\n\\n- report the origins actually located;\\n- write SINGLE-ORIGIN CONFIRMED: NOT ESTABLISHED;\\n- do not convert the located-origin count into an exclusivity claim;\\n- classify the network behavior from the evidence actually available, using\\n  CHAIN UNRESOLVED where the missing origin structure is load-bearing.\\n\\nThis rule preserves positive source tracing under partial retrieval without\\nweakening the absence-claim evidence floor.\\n\\nORIGIN AUTHORITY IS PROPOSITION-SPECIFIC\\n\\nA source may be authoritative for the occurrence of its own act, statement,\\ndecision, filing, publication, or status while remaining non-authoritative for:\\n\\n- external facts;\\n- causal explanations;\\n- motive;\\n- responsibility;\\n- legality;\\n- justification;\\n- scale;\\n- or the truth of allegations about another actor.\\n\\nPERMITTED NETWORK CLASSIFICATIONS\\n\\nCOMMON-SOURCE PROPAGATION\\n\\nUse when the origin is directly authoritative about an act, statement,\\ndecision, proceeding, publication, filing, or status within its control.\\n\\nExamples:\\n\\n- a person announces their resignation;\\n- an institution announces that it opened an investigation;\\n- a court reports that it entered an order;\\n- an agency publishes its own policy.\\n\\nCommon-source propagation is non-independent reporting. It is not claim\\namplification merely because only one origin exists.\\n\\nSOURCE-DEPENDENT INTERPRETATION\\n\\nUse when the underlying act or status is established, but its cause, meaning,\\nmotive, responsibility, or significance comes from one interested or\\nnon-independent source.\\n\\nExample:\\n\\n- the resignation occurred, but the resigning party's explanation of why it\\n  occurred remains that party's account.\\n\\nDo not treat repetition of the interpretation as independent confirmation.\\n\\nCLAIM AMPLIFICATION\\n\\nUse only when ALL are true:\\n\\n1. The claim concerns a disputed, uncertain, inferential, causal, quantitative,\\n   reputational, classificatory, or externally verifiable proposition.\\n2. The originating source is not independently authoritative to establish that\\n   proposition merely by stating it.\\n3. Multiple pieces repeat the claim from the same origin in a way that may create\\n   the appearance of cross-outlet corroboration.\\n\\nExamples:\\n\\n- disputed casualty, attendance, financial, crime, prevalence, or scale figures;\\n- allegations of misconduct;\\n- claims about motive, responsibility, affiliation, or control;\\n- analytical findings produced by one investigation;\\n- causal explanations;\\n- contested event classifications.\\n\\nCROSS-OUTLET CORROBORATION\\n\\nUse only where the fact has two or more genuinely independent origins capable of\\nsupporting the proposition at issue.\\n\\nCONTESTED\\n\\nUse when retrieved origins materially conflict.\\n\\nCHAIN UNRESOLVED\\n\\nUse when the immediate or upstream origin cannot be established well enough to\\nclassify the network behavior.\\n\\nAPPARENT-CORROBORATION RISK\\n\\nCode:\\n\\n- LOW\\n- MODERATE\\n- HIGH\\n\\nA plainly attributed repetition such as \\\"Arday said the scrutiny was racially\\nmotivated\\\" generally carries lower apparent-corroboration risk than multiple\\noutlets stating \\\"the scrutiny was racially motivated\\\" in outlet voice.\\n\\nRULES FOR THE TABLE\\n\\n- Count origins PER FACT and distinguish ORIGINS LOCATED from origin completeness.\\n- Do not pool facts.\\n- Do not average a single-origin claim against a well-corroborated one.\\n- Many pieces / one origin is not automatically amplification.\\n- A single statement may contain multiple proposition types:\\n  - the speaker made the statement: COMMON-SOURCE PROPAGATION;\\n  - the explanation inside it: SOURCE-DEPENDENT INTERPRETATION or CLAIM\\n    AMPLIFICATION.\\n- Preserve attribution behavior. Attribution that weakens or disappears across\\n  the network increases apparent-corroboration risk.\\n\\nFINDING CONSEQUENCES\\n\\n- COMMON-SOURCE PROPAGATION: ordinarily descriptive only.\\n- SOURCE-DEPENDENT INTERPRETATION: eligible for a finding only when attribution\\n  weakens, disappears, or the interpretation becomes load-bearing.\\n- CLAIM AMPLIFICATION: eligible for a source-chain finding.\\n- CROSS-OUTLET CORROBORATION: may weaken or defeat an amplification concern.\\n- CHAIN UNRESOLVED: capped and may not anchor a strong finding.\\n\\nREQUIRED STATEMENT \\u2014 use this form:\\n\\n\\\"Across [P] pieces, the load-bearing facts trace to these located origins:\\n[fact \\u2014 pieces / origins located / origin completeness / classification; ...].\\n[N] facts are COMMON-SOURCE PROPAGATION, [M] are SOURCE-DEPENDENT\\nINTERPRETATIONS, and [K] qualify as CLAIM AMPLIFICATION. Only the last category\\nrepresents apparent cross-outlet agreement that may falsely resemble independent\\nconfirmation. Identify any source-dependent interpretation whose attribution\\nweakened or disappeared across the network, and any fact for which\\nSINGLE-ORIGIN CONFIRMED is NOT ESTABLISHED.\\\"\\n\\nSOURCE-CHAIN STATUS  -  a SEPARATE axis from verification state (Do NOT use\\nRECEPTION-CONFIRMED here. In shared_primitives Section 1 that means a source's own later\\nreception was checked  -  replies, replications, corrections. Comparing an article to a\\npress release is source-chain verification, a different operation entirely.)\\n\\n  CHAIN-CONFIRMED ... primary source material or wire copy was available and directly\\n  compared against the piece CHAIN-INFERRED .... chain inferred from attribution,\\n  publication timing, or textual similarity, without the upstream document in hand\\n  CHAIN-PROVISIONAL . upstream source cannot be established\\n\\nVERIFICATION STATE OF THE EVIDENCE USED  -  media branch subset:\\n\\n  LOCATED ..................... the item exists; content unverified\\n  FULL-TEXT-CONFIRMED ......... you read the full source and it supports the claim\\n  CROSS-OUTLET-CORROBORATED ... the fact is supported by 2+ INDEPENDENT origins\\n                                across outlets; state the per-fact origin count\\n  CONTESTED ................... outlets report it incompatibly\\n  PROVISIONAL ................. asserted from memory, or source not retrieved\\n\\n  RECEPTION-CONFIRMED IS NOT USED IN THIS BRANCH. In shared_primitives Section 1 it means a\\n  source's own scholarly reception was checked  -  replies, replications, corrigenda. News\\n  coverage does not have reception in that sense. If you reach for it, you want\\n  CROSS-OUTLET-CORROBORATED or CHAIN-CONFIRMED.\\n\\n  CROSS-OUTLET-CORROBORATED MUST CARRY THE PER-FACT ORIGIN COUNT. A fact may be labeled\\n  CROSS-OUTLET-CORROBORATED only if it has 2+ INDEPENDENT origins capable of supporting the\\n  proposition at issue on its own row in the per-fact table. A fact carried by many outlets\\n  but tracing to ONE origin is SINGLE-ORIGIN PROPAGATION and must be classified under the\\n  Section B taxonomy. It is not automatically CLAIM AMPLIFICATION and may not be called\\n  corroborated. State the per-fact origin count and network classification alongside every\\n  use of this label.\\n\\nApply this subset separately to the documents supporting a finding. The two axes combine  -\\ne.g. the police statement may be FULL-TEXT-CONFIRMED while the outlet's dependence on it is\\nonly CHAIN-INFERRED.\\n\\nReport both when both apply.\\n\\n\\n=================================================================\\nEVENT OBJECT CONSTRUCTION AND EXTRACTION\\n=================================================================\\n\\n-----------------------------------------------------------------\\nPARTY ENUMERATION\\n-----------------------------------------------------------------\\n\\nBefore language, role, or event-classification analysis begins, enumerate every\\nanalytically significant party.\\n\\nEligible parties include:\\n\\n- primary actors;\\n- counterparts;\\n- affected parties;\\n- organizations or collectives;\\n- institutions;\\n- government;\\n- law enforcement;\\n- media;\\n- physical sites;\\n- disputed objects;\\n- event classifications when they carry independent framing significance.\\n\\nA party is analytically significant when at least one is true:\\n\\n- labels materially diverge across sources;\\n- agency assignment materially diverges;\\n- competing evaluative packages exist;\\n- treatment changes after an evidentiary update;\\n- the party is implicated by an investigation lead;\\n- the party is necessary to explain a finding.\\n\\nDo not omit collectives merely because no individual member is named.\\n\\nRequired table:\\n\\n| Party / object | Why analytically significant | Relevant outlets / sources | Planned analysis location |\\n|---|---|---|---|\\n\\nA party omitted at this stage may not later become the basis of a load-bearing\\nfinding unless the auditor explicitly adds it to the table and explains why it\\nwas missed.\\n\\n-----------------------------------------------------------------\\nCOMPETING EVENT CLASSIFICATIONS\\n-----------------------------------------------------------------\\n\\nBefore judging framing, enumerate all materially different classifications\\napplied to the same event, site, action, or dispute.\\n\\nFor each classification, record:\\n\\n| Classification | Outlet / source | Placement | Attribution status | Facts available when used | Dimension captured | Dimension omitted |\\n|---|---|---|---|---|---|---|\\n\\nPermitted dimension labels:\\n\\n- FUNCTION\\n- STRUCTURE\\n- ROLE\\n- LEGAL STATUS\\n- MORAL EVALUATION\\n- CAUSAL INTERPRETATION\\n- OTHER\\n\\nDo not select one label before extraction is complete.\\n\\nA label may be factually true on one dimension while incomplete as the governing\\nevent classification.\\n\\n-----------------------------------------------------------------\\nFUNCTION / STRUCTURE COMPLETENESS TEST\\n-----------------------------------------------------------------\\n\\nFor every contested event classification, determine whether it describes:\\n\\n- what the event or site did;\\n- how it operated;\\n- how it related to nonparticipants;\\n- what authority, control, restriction, or access structure existed;\\n- whether the label is complete enough to govern the article's event identity.\\n\\nRequired table:\\n\\n| Label | Function captured | Structure captured | Function omitted | Structure omitted | Complete enough to govern event identity? |\\n|---|---|---|---|---|---|\\n\\nDo not treat a functionally true label as a complete event description when\\nstructurally significant characteristics are omitted.\\n\\nExamples:\\n\\n- memorial vs. occupation;\\n- community hub vs. autonomous zone;\\n- protest vs. blockade;\\n- tragedy vs. gang-related shootout.\\n\\nIf two labels capture different valid dimensions, preserve both rather than\\nforcing a false binary.\\n\\n\\nSCOPE LIMIT\\n\\nApply Function vs. Structure only to labels describing:\\n\\n- the event;\\n- the site;\\n- an institution;\\n- a collective action;\\n- or a disputed social object.\\n\\nDo not apply it to ordinary factual sequence components, such as the steps of a\\nphysical altercation, unless the competing labels themselves constitute distinct\\nfunctional versus structural descriptions of the event or site.\\n\\nOrdinary sequence completeness belongs in source-chain, causal-role,\\nepistemic-level, or chronology analysis.\\n\\n-----------------------------------------------------------------\\nSAME-STAGE CLASSIFICATION TEST\\n-----------------------------------------------------------------\\n\\nTiming explains many language differences.\\nIt does not explain different classifications used under substantially the same\\nevidentiary conditions.\\n\\nWhenever competing labels appear after the same material facts are available,\\nclassify the difference as SAME-STAGE CLASSIFICATION DIVERGENCE.\\n\\nRequired output:\\n\\n| Label | Evidentiary stage | Dimension captured | Dimension omitted | Attribution status | Timing explains difference? | Residual divergence |\\n|---|---|---|---|---|---|---|\\n\\nDistinguish:\\n\\n- temporal update;\\n- function / structure difference;\\n- legal-status difference;\\n- moral-evaluation difference;\\n- factual disagreement;\\n- same-stage abstraction.\\n\\nApply SHARED INNOCENT-EXPLANATION TEST before reporting the residual divergence.\\n\\nFor same-stage abstraction, preserve both the specific and abstract forms before\\njudgment. Record:\\n\\n- the more specific form;\\n- the more abstract form;\\n- whether both were available at the same evidentiary stage;\\n- what categorical specificity changes at the point of agency assignment;\\n- whether attribution, genre, or source dependence explains the difference.\\n\\nPreferred neutral wording when specificity is reduced without evidence of motive:\\n\\n  \\\"Reduces categorical specificity at the point of agency assignment.\\\"\\n\\nDo not infer sanitization, laundering, concealment, or intent from abstraction\\nalone.\\n\\n-----------------------------------------------------------------\\nFINDING OWNERSHIP FOR EVENT CLASSIFICATION\\n-----------------------------------------------------------------\\n\\nUse finding type:\\n\\n  event-classification-divergence\\n\\nwhen the finding concerns competing labels for the event, site, action, or\\ndispute and does not consist solely of a [MEDIA-P1] causal-role assignment.\\n\\nIf the classification directly moves a [MEDIA-P1] axis, cross-reference D-ROLE\\nand emit only one finding.\\n\\nDo not duplicate the same classification divergence under:\\n- framing-divergence;\\n- causal-role-framing;\\n- event-classification-divergence.\\n\\nChoose the owner by the primary analytical effect.\\n\\n=================================================================\\n\\n=================================================================\\nSECTION C  -  SHARED FACTUAL CORE vs. UNIQUE MATERIAL\\n=================================================================\\n\\n  1. SHARED CORE: facts reported by all or nearly all pieces. List them.\\n     For each shared-core fact, check its row in the per-fact table in Section B.\\n     Shared appearance does not itself establish independence. Carry forward the\\n     Section B network classification: COMMON-SOURCE PROPAGATION,\\n     SOURCE-DEPENDENT INTERPRETATION, CLAIM AMPLIFICATION,\\n     CROSS-OUTLET CORROBORATION, CONTESTED, or CHAIN UNRESOLVED.\\n\\n  2. UNIQUE MATERIAL: facts appearing in only one or two pieces. For each:\\n     - which outlet\\n     - scoop (original reporting) or selection (chose to include what others had available and\\n       omitted)?\\n     - does it cut for or against the dominant framing?\\n\\n  3. CONTRADICTIONS: where pieces report the same fact differently. Quote both. Note whether\\n     the contradiction is factual (incompatible claims) or definitional (same event, different\\n     terms).\\n\\n| Fact | Outlets reporting | Outlets omitting | Scoop or selection | Cuts which way |\\n|---|---|---|---|---|\\n\\nAVAILABILITY MATRIX  -  REQUIRED BEFORE CALLING ANYTHING \\\"SELECTION\\\"\\n(CROSS-PIECE OMISSION ONLY \\u2014 does not govern within-piece prominence;\\n see PROMINENCE AND PACKAGING below)\\n\\nOutlets publish at different times with different information. Comparing a later piece (more\\navailable) against an earlier brief (less available) and calling the difference \\\"selection\\\" is\\nthe network-branch version of the timing error.\\n\\n| Fact / source material | Available when A published? | B? | C? | D? |\\n|---|---|---|---|---|\\n\\nRULE: a fact may be called SELECTION only if it was AVAILABLE before that piece published and\\nthe piece still omitted it. Otherwise it is a TIMING ARTIFACT and must be labeled so.\\n\\n\\nABSENCE-CLAIM EVIDENCE FLOOR\\n\\nClaims using \\\"only,\\\" \\\"none,\\\" \\\"no outlet,\\\" \\\"unique,\\\" \\\"absent,\\\" \\\"omitted,\\\" or an\\nequivalent absence / exclusivity formulation require FULL-TEXT-CONFIRMED status\\nfor every source included in the claimed range.\\n\\nA HEADLINE-ONLY, SNIPPET-ONLY, unretrieved, or otherwise partial source:\\n\\n- may support a presence claim about the preserved text;\\n- may not support absence, omission, exclusivity, source-distribution\\n  completeness, sequencing completeness, or \\\"only / none\\\" claims;\\n- must be excluded from the denominator of the absence claim.\\n\\nIf excluding partial sources makes the claimed range incomplete, the absence\\nclaim is UNAVAILABLE, not merely PROVISIONAL.\\n\\nDo not convert silence in a summary, snippet, reconstruction, or prior audit into\\nevidence that the underlying article lacked the material.\\n\\nState availability basis for each: known (documented release time) / inferred (other coverage\\ncarried it earlier) / unknown. Unknown availability caps the finding at PROVISIONAL.\\n\\n\\nMANDATORY AVAILABILITY CITATION FOR SELECTION CLAIMS\\n\\nAny finding that uses \\\"selection\\\" or an equivalent formulation \\u2014 including:\\n\\n- selectively amplified;\\n- chose to include;\\n- chose to omit;\\n- foregrounded despite availability;\\n- withheld despite availability;\\n\\nmust cite an explicit Availability Matrix row inside the finding itself.\\n\\nUse this form:\\n\\n  AVAILABILITY ROW CITED:\\n  [fact or source] available by [date/time] \\u2014 [outlet] published [date/time].\\n\\nThe cited row must establish that the material was available before the outlet\\npublished.\\n\\nWithout this citation, the audit may describe:\\n\\n- inclusion;\\n- non-inclusion;\\n- source-distribution difference;\\n- availability unknown;\\n- timing artifact;\\n- timing untested.\\n\\nIt may not call the difference selection.\\n\\nTHE KEY ASYMMETRY: a fact available to all outlets  -  present in the primary source or in\\nearlier coverage  -  that some include and some omit, where the pattern correlates with\\nframing. That is selection, and unlike a single-piece omission finding, it is demonstrable\\nrather than asserted.\\n\\nA second, distinct object is also demonstrable. Where a fact is carried anywhere\\nin a FULL-TEXT-CONFIRMED piece but is absent from a more prominent layer under\\ncomparison \\u2014 or where competing facts or factual dimensions receive materially\\ndifferent placement priority across headline, lede, and body \\u2014 the piece itself\\nestablishes possession of the fact. No cross-piece availability reconstruction is\\nrequired. That object is PROMINENCE, not SELECTION, and it is governed below.\\n\\n-----------------------------------------------------------------\\nPROMINENCE AND PACKAGING  (within-piece placement)   [FAIL-MB-017]\\n-----------------------------------------------------------------\\n\\nOBJECT\\n\\nSELECTION asks:\\n  Did outlet A omit a fact that outlet B carried, and was that fact demonstrably\\n  available to A when A published?\\n\\nPROMINENCE asks:\\n  Where, inside a piece that carries the fact, was it placed? Did competing facts\\n  or dimensions receive materially different placement priority across headline,\\n  lede, and body?\\n\\nThese are different objects and have different evidentiary preconditions.\\n\\n-----------------------------------------------------------------\\nEVIDENTIARY FLOOR\\n-----------------------------------------------------------------\\n\\nA piece must be FULL-TEXT-CONFIRMED to support a prominence finding.\\n\\nHEADLINE-ONLY or SNIPPET-ONLY pieces may not support a within-piece placement\\nfinding because the hierarchy cannot be established without the whole piece.\\n\\nExclude such pieces from the prominence table. Do not mark their placement UNKNOWN.\\n\\nCross-piece availability:\\n  NOT APPLICABLE BY CONSTRUCTION.\\n\\nDo not build, cite, or require an Availability Matrix row for a\\nprominence-packaging finding. The fact's presence somewhere in the piece\\nestablishes that the piece possessed it.\\n\\nA prominence candidate may compare:\\n- HEADLINE vs LEDE\\n- HEADLINE vs BODY\\n- LEDE vs LATER BODY, where materially relevant\\n\\nA fact need not be absent from both headline and lede. Absence from a more\\nprominent layer under comparison is sufficient to create a candidate.\\n\\n-----------------------------------------------------------------\\nPROMINENCE TABLE\\n-----------------------------------------------------------------\\n\\n| Piece | Fact / dimension carried | Placement (headline / lede / body para n) | Competing fact / dimension occupying the more prominent layer | Packaging provenance | Cuts which way |\\n|---|---|---|---|---|---|\\n\\nPACKAGING PROVENANCE vocabulary:\\n- CHOSEN\\n- INHERITED\\n- MIXED\\n- UNKNOWN\\n\\nBuild a row for every load-bearing or contested fact that:\\n- appears in Section B's per-fact table; or\\n- appears in Section C's contradictions; or\\n- directly qualifies, complicates, or reverses a figure or factual dimension\\n  foregrounded in the same piece.\\n\\nDo not build rows for ordinary low-value facts merely because they appear lower\\nin the article.\\n\\n-----------------------------------------------------------------\\nWHAT MAKES THIS A FINDING, NOT AN OBSERVATION\\n-----------------------------------------------------------------\\n\\nHeadlines and ledes cannot carry everything. Lower placement is normal and is\\nNOT by itself a finding.\\n\\nA prominence finding requires BOTH:\\n\\n  (a) MATERIALITY:\\n      the fact is load-bearing or contested, OR directly qualifies, complicates,\\n      reverses, or changes the interpretation of a competing fact/dimension\\n      foregrounded in the same piece;\\n\\nAND\\n\\n  (b) ASYMMETRY:\\n      EITHER:\\n      - different pieces foreground different sides of the same fact-pair or\\n        factual dimension;\\n      OR:\\n      - one piece's headline or lede foregrounds a proposition/figure that its\\n        own lower text materially qualifies.\\n\\nWhere only (a) holds, record the row and stop:\\n\\n  PROMINENCE RECORDED \\u2014 NO MATERIAL ASYMMETRY ESTABLISHED.\\n\\nCandidate generation may be broad. Finding generation is not.\\nThe (a)+(b) trigger is mandatory.\\n\\n-----------------------------------------------------------------\\nPACKAGING PROVENANCE \\u2014 CHOSEN / INHERITED GATE\\n-----------------------------------------------------------------\\n\\nA prominence pattern may be observed even when inherited. But claims about\\neditorial or outlet choice require provenance.\\n\\nCHOSEN:\\n  The outlet's packaging choice is independently attributable to the outlet.\\n  A prominence-packaging finding may describe outlet choice.\\n\\nINHERITED:\\n  The placement pattern is inherited from a wire, common source package, or other\\n  upstream structure.\\n  Record the pattern if analytically relevant, but do NOT attribute the packaging\\n  decision to the outlet.\\n  SOURCE-CHAIN owns the inheritance explanation.\\n\\nMIXED:\\n  Identify the chosen and inherited components separately.\\n  A finding may attribute only the chosen component to the outlet.\\n\\nUNKNOWN:\\n  The prominence pattern may be described, but attribution to outlet choice is\\n  capped at PROVISIONAL.\\n\\nA prominence finding about outlet editorial choice requires:\\n- CHOSEN provenance; or\\n- MIXED provenance with the chosen component identified.\\n\\nDo not infer CHOSEN merely because the outlet has its own byline.\\n\\n-----------------------------------------------------------------\\nFACT-TIMING / VERSION CHECK \\u2014 INNOCENT EXPLANATION\\n-----------------------------------------------------------------\\n\\nCross-piece availability does not govern prominence, but publication/update\\ntiming can explain why a fact appears lower in a piece than in its headline.\\n\\nThis is a narrower question than SELECTION:\\n\\n  Could the subordinated or qualifying fact have entered the article only AFTER\\n  the headline was originally set?\\n\\nBefore attributing a prominence pattern to a deliberate same-version packaging\\nchoice, check Section A and any already-retrieved timestamped material for:\\n- initial publication time;\\n- last-updated time;\\n- correction/update note;\\n- whether the headline changed;\\n- whether version history is known;\\n- whether the subordinated/qualifying fact demonstrably predates initial\\n  publication, demonstrably emerged later, or has unknown timing.\\n\\nUse three states:\\n\\nFACT TIMING: PREDATES INITIAL PUBLICATION\\n  The fact is shown by timestamped packet material, a timestamped primary source,\\n  or clearly earlier packet coverage to have existed before the piece's initial\\n  publication.\\n  Result:\\n  - later-body-update explanation is RULED OUT for that fact;\\n  - unknown headline-version history does NOT by itself create a same-version\\n    caveat.\\n\\nFACT TIMING: EMERGED AFTER INITIAL PUBLICATION\\n  The fact is shown to have emerged after initial publication and before a later\\n  body update.\\n  Result:\\n  - later-body-update explanation is LIVE;\\n  - the observed prominence pattern remains real;\\n  - attribution to a deliberate same-version packaging choice is limited unless\\n    headline/version history resolves it.\\n\\nFACT TIMING: UNKNOWN\\n  The available packet does not establish whether the fact predated initial\\n  publication.\\n  Result:\\n  - prominence remains observable;\\n  - same-version editorial attribution remains unresolved.\\n\\nWhere the later-body-update explanation is live or timing is unknown, report as\\nappropriate:\\n\\n  PROMINENCE OBSERVED; SAME-VERSION PACKAGING ATTRIBUTION UNRESOLVED.\\n\\nDo NOT convert this into a cross-piece availability failure.\\n\\nUnknown version history is not an automatic caveat when fact timing already\\nrules out the later-body-update explanation.\\n\\n-----------------------------------------------------------------\\nPROMINENCE SYMMETRY CHECK / PACKET INVERSE  (mandatory)\\n-----------------------------------------------------------------\\n\\nThis is NOT Section F's constructed mirror.\\n\\nIt is an observed inverse within the packet.\\n\\nFor every prominence finding:\\n\\n1. State the foregrounded fact/dimension.\\n2. State the subordinated or qualifying fact/dimension.\\n3. Search the eligible comparison set for a reversed prominence relationship.\\n4. Classify the inverse:\\n\\n   FULL\\n   The comparison piece materially reverses the prominence relationship at a\\n   comparable placement level.\\n\\n   PARTIAL\\n   The comparison piece reverses the relationship incompletely \\u2014 for example,\\n   the qualifying fact reaches the lede but not the headline.\\n\\n   NONE\\n   No inverse is located in the eligible FULL-TEXT-CONFIRMED comparison set.\\n\\n5. Name the inverse piece(s), where present.\\n\\nRequired output states:\\n\\n  PACKET INVERSE: FULL \\u2014 [piece(s)]\\n  PACKET INVERSE: PARTIAL \\u2014 [piece(s)]\\n  PACKET INVERSE: NONE AMONG [N] FULL-TEXT-CONFIRMED ELIGIBLE PIECES\\n\\nA one-directional finding where an available FULL or PARTIAL inverse exists but is\\nnot acknowledged is incomplete and must be downgraded.\\n\\nA PARTIAL PACKET INVERSE fully satisfies the symmetry requirement.\\nFULL / PARTIAL / NONE is descriptive and does NOT mechanically raise or lower\\nseverity. Severity follows materiality, evidentiary support, provenance, and the\\nordinary severity rules. Do not downgrade merely because the observed inverse is\\nPARTIAL.\\n\\n-----------------------------------------------------------------\\nABSENCE FLOOR FOR \\\"NO PACKET INVERSE\\\"\\n-----------------------------------------------------------------\\n\\n\\\"NO PACKET INVERSE\\\" is an absence claim.\\n\\nIt therefore inherits the ABSENCE-CLAIM EVIDENCE FLOOR for the claimed comparison\\nrange.\\n\\nAn unqualified packet-wide NONE claim requires every eligible source in the\\nclaimed range to be FULL-TEXT-CONFIRMED.\\n\\nIf some eligible pieces are not fully retrieved, report instead:\\n\\n  NO PACKET INVERSE LOCATED AMONG [N] FULL-TEXT-CONFIRMED PIECES;\\n  [M] ELIGIBLE PIECES EXCLUDED FROM INVERSE TEST.\\n\\nDo not treat excluded snippet/headline-only pieces as evidence of absence.\\n\\n\\nSEMANTIC-GATE INTERACTION\\n\\nA prominence finding must be grounded in PLACEMENT PRIORITY among substantive\\nfacts or factual dimensions, not merely in different wording for the same fact.\\nIf the candidate contrast is itself a lexical/formulation difference, record the\\nplacement observation but defer any finding until the SEMANTIC EQUIVALENCE AND\\nEARNEDNESS GATE resolves the wording. If that gate returns REGISTER VARIANCE or\\nEARNED SPECIFICITY with no moved substantive assignment, the wording difference\\nmay not anchor a prominence-packaging finding.\\n\\n-----------------------------------------------------------------\\nRELATIONSHIP TO OTHER SECTIONS \\u2014 TYPE OWNERSHIP / NO DOUBLE-COUNT\\n-----------------------------------------------------------------\\n\\nSOURCE-CHAIN / CLAIM-AMPLIFICATION owns:\\n- removal or restoration of source attribution;\\n- removal or restoration of epistemic status;\\n- source-cue compression;\\n- packaging that is materially inherited from an upstream source/wire.\\n\\nIf the only headline/body difference is that the headline strips or restores\\nattribution, source provenance, or epistemic qualification, do NOT emit a\\nprominence-packaging finding for the same analytical object.\\n\\nD-ROLE / CAUSAL-ROLE-FRAMING owns:\\n- different event-classification assignments;\\n- different causal assignments;\\n- different role/status assignments;\\n- different blame/responsibility assignments;\\n- different remedy assignments;\\n- different leadership/policy assignments.\\n\\nPROMINENCE-PACKAGING owns:\\n- placement priority among substantive facts or competing factual dimensions that\\n  the piece itself carries without contradiction across its layers.\\n\\nA single piece may support both a source-chain finding and a prominence finding\\nonly where the analytical objects differ.\\n\\nExample:\\n\\n  \\\"60,000\\\" headline strips Vivas attribution\\n    -> SOURCE-CHAIN / CLAIM-AMPLIFICATION.\\n\\n  \\\"60,000\\\" headline foregrounds gross arrivals while the same piece carries\\n  return context lower in the text\\n    -> PROMINENCE-PACKAGING.\\n\\n\\n-----------------------------------------------------------------\\nSEMANTIC EQUIVALENCE AND EARNEDNESS GATE   [FAIL-MB-018]\\n-----------------------------------------------------------------\\n\\nJURISDICTION \\u2014 IMPORTANT\\n\\nThis gate governs:\\n\\n- lexical / formulation differences proposed as framing evidence;\\n- language-package expansion triggered by wording variance;\\n- VERB-AS-TRACE candidates;\\n- event-classification findings whose evidentiary object is a wording difference;\\n- D-ROLE expansion triggered by a lexical/formulation difference.\\n\\nThis gate does NOT govern D-ROLE's independent substantive scan.\\n\\nD-ROLE must remain able to discover semantic assignment differences directly,\\nincluding differences such as:\\n\\n  \\\"smugglers caused the crossing\\\"\\n  versus\\n  \\\"police facilitated the crossing\\\"\\n\\nThose are substantive CAUSE / BLAME assignments even if no lexical comparison\\ngenerated them.\\n\\nRULE:\\n\\n  A bucketed lexical difference may not TRIGGER D-ROLE.\\n  D-ROLE may independently DISCOVER a substantive assignment difference.\\n\\nDo not condition the six-axis causal-role scan on survival of a word-bucketing\\nstep.\\n\\n=================================================================\\nSTEP 0 \\u2014 COMPARABILITY GATE\\n=================================================================\\n\\nBefore bucketing formulations together, establish that they are actually\\ncomparable.\\n\\nTwo formulations may enter the same semantic comparison only when they refer to:\\n\\n- the same underlying actor / party or materially equivalent actor class;\\n- the same event or action;\\n- the same relevant object;\\n- the same or materially comparable evidentiary stage;\\n- the same or materially comparable event stage / time slice.\\n\\nDo NOT normalize across real event evolution.\\n\\nExamples of invalid comparisons:\\n\\n- early \\\"crossing\\\" versus later \\\"return\\\";\\n- allegation-stage \\\"suspect\\\" versus post-charge \\\"defendant\\\" where status changed;\\n- \\\"two groups firing\\\" versus a later classification based on newly available\\n  evidence, unless same-stage comparability is separately established.\\n\\nWhere timing, referent, or evidentiary stage explains the difference, route the\\nobject to the appropriate timing/update/same-stage logic. Do not treat it as\\nsemantic synonym variance.\\n\\n=================================================================\\nSTEP 1 \\u2014 BUILD THE COMMON BUCKET\\n=================================================================\\n\\nFor each contested or load-bearing event/action, collect the comparable\\nformulations used across the packet.\\n\\nThe unit of analysis is the SEMANTIC ASSIGNMENT, not the word.\\n\\nGroup formulations into one COMMON BUCKET only when:\\n\\n- they describe the same underlying proposition;\\n- they refer to the same/comparable actor, action, object, and stage under STEP 0;\\n- the semantic content needed for the shared proposition is supported by the\\n  retrieved packet;\\n- they do not materially alter:\\n  * EVENT CLASSIFICATION\\n  * AGENCY\\n  * ROLE / STATUS\\n  * CAUSE\\n  * BLAME / RESPONSIBILITY\\n  * REMEDY\\n  * LEADERSHIP / POLICY\\n  * EPISTEMIC LEVEL\\n  * MORAL / EVALUATIVE CLASSIFICATION\\n  * another substantive reader model of the event.\\n\\nRequired compact output:\\n\\n| Underlying event/action | Common bucket | Candidate specificity / outliers | Resolution |\\n|---|---|---|---|\\n\\nRecord each resolved bucket ONCE.\\n\\nDo not reproduce every bucketed formulation in later sections.\\n\\n=================================================================\\nSTEP 2 \\u2014 DECOMPOSE ADDED SEMANTIC CONTENT\\n=================================================================\\n\\nBefore deciding that a more vivid, specific, or forceful formulation is EARNED\\nSPECIFICITY or a MATERIAL OUTLIER, state what semantic content it adds beyond the\\ncommon bucket.\\n\\nRequired form:\\n\\n  CANDIDATE: [word/formulation]\\n  COMMON PROPOSITION: [shared proposition]\\n  ADDED SEMANTIC PREDICATE(S): [what additional claim/classification the candidate adds]\\n\\nExamples:\\n\\n  \\\"breach\\\"\\n    common proposition:\\n      people crossed a boundary\\n    candidate added predicates may include:\\n      - the boundary was restricted / defended / controlled;\\n      - the crossing occurred contrary to that control;\\n      - the boundary/control was overcome.\\n\\n  \\\"riot\\\"\\n    common proposition:\\n      public gathering / confrontation occurred\\n    added predicate:\\n      serious disorder / violence sufficient to alter event classification.\\n\\n  \\\"waved through\\\"\\n    common proposition:\\n      people crossed\\n    added predicate:\\n      an authority facilitated or permitted the crossing.\\n\\nIf no additional semantic predicate can be named, the candidate is not a\\nmaterial outlier. Return it to the common bucket as REGISTER VARIANCE.\\n\\n=================================================================\\nSTEP 3 \\u2014 EARNED SPECIFICITY\\n=================================================================\\n\\nA formulation with additional semantic content is EARNED SPECIFICITY \\u2014 not\\nframing divergence \\u2014 only when the added predicate is:\\n\\n1. supported by material in the retrieved packet;\\n2. supported independently of the formulation being tested;\\n3. uncontested across the relevant packet material.\\n\\nEARNED IS A PACKET TEST, NOT A TRUTH TEST.\\n\\nThe Coverage Network branch does not adjudicate what actually happened outside\\nthe retrieved object.\\n\\n\\\"Supported\\\" means:\\n  retrieved packet material provides evidence for the added predicate.\\n\\n\\\"Uncontested\\\" means:\\n  no relevant piece in the packet disputes the predicate or presents materially\\n  incompatible evidence.\\n\\n-----------------------------------------------------------------\\nNON-CIRCULAR SUPPORT RULE \\u2014 MANDATORY\\n-----------------------------------------------------------------\\n\\nThe candidate formulation may NOT count as evidence that its own added predicate\\nis supported.\\n\\nNeither may:\\n- the same word repeated by another outlet;\\n- a synonymous restatement that merely presupposes the same added meaning;\\n- an inference whose only premise is the candidate wording itself.\\n\\nSupport for EARNED SPECIFICITY must come from packet material independent of the\\nformulation being tested.\\n\\nExample:\\n\\n  Candidate: \\\"breach\\\"\\n\\n  NOT sufficient:\\n  - AP says \\\"breach\\\";\\n  - NPR repeats \\\"border breach\\\";\\n  - CBC says \\\"breached\\\".\\n\\n  Potentially sufficient:\\n  - independently reported facts describing a controlled/restricted boundary;\\n  - observed barrier or controlled crossing point;\\n  - independently described actions showing the control/barrier was overcome;\\n  - no relevant packet item disputes those underlying predicates.\\n\\nIf the only \\\"support\\\" for a forceful term is other outlets repeating that term,\\nEARNED SPECIFICITY is NOT established.\\n\\nIf the underlying predicate is contested among the pieces:\\n\\n  DO NOT adjudicate the dispute in order to award earnedness.\\n\\nThe candidate remains a MATERIAL OUTLIER and proceeds to downstream evidence,\\nsource-chain, inheritance, and assignment analysis.\\n\\nWhere earnedness is established, record:\\n\\n  EARNED SPECIFICITY \\u2014 [candidate] adds [predicate]; independently supported by\\n  [packet evidence]; uncontested in eligible packet material.\\n\\nThen stop the lexical-framing path for that candidate.\\n\\nPrecision is not rhetoric merely because it is more specific.\\n\\n=================================================================\\nSTEP 4 \\u2014 STOP ON ORDINARY VARIANCE\\n=================================================================\\n\\nFormulations remaining inside the common bucket are REGISTER VARIANCE.\\n\\nRecord them once.\\n\\nThey DO NOT propagate as lexical candidates into:\\n\\n- language trajectory;\\n- language-package expansion;\\n- VERB-AS-TRACE;\\n- lexical-triggered D-ROLE expansion;\\n- the flip test;\\n- Section H;\\n- Section I.\\n\\nDo not re-derive, re-test, or re-report them downstream.\\n\\nIf every comparable formulation resolves inside the common bucket or as earned\\nspecificity and no substantive assignment moves, write:\\n\\n  SEMANTIC NORMALIZATION: [event/action] \\u2014 no material assignment difference;\\n  wording resolved as register variance and/or earned specificity;\\n  language-package analysis NOT TRIGGERED by this wording object.\\n\\nThis is a valid and expected null result.\\n\\n=================================================================\\nSTEP 5 \\u2014 CARRY FORWARD ONLY MATERIAL OUTLIERS\\n=================================================================\\n\\nA lexical/formulation candidate advances only if its added semantic content\\nmaterially moves at least one named substantive assignment.\\n\\nFor every surviving outlier, state:\\n\\n| Outlier | Added semantic predicate | Assignment moved | Direction of movement | Why not bucketed / earned |\\n|---|---|---|---|---|\\n\\nAn outlier with no named moved assignment is not an outlier.\\n\\nReturn it to the common bucket.\\n\\nSurviving wording-derived outliers may then proceed to the relevant downstream\\ntests, including:\\n\\n- VERB-AS-TRACE;\\n- source / wire inheritance;\\n- CHOSEN / INHERITED ownership;\\n- epistemic classification where applicable;\\n- same-stage checks not already resolved;\\n- innocent-explanation tests;\\n- D-ROLE where the wording genuinely moves a MEDIA-P1 assignment;\\n- flip/symmetry;\\n- standardized finding table.\\n\\n=================================================================\\nSTEP 6 \\u2014 BUCKETING SYMMETRY CHECK\\n=================================================================\\n\\nBucketing is itself a judgment surface.\\n\\nAggressive bucketing can suppress real divergence.\\nNarrow bucketing can manufacture divergence.\\n\\nBefore finalizing the bucket, ask:\\n\\n  Would these same formulations be bucketed identically if outlet identities\\n  were permuted?\\n\\n  Would the bucket remain the same if the apparent political valence were\\n  reversed?\\n\\nIf not, rebuild the bucket.\\n\\nDo not ask the model to declare which outlet it finds sympathetic or\\nunsympathetic.\\n\\nRequired output:\\n\\n  BUCKETING SYMMETRY CHECK: PASS\\n\\nor, if the first classification changed:\\n\\n  BUCKETING SYMMETRY CHECK: REBUILT \\u2014 [brief reason]\\n\\nA bucket that fails the permutation/valence test may not govern downstream\\nsuppression.\\n\\n=================================================================\\nPROVENANCE HANDOFF \\u2014 CHOSEN / INHERITED\\n=================================================================\\n\\nThis patch does NOT promote CHOSEN / INHERITED into a new shared primitive.\\n\\nThe recurring coupling is logged for later review.\\n\\nImportant distinction:\\n\\n  semantic status\\n      !=\\n  provenance of the wording choice\\n\\nThis gate answers:\\n  Are the formulations semantically equivalent, earned, or materially different?\\n\\nIt does NOT by itself answer:\\n  Whose wording choice was this?\\n\\nFor a surviving MATERIAL OUTLIER, downstream Coverage Network provenance rules\\nstill determine whether the wording was:\\n\\n- CHOSEN\\n- INHERITED\\n- MIXED\\n- UNKNOWN\\n\\nDo not attribute a surviving lexical choice to an outlet merely because the\\nsemantic gate found it material.\\n\\nLikewise, uniform wire inheritance does not make a material semantic difference\\ndisappear; it changes ownership of the framing choice.\\n\\nGUARD NOTE:\\n\\nThe CHOSEN/INHERITED coupling has now appeared in both:\\n- PROMINENCE / PACKAGING;\\n- semantic / language analysis.\\n\\nLog this recurrence. Do not independently redefine the provenance vocabulary in\\nthis gate. Consider shared-primitive promotion only if another independent\\nmodule requires the same coupling or the architecture review otherwise justifies\\npromotion.\\n\\n=================================================================\\nWORKED EXAMPLES\\n=================================================================\\n\\nEXAMPLE A \\u2014 likely common bucket\\n\\n  Event:\\n    large-scale entry into Ceuta\\n\\n  Comparable formulations:\\n    cross / enter / move into\\n\\n  Resolution:\\n    COMMON BUCKET if no substantive assignment moves.\\n\\n  Candidate:\\n    pour / stream\\n\\n  Added semantic predicate:\\n    sustained or high-volume movement, potentially with flood-like imagery.\\n\\n  Test:\\n    If scale/continuity predicates are independently established and the wording\\n    changes no substantive assignment, mark EARNED SPECIFICITY or REGISTER\\n    VARIANCE as appropriate.\\n    If it materially adds a flood/threat classification not earned by independent\\n    packet evidence, carry it forward.\\n\\nEXAMPLE B \\u2014 \\\"breach\\\"\\n\\n  Candidate:\\n    breach\\n\\n  Added semantic predicates:\\n    restricted/defended boundary + crossing contrary to control + control/barrier\\n    overcome.\\n\\n  Do NOT award earnedness because multiple articles say \\\"breach.\\\"\\n\\n  Award EARNED SPECIFICITY only if independent packet facts establish the added\\n  predicates and no relevant piece contests them.\\n\\n  Otherwise:\\n    MATERIAL OUTLIER -> downstream evidence / provenance / assignment analysis.\\n\\nEXAMPLE C \\u2014 event classification dispute\\n\\n  Common formulations:\\n    protest / demonstration / rally\\n\\n  Candidate:\\n    riot\\n\\n  Added predicate:\\n    serious disorder / violence sufficient to alter event classification.\\n\\n  If the packet disputes whether that predicate occurred:\\n    NOT EARNED.\\n    Carry forward as MATERIAL OUTLIER.\\n\\nEXAMPLE D \\u2014 D-ROLE independent discovery\\n\\n  Piece A:\\n    official source says smugglers caused the movement.\\n\\n  Piece B:\\n    witness says police facilitated the movement.\\n\\n  This is a substantive CAUSE / BLAME divergence.\\n\\n  D-ROLE must detect it even if no lexical/formulation candidate survived the\\n  semantic gate.\\n\\n=================================================================\\nLANGUAGE TRAJECTORY AND DESCRIPTIVE TREATMENT\\n=================================================================\\n\\n-----------------------------------------------------------------\\nLANGUAGE TRAJECTORY AND UPDATE TEST\\n-----------------------------------------------------------------\\n\\nFor each analytically significant party identified in PARTY ENUMERATION, record:\\n\\n- HEADLINE LABEL\\n- FIRST-REFERENCE LABEL\\n- LEDE LABEL\\n- LATER-UPDATE LABELS\\n- WHEN EACH MATERIAL FACT BECAME AVAILABLE\\n- UPDATE BEHAVIOR\\n- COUNTERPART / AFFECTED-PARTY TREATMENT\\n\\nMaterial-fact availability includes, where relevant:\\n\\n- identity or category membership;\\n- role;\\n- alleged or confirmed conduct;\\n- institutional affiliation or status;\\n- ideological or organizational alignment;\\n- prior history or record;\\n- charging, disciplinary, investigative, or formal status.\\n\\nSINGLE-EVENT RULE\\n\\nA single-event audit may document:\\n\\n- observed labels;\\n- package direction;\\n- timing;\\n- persistence;\\n- update behavior;\\n- counterpart treatment;\\n- plausible innocent explanations.\\n\\nIt may not conclude systematic differential treatment by race, ideology, group,\\ninstitutional status, or other social category without a matched corpus.\\n\\nCORPUS-LEVEL HYPOTHESIS FORM\\n\\nWhen appropriate, record only as a future corpus-level hypothesis:\\n\\n  Outlets retain softer or category-protective labels longer for Group A while\\n  promoting stronger role, conduct, or identity labels earlier in otherwise\\n  comparable cases involving Group B.\\n\\nDo not resolve that hypothesis in a single-event audit.\\n\\n\\nUPDATE TRIGGER AND PERSISTENCE\\n\\nFor every significant package shift or non-shift, identify:\\n\\nUPDATE TRIGGER\\n- What newly available fact should reasonably have caused the package to change?\\n- When did that fact become available?\\n- Was it available before the relevant headline, lede, body, or update?\\n\\nPERSISTENCE\\n- Did the earlier package remain unchanged?\\n- Did it partially change?\\n- Did it fully change?\\n- Was persistence justified by uncertainty, legal limits, attribution rules,\\n  article format, or other SHARED INNOCENT-EXPLANATION TEST explanation?\\n- Did the package remain mismatched to the strongest available facts?\\n\\nRequired table:\\n\\n| Party | Prior package | Update trigger | Later package | Persistence result | Residual issue |\\n|---|---|---|---|---|---|\\n\\nIf no new fact separates two packages, classify the difference as same-stage\\ndivergence rather than update failure.\\n\\nAny claim that an outlet failed to update must cite the relevant availability\\nrow and publication/update time.\\n\\n-----------------------------------------------------------------\\nLANGUAGE PACKAGE\\n-----------------------------------------------------------------\\n\\nFor each party selected for full analysis, record:\\n\\n- SOFTENING LANGUAGE\\n  Age-based, protective, euphemistic, minimizing, depersonalizing, or passive\\n  constructions.\\n\\n- HARDENING LANGUAGE\\n  Agentive, moralized, criminalizing, pathologizing, delegitimizing, or\\n  categorical constructions.\\n\\n- AGENCY ASSIGNMENT\\n  Who acts, causes, chooses, suffers, receives, or is acted upon.\\n\\n- ACTIVE / PASSIVE CONSTRUCTION\\n  Whether grammatical form changes responsibility or role visibility.\\n\\n- EVALUATIVE FRAMING\\n  Victimized, threatening, legitimate, illegitimate, competent, failed,\\n  credible, deceptive, heroic, suspect, or equivalent coloring.\\n\\n- ATTRIBUTION TYPE\\n  Outlet voice, direct quotation, paraphrase, official allegation, source\\n  inference, or independently established fact.\\n\\n- SPECIFICITY\\n  Whether categorical detail is increased, reduced, or replaced by abstraction.\\n\\n- TEMPORAL UPDATE PATTERN\\n  Whether the package changes across updates, corrections, or related coverage.\\n\\n- UPDATE TRIGGER\\n  The specific new fact that should reasonably have caused a change.\\n\\n- PERSISTENCE\\n  Whether the package remains unchanged despite stronger or updated facts.\\n\\nCOMPOSITE ANALYSIS RULE\\n\\nDo not interpret a noun in isolation.\\n\\nRecord the verbs, modifiers, attribution structure, sequencing, certainty,\\nagency, and evaluative framing that jointly construct the party's role.\\n\\nA nominally soft label may coexist with strong agency and severe conduct.\\nA nominally hard label may coexist with protective or exculpatory framing.\\n\\nDo not infer motive from package differences.\\n\\nPreferred neutral descriptive wording for same-stage abstraction:\\n\\n  \\\"Reduces categorical specificity at the point of agency assignment.\\\"\\n\\nAvoid \\\"sanitizes,\\\" \\\"launders,\\\" \\\"disguises,\\\" or similar motive/effect language\\nunless independent evidence supports the claimed effect or intent.\\n\\n-----------------------------------------------------------------\\nADAPTIVE DETAIL\\n-----------------------------------------------------------------\\n\\nDo not apply the full language-package schema to every party by default.\\n\\nFor every analytically significant party, first complete the compressed table:\\n\\n| Party | Label trajectory | Package direction (SOFT / MIXED / HARD / NEUTRAL) | Update behavior |\\n|---|---|---|---|\\n\\nExpand to the full LANGUAGE PACKAGE schema only when at least one is true:\\n\\n- an investigation lead specifically targets the party;\\n- soft and hard language are in genuine tension;\\n- competing packages materially diverge;\\n- same-stage divergence is present;\\n- updates materially change treatment;\\n- persistence after a material update may be consequential;\\n- the compressed record is ambiguous;\\n- the party becomes load-bearing to a finding.\\n\\nFor every expanded party, state the trigger for expansion.\\n\\nThe default is compressed coding with conditional deep dive, not a full dossier\\non every actor or institution.\\n\\n\\n-----------------------------------------------------------------\\nCOUNTERPART AND AFFECTED-PARTY TREATMENT\\n-----------------------------------------------------------------\\n\\nFor every load-bearing party, compare treatment of the counterpart or affected\\nparty.\\n\\nRecord:\\n\\n- whether each party is individualized or categorized;\\n- whether biography, role, status, or prior history is supplied;\\n- whether conduct is described with comparable specificity;\\n- whether agency separation is clear;\\n- whether one party's prior history is included while the other's is omitted;\\n- whether one party receives direct voice and the ot
